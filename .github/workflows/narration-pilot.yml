name: Narration pilot

# The FULL §13 pilot (docs/narration-plan.md) on GitHub runners: every pilot
# book × every persona through the real pipeline — plan → synth → finish →
# verify — sharded across parallel jobs so the long books fit runner limits.
# Cloud Claude sessions can't reach huggingface.co; runners can (see
# narration-chapter-test.yml, the same trick at listen-test scale).
#
# The collect job merges the verified output, rebuilds narration-v1.json and
# NARRATION-CHECKLIST.md, commits them to master, and — when the repository
# has R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_ENDPOINT secrets — uploads
# the audio to the focus-reader-books bucket under audio/<id>/<voice>/ (the
# exact keys functions/audio/[[path]].js serves), copy-only so shipped keys
# are never overwritten. Without the secrets it stops after committing the
# manifest and leaves everything as the pilot-bundle artifact.
#
# What stays manual either way: the Pages deploy (Cloudflare credentials
# never live in CI) — `node scripts/deploy-pages.mjs` from Michael's machine
# makes the manifest live and the installed app light up.

on:
  workflow_dispatch:
    inputs:
      resume_from_run:
        description: "Reuse synthesized WAVs from this earlier run id (skips synth)"
        default: ""
      collect_from_run:
        description: "Reuse VERIFIED out-* from this earlier run id (skips synth AND finish)"
        default: ""

permissions:
  contents: write

concurrency:
  group: narration-pilot
  cancel-in-progress: false

env:
  IDS: "84,1342,14838"

jobs:
  synth:
    name: synth ${{ matrix.id }}/${{ matrix.voice }} ${{ matrix.shard }}
    if: ${{ !github.event.inputs.resume_from_run && !github.event.inputs.collect_from_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: "84", voice: marlowe, shard: "0/2" }
          - { id: "84", voice: marlowe, shard: "1/2" }
          - { id: "84", voice: rowan, shard: "0/2" }
          - { id: "84", voice: rowan, shard: "1/2" }
          - { id: "84", voice: hazel, shard: "0/2" }
          - { id: "84", voice: hazel, shard: "1/2" }
          - { id: "1342", voice: marlowe, shard: "0/2" }
          - { id: "1342", voice: marlowe, shard: "1/2" }
          - { id: "1342", voice: rowan, shard: "0/2" }
          - { id: "1342", voice: rowan, shard: "1/2" }
          - { id: "1342", voice: hazel, shard: "0/2" }
          - { id: "1342", voice: hazel, shard: "1/2" }
          - { id: "14838", voice: marlowe, shard: "0/1" }
          - { id: "14838", voice: rowan, shard: "0/1" }
          - { id: "14838", voice: hazel, shard: "0/1" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: System deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg
      - name: Node deps
        run: npm ci --no-audit --no-fund
      - name: Python deps
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet kokoro soundfile
      - name: Fetch book text (exact mirror bytes)
        run: |
          mkdir -p /tmp/texts
          curl -fsSL "https://focus-reader-48z.pages.dev/books/${{ matrix.id }}.txt" -o "/tmp/texts/${{ matrix.id }}.txt"
          head -c 200 "/tmp/texts/${{ matrix.id }}.txt" | grep -qi "<html" && exit 1 || true
      - name: Plan
        run: node scripts/narration/plan.mjs --ids="${{ matrix.id }}" --text-dir=/tmp/texts
      - name: Synthesize shard
        run: python scripts/narration/synth.py --ids="${{ matrix.id }}" --voices="${{ matrix.voice }}" --unit-stride="${{ matrix.shard }}"
      - name: Upload shard WAVs
        uses: actions/upload-artifact@v4
        with:
          name: wavs-${{ matrix.id }}-${{ matrix.voice }}-${{ strategy.job-index }}
          path: scripts/narration/work/${{ matrix.id }}/${{ matrix.voice }}/unit-*
          retention-days: 3
          if-no-files-found: error

  finish:
    name: finish ${{ matrix.id }}/${{ matrix.voice }}
    needs: synth
    if: ${{ always() && !github.event.inputs.collect_from_run && (needs.synth.result == 'success' || needs.synth.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        id: ["84", "1342", "14838"]
        voice: [marlowe, rowan, hazel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - name: System deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Node deps
        run: npm ci --no-audit --no-fund
      - name: Fetch book text + plan
        run: |
          mkdir -p /tmp/texts
          curl -fsSL "https://focus-reader-48z.pages.dev/books/${{ matrix.id }}.txt" -o "/tmp/texts/${{ matrix.id }}.txt"
          node scripts/narration/plan.mjs --ids="${{ matrix.id }}" --text-dir=/tmp/texts
      - name: Download shard WAVs
        uses: actions/download-artifact@v4
        with:
          pattern: wavs-${{ matrix.id }}-${{ matrix.voice }}-*
          path: scripts/narration/work/${{ matrix.id }}/${{ matrix.voice }}
          merge-multiple: true
          run-id: ${{ github.event.inputs.resume_from_run || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Align, time, encode
        run: node scripts/narration/finish.mjs --ids="${{ matrix.id }}" --voices="${{ matrix.voice }}"
      - name: Verify
        run: node scripts/narration/verify.mjs --ids="${{ matrix.id }}" --voices="${{ matrix.voice }}"
      - name: Upload verified output
        uses: actions/upload-artifact@v4
        with:
          name: out-${{ matrix.id }}-${{ matrix.voice }}
          path: |
            scripts/narration/work/${{ matrix.id }}/${{ matrix.voice }}/out/*
            scripts/narration/work/${{ matrix.id }}/${{ matrix.voice }}/status.json
          retention-days: 14
          if-no-files-found: error

  collect:
    name: collect, manifest, upload
    needs: finish
    # Explicit: without this, a skipped ancestor (synth, on a resume run)
    # propagates down the needs chain and silently skips collect — the run
    # still reports success while producing no manifest at all.
    if: ${{ always() && (needs.finish.result == 'success' || needs.finish.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - name: Node deps
        run: npm ci --no-audit --no-fund
      - name: Download verified pairs
        uses: actions/download-artifact@v4
        with:
          pattern: out-*
          path: /tmp/pairs
          run-id: ${{ github.event.inputs.collect_from_run || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Reassemble work layout + audio tree
        run: |
          set -e
          mkdir -p audio-tree
          for d in /tmp/pairs/out-*; do
            name=$(basename "$d"); rest=${name#out-}; id=${rest%%-*}; voice=${rest#*-}
            mkdir -p "scripts/narration/work/$id/$voice"
            cp -r "$d"/* "scripts/narration/work/$id/$voice/" 2>/dev/null || true
            # artifact layout: out/ subdir + status.json (see finish job)
            mkdir -p "audio-tree/$id/$voice"
            cp "scripts/narration/work/$id/$voice/out/"* "audio-tree/$id/$voice/"
          done
          find audio-tree -type f | sort
      - name: Build manifest + checklist
        run: |
          node scripts/narration/build-manifest.mjs
          node scripts/narration/build-narration-checklist.mjs
          cat public/narration-v1.json
      - name: Commit manifest + checklist to master
        run: |
          git config user.name "narration-pilot"
          git config user.email "actions@users.noreply.github.com"
          git add public/narration-v1.json NARRATION-CHECKLIST.md
          if git diff --cached --quiet; then
            echo "::notice::manifest unchanged — nothing to commit"
          else
            # Commit BEFORE syncing: the files we just wrote are
            # tracked, and `pull --rebase` refuses to run with
            # unstaged changes (exit 128).
            git commit -m "feat(narration): pilot manifest — narration-v1.json + checklist (run ${{ github.run_id }})

          Generated by the narration-pilot workflow from verified runner output.
          Goes live for installed apps on the next Pages deploy.

          Co-Authored-By: Claude <noreply@anthropic.com>"
            git fetch origin master
            git rebase origin/master
            git push origin master
          fi
      - name: Upload to R2 (only when secrets are configured)
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          if [ -z "$R2_ACCESS_KEY_ID" ]; then
            echo "::notice::R2 secrets not configured — skipping upload. Audio is in the pilot-bundle artifact; upload from the desk with scripts/upload-audio-r2.mjs, or add R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_ENDPOINT repository secrets and re-run this job."
            exit 0
          fi
          sudo apt-get install -y -qq rclone
          rclone copy audio-tree :s3:focus-reader-books/audio \
            --s3-provider Cloudflare \
            --s3-access-key-id "$R2_ACCESS_KEY_ID" \
            --s3-secret-access-key "$R2_SECRET_ACCESS_KEY" \
            --s3-endpoint "$R2_ENDPOINT" \
            --s3-no-check-bucket --ignore-existing --progress
          echo "R2 upload complete. Remember: backup-r2.mjs + deploy-pages.mjs from the desk."
      - name: Upload pilot bundle (backup / desk pickup)
        uses: actions/upload-artifact@v4
        with:
          name: pilot-bundle
          path: |
            audio-tree
            public/narration-v1.json
            NARRATION-CHECKLIST.md
          retention-days: 14
