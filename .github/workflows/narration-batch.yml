name: Narration batch

# Generic narration generation for ANY id list, in waves — the scaled-up
# sibling of narration-pilot.yml built for the Popular-shelf rollout. A
# prepare job plans every book (running the leftover gate), sizes shards
# from real word counts (~60k words per shard keeps every job well inside
# runner limits), and emits the synth/finish matrices dynamically. Everything
# else matches the pilot: synth shards → finish+verify per book×voice →
# collect (manifest merge + commit, R2 upload when secrets exist, bundle
# artifact otherwise).
#
# GitHub caps a matrix at 256 jobs — run big shelves in waves of ~25 books.
# Books the gate excludes are reported in the prepare job summary and land
# in NARRATION-CHECKLIST.md at collect time.

on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Comma-separated Gutenberg ids for this wave"
        required: true
      resume_from_run:
        description: "Reuse synthesized WAVs from this earlier batch run id (skips synth)"
        default: ""
      collect_from_run:
        description: "Reuse VERIFIED bout-* from this earlier batch run id (skips synth AND finish)"
        default: ""

permissions:
  contents: write

concurrency:
  group: narration-batch
  cancel-in-progress: false

jobs:
  prepare:
    name: plan, gate, size shards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      synth_matrix: ${{ steps.mk.outputs.synth_matrix }}
      finish_matrix: ${{ steps.mk.outputs.finish_matrix }}
      deferred: ${{ steps.mk.outputs.deferred }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Fetch texts + plan + gate
        run: |
          mkdir -p /tmp/texts
          for id in $(echo "${{ github.event.inputs.ids }}" | tr ',' ' '); do
            curl -fsSL "https://focus-reader-48z.pages.dev/books/${id}.txt" -o "/tmp/texts/${id}.txt" || echo "::warning::${id}: fetch failed"
          done
          node scripts/narration/plan.mjs --ids="${{ github.event.inputs.ids }}" --text-dir=/tmp/texts || true
      - name: Build matrices
        id: mk
        run: |
          node - <<'EOF' >> "$GITHUB_OUTPUT"
          const { readFileSync, existsSync } = require('fs');
          const voices = Object.keys(JSON.parse(readFileSync('scripts/narration/voices.json', 'utf8')).personas);
          const ids = "${{ github.event.inputs.ids }}".split(',').map((s) => s.trim()).filter(Boolean);
          // GitHub caps a matrix at 256 jobs. Rather than fail an oversized
          // wave, fill up to MAX_JOBS in the order given and DEFER the rest —
          // real span sizes are only known here, after planning, and a book
          // like the complete Shakespeare can be worth 45 jobs on its own.
          const MAX_JOBS = 220;
          const synth = [], finish = [], excluded = [], deferred = [], sized = [];
          let total = 0;
          for (const id of ids) {
            const planPath = `scripts/narration/work/${id}/plan.json`;
            if (!existsSync(planPath)) { excluded.push(id); continue; }
            const plan = JSON.parse(readFileSync(planPath, 'utf8'));
            const shards = Math.max(1, Math.ceil(plan.spanWords / 60000));
            const jobs = shards * voices.length;
            if (total + jobs > MAX_JOBS) { deferred.push(id); continue; }
            total += jobs;
            sized.push(`${id}: ${plan.spanWords}w -> ${shards} shards x ${voices.length} voices = ${jobs} jobs`);
            for (const voice of voices) {
              finish.push({ id, voice });
              for (let s = 0; s < shards; s++) synth.push({ id, voice, shard: `${s}/${shards}` });
            }
          }
          if (!synth.length) { console.error('nothing to synthesize (all ids gated or deferred)'); process.exit(1); }
          console.log(`synth_matrix=${JSON.stringify({ include: synth })}`);
          console.log(`finish_matrix=${JSON.stringify({ include: finish })}`);
          console.log(`deferred=${deferred.join(',')}`);
          console.error(`jobs: ${synth.length} synth, ${finish.length} finish`);
          console.error(sized.join('\n'));
          console.error(`gated/excluded: ${excluded.join(',') || 'none'}`);
          console.error(`DEFERRED to a later wave: ${deferred.join(',') || 'none'}`);
          EOF

  synth:
    name: synth ${{ matrix.id }}/${{ matrix.voice }} ${{ matrix.shard }}
    needs: prepare
    if: ${{ !github.event.inputs.resume_from_run && !github.event.inputs.collect_from_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.prepare.outputs.synth_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: System deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg
      - run: npm ci --no-audit --no-fund
      - name: Python deps
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet kokoro soundfile
      - name: Fetch text + plan
        run: |
          mkdir -p /tmp/texts
          curl -fsSL "https://focus-reader-48z.pages.dev/books/${{ matrix.id }}.txt" -o "/tmp/texts/${{ matrix.id }}.txt"
          node scripts/narration/plan.mjs --ids="${{ matrix.id }}" --text-dir=/tmp/texts
      - name: Synthesize shard
        run: python scripts/narration/synth.py --ids="${{ matrix.id }}" --voices="${{ matrix.voice }}" --unit-stride="${{ matrix.shard }}"
      - name: Upload shard WAVs
        uses: actions/upload-artifact@v4
        with:
          name: bwavs-${{ matrix.id }}-${{ matrix.voice }}-${{ strategy.job-index }}
          path: scripts/narration/work/${{ matrix.id }}/${{ matrix.voice }}/unit-*
          retention-days: 3
          if-no-files-found: error

  finish:
    name: finish ${{ matrix.id }}/${{ matrix.voice }}
    needs: [prepare, synth]
    # A skipped ancestor propagates down the needs chain, so a resume run has
    # to say so explicitly or finish never starts.
    if: ${{ always() && !github.event.inputs.collect_from_run && needs.prepare.result == 'success' && (needs.synth.result == 'success' || needs.synth.result == 'skipped') }}
    runs-on: ubuntu-latest
    # 60 was sized for a novel. The complete Shakespeare is ~80 hours of audio
    # in one job: ~10 GB of artifacts to pull, ~275 segments to encode, and an
    # ffprobe pass over every one of them.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.finish_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - name: Free disk space
        # A 960k-word book unpacks ~14 GB of shard WAVs and a stock runner has
        # only ~21 GB free. These toolchains are worth ~25 GB and this job
        # touches none of them.
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
                      /usr/share/swift /usr/local/.ghcup || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / | tail -1
      - name: System deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm ci --no-audit --no-fund
      - name: Fetch text + plan
        run: |
          mkdir -p /tmp/texts
          curl -fsSL "https://focus-reader-48z.pages.dev/books/${{ matrix.id }}.txt" -o "/tmp/texts/${{ matrix.id }}.txt"
          node scripts/narration/plan.mjs --ids="${{ matrix.id }}" --text-dir=/tmp/texts
      - name: Download shard WAVs
        uses: actions/download-artifact@v4
        with:
          pattern: bwavs-${{ matrix.id }}-${{ matrix.voice }}-*
          path: scripts/narration/work/${{ matrix.id }}/${{ matrix.voice }}
          merge-multiple: true
          run-id: ${{ github.event.inputs.resume_from_run || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Align, time, encode
        run: node scripts/narration/finish.mjs --ids="${{ matrix.id }}" --voices="${{ matrix.voice }}"
      - name: Verify
        run: node scripts/narration/verify.mjs --ids="${{ matrix.id }}" --voices="${{ matrix.voice }}"
      - name: Upload verified output
        uses: actions/upload-artifact@v4
        with:
          name: bout-${{ matrix.id }}-${{ matrix.voice }}
          path: |
            scripts/narration/work/${{ matrix.id }}/${{ matrix.voice }}/out/*
            scripts/narration/work/${{ matrix.id }}/${{ matrix.voice }}/status.json
          retention-days: 14
          if-no-files-found: error

  collect:
    name: collect, manifest, upload
    needs: [prepare, finish]
    # finish is fail-fast:false and the manifest MERGES, so one bad book must
    # not throw away the other eighteen: collect on failure too and ship every
    # pair that actually verified. A wave with zero verified pairs is caught
    # below, at reassembly.
    if: ${{ always() && (needs.finish.result == 'success' || needs.finish.result == 'failure' || needs.finish.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Download verified pairs
        uses: actions/download-artifact@v4
        with:
          pattern: bout-*
          path: /tmp/pairs
          run-id: ${{ github.event.inputs.collect_from_run || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Reassemble work layout + audio tree
        run: |
          set -e
          mkdir -p audio-tree
          shopt -s nullglob
          pairs=(/tmp/pairs/bout-*)
          if [ ${#pairs[@]} -eq 0 ]; then
            echo "::error::no verified bout-* artifacts — every pair in this wave failed"
            exit 1
          fi
          echo "verified pairs: ${#pairs[@]}"
          for d in "${pairs[@]}"; do
            name=$(basename "$d"); rest=${name#bout-}; id=${rest%%-*}; voice=${rest#*-}
            mkdir -p "scripts/narration/work/$id/$voice"
            cp -r "$d"/* "scripts/narration/work/$id/$voice/"
            mkdir -p "audio-tree/$id/$voice"
            cp "scripts/narration/work/$id/$voice/out/"* "audio-tree/$id/$voice/"
          done
          du -sh audio-tree
      - name: Build manifest + checklist
        run: |
          node scripts/narration/build-manifest.mjs
          node scripts/narration/build-narration-checklist.mjs
      - name: Commit manifest + checklist to master
        run: |
          git config user.name "narration-batch"
          git config user.email "actions@users.noreply.github.com"
          git add public/narration-v1.json NARRATION-CHECKLIST.md
          if git diff --cached --quiet; then
            echo "::notice::manifest unchanged — nothing to commit"
          else
            # Commit BEFORE syncing: the files we just wrote are
            # tracked, and `pull --rebase` refuses to run with
            # unstaged changes (exit 128).
            git commit -m "feat(narration): batch manifest (run ${{ github.run_id }})

          Co-Authored-By: Claude <noreply@anthropic.com>"
            git fetch origin master
            git rebase origin/master
            git push origin master
          fi
      - name: Upload to R2 (only when secrets are configured)
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          # Check all three by name: a partially-configured set otherwise
          # fails deep inside rclone with an opaque message.
          missing=""
          [ -z "$R2_ACCESS_KEY_ID" ] && missing="$missing R2_ACCESS_KEY_ID"
          [ -z "$R2_SECRET_ACCESS_KEY" ] && missing="$missing R2_SECRET_ACCESS_KEY"
          [ -z "$R2_ENDPOINT" ] && missing="$missing R2_ENDPOINT"
          if [ -n "$missing" ]; then
            echo "::warning::R2 upload skipped — missing repository secret(s):$missing (names must match EXACTLY). The audio is safe in this run's bundle artifact; add the secret(s) and re-run, or upload from the desk with scripts/upload-audio-r2.mjs."
            exit 0
          fi
          sudo apt-get install -y -qq rclone
          # rclone flags are long and repeated; keep one copy. GitHub masks
          # the secret values in the log.
          RC=(--s3-provider Cloudflare
              --s3-access-key-id "$R2_ACCESS_KEY_ID"
              --s3-secret-access-key "$R2_SECRET_ACCESS_KEY"
              --s3-endpoint "$R2_ENDPOINT"
              --s3-no-check-bucket)
          rclone copy audio-tree :s3:focus-reader-books/audio "${RC[@]}" --ignore-existing --stats-one-line --stats 5s
          # Read BACK from the bucket. An exit-0 copy is not evidence the
          # objects landed — the only proof is what the bucket returns.
          sent=$(find audio-tree -type f | wc -l)
          held=$(rclone lsf -R --files-only :s3:focus-reader-books/audio "${RC[@]}" | wc -l)
          rclone size :s3:focus-reader-books/audio "${RC[@]}"
          echo "this wave sent $sent files; R2 audio/ now holds $held objects"
          if [ "$held" -lt "$sent" ]; then
            echo "::error::R2 holds $held objects but this wave sent $sent — upload incomplete"
            exit 1
          fi
      - name: Upload batch bundle
        uses: actions/upload-artifact@v4
        with:
          name: batch-bundle-${{ github.run_id }}
          path: |
            audio-tree
            public/narration-v1.json
            NARRATION-CHECKLIST.md
          retention-days: 14
