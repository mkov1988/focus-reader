dle. Sentence skips, word taps, and swipe skips during playback now continue reading from the new spot with the new word getting a full dwell. Only pause, togglePlay, and the AppState listener flip playing.\n\n**2. Stuck dragging flag after tap or failed pan** (done)\n\nAdded pan.onFinalize worklet that clears dragging; it fires for completed, cancelled, and failed gestures, so interacting can no longer pin true after a tap wins the Race or a horizontal move trips failOffsetX. Verified in displays.tsx that useReelFrame then mounts only the centred row with no per word setReel pushes during playback. Did not replicate the web's stuck scrubbing tap quirk.\n\n**3. Final readable word gets full dwell; play works at readable end** (done)\n\nMoved the end check inside the acc >= wordDelay branch: the word at (or past) effectiveEnd accumulates its full delay (including the 3x sentence end multiplier) before mode drops to 0 and setPlayingJS(false) fires. togglePlay guard changed from cur < effectiveEnd to max > 0 && cur < max, matching web play() which blocks only at the raw last token; the max > 0 part mirrors web's tokens.length > 0 so play stays blocked while the parse is still empty.\n\n**4. WPM change during playback restarts current word's dwell** (done)\n\nThe existing wpm effect now also resets acc.value = 0 when mode.value === 1, so each plus/minus tap gives the on screen word a fresh full delay at the new rate, like the web's loop restart.\n\n**5. OS reduce motion honored** (done)\n\nNew reduceMotion shared value fed by AccessibilityInfo.isReduceMotionEnabled plus a live reduceMotionChanged listener (chose this over reanimated's useReducedMotion because that hook only reads the value at app start; the web matchMedia check is live). Pan onEnd finalizes instantly (round, clamp, vel 0, mode 0) when enabled, and the mode 3 settle branch also lands instantly for any settle already in flight. Applies to Focus, Sentence, and Trail since all share the engine.\n\n**6. Fling interruption semantics (re-grip, controls seek, play)** (done)\n\n(a) dragBase now seeds from the clamped Math.round(pos.value) (the committed integer, like web getIndex()), so catching a coasting reel snaps up to half a row on the first move; at rest and during playback pos is already an integer so nothing else changes. (b) Kept native's seek wins behavior over an in flight fling as instructed, documented the deliberate divergence in a comment, and put the question to Michael in the summary. (c) Confirmed togglePlay during a fling still zeroes vel, resets acc, and enters mode 1; none of my edits touched that path.\n\n### Judgment calls made during implementation\n\n1) Reduce motion uses AccessibilityInfo with the reduceMotionChanged event listener instead of reanimated's useReducedMotion hook, because the reanimated hook only samples the setting at app launch while the web's media query check is live; the listener keeps the shared value current if Michael flips the setting mid session. 2) Issue 6(b): kept the native behavior where a controls seek immediately beats a coasting fling, since the web's fling swallowing an explicit seek reads like an accident; flagged the question for Michael below. 3) togglePlay's new guard is max > 0 && cur < max rather than just cur < max, mirroring the web's tokens.length > 0 check so play cannot start on an empty or still loading parse (where delay tables are empty and the worklet would compute NaN delays). 4) Version: preserved the uncommitted 0.7.3 bump in app.json untouched and did not bump further, reading this parity round (the nine storefront packs plus the reader packages) as sharing that one bump since a separate step commits the round. 5) Did not touch ReaderChrome's progress bar (it already pauses explicitly before seeking, matching web) or the pan onBegin pause at touch down (the over eager tap zone pause is owned by another session's package).\n\n### Testing performed\n\n- `npx tsc --noEmit` in the native repo: clean at commit time.\n- An independent adversarial review agent re-opened the uncommitted diff, checked every acceptance checklist item above against the native code and the cited web sources (exact constants, timings, easing curves, and copy strings), hunted for regressions (broken imports, accidental behavior changes, worklet violations), and re-ran the type check itself. Verdict: passed with no unresolved findings and zero fix rounds.\n- The commit step re-ran the type check once more before staging, and staged only the files listed above (no blanket `git add`).\n- Not yet done: the on-device checks in the Verification section above. Playback pacing and gesture feel only prove out on a real phone, so those remain for Michael on build 0.7.10 or later.\n"},{"id":"07","filename":"07-reader-gesture-zoning.md","title":"Reader stage gesture zoning","content":"# Reader stage gesture zoning\n\n> **Status: implemented and committed 2026-07-13.** Commit `90e77e1` on `feat/native-ui-web-parity` in the native repo. Adversarial review passed with no unresolved findings. Note: Sentence view ships with no swipe down exit anywhere, matching the web; flagged for Michael to overrule if wanted.\n\n\n## Mission\n\nRestructure the native reader's touch handling so it matches the web app's spatial gesture zoning. Today the native app runs one `Gesture.Race(...)` over the entire reading stage, so every touch anywhere competes between scrub, swipe, and tap. The web app instead splits the stage into zones: the display band (the Focus reel or Trail ribbon, or the full stage in Sentence mode) owns the kinetic scrub, and the surrounding stage owns tap to peek, horizontal sentence skip swipes, and the swipe down exit. This package rebuilds that zoning and fixes eight smaller gesture and feel mismatches that hang off the same structure.\n\n## Context\n\nFocus Reader is a cozy speed reading app for public domain books. There are two repos:\n\n- **Web app (READ ONLY source of truth):** `C:/Users/Michael/Desktop/Focus Reader`. This is the reference for every look and behavior. Never modify anything in this repo. Read it freely.\n- **Native app (where ALL changes go):** `C:/Users/Michael/Desktop/Focus Reader Android`. Expo SDK 54, React Native 0.81, reanimated 4, gesture-handler 2.28, zustand, expo-image, expo-haptics, lucide-react-native, react-navigation native-stack.\n\nThis is a full React Native app. Never introduce a WebView anywhere.\n\nReader vocabulary you need:\n\n- The reader has five visualization modes: `rsvp` (called Focus, a vertical word reel), `trail` (a horizontal ghost ribbon), `sentence` (a horizontal word strip), `paragraph` (a scrollable paragraph card), and `hybrid` (Focus reel on top plus a faded paragraph card in the bottom 45%).\n- `READER_FONT_SIZE` is 56 in both apps. The Focus reel and Trail ribbon are each a band of height `fontSize * 4` = 224px. The reel row height and vertical scrub density are `fontSize * 1.5` = 84px per word. Trail scrub density is `round(fontSize * 2.5)` = 140px per word.\n- \"Kinetic scrub\" means dragging the reel or strip with your finger to move through the book, with inertia on release. On web it lives in `src/hooks/useKineticScrub.ts`; on native it is the `scrubGesture` built inside `src/reader/useReelEngine.ts`.\n- \"Chrome\" means the header and controls. \"Peek\" briefly shows the chrome while playing. \"Poke\" counts as activity so the chrome stays up.\n\n## Before you start\n\n1. Run `git status` in `C:/Users/Michael/Desktop/Focus Reader Android`. Expect branch `feat/native-ui-web-parity`.\n2. **WARNING, THIS PACKAGE OVERLAPS THE ACTIVE READER FIX SESSION.** Another session may hold uncommitted changes in `src/reader/ReaderChrome.tsx`, `src/reader/displays.tsx`, `src/reader/useReelEngine.ts`, and `app.json`. This package edits `src/reader/useReelEngine.ts`, `src/reader/displays.tsx`, and `src/screens/ReaderScreen.tsx`, so two of your three files may already differ from the last commit. Read the current state of every file before editing it, build your edits on what is actually there, and do not revert changes you did not make.\n3. Ideally run this package after the `reel-engine-playback-core` package (see `docs/native-parity/06-reel-engine-playback-core.md` in the web repo), because pause and seek semantics feed the zoning behavior here. If that package has not landed, proceed anyway but re-check any engine code it touched.\n4. Line numbers below were verified on 2026-07-13. If a listed line has drifted, trust the described behavior and re-locate the code.\n\n## The target gesture map\n\nThis is the web's zoning, which native must reproduce. All thresholds resolve at release unless noted.\n\n| Mode | Scrub surface (kinetic scrub + pause on touch down) | Rest of the stage |\n|---|---|---|\n| Focus (`rsvp`) | The 224px reel band, vertical axis | Tap peeks (no pause). Horizontal swipe past 70px skips a sentence. Downward swipe past 110px exits. |\n| Hybrid | The 224px reel band, vertical axis | Top area off the band: same as Focus. Bottom 45% paragraph card: native scroll plus edge advance; horizontal swipes still skip; swipe down NEVER exits from here. |\n| Trail | The 224px ribbon, horizontal axis | Tap peeks. Horizontal swipe past 70px skips. Downward swipe past 110px exits. |\n| Sentence | The strip covers the WHOLE stage, horizontal axis | Nothing. No tap peek, no skip swipe, no exit swipe. Tapping a word seeks (word press only). |\n| Paragraph | none (no kinetic scrub) | Native scroll plus edge advance on the card. Tap peeks. Horizontal swipe past 70px skips. No swipe down exit (the whole surface is a scroller). |\n\nKey web mechanics behind this map:\n\n- The display components stop propagation on pointer down (`src/hooks/useKineticScrub.ts:139-149`, attached in `src/components/Reader/RSVPDisplay.tsx:123-133`, `src/components/Reader/GhostTrailDisplay.tsx:121-126`, `src/components/Reader/SentenceDisplay.tsx:168-179`), so once a touch starts on the display band the outer reader gestures never arm.\n- The outer gestures live on `<main>` (`src/App.tsx:337`) via `useReaderGestures` (`src/hooks/useReaderGestures.ts`). Constants at lines 17-21: `TAP_MS = 250`, `TAP_PX = 8`, `SWIPE_PX = 70`, `SWIPE_DOWN_PX = 110`. Resolution happens ONCE at pointer up (lines 96-108): tap if both axes moved under 8px and under 250ms; else horizontal skip if `absX > absY && absX > 70`; else exit if `!inScroller && dy > absX && dy > 110`. Because dominance is checked at release, steep diagonals still count.\n- `startedInVerticalScroller` (`useReaderGestures.ts:32-40`) walks up from the touch target looking for `overflow-y: auto|scroll`; if the gesture began inside the paragraph scroller, the swipe down exit is suppressed so scrolling the text never ejects the reader.\n- Touching the scrub surface pauses playback immediately at pointer down: `useKineticScrub` fires `onStart` (line 163), wired to `handleManualScroll` = activity poke + pause (`src/components/Reader/ReaderView.tsx:54-57`).\n- A tap on the scrub surface resolves inside the scrub itself: if movement ON THE SCRUB AXIS stayed under 8px and the touch lasted under 250ms, `onTap` fires (`useKineticScrub.ts:194-197`). Focus and Trail wire `onTap` to haptic tick + peek (`App.tsx:349`, `ReaderView.tsx:97,109`); Sentence does NOT pass `onTap` (`ReaderView.tsx:126-136`), so a tap on the sentence strip does nothing. Note the tap check uses axis movement only, so a quick horizontal flick across the Focus reel band (under 250ms, under 8px of VERTICAL travel) resolves as a tap and peeks; it never skips a sentence.\n\nNative counterpart today: `src/screens/ReaderScreen.tsx:180-204` builds `tap` (Tap, maxDuration 250, maxDistance 8, haptic + peek), `swipeSkip` (Pan, `activeOffsetX([-28, 28])`, `failOffsetY([-20, 20])`, onEnd fires skip when `|translationX| > 70`), and `swipeDown` (Pan, `activeOffsetY(30)`, `failOffsetX([-24, 24])`, onEnd fires `handleBack` when `translationY > 110 && translationY > |translationX|`), then composes per mode:\n\n```\nrsvp / hybrid: Race(engine.scrubGesture, swipeSkip, tap)\ntrail / sentence: Race(engine.scrubGesture, swipeDown, tap)\nparagraph: Race(swipeSkip, tap)\n```\n\nOne `GestureDetector` with that Race wraps the whole stage (`ReaderScreen.tsx:273`). The engine's `scrubGesture` (`src/reader/useReelEngine.ts:262-300`) pauses playback in `onBegin` (which fires at touch down, stage wide) and activates with `activeOffsetY([-12, 12]).failOffsetX([-24, 24])` on the y axis or the mirrored offsets on the x axis.\n\n## Issues to fix\n\n### 1. Replace the stage wide Race with spatial zoning (gestures-stage-gesture-zoning)\n\n**Web:** as described in the gesture map above. Concrete consequences of the web structure: (a) a horizontal swipe ON the 224px Focus reel band never skips a sentence (it either does nothing or peeks, if axis movement stayed under 8px within 250ms); (b) a fast vertical flick ON the trail ribbon or sentence strip never exits the reader (the x axis scrub owns it); (c) in Trail mode a 70px horizontal swipe OFF the ribbon skips a sentence; (d) swipe direction dominance is resolved once at release (`absX > absY && absX > 70`), so steep diagonals still count.\n\n**Native:** the single Race over the whole stage means (a) a horizontal swipe over the Focus reel activates `swipeSkip` (its `activeOffsetX` 28 beats the scrub's `failOffsetX` 24) and wrongly skips a sentence; (b) a strong downward flick over the trail or sentence strip activates `swipeDown` and wrongly exits; (c) in Trail mode there is no `swipeSkip` at all, so off ribbon horizontal swipes scrub instead of skipping; (d) diagonal swipes that cross `failOffsetY` 20px before `activeOffsetX` 28px fail entirely instead of resolving by dominance at release. Also, because the scrub's `onBegin` pause fires at touch down stage wide, ANY touch anywhere pauses playback, so tap to peek always pauses (web only pauses when the touch starts on the scrub surface).\n\n**Change:** attach the kinetic scrub (and its pause on touch down) to the display band only, and attach the outer set to the rest of the stage, per the gesture map. Suggested implementation, adapt as needed:\n\n- Pass `engine.scrubGesture` down into the display components (or wrap the band views in `ReaderScreen`) so a `GestureDetector` sits directly on the `fontSize * 4` band view (`displays.tsx:165` for the Focus reel, `displays.tsx:253` for Trail) and on the SentenceDisplay root, which spans the whole stage.\n- Keep an outer `GestureDetector` on the stage. Replace `swipeSkip` + `swipeDown` with ONE resolver Pan that mirrors the web's single release time resolution: at `onEnd`, if `absX > absY && absX > 70` skip (left = forward, right = back); else if the touch did not start inside the hybrid paragraph card and `dy > absX && dy > 110` exit. Keep the separate Tap (250ms, 8px) for peek + haptic, racing the resolver.\n- RNGH has no `stopPropagation`, so make the zoning deterministic with hit tests instead of activation order: measure the band frame (and in Hybrid the paragraph card frame) via `onLayout` into refs, record the touch start position in the outer gestures, and no-op the outer tap and resolver when the touch began inside the band. This avoids every arbitration race. Mark the outer resolver `simultaneousWithExternalGesture` with the band scrub and the paragraph scroller so nothing cancels anything; the hit tests decide what acts.\n- Per mode composition after the fix: Focus and Hybrid get band scrub + outer tap + outer resolver (skip and exit branches). Trail gets ribbon scrub + outer tap + outer resolver (skip AND exit, fixing consequence (c)). Sentence gets ONLY the strip scrub (see issues 7 and 8). Paragraph keeps outer tap + the resolver's skip branch only.\n- A tap on the Focus band or Trail ribbon should still pause (touch down pause) then peek with a haptic, matching web. Implement the band tap inside the band scoped detector (for example Race the band pan with a Tap of maxDuration 250 / maxDistance 8, or resolve it inside the pan like web does with axis movement under 8px within 250ms).\n\n### 2. Focus and Hybrid have no swipe down exit (gestures-focus-hybrid-swipe-down-exit-missing)\n\n**Web:** `useReaderGestures` on `<main>` (`src/hooks/useReaderGestures.ts:96-108`, constants at 17-21, `App.tsx:246-252`): on pointer up, if `dy > |dx|` and `dy > 110` and the gesture did not start inside a vertical scroller (`startedInVerticalScroller`, lines 32-40), `onSwipeDown` fires `handleBack` (pause + return to the storefront). In Focus, that is the whole stage above and below the 224px reel band. In Hybrid, it is only the top half area around the reel band; the bottom 45% paragraph scroller deliberately suppresses the exit so scrolling the text never ejects the reader. The 110px threshold is deliberately large so casual movement never exits.\n\n**Native:** `swipeDown` exists (`ReaderScreen.tsx:193-198`) but `surfaceGesture` only includes it for `trail` and `sentence` (`ReaderScreen.tsx:200-204`). For `rsvp` and `hybrid` the Race is `(scrubGesture, swipeSkip, tap)`: the vertical scrub claims all vertical drags stage wide, and there is no downward flick exit at all.\n\n**Change:** with the zoning from issue 1 in place, vertical drags starting on the reel band scrub, and a downward flick starting elsewhere on the stage (`dy > 110`, vertically dominant at release, NOT starting inside the hybrid paragraph card) exits the reader via `handleBack`.\n\n### 3. Scrub activation deadzone and cross axis bail (gestures-reel-scrub-activation-deadzone)\n\n**Web:** `useKineticScrub` owns the pointer at pointer down (`useKineticScrub.ts:139-180`; the reel and ribbon set `touchAction: 'none'`) and applies `(start - coord) / pxPerStep` on every pointer move, so the reel moves fractionally from the very first pixel of finger travel (1px = 1/84 word on the Focus reel). Movement on the perpendicular axis is simply ignored; it never cancels the scrub.\n\n**Native:** the scrub Pan uses `activeOffsetY([-12, 12]).failOffsetX([-24, 24])` (y axis) or the mirrored x axis offsets (`useReelEngine.ts:296-298`). The reel does not follow the finger until 12px of travel, and 24px of perpendicular movement kills the scrub entirely, handing the gesture to `swipeSkip` or `swipeDown`. Worse, RNGH translation includes the pre activation travel, so on activation the reel jumps about 12/84 of a word instead of easing from zero.\n\n**Change:** once the scrub is scoped to the band (issue 1), those offsets have no reason to exist; they were only there because scrub, swipes, and tap raced over one surface. Remove the activation deadzone and the cross axis fail: use `manualActivation` (activate in `onTouchesMove` on the first movement) or minimal offsets so tracking starts effectively immediately and perpendicular movement never cancels the scrub. Make sure the tracked position starts from zero at the moment tracking begins so there is no activation jump.\n\n### 4. Hybrid reel scrub races the paragraph half's scroll (gestures-hybrid-reel-scrub-steals-paragraph-scroll)\n\n**Web:** Hybrid = reel band on top plus a bottom 45% ParagraphDisplay that is a real `overflow-y: auto` scroller (`ReaderView.tsx:139-164`, `ParagraphDisplay.tsx:205-217`). Dragging the paragraph text scrolls it natively, pausing playback via `onManualScroll` when vertically dominant past 8px; over scrolling an edge by 34px advances a paragraph; the reel scrub exists only within the reel band; the swipe down exit is suppressed for gestures starting inside the scroller (`useReaderGestures.ts:32-40`).\n\n**Native:** `surfaceGesture` for `hybrid` wraps the WHOLE stage (`ReaderScreen.tsx:200-204,297-313`), including the bottom 45% ParagraphDisplay. Inside that half the paragraph has its own `GHScrollView` (`displays.tsx:520-534`) plus a bare `edgePan` (`displays.tsx:475-513`) that activates at the platform touch slop (about 8dp on Android) in any direction and runs simultaneously with the scroll. Three handlers race every drag. For a normal speed vertical drag the edgePan and scroll (about 8dp) activate before the stage scrub (12px) and cancel it, so the paragraph likely scrolls. But a fast fling whose first touch move event jumps past 12px can let the stage scrub activate first, cancelling the scroll and scrubbing the reel instead. The outcome depends on arbitration and touch sampling, unlike web's deterministic spatial split.\n\n**Change:** falls out of issue 1. In Hybrid, vertical drags inside the paragraph half must ALWAYS scroll the paragraph (with the 34px edge advance barrier), and the reel scrub must engage only on the reel band. Scope the scrub detector to the band; do not rely on activation order races.\n\n### 5. Paragraph edgePan claims all drags (gestures-paragraph-edgepan-claims-all-drags)\n\n**Web:** `ParagraphDisplay.handleTouchMove` (`ParagraphDisplay.tsx:136-164`) returns early unless `|dy| > 8 && |dy| > |dx|`. Only vertically dominant drags count as manual scroll (`onManualScroll` = pause + activity, `ReaderView.tsx:54-57`) or feed the edge advance logic. A horizontal swipe over the paragraph therefore does NOT pause playback and, at release, the outer gestures fire the sentence skip at 70px (`useReaderGestures.ts:100-104`).\n\n**Native:** `edgePan` (`displays.tsx:475-513`) is a bare `Gesture.Pan()` that activates at the platform touch slop (about 8dp on Android), direction agnostic, and its `onUpdate` calls `onManualScroll?.()` unconditionally on EVERY update. `ReaderScreen.handleManualScroll` (`ReaderScreen.tsx:221-224`) is `poke()` + `engine.pause()`. So an 8dp horizontal drag over the paragraph pauses playback, and because edgePan activates long before the stage `swipeSkip` (`activeOffsetX` 28), RNGH's default cancel on activate prevents the sentence skip swipe from ever firing in paragraph mode.\n\n**Change:** gate the edgePan's manual scroll pause and its edge logic on vertically dominant movement (`|dy| > 8 && |dy| > |dx|`). Either give the pan `activeOffsetY([-8, 8])` plus a fail on x, or check translation dominance inside `onUpdate` before acting. Ensure horizontal 70px swipes over the paragraph card still reach the outer skip resolver (make edgePan simultaneous with, or at least not cancelling, the outer resolver). Web wheel handling (`WHEEL_MIN` 90 with magnitude mapping to 1/2/3 paragraphs) is desktop only and needs nothing on native.\n\n### 6. Edge advance can repeat within one finger stroke (displays-paragraph-advance-repeat-per-gesture)\n\n**Web:** `triggerAdvance` (`ParagraphDisplay.tsx:104-110`) sets `touchStart.current = null`, and `handleTouchMove` early returns when `touchStart` is null. After one over scroll advance the rest of that touch is inert; the user must lift and drag again to advance another paragraph. The 420ms `LANDING_MS` lock is only a secondary guard.\n\n**Native:** after an advance, only the 420ms `advanceLock` guards (`displays.tsx:456-469`). The pan keeps updating; once the lock clears, the edge anchor re-arms, and if the new paragraph is still at its edge (a short paragraph that fully fits has `atBottom` immediately true) and the finger keeps pulling, another advance fires within the same continuous gesture, repeating about every 420ms.\n\n**Change:** latch a per gesture flag when an advance fires: set it in the trigger, clear it in `onBegin` (or `onFinalize`), and early return in `onUpdate` while set. At most one edge advance per finger stroke. Do not touch the flick strength multi paragraph jumps (count 2 or 3 from one release); those already match web (`V_TWO` 0.9, `V_THREE` 1.5, `OVERSCROLL_MIN` 34, `LANDING_MS` 420, constants at `displays.tsx:396-399`).\n\n### 7. Swipe down exit wrongly present on the trail and sentence scrub surfaces (displays-scrub-surface-swipe-down-exit-extra)\n\n**Web:** both scrub displays stop propagation on pointer down (`GhostTrailDisplay.tsx:124-126`, `SentenceDisplay.tsx:168-179`, `useKineticScrub.ts:147-149`), so the `<main>` level exit (110px vertically dominant) never arms for gestures starting on them. On the trail ribbon (`touchAction: 'none'`) a vertical drag does nothing. On the sentence strip (`touchAction: 'pan-y'`, covering the whole stage) a vertical drag never exits either; the browser may take the pointer for panning, aborting the scrub, but no exit fires. So in Trail mode the exit swipe only works on the stage area OUTSIDE the 224px ribbon, and in Sentence mode it works nowhere.\n\n**Native:** the trail and sentence races include `swipeDown` across the entire stage including the scrub surface (`ReaderScreen.tsx:193-204`); the x axis scrub fails on vertical drags via `failOffsetY`, handing them to `swipeDown`.\n\n**Change:** with the zoning of issue 1, exclude the exit from gestures that start on the scrub surface: in Trail mode keep it only outside the ribbon; in Sentence mode remove it entirely (the strip spans the whole stage). Note this leaves Sentence mode with no exit gesture at all, only the header back button. This matches web exactly, but it removes an escape hatch, so mention it plainly in your summary to Michael together with issue 8 in case he prefers the native behavior.\n\n### 8. Sentence strip tap peeks on native but does nothing on web (displays-sentence-tap-peek-mismatch)\n\n**Web:** `ReaderView` does NOT pass `onTap` to SentenceDisplay (`ReaderView.tsx:126-136`), and the strip fills the whole reading area with a pointer down that stops propagation, so a tap on the strip fires the scrub's `onTap` which is undefined, a no-op (`SentenceDisplay.tsx:124-135`, `useKineticScrub.ts:193-197`). Tapping a word still seeks via the word's own click handler. Net: in Sentence mode there is no tap to peek anywhere on the reading surface; chrome only returns via controls activity or pausing. Web Trail and Focus DO peek on a band tap (their `onTap` is wired through).\n\n**Native:** the stage level Tap in the sentence race fires `haptics.tick()` + `peek()` on any tap (`ReaderScreen.tsx:180-183,200-204`); a tap on a word additionally seeks via the Text `onPress`.\n\n**Change:** remove the tap (peek + haptic) from the sentence mode composition; a tap should only seek when it lands on a word. Keep the band tap peek in Focus and Trail. The web's missing tap peek in Sentence mode may itself be an oversight, but web is the source of truth until Michael says otherwise; flag it in your summary so he can decide.\n\n### 9. Sentence scrub density and word gap are off (gestures-sentence-pxperstep-off-by-one)\n\n**Web:** `SentenceDisplay.tsx:59-64`: `displaySize = max(32, min(fontSize * 0.8, 64))` = 44.8 at the fixed 56px reader size; `pxPerStep = Math.round(displaySize * 2.6)` = `Math.round(116.48)` = 116px of drag per word; strip word gap = `displaySize * 0.4` = 17.9px. That way `pxPerStep` approximates one average word plus gap and the strip roughly tracks the finger 1:1.\n\n**Native:** `PX_PER_STEP_X = 117` (`useReelEngine.ts:32-33`) and `ReaderScreen.tsx:97-99` passes a hardcoded 117 for sentence mode. The strip's gap is `displaySize * 0.5` = 22.4px (`displays.tsx:306-307`), so words sit wider apart while the drag density stays fixed; the strip tracks the finger slightly differently than web. Trail (140) and Focus (84) already match web exactly.\n\n**Change:** compute the sentence `pxPerStep` as `Math.round(displaySize * 2.6)` = 116 (derive it from the same `displaySize` formula rather than hardcoding, so a future font size change stays correct) and set the strip gap to `displaySize * 0.4` in `displays.tsx`. The gap looks visual but it is load bearing for scrub feel, since `pxPerStep` is calibrated against word plus gap width.\n\n### 10. Paragraph scroller shows Android overscroll stretch (gestures-paragraph-overscroll-stretch)\n\n**Web:** the paragraph container is `overflow-y: auto` with `overscroll-contain` (`ParagraphDisplay.tsx:205-217`): reaching an edge is a dead stop, and the deliberate 34px `OVERSCROLL_MIN` pull past it (the barrier before a paragraph advance, constants at `ParagraphDisplay.tsx:22-35`) happens against a visually static page. No rubber band, no glow.\n\n**Native:** the `GHScrollView` (`displays.tsx:520-534`) uses the default `overScrollMode`: on Android 12+ the content visibly stretches when pulled past an edge (glow on older versions), so the 34px barrier pull is accompanied by a stretch effect web never shows.\n\n**Change:** set `overScrollMode=\"never\"` (and `bounces={false}` for any future iOS build) on the paragraph `GHScrollView` so the edge feels like web's hard stop and the 34px pull is the only feedback before the advance fires. All other paragraph feel constants already match web (EDGE_SLOP 2, OVERSCROLL_MIN 34, LANDING_MS 420 with scroll disabled during landing, velocity thresholds 0.9/1.5, land at top, slide in `28 + 42(n-1)` px over `300 + 150(n-1)` ms).\n\n## Acceptance checklist\n\n- [ ] Zoning: in Focus, a horizontal swipe across the 224px reel band never skips a sentence (a quick short one peeks); in Trail, a horizontal swipe off the ribbon skips a sentence at 70px; a vertical flick on the trail ribbon or sentence strip neither exits nor does anything else; taps outside the scrub surface peek the chrome without pausing playback; steep diagonal swipes off the band resolve by dominance at release instead of dying part way.\n- [ ] Focus and Hybrid: a downward flick past 110px starting off the reel band (and, in Hybrid, off the paragraph card) exits the reader; scrolling or flicking the Hybrid paragraph text never exits.\n- [ ] The reel and strip follow the finger from the first pixel of travel, with no 12px dead zone, no jump on activation, and no cancellation from sideways finger drift.\n- [ ] In Hybrid, every vertical drag inside the paragraph half scrolls the paragraph (with the 34px edge barrier), including fast flings; the reel only scrubs when the touch starts on the reel band.\n- [ ] A horizontal drag over the paragraph card no longer pauses playback, and a 70px horizontal swipe there skips a sentence; only vertically dominant drags (over 8px and more vertical than horizontal) pause and feed the edge advance.\n- [ ] Holding a continuous pull past a paragraph edge advances exactly once; advancing again requires lifting the finger and dragging again.\n- [ ] Swipe down exits only from the stage area outside the trail ribbon in Trail mode, and not at all in Sentence mode (header back still works there).\n- [ ] Tapping the sentence strip does nothing (no peek, no haptic); tapping a word in the strip still seeks to it.\n- [ ] Sentence scrub moves one word per 116px of drag and the strip's word gap is `displaySize * 0.4` (17.9px at the default size), matching web geometry.\n- [ ] Pulling past the top or bottom of the paragraph card shows no stretch or glow; the edge is a hard stop and the only feedback before an advance is the pull itself.\n\n## Verification\n\n1. Type check the native repo: run `npx tsc --noEmit` in `C:/Users/Michael/Desktop/Focus Reader Android`. Fix any errors you introduced.\n2. Reason through the running behavior carefully, gesture by gesture and mode by mode against the target gesture map table above. Pay special attention to RNGH arbitration: confirm nothing relies on activation order between the band scrub, the outer resolver, the paragraph scroll, and the edgePan. Hit tests and explicit simultaneity should make every outcome deterministic.\n3. Do NOT use the Expo web build to verify anything. Its dev server opens blank localhost tabs in the real browser and the web bundle breaks on zustand's `import.meta`. Do not start it.\n4. On-device checking is done by Michael on his Android phone. End your summary by telling him exactly what to try, in plain everyday English, for example: open a book in Focus mode and swipe sideways across the big word in the middle, nothing should skip; swipe sideways above or below it, that should jump a sentence; flick down from the empty area, that should close the book; drag the small text at the bottom of the split view, it should only ever scroll that text; pull past the end of a paragraph and keep holding, it should turn the page once and then wait for you to let go; tap the word strip in sentence view, nothing should flash or buzz; and the page edges should feel like a firm wall instead of stretching.\n\n## Final note\n\nWhen summarizing your work for Michael, use plain everyday language, no jargon, and avoid dashes in prose (restructure the sentence instead). Also mention the two judgment calls from issues 7 and 8 (sentence view now has no swipe to exit and no tap to peek, exactly like the web) so he can overrule them if the web behavior was an oversight.\n\n---\n\n## Outcome, recorded 2026-07-13\n\nImplemented in commit `90e77e1` on `feat/native-ui-web-parity` in the native repo.\n\nFiles changed: `src/screens/ReaderScreen.tsx`, `src/reader/useReelEngine.ts`, `src/reader/displays.tsx`, `app.json`.\n\n### Issue by issue\n\n**1. Replace the stage wide Race with spatial zoning** (done)\n\nScrub GestureDetector now sits directly on the fontSize*4 band view (Focus/Trail/Hybrid) and on a full-stage wrapper in Sentence mode. The outer stage keeps Race(tap, resolver): ONE release-time Pan resolves skip (absX>absY && absX>70) then exit (dy>absX && dy>110) at finger-up, like web useReaderGestures. Zoning is deterministic via both onLayout-measured frames (band + hybrid paragraph card, measured relative to the stage view so header collapse never stales them) hit-tested against the touch start point, AND simultaneousWithExternalGesture between resolver, band scrub, and paragraph scroller so nothing cancels anything. Band taps pause at touch down then peek with a haptic; stage taps peek without pausing.\n\n**2. Focus and Hybrid swipe down exit** (done)\n\nThe resolver's exit branch is active in rsvp/hybrid/trail; a 110px vertically dominant flick off the band (and off the hybrid paragraph card) calls handleBack. Gestures starting in the hybrid card are suppressed via the measured card frame.\n\n**3. Scrub activation deadzone and cross axis bail** (done)\n\nactiveOffset/failOffset removed. The pan uses manualActivation and activates in onTouchesMove at 2px of travel; translation is measured from touch down so there is no activation jump; perpendicular movement never cancels. The 2px slack (rather than literally 0) keeps clean finger taps from activating the pan, which on Android would cancel native word presses.\n\n**4. Hybrid reel scrub races the paragraph half's scroll** (done)\n\nFalls out of issue 1: the scrub detector only exists on the reel band, and the resolver + edgePan + GHScrollView are all mutually simultaneous, so every vertical drag (including fast flings) in the paragraph half scrolls the paragraph.\n\n**5. Paragraph edgePan claims all drags** (done)\n\nedgePan onUpdate now early-returns unless |dy|>8 && |dy|>|dx| (web handleTouchMove gate) before calling onManualScroll or edge logic, with velocity samples still collected first like web. It also declares simultaneity with the stage resolver so 70px horizontal swipes over the card reach the skip.\n\n**6. Edge advance can repeat within one finger stroke** (done)\n\nA strokeConsumed ref is set in trigger() (mirroring web nulling touchStart in triggerAdvance), cleared in onBegin, and early-returns onUpdate — at most one advance per stroke. Flick-strength multi-paragraph counts (V_TWO/V_THREE) untouched.\n\n**7. Swipe down exit wrongly present on trail and sentence scrub surfaces** (done)\n\nTrail: exit only fires for touches starting outside the measured ribbon frame. Sentence: the outer detector is not rendered at all, so there is no exit gesture anywhere (header back still works). Flagged to Michael as a web-parity judgment call he can overrule.\n\n**8. Sentence strip tap peeks on native but does nothing on web** (done)\n\nNo tap/peek/haptic in sentence mode (no outer gestures; the engine's onTap for sentence routes to word-seek only). Word taps still seek: kept Text onPress AND added an analytic tap-to-word resolver driven by the scrub gesture's tap (gated on <8px stillness on both axes), because an activated pan cancels native presses for any wobbly tap. Flagged to Michael as possibly a web oversight.\n\n**9. Sentence scrub density and word gap** (done)\n\nExported sentenceDisplaySize() from displays.tsx; strip gap is now displaySize*0.4 (17.9px) and ReaderScreen passes pxPerStep = Math.round(sentenceDisplaySize(READER_FONT_SIZE)*2.6) = 116, derived from the same size so future font changes stay in step.\n\n**10. Paragraph scroller shows Android overscroll stretch** (done)\n\nGHScrollView now has overScrollMode=\"never\" and bounces={false}; edges are a hard stop and the 34px barrier pull is the only pre-advance feedback.\n\n### Judgment calls made during implementation\n\n1) Version bump: the uncommitted 0.7.3 bump was preserved and, per the standing rule to bump every change round, app.json now reads 0.7.4. 2) Scrub activation threshold: used 2px of travel instead of literally the first reported movement — a真 0px activation would cancel native word presses (sentence strip) on every real-world tap since fingers wobble a few pixels; 2px is 1/42 of a reel row and imperceptible, and translation is still measured from touch down so nothing jumps. 3) Sentence word taps: implemented an analytic tap-to-word seek fed by the scrub gesture's tap resolution (requiring <8px stillness on BOTH axes, i.e. browser-click semantics) in addition to keeping Text onPress — on native an activated pan cancels the press, so onPress alone would drop most real taps; both paths seek the same word so double-firing is idempotent. 4) Hybrid exit suppression uses a measured paragraph-card frame hit test as the native equivalent of the web's startedInVerticalScroller DOM walk. 5) Paragraph mode has NO exit branch anywhere on the stage, following the prompt's gesture map ('the whole surface is a scroller'); on very wide web screens a swipe outside the 672px card could technically exit, but on a phone the card covers the stage. 6) Per prompt instruction, the two behavior removals (sentence view: no swipe-to-exit, no tap-to-peek) were applied to match web exactly and are flagged for Michael to overrule. Suggested on-device checks for Michael, in plain words: open a book in Focus view and swipe sideways across the big word — nothing should skip, though a quick light brush there may flash the controls; swipe sideways above or below the big word and it should jump a sentence; flick straight down from an empty part of the screen and the book should close; in the split view, drag the small text at the bottom — it should only ever scroll that text, and flicking down there should never close the book; in Paragraph view, drag sideways — reading should not pause, and a longer sideways swipe should jump a sentence; pull past the end of a paragraph and keep holding — it should turn once, then wait for you to lift your finger; the page edges should feel like a firm wall with no stretchy glow; in the ribbon view, swipe sideways off the ribbon to jump a sentence, and flicking down ON the ribbon should do nothing; in Sentence view, tapping the strip should not buzz or flash anything, tapping a word should jump to it, and the only way out is the back button — that last part and the no-tap-flash both copy the website exactly, so say the word if you'd rather keep a swipe-down exit or tap-to-show-controls there.\n\n### Testing performed\n\n- `npx tsc --noEmit` in the native repo: clean at commit time.\n- An independent adversarial review agent re-opened the uncommitted diff, checked every acceptance checklist item above against the native code and the cited web sources (exact constants, timings, easing curves, and copy strings), hunted for regressions (broken imports, accidental behavior changes, worklet violations), and re-ran the type check itself. Verdict: passed with no unresolved findings and zero fix rounds.\n- The commit step re-ran the type check once more before staging, and staged only the files listed above (no blanket `git add`).\n- Not yet done: the on-device checks in the Verification section above. Playback pacing and gesture feel only prove out on a real phone, so those remain for Michael on build 0.7.10 or later.\n"},{"id":"08","filename":"08-display-text-measurement.md","title":"Native Reader Displays: Real Text Measurement and Centering Parity","content":"# Native Reader Displays: Real Text Measurement and Centering Parity\n\n> **Status: implemented and committed 2026-07-13.** Commit `8e27908` on `feat/native-ui-web-parity` in the native repo. Adversarial review passed with no unresolved findings.\n\n\n## Mission\n\nReplace the per character width guesses in the native reader displays with real text measurement, then fix every piece of geometry that depends on them. Concretely: build a Fraunces 400 measurement utility, use it for the long word shrink logic and the sentence strip layout, rebuild the ghost trail display with the web's three layer absolute geometry so the focal letter is pinned to the exact centre of the screen, add the missing 128px padding term to paragraph auto centering, and fix four small visual constants (two \"Ready\" font sizes, a ghost opacity floor, a 4px row nudge).\n\n**WARNING, read this first: another session is actively fixing the reader and may hold uncommitted changes in `src/reader/displays.tsx`, the main file you will edit. Audit the current working tree state of that file before touching it and coordinate your edits around whatever is already there. Never revert or blindly rewrite changes you did not make.**\n\n## Context\n\nFocus Reader is a cozy speed reading app for public domain books. There are two repos:\n\n- **Web app, the READ ONLY source of truth for look and behavior:** `C:/Users/Michael/Desktop/Focus Reader`. Open its files to confirm behavior and constants. Never modify anything in this repo.\n- **Native app, where ALL changes go:** `C:/Users/Michael/Desktop/Focus Reader Android`. Expo SDK 54, React Native 0.81, reanimated 4, gesture-handler 2.28, zustand, expo-image, expo-haptics, lucide-react-native, react-navigation native-stack.\n\nThis is a full React Native app. Never introduce a WebView.\n\nNative files you will work with:\n\n- `src/reader/displays.tsx` holds all five display modes (Focus reel, ghost trail, sentence strip, paragraph, hybrid) plus the shared `GuideFrame`, `estWordWidth`, and `fitFontSize` helpers.\n- `src/theme.ts` exports `FONTS`; `FONTS.serifRegular` is `'Fraunces_400Regular'`, the reading serif used by every display.\n- `src/textProcessing.ts` exports `splitWord(word, fitMode)` and `effectiveBaseFontSize(fontSize, fitMode)`, both of which already match the web exactly.\n\nShared facts: the reader base font size is 56 (`READER_FONT_SIZE` in native `displays.tsx`, `DEFAULT_FONT_SIZE` in web `src/App.tsx`). The reel and trail stage containers are `fontSize * 4` = 224px tall. The web measures text with a canvas 2D context (`ctx.measureText`), which React Native lacks; the absence of synchronous measurement is the root cause of every issue below.\n\n## Before you start\n\n1. Run `git status` in `C:/Users/Michael/Desktop/Focus Reader Android`. Expect branch `feat/native-ui-web-parity`.\n2. Expect uncommitted changes from another session in `src/reader/ReaderChrome.tsx`, `src/reader/displays.tsx`, `src/reader/useReelEngine.ts`, and `app.json` (a new `metro.config.js` may also be present). Read the current state of each file before editing, build on what is there, and do not revert changes you did not make.\n3. Line numbers below were verified on 2026-07-13 but the overlapping session may shift them. If a listed line does not match, trust the described behavior and find the code again.\n\n## Step zero: build the measurement utility\n\nCreate one shared Fraunces 400 text measurement utility (suggested new file: `src/reader/measureText.ts`) and consume it from issues 1, 2, and 3 below. Two workable designs; a hybrid of both is best:\n\n1. **Per glyph advance table.** Render each glyph you care about (upper and lower case ASCII letters, digits, common punctuation, plus an average fallback for anything else) once at a reference size in hidden `Text` elements, capture widths via `onTextLayout`, and estimate any word's width as the sum of its glyph advances scaled by `fontSize / referenceSize`. Synchronous after warmup. It ignores kerning so it is approximate, but far closer to truth than the current flat 0.58em per character.\n2. **Per word `onTextLayout` cache.** Render the words you currently need inside a hidden offscreen `View` (absolutely positioned, `opacity: 0`, non interactive), capture exact rendered widths via `onTextLayout` into a `Map` keyed by word plus size, and trigger one state bump when new widths land. Exact, converging one frame after a new word first appears; fall back to an estimate until then.\n\nThe hybrid: answer synchronously from the glyph table, and let exact per word measurements overwrite cache entries as they arrive. Whichever you build:\n\n- Cache aggressively. The web caches canvas measurements in a `Map` per word and clears the cache when the font size changes.\n- Always measure at the BASE font size, never the shrunk size, so the shrink math in issue 3 remains a stable fixed point (measuring again after a shrink must give the same answer).\n- Font is Fraunces 400 (`FONTS.serifRegular`), normal style, normal weight, matching the web's canvas font string `${fontStyle} ${fontWeight} ${sizePx}px ${fontFamily}`.\n\n## Issues to fix\n\n### 1. Trail view: focal letter is not pinned to screen centre\n\nDelta id: `displays-trail-focal-not-pinned-center`. Severity: high.\n\n**Web** (`src/components/Reader/GhostTrailDisplay.tsx:121-216`, measurement at `71-77`): the focal letter of the current word is ALWAYS pinned to the exact horizontal centre of the container. The container is full width, `overflow: hidden`, height `fontSize * 4` (224px), with `fontSize` set to the fit shrunk `renderFontSize`. Inside it, three absolutely positioned layers each fill the container (`inset-0`), each a flex row with vertical centring and `marginTop: '-8px'` (see issue 8):\n\n- **Layer A, current word:** three absolute spans in Fraunces serif, `whitespace-nowrap`. `before` is anchored `right: calc(50% + halfFocalpx)` so its right edge ends exactly where the focal half begins. `focal` sits at `left: 50%` with `translateX(-50%)`, in the focal accent color. `after` is anchored `left: calc(50% + halfFocalpx)`. `halfFocal` is the MEASURED pixel width of the rendered focal span divided by 2 (`getBoundingClientRect` in a `useLayoutEffect` that reruns whenever `before`, `focal`, `after`, or `renderFontSize` change). The same effect also measures `beforeWidth` and `afterWidth`.\n- **Layer B, left ghosts:** an absolute row `flex items-baseline gap-[0.3em]` anchored `right: calc(50% + halfFocalpx)` with `marginRight: beforeWidth + 8px` when `before` is nonempty, else just `8px`, and `direction: rtl` so words flow right to left from the anchor. The ghost array is reversed so the nearest ghost sits closest to centre, exactly 8px past the measured end of the current word. Each ghost span sets `direction: ltr` so its own text reads normally.\n- **Layer C, right ghosts:** the mirror. `left: calc(50% + halfFocalpx)`, `marginLeft: afterWidth + 8px` when `after` is nonempty else `8px`, normal flow, same 0.3em gaps.\n\nGhost styling: `fontSize` is `ghostFontSize = renderFontSize * 0.82`, muted ink color, opacity per issue 7. Ghosts overflow and clip hard at the container edges (`overflow: hidden`, no fade mask). Consequence: at the first word of a book (no left ghosts) the current word stays dead centre with ghosts extending right only. The focal letter never moves off centre regardless of ghost balance.\n\n**Native** (`Focus Reader Android: src/reader/displays.tsx:276-290`, style `s.trailRow` at `:589`, ghost helper at `:262-270`): one centred flex row (`flexDirection: 'row', alignItems: 'baseline', justifyContent: 'center', paddingHorizontal: 8`) containing `[leftGhosts, before, focal, after, rightGhosts]` in document order. The whole ROW is centred, so the current word's position depends on the total width of left versus right ghosts; with unbalanced ghost widths, or at book start and end where one side has fewer or no ghosts, the current word and its focal letter sit visibly off centre. Ghost spacing is `marginHorizontal: ghostFontSize * 0.14` per ghost (0.28em between ghosts, roughly 0.14em from word to ghost) instead of 0.3em gaps plus the measured 8px anchor.\n\n**Fix for parity:** rebuild `TrailDisplay` with the web's three layer absolute geometry. Measure the rendered pixel widths of the `focal`, `before`, and `after` runs at `renderFontSize` using the step zero utility (cache per word, the way the web caches via refs). Pin the focal letter's centre at container centre. Anchor `before` with its right edge at centre plus `halfFocal`. Left ghost row: right edge anchored at centre plus `halfFocal`, offset further left by `beforeWidth + 8` (just `8` when `before` is empty), nearest ghost adjacent to the anchor, gaps of 0.3em of `ghostFontSize` (React Native has no CSS `gap` with `direction: rtl`; use `flexDirection: 'row-reverse'` with margins, or compute absolute positions from the measured ghost widths). Mirror for `after` and the right ghosts with `afterWidth + 8`. Keep the hard clip at container edges.\n\nThis is the user's explicit red line from the RSVP work: the focal letter is always centred on screen; never reintroduce an off centre pin. The existing native comment (\"sits at or very near screen centre\") admits the approximation you are removing.\n\n### 2. Sentence strip: estimated widths, uneven gaps, ellipsis truncation\n\nDelta id: `displays-sentence-word-widths-estimated-and-truncating`. Severity: high.\n\n**Web** (`src/components/Reader/SentenceDisplay.tsx:26-33, 77-114, 145-162, 186-201`): word widths are EXACT. Each word is measured once with a canvas 2D context using the strip's computed font (`${fontStyle} ${fontWeight} ${displaySize}px ${fontFamily}`), cached in a `Map`, cache cleared and remeasured when `displaySize` changes. `displaySize = Math.max(32, Math.min(fontSize * 0.8, 64))`, which is 44.8 at the 56 base. Cumulative lefts advance `x += width + gap` with `gap = displaySize * 0.4` (about 17.9px), so the visible gap between every pair of words is identical. Words are absolutely positioned spans with `whitespace-nowrap` and NO width box, at `top: 50%` with `translateY(-50%)`; nothing can ever truncate. Opacity is `Math.max(0.2, 1 - dist * 0.16)`, current word in the focal color. The imperative transform interpolates between the true centres of adjacent words across the whole window of 9 each side: a mids map from index to centre x, `at = m0 + (m1 - m0) * (f - i0)` where `m0`/`m1` are the centres of `floor(f)` and `floor(f) + 1`, so a fast fling tracks real geometry the whole way.\n\n**Native** (`Focus Reader Android: src/reader/displays.tsx:47-49, 306-345, 357-384`): `estWordWidth = Math.max(fontSize * 0.4, word.length * fontSize * 0.58)`, a flat 0.58em per character regardless of glyph shapes. The gap is also wrong: `gap = displaySize * 0.5` at line 307 versus the web's 0.4. Each word is a fixed width `Text` with `numberOfLines={1}` and `textAlign: 'center'`: narrow glyph words (\"ill\", \"if\") get visually huge gaps, and wide words, all caps Gutenberg headings like \"CHAPTER\", Roman numerals, words heavy in m and w, exceed the estimate and get truncated with a trailing ellipsis (\"CHAPT…\"). The `stripStyle` worklet (`:338-345`) interpolates only between the prev, current, and next estimated centres, extrapolating linearly beyond one word during fast flings.\n\n**Fix for parity:** position words from real rendered widths via the step zero utility (fall back to the estimate until a measurement lands; an `onTextLayout` fed cache converges one frame after a new word appears). Lay out lefts as cumulative measured width plus `displaySize * 0.4` (change the 0.5 constant to 0.4). Drop the fixed width and `numberOfLines` truncation entirely: no `width`, no ellipsize, single line by construction (keeping `lineHeight: stripH` for vertical centring is fine). Feed the animated interpolation the measured centres of the FULL window so the strip tracks real geometry beyond one word during a fling; the worklet currently receives three plain numbers, so pass a small plain array of centres plus the window's first index (at most 19 entries) or an equivalent shape reanimated is happy with. Keep the existing pin to the committed index during playback and follow `pos` while scrubbing.\n\nThe file header comment calls the analytic widths a deliberate stopgap to avoid async layout; this issue retires that stopgap.\n\n### 3. Long word shrink uses a character count heuristic\n\nDelta id: `displays-fit-shrink-heuristic-vs-measured`. Severity: medium.\n\n**Web** (`src/hooks/useFitFontSize.ts:8-12, 47-99`): `FIT_SIDE_MARGIN = 14`, `MIN_SCALE = 0.5`. It measures the actual pixel width of `before + halfFocal` and `after + halfFocal` with a canvas using the element's REAL computed font at the BASE size (a stable fixed point: always measured at base, never at the shrunk size). `halfFocal` is half the measured focal width. `availableHalf = containerWidth / 2 - 14`. Only if the longer half exceeds `availableHalf` does the word shrink, by the exact ratio `availableHalf / longerHalf`, floored at scale 0.5. Normal words render at exactly the base size, and the shrink threshold matches what actually paints.\n\n**Native** (`Focus Reader Android: src/reader/displays.tsx:43-60`): `fitFontSize` estimates each half as `charCount * 0.58` em, plus `0.5 * 0.58` em for the focal. The 0.58em per character constant is deliberately generous for Fraunces, so native shrinks words the web would leave at full size and shrinks earlier and by more, with no sensitivity to glyph shapes (\"illicit\" shrinks as if it were as wide as \"mammoth\"). `FIT_SIDE_MARGIN = 14` and `MIN_SCALE = 0.5` already match the web.\n\n**Fix for parity:** replace the per character estimate with real measurement of the split halves (`splitWord(word, mode)`) in Fraunces 400 at the base size, measured once per word and cached (key on word, mode, and base size), keeping the same `containerW / 2 - 14` threshold, exact ratio shrink, and 0.5 floor, so shrink onset and amount match the web word for word. `fitFontSize` is consumed by `TrailDisplay` and by `FocusReelDisplay` (and through it the hybrid view), so this one fix serves all displays. `splitWord` and `effectiveBaseFontSize` already match the web; do not touch them.\n\n### 4. Paragraph auto centering ignores the 128px content padding\n\nDelta id: `displays-paragraph-autocenter-ignores-content-padding`. Severity: high.\n\n**Web** (`src/components/Reader/ParagraphDisplay.tsx:172-195`): on every `currentIndex` change it measures REAL rects: `diff = elementCenter - containerCenter` from `getBoundingClientRect` of the active word span and the scroll container, then `container.scrollBy({ top: diff, behavior })` only when `|diff| > 2` px. This is padding independent; the active word is kept exactly at the vertical centre of the visible card (subject to scroll clamping at the extremes). The first positioning after a paragraph change is instant (`'auto'`), subsequent per word moves are `'smooth'`.\n\n**Native** (`Focus Reader Android: src/reader/displays.tsx:440-448`, style at `:593`): computes `target = Math.max(0, wordY - layoutH / 2 + lineHeight / 2)` where `wordY` is the word's `onLayout` y RELATIVE TO the inner `paraWrap` view. But the scroll content begins with `paddingVertical: 128` (`s.paraContent`), so the word's y in content coordinates is `wordY + 128`. The `scrollTo` therefore lands 128px short and the active word sits about 128px below the card's vertical centre for the whole mid paragraph reading flow (roughly two lines low at the 33.6px paragraph type). Near the top of a paragraph the `Math.max(0, ...)` clamp masks the error; mid paragraph it is fully visible. Verified parent chain: the word `Text` reports `onLayout` against `paraWrap`, which sits inside `EnterPara` (zero layout offset) inside the content container that carries the padding, so the 128px error is exact.\n\n**Fix for parity:** add the content container top padding to the target: `target = Math.max(0, wordY + 128 - layoutH / 2 + lineHeight / 2)`. Prefer deriving the 128 from the style (or a shared constant) instead of hardcoding it twice, or measure the word's y in content coordinates (`measureLayout` against the ScrollView's inner content), which stays correct if the `EnterPara` wrapper ever gains a layout offset. Keep the existing instant then smooth behavior (`shouldInstantScroll`). Optionally skip the scroll when the correction is 2px or less, like the web; harmless to add.\n\n### 5. Focus reel \"Ready\" empty state renders at 24px\n\nDelta id: `focusreel-ready-state-font-size`. Severity: low.\n\n**Web** (`src/components/Reader/RSVPDisplay.tsx:104-116`): with `tokens.length === 0` the display keeps the guide frame in a `fontSize * 4` = 224px box whose inline style sets `fontSize` to the `fontSize` prop (56 as wired from App's `DEFAULT_FONT_SIZE`); the centred span \"Ready\" inherits that 56px, in the muted ink color, Fraunces 400.\n\n**Native** (`src/reader/displays.tsx:163-171`): same 224px box, guide frame, muted Fraunces text, but `fontSize` is hardcoded to 24 (line 168).\n\n**Fix for parity:** render \"Ready\" at the display's `fontSize` prop (56 by default), color `t.textMuted`, `FONTS.serifRegular`. This state is nearly unreachable on both platforms (both gate the reader behind a successful parse), so it is cosmetic only.\n\n### 6. Trail \"Ready\" empty state renders at 24px\n\nDelta id: `displays-trail-ready-font-size`. Severity: low.\n\n**Web** (`src/components/Reader/GhostTrailDisplay.tsx:107-119`): when there is no current word, the container (height `fontSize * 4`, `fontSize: ${fontSize}px`) shows a centred span \"Ready\" in the muted ink serif (`text-mocha` maps to the muted text variable); it inherits the container font size, 56px.\n\n**Native** (`Focus Reader Android: src/reader/displays.tsx:251-260`): shows \"Ready\" in Fraunces 400 at a hardcoded `fontSize: 24` (line 256), color `t.textMuted`, inside the guide frame.\n\n**Fix for parity:** render \"Ready\" at the display's `fontSize` prop (56) in Fraunces 400, `t.textMuted`. Same shape of fix as issue 5; the two hardcodes are copies of each other.\n\n### 7. Farthest ghost opacity floor is 0.06 instead of 0.04\n\nDelta id: `displays-trail-min-ghost-opacity`. Severity: low.\n\n**Web** (`src/components/Reader/GhostTrailDisplay.tsx:87`): ghost opacity is `Math.max(0.04, 1 - i * 0.2)` for i = 1..5, giving 0.8, 0.6, 0.4, 0.2, 0.04. The fifth ghost is nearly invisible at 4%.\n\n**Native** (`Focus Reader Android: src/reader/displays.tsx:242`): `Math.max(0.06, 1 - i * 0.2)`, so the fifth ghost sits at 6%, slightly more visible.\n\n**Fix for parity:** change the native floor to 0.04. `TRAIL_COUNT = 5` and the 0.2 falloff already match.\n\n### 8. Trail rows should ride 4px above the guide frame centre\n\nDelta id: `displays-trail-row-vertical-offset`. Severity: low.\n\n**Web** (`src/components/Reader/GhostTrailDisplay.tsx:131, 158-161, 190-193`): all three layers (current word, left ghosts, right ghosts) are absolutely positioned `inset-0 flex items-center` wrappers with `style={{ marginTop: '-8px' }}`. Because top and bottom are both 0 with auto height, the negative top margin stretches each layer's box from y = -8 to y = 224 (resolved height 232), so the flex centred text line lands at y = 108, a net 4px above the geometric centre (112) of the 224px frame, visually balancing between the guide notches.\n\n**Native** (`Focus Reader Android: src/reader/displays.tsx:276-290`): the single trail row is centred exactly via `justifyContent: 'center'` on the container with no offset, so the text sits 4px lower relative to the guide frame than on web.\n\n**Fix for parity:** nudge the trail text rows up 4px net. Either apply `transform: [{ translateY: -4 }]` to each row, or reproduce the web construction with `marginTop: -8` on a row inside a vertically centring container (RN flexbox centres the margin box, yielding the same 4px up result). Apply the same offset to all three layers you build in issue 1 so the current word and both ghost rows share one baseline.\n\nImportant nuance, verified against the web source: the web Focus reel (`RSVPDisplay.tsx:148-157`) does NOT share this nudge; its rows are exactly centred (`top: '50%'`, `translateY(calc(-50% + offsetY))`, no margin). Matching the web therefore means the trail view alone rides 4px high relative to the reel. That is correct strict parity, but flag it in your summary so Michael can decide whether he prefers cross mode consistency instead.\n\n## Acceptance checklist\n\n- [ ] Trail view: at the first word of a book, the last word, and any word with lopsided neighbours, the focal letter sits at the exact horizontal centre of the screen; ghosts begin exactly 8px past the measured end of the current word, are spaced by 0.3em gaps, and clip hard at the container edges.\n- [ ] Sentence strip: every pair of words shows the same visible gap (`displaySize * 0.4`); narrow words like \"ill\" no longer float in oversized boxes; wide words like \"CHAPTER\" render in full with no trailing ellipsis; a fast fling tracks real word centres across the whole window instead of extrapolating past one word.\n- [ ] Long word shrink: onset and amount match the web word for word; normal words render at exactly the base size; a narrow word like \"illicit\" no longer shrinks as though it were as wide as \"mammoth\"; the `containerW / 2 - 14` threshold, exact ratio, and 0.5 floor are intact.\n- [ ] Paragraph view: several lines into a long paragraph, the highlighted word sits at the vertical centre of the card instead of about 128px low.\n- [ ] Focus reel empty state: \"Ready\" renders at the display's `fontSize` prop (56), muted serif, inside the guide frame.\n- [ ] Trail empty state: \"Ready\" renders at the display's `fontSize` prop (56), muted serif, inside the guide frame.\n- [ ] Trail view: the fifth ghost on each side renders at 0.04 opacity, not 0.06.\n- [ ] Trail view: the word and ghost rows sit a net 4px above the guide frame's geometric centre, matching the web trail (and the summary flags that the web reel does not share this nudge).\n\n## Verification\n\n1. Run `npx tsc --noEmit` in `C:/Users/Michael/Desktop/Focus Reader Android` and get a clean pass.\n2. Reason carefully through the running behavior: what renders on the very first frame before a measurement lands (the fallback path must not flash or misplace the focal pin), whether reanimated worklets only receive plain numbers or small plain arrays, whether measurement caches clear when the font size changes, and whether both empty states still center inside the guide frame.\n3. Do NOT use the Expo web build to verify anything. Its dev server opens blank localhost tabs in the real browser and the web bundle breaks on zustand's `import.meta`.\n4. On device checking is done by Michael on his Android phone. End your summary by telling him exactly what to look at, in plain everyday English without jargon. For example: open any book in the trail view and jump to the very first word, the big word should sit exactly in the middle of the screen with the faded words trailing off to the right only. Scrub to a spot where one side has much longer words than the other, the bright letter should stay glued to the middle. In the sentence view, find a chapter heading like CHAPTER I, the whole word should be visible with no dots at the end, and the spacing between words should look even. In the paragraph view, read a few lines into a long paragraph, the highlighted word should stay in the middle of the card instead of drifting toward the bottom. Very long words should shrink only when they truly need to, and about as much as on the web version.\n\n## Final note\n\nWhen summarizing your work for Michael, use plain everyday language, explain what changed and why it matters as if to a friend, and avoid dashes in prose. Restructure sentences with commas or periods instead.\n\n---\n\n## Outcome, recorded 2026-07-13\n\nImplemented in commit `8e27908` on `feat/native-ui-web-parity` in the native repo.\n\nFiles changed: `src/reader/measureText.tsx`, `src/reader/displays.tsx`, `app.json`.\n\n### Issue by issue\n\n**Step zero: shared Fraunces 400 measurement utility** (done)\n\nNew src/reader/measureText.tsx, the recommended hybrid: a glyph advance table warmed once via hidden onTextLayout probes answers synchronously, and exact per string widths overwrite the estimate a frame later. Everything is measured at one 100px reference size and scaled, so base size measurement is a stable fixed point and font size changes need no cache flush. Exposes measureTextWidth, useTextMeasurement (re-render subscription), and a hidden MeasureHost mounted inside each measuring display.\n\n**1. Trail view: focal letter pinned to screen centre** (done)\n\nTrailDisplay rebuilt with the web's three layer geometry: current word layer pins the focal box dead centre via equal flex sides (identical result to the web's left 50% translateX(-50%), needs no measurement so the pin never drifts), ghost lanes are anchored at centre + measured halfFocal + measured before/after width + 8px (just 8px when that half is empty), nearest ghost adjacent to the anchor, 0.3em columnGap at the ghost size, hard clip at container edges via overflow hidden.\n\n**2. Sentence strip: measured widths, even gaps, no ellipsis** (done)\n\nWord positions now come from measureTextWidth at displaySize with cumulative lefts + gap; the gap constant was already 0.4 in the committed tree (the other session fixed it, prompt was stale there). Width boxes, numberOfLines, and textAlign removed so nothing can truncate; the strip gets an explicit width with 4em slack so no box is ever clamped. The worklet now interpolates across the FULL window via a plain array of centres plus the first index, clamped at the window edges; playback pin and scrub follow of pos unchanged.\n\n**3. Long word shrink from real measurement** (done)\n\nfitFontSize now measures the splitWord halves plus half the focal in Fraunces 400 at the BASE size via the utility (cached per string), keeping containerW/2 - 14, exact ratio shrink, and the 0.5 floor. Serves reel, trail, and hybrid. splitWord and effectiveBaseFontSize untouched.\n\n**4. Paragraph auto centering + 128px padding term** (done)\n\nAdded shared PARA_PAD_V = 128 constant used by both the s.paraContent style and the scroll target (wordY + PARA_PAD_V - layoutH/2 + lineHeight/2). Also added the web's skip when the correction is 2px or less. Instant then smooth behavior preserved.\n\n**5. Focus reel Ready at 24px** (done)\n\nNow renders at the fontSize prop (56), t.textMuted, Fraunces 400, inside the guide frame.\n\n**6. Trail Ready at 24px** (done)\n\nSame fix as issue 5 in TrailDisplay's empty state.\n\n**7. Ghost opacity floor 0.06 to 0.04** (done)\n\nMath.max(0.04, 1 - i * 0.2); fifth ghost now 4%.\n\n**8. Trail rows ride 4px above frame centre** (done)\n\nAll three trail layers (word layer and both ghost lanes) carry translateY -4 so they share one baseline. The Focus reel intentionally does NOT get the nudge, matching the web reel, so the trail alone rides 4px high; flagged for Michael in the summary.\n\n### Judgment calls made during implementation\n\n1) app.json state differed from the run brief: the tree was clean and already committed at 0.7.4 (no uncommitted 0.7.3 bump existed to preserve). Per the standing rule to bump every change round, I bumped 0.7.4 to 0.7.5. 2) The sentence gap was already 0.4 in the committed tree (another session's fix landed); I verified rather than re-changed it. 3) Trail focal pin: I kept the FocalWord equal flex construction for the current word instead of measured absolute spans, because it produces geometry identical to the web pin without depending on measurements, so the pin cannot shift while exact widths land; measurements only position the ghost lanes. 4) Ghost rows live in 4000px wide invisible lanes anchored by inset with the row packed against the anchor edge, sized so Yoga can never clamp the row below its content (which would spill ghosts past the anchor); this also means ghost words themselves never need measuring. 5) Measurement happens at one 100px reference size and scales linearly, so the base size fixed point holds by construction and no cache flush is needed on font size changes. 6) MeasureHost is mounted inside each measuring display (only one display is ever mounted at a time) to keep displays self contained instead of editing ReaderScreen. 7) Worklet fallback beyond the rendered window clamps to the window edge centre, the natural extension of the web's mids map fallback. 8) I added the optional 2px scroll skip in paragraph view since the prompt called it harmless and it matches the web.\n\n### Testing performed\n\n- `npx tsc --noEmit` in the native repo: clean at commit time.\n- An independent adversarial review agent re-opened the uncommitted diff, checked every acceptance checklist item above against the native code and the cited web sources (exact constants, timings, easing curves, and copy strings), hunted for regressions (broken imports, accidental behavior changes, worklet violations), and re-ran the type check itself. Verdict: passed with no unresolved findings and zero fix rounds.\n- The commit step re-ran the type check once more before staging, and staged only the files listed above (no blanket `git add`).\n- Not yet done: the on-device checks in the Verification section above. Playback pacing and gesture feel only prove out on a real phone, so those remain for Michael on build 0.7.10 or later.\n"},{"id":"09","filename":"09-open-transition-internals.md","title":"Book Open Transition Internals and Error Flow","content":"# Book Open Transition Internals and Error Flow\n\n> **Status: implemented and committed 2026-07-13.** Commit `61d1926` on `feat/native-ui-web-parity` in the native repo. Adversarial review passed with no unresolved findings.\n\n\n## Mission\n\nBring the native book open transition (`src/open/OpenTransition.tsx` and the adjacent loading and error paths in `src/screens/ReaderScreen.tsx`) to exact parity with the web app's `BookOpenTransition`. The big items: parse the book text during the transition so the reader is fully ready the moment the fade ends, freeze all cover motion the instant the closing fade starts, match the web's error flow (spring back, then a persistent dismissible cream error card, no retry button, no full screen error page), render the faux page text as dashed word strips, swap the platform spinner for a spinning 14px Loader2, leave instant open anchors unclamped, skip the 'committed' badge flash when content is already loaded at release, verify the cover scaling model at rest, and make the Reader screen's navigation animation instant.\n\n## Context\n\nFocus Reader is a cozy speed reading app for public domain books. It exists twice:\n\n- Web app at `C:/Users/Michael/Desktop/Focus Reader`. This is the READ ONLY source of truth for look and behavior. Never modify anything in this repo. Open its files freely to check constants, copy, and timings.\n- Native app at `C:/Users/Michael/Desktop/Focus Reader Android`. ALL changes go here. Expo SDK 54, React Native 0.81, reanimated 4, gesture-handler 2.28, zustand, expo-image, expo-haptics, lucide-react-native, react-navigation native-stack.\n\nThis is a full React Native app. Never introduce a WebView.\n\nHow the transition works on both platforms: pressing a book card lifts a floating 180x270 cover (`COVER_W`/`COVER_H`) that springs toward the finger while the book text downloads in parallel. Release inside the card commits the open; the cover freezes mid air, a \"Brewing your book…\" badge shows if the text is still loading, and once loaded the cover fades out over 240ms (`CLOSE_FADE_MS`) and hands off to the reader. Release outside cancels and springs the cover back to its slot. A quick tap is an instant open (web calls this `autoCommit`). On web this all lives in `src/components/Reader/BookOpenTransition.tsx` orchestrated by `src/App.tsx`; on native it lives in `src/open/OpenTransition.tsx` (a context provider plus an `Overlay` driven by reanimated shared values) which navigates to the `Reader` screen when the fade completes.\n\n## Before you start\n\n1. Run `git status` in `C:/Users/Michael/Desktop/Focus Reader Android`. Expect branch `feat/native-ui-web-parity`.\n2. WARNING: another session may hold uncommitted changes in `src/reader/ReaderChrome.tsx`, `src/reader/displays.tsx`, `src/reader/useReelEngine.ts`, and `app.json`. This task touches `src/screens/ReaderScreen.tsx`, which sits right next to those files and imports from `src/reader/`. Read the current state of every file before editing it, keep your edits surgical, and do not revert or reformat changes you did not make. Do not touch the four files listed above at all.\n3. This package ideally runs after the book-pickup-and-instant-open package. If that package already changed `src/open/OpenTransition.tsx`, work from the file as it now stands.\n4. Line numbers below were verified recently but files drift. If a listed line number does not match, trust the described behavior and re-locate the code.\n\n## Issues to fix\n\n### 1. Close the transition on parse completion, not on download completion\n\nDelta id: `transition-close-parse-timing`. Severity: medium.\n\nWeb (`src/App.tsx:170-194`, `196-211`, `365`): App.tsx fetches `library.fetchContent(book)`, runs `parseText(text)` synchronously, injects authored scene chapters into the parsed result, and only then sets `pendingParsed`:\n\n```ts\nconst scenes = getScenes(pending.book.id);\nif (scenes.length > 0) {\n    parsed.chapters = scenes.map((s) => ({ title: s.label, wordIndex: s.startIndex, lineIndex: 0 }));\n    parsed.chapterConfidence = 'high';\n}\nsetPendingParsed(parsed);\n```\n\nThe transition's `loaded` prop is `pendingParsed !== null` (App.tsx:365). The 240ms close fade therefore starts only after the book is fully parsed, and `onComplete` swaps straight into a fully ready reader. There is no in reader loading state at all on web.\n\nNative (`src/open/OpenTransition.tsx:134-146`, `275-287`; `src/screens/ReaderScreen.tsx:58-73`, `226-254`): `begin()` calls `prefetchContent(book)` (`src/services/library.ts:113-125`) which resolves with the raw stripped but unparsed text; `setLoaded(true)` fires on download, the 240ms fade runs, then `navigationRef.navigate('Reader')`. ReaderScreen then re-awaits `fetchContent` (reusing the in flight promise) and runs `parseText` in a `useMemo` during render (line 72). While `parsed.tokens.length === 0` it renders a full screen loading view with its own back chevron and a duplicate 'Brewing your book…' badge, and the synchronous parse of a large book blocks the JS thread after the fade already ended. The web never shows this gap.\n\nChange: gate `loaded` on parse completion.\n\n- In `begin()`, after `prefetchContent(book)` resolves, run `parseText(text)` plus the scenes to chapters mapping shown above (`getScenes` lives in `src/services/scenes.ts` on native, same as the reader already uses at ReaderScreen.tsx:77-83), cache the resulting `ParsedText` keyed by book id, and only then call `setLoaded(true)`. Running the parse synchronously at that moment matches the web, which also parses on the main thread while the cover is still up.\n- Add a small cache module or export from `src/services/library.ts`, for example `consumeParsed(bookId): ParsedText | null`, that ReaderScreen checks first. Clear the entry after consumption so stale parses never leak across opens.\n- ReaderScreen should consume the cached `ParsedText` so the reader is fully formed the frame the fade completes and the 'Brewing your book…' screen never appears on transition driven opens. Keep the existing fetch plus parse path as a fallback for cold ReaderScreen mounts (deep links, state restore), but it should be unreachable via the open transition.\n- Make sure the scene chapter mapping is not applied twice. ReaderScreen's `chapters` useMemo (lines 77-83) produces the same mapping; either keep it (it is idempotent, same output) or have it prefer `parsed.chapters` when the cached parse already carries scene chapters with `chapterConfidence === 'high'`.\n\n### 2. Failed opens show a persistent dismissible error card, after the cancel spring settles\n\nDelta id: `transition-error-ui`. Severity: medium.\n\nWeb (`src/App.tsx:189-192`, `373-384`; `src/components/Reader/BookOpenTransition.tsx:344-353`): the fetch catch stores the error message (`e.message`, fallback `'Could not open that book.'`). The transition reacts to the `error` prop: `haptics.error()` then springs the cover back to its slot. Only after cancel completes and `pending` clears does App render (condition `pendingError && !pending`) a fixed card: `bottom-6` (24px), centered (`left-1/2 -translate-x-1/2`), `z-[90]`, `max-w-sm` (384px), `w-[calc(100%-2rem)]`, `bg-cream rounded-2xl ring-1 ring-coral-accent/30 shadow-xl px-4 py-3 flex items-start gap-3`. Inside: bold 13px \"Couldn't open that book.\" plus the specific error message in italic mocha below (e.g. 'No readable plain-text edition is available for this title.'), and an X dismiss button (lucide `X`, size 16, mocha). It persists until dismissed.\n\nNative (`src/open/OpenTransition.tsx:135-145`; `src/components/Toast.tsx:20-33`, `52-62`): the `prefetchContent` rejection handler runs `haptics.error()`, `showToast(\"Couldn't open that book.\")` immediately while the cover is still springing back, then cancels. The toast is the store's transient bubble (in over 290ms, hold 1750ms, fade out 360ms, the web `toastPop` envelope), carries no error detail and no dismiss control, and is styled as the save confirmation pill with the coral Bookmark medallion rather than an error card.\n\nChange:\n\n- In the rejection handler keep `haptics.error()` and the cancel (target 0, `phaseSV = 3`, phase 'cancelling'), but remove the `showToast` call. Instead store the caught error's message (fallback 'Could not open that book.') in provider state.\n- Show the error UI only after the cancel spring settles, i.e. after `onClear` runs (the `finishCancel` path at OpenTransition.tsx:258-266 ends in `runOnJS(finishCancel)`).\n- Render it as a persistent card matching the web: cream/surface background (`t.surface`), borderRadius 16, borderWidth 1 with the accent color at 30% alpha, shadow, paddingHorizontal 16, paddingVertical 12, positioned near the bottom (24px plus safe area inset), centered, maxWidth 384, width = screen width minus 32. Contents: bold 13px \"Couldn't open that book.\" headline, the caught error's message as an italic muted detail line below, and a 16px X dismiss button (lucide-react-native `X`). It stays until dismissed.\n- Give the card zIndex >= 90 so it sits above the transition overlay, like the web's `z-[90]`. For reference the native toast wrap uses zIndex 95 (Toast.tsx:53) and already draws above the flying cover; that layering is fine, do not change it.\n- The detailed error strings already exist in `src/services/library.ts` ('No readable plain-text edition is available for this title.' at :152, 'The downloaded file appears to be empty.' at :155, `HTTP ${res.status}` at :92); they are currently swallowed. Surface them in the card's detail line.\n\n### 3. Remove ReaderScreen's full screen error page and Try again button\n\nDelt
