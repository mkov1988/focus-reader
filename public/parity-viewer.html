    const DOCS = [{"id":"00","filename":"00-INDEX.md","title":"Native Parity Prompt Pack","content":"# Native Parity Prompt Pack\n\nA full audit of the native Android app against the web app ran on 2026-07-13. Thirteen auditors combed both codebases surface by surface, a second pass re-verified every claim against the code, and the confirmed differences were grouped into 16 session sized work packages, one prompt file each.\n\n**Status: COMPLETE.** All 16 packages were implemented the same day, in two sequential background runs, one commit per package on `feat/native-ui-web-parity` in the native repo. Every package passed an adversarial review on the first try, with zero fix rounds. `expo.version` ended at 0.7.10.\n\n**The audit numbers:** 188 differences confirmed, 68 were duplicate reports of the same underlying issue, leaving 120 unique fixes. All 120 are implemented except two drawer swipe details in pack 05 that the prompt itself marked optional.\n\n## Results\n\n| # | File | What it fixed | Issues | Commit |\n|---|------|---------------|--------|--------|\n| 01 | [01-typography-and-type-metrics.md](01-typography-and-type-metrics.md) | Inter italic faces, letter spacing, line heights, header alignment | 9 | `ddfed5b` |\n| 02 | [02-data-services-parity.md](02-data-services-parity.md) | Catalog title cleanup, cover URL threading, fetch and error semantics, hydration gate | 6 | `1546115` |\n| 03 | [03-shared-cover-save-toast.md](03-shared-cover-save-toast.md) | BookCover details, save ribbon, skeletons, toast exit | 9 | `30a2cd4` |\n| 04 | [04-book-pickup-and-instant-open.md](04-book-pickup-and-instant-open.md) | Hold to open thresholds, touch slop, open origins, slot hiding | 9 | `abf2cff` |\n| 05 | [05-navigation-and-drawer-model.md](05-navigation-and-drawer-model.md) | Hardware back, drawer behavior, stack resets, transitions | 11 | `5de8738` |\n| 06 | [06-reel-engine-playback-core.md](06-reel-engine-playback-core.md) | Seek freezing playback, stuck drag flag, final word dwell, WPM reset, reduce motion | 6 | `0bfbcde` |\n| 07 | [07-reader-gesture-zoning.md](07-reader-gesture-zoning.md) | Band scoped scrub vs stage wide race, tap and skip zones, swipe down exit | 10 | `90e77e1` |\n| 08 | [08-display-text-measurement.md](08-display-text-measurement.md) | Real text measurement, focal pinning, strip widths, centering | 8 | `8e27908` |\n| 09 | [09-open-transition-internals.md](09-open-transition-internals.md) | Close motion, error card, spinner, faux text, phase skips | 10 | `61d1926` |\n| 10 | [10-reading-progress-and-sessions.md](10-reading-progress-and-sessions.md) | Save triggers, restart position, session accounting | 5 | `295bbb7` |\n| 11 | [11-shelf-snap-and-virtualization.md](11-shelf-snap-and-virtualization.md) | Shelf snapping, list virtualization, grid spacing | 5 | `ef4bf3e` |\n| 12 | [12-app-shell-branding-washes.md](12-app-shell-branding-washes.md) | App icon and splash, page washes, shell padding, theme cross fade | 6 | `d34a4d3` |\n| 13 | [13-press-feedback-micromotion.md](13-press-feedback-micromotion.md) | Press scale feedback everywhere, header collapse, search pill polish | 11 | `07605cf` |\n| 14 | [14-paragraph-mode-polish.md](14-paragraph-mode-polish.md) | Active word scale, slide in easing, highlight pill, word gap | 5 | `269e27b` |\n| 15 | [15-reader-chrome-polish.md](15-reader-chrome-polish.md) | Play glyphs, pill animation, fill easing, chrome typography | 6 | `8a14767` |\n| 16 | [16-accessibility-parity.md](16-accessibility-parity.md) | TalkBack roles, labels, selected states, live region toast | 4 | `d82603b` |\n\nEach prompt file carries a status banner under its title with its commit hash and any package specific notes.\n\n## Deliberate divergences from the web\n\nThree places where the implementation intentionally does not copy the web pixel for pixel, each documented in a code comment at the site. Michael can overrule any of them:\n\n1. **Cover inks stay pinned (pack 03, Michael's decision).** The web's theme derived label cover inks go nearly invisible in dark mode. Native keeps warm pinned inks, and the web `BookCover.tsx` was updated the same day to adopt the identical pinning, so both apps now match on the readable behavior.\n2. **A controls seek beats a coasting fling (pack 06).** On the web, a fling in progress swallows an explicit skip press, which was judged accidental. Native honors the press immediately.\n3. **Reader fades use Tailwind's real ease out curve (pack 15).** The audit spec named the CSS keyword value, but the web actually ships Tailwind's `cubic-bezier(0, 0, 0.2, 1)`. Native matches what the web really renders.\n\nAlso of note: Sentence view has no swipe down exit anywhere because the web has none (pack 07). Flagged in case it should exist on both.\n\n## What this folder is now\n\nThe prompts remain useful as the reference spec for what exact parity means on each surface: every constant, timing, and copy string was verified against the web source. If a future regression appears on some surface, re running that single package's prompt in a fresh session is a targeted way to restore parity. The audit method (13 surface auditors, skeptical verification, planner, per package prompts) is repeatable if the web app grows new features that need porting.\n"},{"id":"01","filename":"01-typography-and-type-metrics.md","title":"Typography foundation: Inter italic faces and type metrics","content":"# Typography foundation: Inter italic faces and type metrics\n\n> **Status: implemented and committed 2026-07-13.** Commit `ddfed5b` on `feat/native-ui-web-parity` in the native repo. Adversarial review passed with no unresolved findings.\n\n\n## Mission\n\nBring the native Android app's storefront typography to exact parity with the web app. Load the Inter italic face, expose it as a `FONTS.sansItalic` token, and sweep every surface where native wrongly renders Fraunces serif italic in place of the web's Inter sans italic. In the same pass, correct a set of small type metric drifts: letter spacing on section and swimlane titles, missing or wrong line heights on numerals, card titles, row titles, author lines, and the Stats, About, and EmptyTab text blocks, plus one flex alignment fix on the Vibe out header icon. This is the foundation package: several later parity packages consume the `FONTS.sansItalic` token you create here.\n\n## Context\n\nFocus Reader is a cozy speed reading app for public domain books. It shows a book one word at a time in a warm, coffeeshop styled interface.\n\nThere are two repos:\n\n- Web app (READ ONLY source of truth for look and behavior): `C:/Users/Michael/Desktop/Focus Reader`. Never modify anything in this repo. Open its files freely to check classes, copy, and values.\n- Native app (ALL changes go here): `C:/Users/Michael/Desktop/Focus Reader Android`. Expo SDK 54, React Native 0.81, reanimated 4, gesture-handler 2.28, zustand, expo-image, expo-haptics, lucide-react-native, react-navigation native-stack.\n\nThis is a full React Native app. Never introduce a WebView.\n\nTypeface background you need:\n\n- The web page root (`src/components/Input/StoreFront.tsx:684`) is `font-sans`, which per `tailwind.config.js:39-40` is Inter. `font-serif` is Fraunces.\n- On the web, text styled `italic` WITHOUT `font-serif` renders in Inter italic. This is a deliberate design distinction: sans italic is the metadata voice (subtitles, author lines, helper text), serif italic (Fraunces) is the editorial voice (hero author line, today's pick blurb, recap text, empty state bodies, the Stats hero pace line, the About subtitle and closing line, the Library intro).\n- The native app loads fonts in `App.tsx:49-52`: Fraunces 400, 400 italic, 500, 600, and Inter 400, 500, 600, 700 upright. No Inter italic face is loaded at all, which is why every italic on native fell back to `FONTS.serifItalic` (Fraunces_400Regular_Italic).\n- Font tokens live in `src/theme.ts` in the `FONTS` object (around lines 93 to 108).\n- The installed `@expo-google-fonts/inter` package (0.4.2) already ships `Inter_400Regular_Italic` (verified present in `node_modules/@expo-google-fonts/inter/400Regular_Italic`), so you can bundle a real italic face. No new dependency needed.\n\nFirst step of the work: add `Inter_400Regular_Italic` to the import from `@expo-google-fonts/inter` in `App.tsx` and to the `useFonts` map, then add to `FONTS` in `src/theme.ts` a token such as:\n\n```ts\n/** italic without font-serif on the web — the metadata voice (Inter italic). */\nsansItalic: 'Inter_400Regular_Italic',\n```\n\nThen apply the per issue changes below.\n\n## Before you start\n\nRun `git status` in `C:/Users/Michael/Desktop/Focus Reader Android`. Expect branch `feat/native-ui-web-parity`.\n\nAnother session may hold uncommitted changes in `src/reader/ReaderChrome.tsx`, `src/reader/displays.tsx`, `src/reader/useReelEngine.ts`, and `app.json`, and there may be an untracked `metro.config.js`. Leave all of those alone. Read the current state of every file before editing it and do not revert changes you did not make. None of the files this package touches overlap with that list.\n\nIf a line number cited below has drifted, trust the described behavior and re-locate the code by searching for the copy string or style name.\n\n## Issues to fix\n\n### 1. Section subtitles, vibe row subtitles, and card/row author lines use Fraunces italic instead of Inter italic\n\nSeverity: medium. Scope: Today screen and everywhere BookCard and the list rows appear.\n\nWeb behavior (`C:/Users/Michael/Desktop/Focus Reader/src/components/Input/StoreFront.tsx` and `src/components/Input/BookCard.tsx`): the page body is `font-sans` (Inter). These strings are styled `italic` WITHOUT `font-serif`, so they render in Inter italic:\n\n- Popular section subtitle 'The most read on Focus Reader', `text-[12px] text-mocha italic mt-1` (StoreFront.tsx:1108).\n- Vibe out section subtitle 'Pick a feeling, not a genre.', same classes (StoreFront.tsx:1148).\n- Each vibe row's subtitle, `block text-[12px] italic text-mocha mt-0.5` (StoreFront.tsx:114).\n- BookCard author line, `text-[11px] text-mocha mt-0.5 italic line-clamp-1` (BookCard.tsx:118).\n- RecentRow author line, `text-[11px] text-mocha italic line-clamp-1 mt-0.5` (StoreFront.tsx:236).\n- BookRow author line, same classes (StoreFront.tsx:272).\n\nNative behavior: all of the above use `FONTS.serifItalic` (Fraunces_400Regular_Italic):\n\n- `src/screens/TodayScreen.tsx:451`, style `sectionSub`.\n- `src/screens/TodayScreen.tsx:247`, the VibeRow subtitle Text.\n- `src/components/BookCard.tsx:141`, style `author`.\n- `src/components/rows.tsx:115`, style `rowAuthor` (used by both RecentRow and BookRow).\n\nChange: switch those four to `fontFamily: FONTS.sansItalic`. Sizes, colors, and margins already match; only the family changes.\n\nThis is a systematic substitution, so audit EVERY `FONTS.serifItalic` usage in the native repo against the web class list. Keep `FONTS.serifItalic` only where the web has both `font-serif` and `italic`. Confirmed keep list: the Today hero author line, the today's pick blurb, the scene recap text, the EmptyTab body (`ui.tsx`), the Library intro line, the Stats hero line 'at about N words a minute', the About subtitle 'A calm place to read the classics.' and the About closing line 'Made with care, over many cups of coffee.'. Anything italic that is metadata (authors, subtitles, helper text, footnotes) moves to `FONTS.sansItalic`; issues 2 through 4 below name the known cases.\n\n### 2. Search no results line uses serif italic instead of Inter italic\n\nSeverity: low. Scope: Results screen.\n\nWeb behavior (StoreFront.tsx:935): 'Nothing on the shelf for that. Try another title or author.' is a `<p>` with `text-center text-[14px] text-mocha italic py-10` inside the `font-sans` page root. Inter italic, 14px, mocha, 40px vertical padding, centered. No `font-serif` class.\n\nNative behavior (`src/screens/ResultsScreen.tsx:114-117`): same copy, size (14), color (textMuted), padding (40) and centering, but `fontFamily: FONTS.serifItalic`.\n\nChange: switch that Text to `FONTS.sansItalic`. Nothing else changes.\n\n### 3. Two italic lines on the Stats page use serif italic instead of Inter italic\n\nSeverity: low. Scope: Stats screen.\n\nWeb behavior (StoreFront.tsx:1440-1442 and 1463-1468):\n\n- The benchmark card's line 'The same {pages} pages would take an average reader about {time}.' is `text-[11px] text-mocha/80 italic mt-2`. That is 11px italic in the page's sans stack (Inter), not serif.\n- The saved footnote '{n} book{s} saved for later in your Library.' is `text-center text-[12px] text-mocha italic mt-9`. That is 12px italic sans, centered, 36px top margin.\n- By contrast the hero's 'at about N words a minute' IS serif italic on the web, and native already matches it. Do not touch that one.\n\nNative behavior (`src/screens/StatsScreen.tsx:151-153` and `170-174`): both lines use `fontFamily: FONTS.serifItalic`. Sizes, colors (mutedA(0.8) and textMuted), margins (8 and 36) and centering already match; only the typeface differs.\n\nChange: switch both to `FONTS.sansItalic`.\n\n### 4. Settings helper texts: wrong typeface on the subtitle, system font on unstyled texts\n\nSeverity: low. Scope: Settings screen, with a spillover note for About.\n\nWeb behavior (StoreFront.tsx:1536, 1542, 1566):\n\n- 'Used when you open a book. You can still change it while reading.' is `text-[12px] text-mocha/80 italic mb-3`. That is 12px ITALIC INTER (inherited `font-sans`), not serif.\n- 'Currently {wpm} words a minute.' is 12px regular Inter with a `font-semibold tabular-nums` span for the number.\n- The fit mode descriptions ('Every word colours a middle letter so it fits.' and friends) are `text-[12px] text-mocha/80 leading-snug`, regular Inter.\n\nNative behavior (`src/screens/SettingsScreen.tsx`):\n\n- Lines 115 to 117: the Reading speed subtitle uses `FONTS.serifItalic`.\n- Lines 125 to 127: the 'Currently …' Text sets no fontFamily at all, so it renders in Roboto/system instead of Inter_400Regular. The inner semibold span is already correct (`FONTS.sansSemiBold` with `fontVariant: ['tabular-nums']`).\n- Line 151: the fit mode description Text sets no fontFamily either.\n\nChange: subtitle becomes `FONTS.sansItalic` at the same 12px. Give the 'Currently …' outer Text and the fit mode description `fontFamily: FONTS.sans`. Then sweep the rest of SettingsScreen: EVERY Text without an explicit fontFamily gets `fontFamily: FONTS.sans` (the web renders all of it in Inter).\n\nSpillover: any React Native Text without an explicit fontFamily silently drops to the system font. The About screen has the same problem: the body copy at `src/screens/AboutScreen.tsx:53-58` and the Getting around tip rows at `AboutScreen.tsx:64-77` set no fontFamily, while the web renders both in Inter. Since issue 8 has you editing those exact Texts anyway, add `fontFamily: FONTS.sans` to them in the same pass.\n\n### 5. Type metric drift on Today: section title letter spacing, stat number line height, card and row title line heights\n\nSeverity: low. Scope: Today screen, BookCard, list rows.\n\nWeb behavior:\n\n- Section `h2` (Popular, Vibe out): 22px with `tracking-tight` = -0.025em = -0.55px (StoreFront.tsx:1107).\n- Swimlane `h3`: 18px `tracking-tight` = -0.45px (StoreFront.tsx:199).\n- 'Your Reading' stat numbers: 28px with `leading-none`, so line height 28px (StoreFront.tsx:1181).\n- BookCard title: 14px `leading-snug` = 19.25px line height (BookCard.tsx:117).\n- RecentRow title: 15px `leading-snug` = 20.6px (StoreFront.tsx:235).\n\nNative behavior:\n\n- `src/screens/TodayScreen.tsx:450`: `sectionTitle` has letterSpacing -0.4 (should be -0.55).\n- `src/components/ui.tsx:103`: Swimlane title letterSpacing -0.3 (should be -0.45; line height handled in issue 6).\n- `src/screens/TodayScreen.tsx:200`: the 28px stat numbers have no lineHeight, so they take the platform default, taller than 28.\n- `src/components/BookCard.tsx:140`: title lineHeight 18 (should be 19).\n- `src/components/rows.tsx:114`: `rowTitle` lineHeight 19 (should be 21; see issue 7).\n\nChange: set letterSpacing -0.55 on the 22px section titles, letterSpacing -0.45 on the 18px swimlane titles, lineHeight 28 on the 28px stat numbers, lineHeight 19 on the 14px card titles, lineHeight 21 on the 15px row titles. Fonts and weights are already correctly mapped (Fraunces 500/600, Inter 500/600); this is pixel nudge polish only.\n\n### 6. Swimlane and section titles missing the web's leading-none line height\n\nSeverity: low. Scope: Today screen and every swimlane (Library, Vibe pages).\n\nWeb behavior: swimlane titles are `font-serif text-[18px] font-semibold tracking-tight leading-none`, so letter spacing -0.45px and line height exactly 18px (StoreFront.tsx:199). The Today section titles are 22px `tracking-tight leading-none`, so -0.55px and line height 22px (StoreFront.tsx:1147).\n\nNative behavior: `src/components/ui.tsx:103` sets letterSpacing -0.3 and no lineHeight; `src/screens/TodayScreen.tsx:450` sets letterSpacing -0.4 and no lineHeight.\n\nChange: Swimlane title letterSpacing -0.45 and lineHeight 18. Today `sectionTitle` letterSpacing -0.55 and lineHeight 22. This matters beyond sub pixel fussiness because the 'see all' control is bottom aligned against these titles (flex-end on both platforms), so the extra default leading shifts the baseline alignment.\n\nAlso apply the same treatment to the 'Reading now' heading in `src/screens/StatsScreen.tsx` (around line 163): it is the same web style (StoreFront.tsx:1452, 18px `tracking-tight leading-none`) and natively has letterSpacing -0.3 with no lineHeight. Make it -0.45 with lineHeight 18.\n\n### 7. Row text metrics: title and author line heights, percent label numerals\n\nSeverity: low. Scope: RecentRow and BookRow (`src/components/rows.tsx`).\n\nWeb behavior (StoreFront.tsx:235-241 and 271-272): row titles are 15px `leading-snug` (20.625px line height). Author lines carry no leading utility so they inherit the Tailwind preflight default of 1.5, about 16.5px at 11px (verified: no line height override anywhere in the web's src CSS). The RecentRow percent label is `text-[10px] font-semibold tracking-[0.1em] tabular-nums`, so digits are fixed width and the label does not jitter as the percentage changes.\n\nNative behavior: `rowTitle` has lineHeight 19 (rows.tsx:114). `rowAuthor` has no lineHeight (rows.tsx:115), which is tighter than 16.5 under RN font defaults. The pct Text (rows.tsx:67) has fontSize 10, letterSpacing 1, `FONTS.sansSemiBold`, but no `fontVariant: ['tabular-nums']`.\n\nChange: `rowTitle` lineHeight 21, `rowAuthor` lineHeight 16.5, and add `fontVariant: ['tabular-nums']` to the percent label (StatsScreen.tsx already uses fontVariant at lines 95, 105, and 123, so the pattern exists). These nudges change overall row height slightly; the web RecentRow content column is title 20.6 + author 16.5 + 2 margin + progress row with 8px top margin, so sanity check the sum still reads the same.\n\n### 8. Stats, About, and EmptyTab line heights drift from web\n\nSeverity: low. Scope: Stats screen, About screen, EmptyTab in `src/components/ui.tsx`.\n\nWeb behavior: two kinds of cases.\n\n- `leading-none` numerals: the Stats hero figure is 44px serif with line height exactly 44 (StoreFront.tsx:1387); the four headline figures are 30px with line height 30 (StoreFront.tsx:1402).\n- Unstyled text inherits Tailwind preflight's 1.5 line height (verified: no line height override in the web's src CSS). So: EmptyTab's 20px title renders at line height 30 (StoreFront.tsx:127); About's 26px hero title at 39 and its 14px subtitle at 21 (StoreFront.tsx:1587-1588); the 13px Getting around tip rows at 19.5, making each row 12 + 19.5 + 12 = 43.5px tall (StoreFront.tsx:1607); the 12px and 10px eyebrow and label lines at 1.5x their size (18 and 15).\n\nNative behavior: the hero figure has lineHeight 48 (`src/screens/StatsScreen.tsx:95`, 4px taller than web) and the headline figures lineHeight 33 (StatsScreen.tsx:105, 3px taller). The EmptyTab title (`src/components/ui.tsx:87`), the About hero title and subtitle (`src/screens/AboutScreen.tsx:46-47`), the tip rows (AboutScreen.tsx:64-77), the benchmark labels (StatsScreen.tsx:122-123) and the eyebrows set NO lineHeight, so they sit at the font's natural metrics, roughly 1.2x, tighter than web's 1.5. For example the tip rows come out around 40px tall versus web's 43.5, and the EmptyTab title box around 24px versus web's 30.\n\nChange, matching web's computed values:\n\n- Stats hero figure: lineHeight 44 (add `includeFontPadding: false` if Android clips descenders at fontSize equal to lineHeight).\n- Headline figures: lineHeight 30 (same includeFontPadding caveat).\n- EmptyTab title (20px): lineHeight 30.\n- About hero title (26px): lineHeight 39. About subtitle (14px): lineHeight 21.\n- Getting around tips (13px): lineHeight 19.5, round to 20 if the fractional value renders oddly.\n- 12px labels (for example the benchmark 'You' / 'Average reader' rows): lineHeight 18. 10px eyebrows and uppercase labels: lineHeight 15.\n\nDo NOT touch the paragraphs that already match: the About body copy (14px, lineHeight 23, web `leading-relaxed`), the benchmark takeaway (web `leading-snug`, native 18), and the EmptyTab body (13px, lineHeight 21). Those set explicit leading on the web and native already mirrors them.\n\n### 9. Coffee icon in the Vibe out header bottom aligns instead of top aligning\n\nSeverity: low. Scope: Today screen.\n\nWeb behavior (StoreFront.tsx:1145-1151): the Vibe out header row is `flex items-start justify-between` with the Coffee icon (size 18, `text-mocha/50`) given `mt-1`, so the icon sits at the TOP of the header block, roughly level with the 'Vibe out' title. The Popular header, by contrast, is `items-end`.\n\nNative behavior (`src/screens/TodayScreen.tsx:173-178` and the `sectionHead` style at line 449): both headers share `s.sectionHead` with `alignItems: 'flex-end'`, so the Coffee icon (18, mutedA(0.5), marginTop 4, which is inert under flex-end) sits at the BOTTOM of the header, level with the subtitle.\n\nChange: give the Vibe out header its own row style with `alignItems: 'flex-start'` (keep the icon's marginTop 4, which now does its job) while the Popular header keeps flex-end. Icon size and color already match.\n\n## Acceptance checklist\n\n- [ ] 1. The Popular and Vibe out subtitles, each vibe row's subtitle, and every card and row author line render in Inter italic (light, geometric slant), not Fraunces italic, while the hero author line, pick blurb, recap, EmptyTab body, Library intro, Stats hero pace line, and About subtitle and closing line stay Fraunces italic.\n- [ ] 2. The search no results line 'Nothing on the shelf for that. Try another title or author.' renders in Inter italic at 14px.\n- [ ] 3. On Stats, the 'The same N pages would take an average reader about …' line and the 'N books saved for later in your Library.' footnote render in Inter italic; the hero's 'at about N words a minute' stays Fraunces italic.\n- [ ] 4. In Settings, the Reading speed subtitle is Inter italic, and every other Text on the screen (including 'Currently N words a minute.' and the fit mode descriptions) renders in Inter, not the system font; the About body copy and tips also render in Inter.\n- [ ] 5. Section titles carry letterSpacing -0.55, swimlane titles -0.45, the Your Reading stat numbers sit at lineHeight 28, card titles at lineHeight 19, row titles at lineHeight 21.\n- [ ] 6. Swimlane titles and Today section titles have lineHeight equal to their font size (18 and 22), and the 'see all' baseline alignment visibly tightens; the Stats 'Reading now' heading matches too.\n- [ ] 7. Row author lines sit at lineHeight 16.5 and the percent label uses tabular numerals so it does not jitter between values.\n- [ ] 8. The Stats hero and headline numerals sit at lineHeight 44 and 30 with no clipped descenders; EmptyTab title, About title and subtitle, tips, labels, and eyebrows use 1.5x their font size, so cards and rows land within a pixel of the web heights.\n- [ ] 9. The Coffee icon in the Vibe out header sits at the top of the header, level with the title, while the Popular header keeps its bottom aligned 'see all'.\n\n## Verification\n\nType check with `npx tsc --noEmit` in `C:/Users/Michael/Desktop/Focus Reader Android` and fix any errors you introduced.\n\nThen reason through the running behavior carefully: confirm the new font key is loaded before use (App.tsx blocks first paint on `useFonts`), confirm every changed style still compiles under StyleSheet, and re-read each changed line against the web value cited above.\n\nDo NOT use the Expo web build to verify anything. Its dev server opens blank localhost tabs in the real browser and the web bundle breaks on zustand's import.meta. On device checking is done by Michael on his Android phone.\n\nEnd your summary by telling Michael exactly what to look at on his phone, in plain everyday English. Suggest checks along these lines: on the home screen, the small line under Popular and under Vibe out should now look like slanted plain text, matching the author names under the book covers, instead of the fancy bookish italic. The fancy italic should still appear on the big greeting area and inside the empty boxes. In Settings, all the small helper text should look like the same clean font as the rest of the app. On the Stats page, the two small italic lines near the bottom change to the plain slanted style, and the big numbers should sit a touch tighter in their boxes. On the home screen, the little coffee cup next to Vibe out should now sit up beside the title instead of down by the subtitle. Titles and rows everywhere should look a hair tighter, nothing should look clipped or cut off at the bottom of letters.\n\n## Final note\n\nWhen summarizing work for Michael, use plain everyday language, no jargon, and avoid dashes in prose. Use commas or periods instead.\n\n---\n\n## Outcome, recorded 2026-07-13\n\nImplemented in commit `ddfed5b` on `feat/native-ui-web-parity` in the native repo.\n\nFiles changed: `App.tsx`, `src/theme.ts`, `src/screens/TodayScreen.tsx`, `src/components/BookCard.tsx`, `src/components/rows.tsx`, `src/components/ui.tsx`, `src/screens/ResultsScreen.tsx`, `src/screens/StatsScreen.tsx`, `src/screens/SettingsScreen.tsx`, `src/screens/AboutScreen.tsx`, `src/screens/ReaderScreen.tsx`.\n\n### Issue by issue\n\n**1. Section subtitles, vibe row subtitles, and card/row author lines move to Inter italic** (done)\n\nSwitched sectionSub and the VibeRow subtitle in TodayScreen, the BookCard author style, and rowAuthor in rows.tsx to FONTS.sansItalic. Audited all 26 serifItalic usages in the repo against the web classes. Kept serif italic where the web has font-serif italic: hero author lines, today's pick blurb, scene recap, note from the room quote, Setting the table loading line, EmptyTab body, Library intros, Stats hero pace line, About subtitle and closing line, vibe page intro and vibe hero author, and the generated BookCover author (web BookCover.tsx uses font-serif italic). Two extra audit finds handled under decisions.\n\n**2. Search no results line to Inter italic** (done)\n\nResultsScreen no results Text now FONTS.sansItalic, size 14, centered, 40px vertical padding unchanged.\n\n**3. Two Stats italic lines to Inter italic** (done)\n\nThe benchmark 'would take an average reader' line and the saved for later footnote now FONTS.sansItalic. The hero 'at about N words a minute' line stays serif italic, untouched.\n\n**4. Settings helper texts: subtitle typeface and system font sweep** (done)\n\nReading speed subtitle now FONTS.sansItalic. The 'Currently N words a minute' outer Text and the fit mode descriptions got fontFamily FONTS.sans. Swept the whole screen: those were the only two Texts without an explicit fontFamily. About spillover done too, body paragraphs and tip rows got FONTS.sans.\n\n**5. Type metric drift on Today: tracking and line heights** (done)\n\nsectionTitle letterSpacing now -0.55, Swimlane title -0.45, Your Reading stat numbers lineHeight 28, BookCard title lineHeight 19, rowTitle lineHeight 21.\n\n**6. leading-none line heights on section, swimlane, and Reading now titles** (done)\n\nSwimlane title lineHeight 18, Today sectionTitle lineHeight 22, Stats 'Reading now' letterSpacing -0.45 with lineHeight 18. Added includeFontPadding false on these so Android does not clip descenders like the p in Popular at the tight line height.\n\n**7. Row text metrics: author line height and tabular percent** (done)\n\nrowAuthor lineHeight 16.5, percent label got fontVariant tabular-nums. Row sum check: title 21 + author 16.5 + 2 margin + 8 progress gap tracks the web's 20.6 + 16.5 + 2 + 8 within a pixel.\n\n**8. Stats, About, and EmptyTab line heights** (done)\n\nStats hero figure lineHeight 44 and headline figures 30, both with includeFontPadding false. EmptyTab title lineHeight 30 and its 10px footnote 15. About hero title 39, subtitle 21, tips 19.5, GETTING AROUND label 15. Stats eyebrows and 10px labels 15, benchmark 12px label rows 18. Left the already matching paragraphs alone: About body (23), benchmark takeaway (18), EmptyTab body (21).\n\n**9. Coffee icon top aligns in the Vibe out header** (done)\n\nAdded sectionHeadTop (alignItems flex-start) used only by the Vibe out header, so the icon with its marginTop 4 sits level with the title. Popular keeps the flex-end sectionHead.\n\n### Judgment calls made during implementation\n\n1. Audit finds beyond the named cases: the reader open error detail (src/screens/ReaderScreen.tsx, the {error} Text in the not ready branch) is plain italic in the web's Inter base stack (web src/App.tsx:378), so I switched it to sansItalic since ReaderScreen is not a protected file. 2. The reader scrub peek snippet in src/reader/ReaderChrome.tsx (around line 260) uses serifItalic but the web (src/components/Reader/Controls.tsx:205, 'text-sm text-mocha italic') is Inter italic. That file is off limits this run, so I skipped it; a follow up should change that one Text to FONTS.sansItalic. 3. I added includeFontPadding: false to every Text I set to lineHeight equal to fontSize (Today section titles, swimlane titles, Stats Reading now, Today stat numbers, Stats hero and headline figures), not just the two Stats numerals the prompt suggested it for, because Android clips glyphs at tight line heights and Popular has a descender. 4. While adding issue 8's line heights to the Stats '{n} wpm' value and the 10px 'Average adult silent reading' footnote, I also gave them fontFamily FONTS.sans (they had none, so they rendered in the system font; this follows the prompt's own spillover principle of fixing fontFamily on Texts issue 8 already edits). The benchmark takeaway paragraph still has no explicit fontFamily but sat on the prompt's do-not-touch list, so I left it; worth a later pass. 5. Used the fractional line heights as specified (16.5 and 19.5); React Native accepts fractional values fine. 6. app.json version was not bumped because that file is owned by another active session this run; the commit step or that session should bump expo.version so Michael can verify the build.\n\n### Testing performed\n\n- `npx tsc --noEmit` in the native repo: clean at commit time.\n- An independent adversarial review agent re-opened the uncommitted diff, checked every acceptance checklist item above against the native code and the cited web sources (exact constants, timings, easing curves, and copy strings), hunted for regressions (broken imports, accidental behavior changes, worklet violations), and re-ran the type check itself. Verdict: passed with no unresolved findings and zero fix rounds.\n- The commit step re-ran the type check once more before staging, and staged only the files listed above (no blanket `git add`).\n- Not yet done: the on-device checks in the Verification section above. Playback pacing and gesture feel only prove out on a real phone, so those remain for Michael on build 0.7.10 or later.\n"},{"id":"02","filename":"02-data-services-parity.md","title":"Data and Services Parity: Catalog Titles, Cover URLs, Fetch Semantics, Hydration Gate","content":"# Data and Services Parity: Catalog Titles, Cover URLs, Fetch Semantics, Hydration Gate\n\n> **Status: implemented and committed 2026-07-13.** Commit `1546115` on `feat/native-ui-web-parity` in the native repo. Adversarial review passed with no unresolved findings.\n\n\n## Mission\n\nBring the native Android app's data and services layer to exact web semantics. Six confirmed deltas: the bundled catalog skips the cleanTitle pass so 37 titles show raw MARC markers, live search results and persisted records drop cover art the web keeps, a failed search shows an error card the web never shows, the book download failure copy differs, native adds download timeouts the web does not have, and the first frame paints from store defaults instead of persisted state. Fix all six in the native repo only.\n\n## Context\n\nFocus Reader is a cozy speed reading app for public domain books. It exists twice:\n\n- Web app at `C:/Users/Michael/Desktop/Focus Reader`. This is the READ ONLY source of truth for look and behavior. Never modify anything in this repo. Read it freely to confirm behavior.\n- Native app at `C:/Users/Michael/Desktop/Focus Reader Android`. ALL changes go here. It is an Expo SDK 54 project on React Native 0.81 with reanimated 4, gesture-handler 2.28, zustand, expo-image, expo-haptics, lucide-react-native, and react-navigation native-stack.\n\nThis is a full React Native app. Never introduce a WebView.\n\nUseful background: book text is served through a tiered ladder (bundled books, device file cache, a static mirror at `https://focus-reader-48z.pages.dev/books`, then live Project Gutenberg). Covers resolve by book id to `https://focus-reader-48z.pages.dev/covers/<id>.webp` and fall back to a generated cover when the image fails. The bundled catalog (`src/data/catalog.json`, 988 books) is title identical to the web's `src/data/curated.json`.\n\n## Before you start\n\nRun `git status` in `C:/Users/Michael/Desktop/Focus Reader Android`. Expect branch `feat/native-ui-web-parity`. Another session may hold uncommitted changes in `src/reader/ReaderChrome.tsx`, `src/reader/displays.tsx`, `src/reader/useReelEngine.ts`, and `app.json`, and an untracked `metro.config.js` may be present. Read the current state of any file before editing it, and do not revert changes you did not make. If a line number cited below has drifted, trust the described behavior and re locate the code.\n\n## Issues to fix\n\n### 1. Bundled catalog titles are never cleaned (37 books show raw MARC markers)\n\nWeb behavior. The web maps every bundled catalog entry through `cleanTitle` at module load, in `src/services/library.ts:45-49`:\n\n```ts\nconst CURATED: BookMetadata[] = (curatedJson as BookMetadata[]).map((b) => ({\n    ...b,\n    title: cleanTitle(b.title),\n    coverUrl: hostedCoverUrl(b),\n}));\n```\n\n`cleanTitle` (web `src/services/gutendex.ts:37-43`) strips MARC subfield markers and collapses whitespace:\n\n```ts\n.replace(/\\s*:\\s*\\$[a-z]\\b\\s*/gi, ': ').replace(/\\s+\\$[a-z]\\b\\s*/gi, ' ').replace(/\\s+/g, ' ').trim()\n```\n\nThis changes exactly 37 of 988 titles. Examples: id 16 \"Peter Pan : $b [Peter and Wendy]\" becomes \"Peter Pan: [Peter and Wendy]\", id 271 \"Black Beauty : $b The autobiography of a horse\" becomes \"Black Beauty: The autobiography of a horse\", id 2350 \"His last bow : $b Some later reminiscences of Sherlock Holmes\" is cleaned, id 33016 has a double space collapsed. Cleaned titles then flow into shelves, search results, the reader header, progress records, and saved records.\n\nNative behavior. `src/services/library.ts:24` exports `CATALOG = catalogJson as BookMeta[]` with NO cleanTitle mapping, so the 37 dirty titles render verbatim in the Browse grid (ResultsScreen), localSearch results, TodayScreen lanes (popular shelf plus today's pick), the reader header, and get persisted raw into `progressById` and `savedById` via ReaderScreen.saveNow and SaveButton.toggleSaved. VibeScreen already applies cleanTitle to vibes.json, and `gutendexSearch` already cleans live search titles (`src/services/gutenberg.ts:95`), so only the bundled catalog path is affected. Cleaning the title also changes the generated cover's hash seed (BookCover hashes title plus author), so after the fix generated covers for those 37 books match the web's.\n\nFix. Map CATALOG through cleanTitle at module load, exactly like web `library.ts:45-49`:\n\n```ts\nexport const CATALOG: BookMeta[] = (catalogJson as BookMeta[]).map((b) => ({ ...b, title: cleanTitle(b.title) }));\n```\n\n`cleanTitle` already exists in native `src/services/gutenberg.ts:55-61` and is character identical to the web's. Import it into `src/services/library.ts` (the file already imports from `./gutenberg`).\n\nNote. Users who already opened one of the 37 books keep the dirty title in Recents or Saved until they reopen it. The progress record self heals on next open since updateProgress overwrites title. Saved records only heal on re toggle. No migration needed.\n\n### 2. coverUrl is dropped from BookMeta, live search results, and persisted records\n\nWeb behavior. `BookMetadata` carries `coverUrl?: string` (web `src/services/types.ts:17`). The live Gutendex search maps `coverUrl: b.formats['image/jpeg']` (web `src/services/gutendex.ts:75`), so a search hit outside the mirrored cover set still shows the real publisher cover art in the results grid (`coverUrl={book.coverUrl}` at StoreFront.tsx:945), only degrading to the generated cover if that image errors. `updateProgress` persists `coverUrl: activeBook.coverUrl` (web `src/App.tsx:269`, and again at 287 in the on exit save), and `toggleSaved` persists `coverUrl: book.coverUrl` (web `SaveButton.tsx:34`). Recents rows (StoreFront.tsx:232), the Today resume hero (StoreFront.tsx:992), and Saved rows (StoreFront.tsx:1244) all render that stored cover, so a book saved or resumed from live search keeps its real cover everywhere.\n\nNative behavior. `BookMeta` (`src/services/gutenberg.ts:13-21`) has id, title, author, downloads, textUrl, words, but NO coverUrl. `gutendexSearch` (`src/services/gutenberg.ts:93-99`) drops `formats['image/jpeg']` entirely. `ReaderScreen.saveNow` (`src/screens/ReaderScreen.tsx:120-131`) and `SaveButton.toggleSaved` (`src/components/SaveButton.tsx:84`) omit coverUrl, even though the store's `ReadingProgress` and `SavedBook` interfaces already declare it (`src/store.ts:23` and `src/store.ts:32`). All covers resolve by id to the mirror (`src/components/BookCover.tsx:71`: `uri = coverUrlProp ?? coverUrl(id)`), so for a live search book not in the mirror this 404s and every surface shows only the generated fallback cover.\n\nFix, in these steps:\n\n1. Add `coverUrl?: string` to `BookMeta` in `src/services/gutenberg.ts`.\n2. In `gutendexSearch`, map `coverUrl: b.formats?.['image/jpeg']`.\n3. Results grid: in `src/screens/ResultsScreen.tsx`, pass `coverUrl={book.coverUrl}` to BookCard. BookCard already accepts a coverUrl prop (`src/components/BookCard.tsx:30,43`) and forwards it to BookCover at line 105, and BookCover's coverUrlProp already wins over the id derived mirror URL, so no component changes are needed.\n4. Persist it: add `coverUrl: book.coverUrl` to the `updateProgress` call in ReaderScreen.saveNow (fields at ReaderScreen.tsx:122-129) and to the `toggleSaved` call in SaveButton.tsx:84.\n5. Read it back everywhere the web does:\n   - `src/components/rows.tsx`: `progressToBook` (line 19-21) should carry `coverUrl: r.coverUrl`; RecentRow's BookCover (line 58) should get `coverUrl={r.coverUrl}`; BookRow's BookCover (line 97) should get `coverUrl={book.coverUrl}`.\n   - `src/screens/LibraryScreen.tsx:79`: include `coverUrl: b.coverUrl` in the BookMeta built for saved rows.\n   - `src/screens/TodayScreen.tsx`: the resume hero builds a BookMeta at line 319 (add `coverUrl: progress.coverUrl`) and renders BookCover at line 330 (add `coverUrl={progress.coverUrl}`). The HeroPick cover at line 385 needs nothing since today's pick is a bundled book resolved by id.\n\nNote. For the 988 bundled books nothing changes visually (both platforms use the id keyed mirror plus generated fallback). This only shows on live Gutendex search hits and anything saved or resumed from them. The memory rule about never hotlinking covers concerns the bundled shelves; the web deliberately still uses the Gutendex jpeg for live hits, so match it.\n\n### 3. A failed live search shows an error card instead of the quiet empty state\n\nWeb behavior. `webLibraryService.search` (web `src/services/library.ts:148-158`) runs localSearch first; on zero local hits it calls `gutendex.search` inside try/catch and RETURNS `[]` on any failure. Because the service never throws, StoreFront's runQuery catch (which would set the error 'Search failed. Please check your connection and try again.' at StoreFront.tsx:532) is never reached for a text search. An offline search renders only the italic centered empty state: \"Nothing on the shelf for that. Try another title or author.\" (StoreFront.tsx:935). The error card is effectively dead for search on web.\n\nNative behavior. `ResultsScreen.run` calls `local.length > 0 ? local : await gutendexSearch(q)` (`src/screens/ResultsScreen.tsx:46`), and `gutendexSearch` throws on failure (`Search failed (${res.status})` at `src/services/gutenberg.ts:91`, or a network TypeError when offline). The catch (ResultsScreen.tsx:48-50) sets error 'Search failed. Please check your connection and try again.' and results `[]`, so an offline search renders BOTH the dismissable accent tinted error card (ResultsScreen.tsx:81-88) AND the empty state line below it (ResultsScreen.tsx:114-117).\n\nFix. Wrap the gutendex fallback in try/catch resolving to `[]` on failure, matching web library.ts:153-157, so a failed or offline search shows only the \"Nothing on the shelf for that. Try another title or author.\" empty state with no error card. The cleanest shape is a shared `search(q)` helper in `src/services/library.ts` mirroring `webLibraryService.search` (localSearch first, then a caught gutendexSearch), with ResultsScreen calling it. The empty state copy already matches word for word; leave the error card code in place for any genuinely unexpected failure, it just must not fire for a failed live search.\n\n### 4. Book download failure copy says \"HTTP 404\" instead of the web sentence\n\nWeb behavior. The tier 3 fetch (web `src/services/library.ts:199`) throws:\n\n```ts\nif (!res.ok) throw new Error(`Could not download the book (${res.status}).`);\n```\n\nThe other two service errors, \"No readable plain-text edition is available for this title.\" (line 196) and \"The downloaded file appears to be empty.\" (line 202), are shown verbatim in the error UI's italic detail line.\n\nNative behavior. `fetchText` throws `new Error(\\`HTTP ${res.status}\\`)` (`src/services/library.ts:92`) for BOTH tier 2 and tier 3, so ReaderScreen's error state (which renders the raw message, caught at `src/screens/ReaderScreen.tsx:68`) shows \"HTTP 404\". The other two error strings (native library.ts:152 and 155) already match web exactly. A timeout abort surfaces as the raw abort text (\"Aborted\"), which has no web counterpart.\n\nFix. Make the tier 3 path throw `Could not download the book (${res.status}).` on a non ok response. Since tier 2 failures are silently swallowed on both platforms (web's fetchHostedBook returns undefined, native's try/catch at library.ts:146-148 falls through to tier 3), it is safe to change the throw inside `fetchText` itself. Also map any abort or timeout rejection that can still reach the user to the same readable sentence rather than leaking \"Aborted\". Coordinate with issue 5 so the surfaced copy matches end to end.\n\n### 5. Native aborts slow downloads that the web would eventually complete\n\nWeb behavior. `fetchContent`'s tier 2 (fetchHostedBook, web library.ts:211-221) and tier 3 (web library.ts:198) fetches use plain `fetch()` with no application timeout. A multi megabyte book over a slow link keeps downloading until it succeeds or genuinely fails, and the \"Brewing your book…\" state simply persists.\n\nNative behavior. `fetchText` (`src/services/library.ts:87-97`) wraps fetch in an AbortController: 30_000 ms default for the mirror tier (called at line 138), 60_000 ms for the live Gutenberg tier (line 153). A download still in flight at the deadline rejects even though it would have completed given more time. A tier 2 abort silently falls through to tier 3 (fine), but a tier 3 abort surfaces the raw \"Aborted\" string on the reader's error screen.\n\nFix. Remove the 60_000 ms timeout from the tier 3 call so it waits indefinitely like the web (make the timeout parameter optional and pass none, or skip the AbortController when no timeout is given). Keep the 30_000 ms tier 2 timeout as a deliberate fast fallthrough optimization, and add a short code comment saying it is intentional and native only (the typical mirror fetch is about 9 ms, so 30 s is generous). After this, no abort should ever reach the reader's error screen; if any path can still abort, give it the \"Could not download the book\" style copy from issue 4.\n\n### 6. First paint uses store defaults because AsyncStorage rehydration is not awaited\n\nWeb behavior. zustand persist with the default localStorage storage (web `src/store/useStore.ts:97`, no `storage` option passed) rehydrates synchronously at store creation. The very first render already has the persisted themeIndex, mode, wpm, visMode, fitMode, progressById, savedById, and stats. A light theme user never sees a dark flash (defaults are mode 'dark', themeIndex 0, wpm 300), and the Today resume hero renders the in progress book immediately.\n\nNative behavior. persist uses `createJSONStorage(() => AsyncStorage)` (`src/store.ts:118`), which rehydrates asynchronously. `App.tsx` gates first paint only on fonts (useFonts at App.tsx:49-56, returning null until loaded) with no hydration gate anywhere in the repo (zero matches for hasHydrated, onRehydrateStorage, or rehydrate). Cold start therefore renders defaults (mode 'dark', themeIndex 0, wpm 300, empty progressById, so Today briefly shows today's pick instead of the resume hero, per TodayScreen.tsx:41-53) and then snaps to the persisted state a beat later.\n\nFix. Hold first paint until the store has rehydrated, extending the existing fonts gate in App.tsx. A clean shape:\n\n```tsx\nconst [hydrated, setHydrated] = useState(() => useStore.persist.hasHydrated());\nuseEffect(() => {\n    const unsub = useStore.persist.onFinishHydration(() => setHydrated(true));\n    return unsub;\n}, []);\nif ((!fontsLoaded && !fontError) || !hydrated) return null;\n```\n\nKeeping the Expo splash screen visible until both gates pass is an acceptable alternative. Either way, the first rendered frame must already reflect persisted theme, mode, wpm, visMode, fitMode, progress, saved books, and stats. Watch hook order: the current App.tsx returns null before other logic, so keep all hooks above any early return. AsyncStorage rehydration is fast (a few ms), so no separate loading UI is needed.\n\n## Acceptance checklist\n\n- [ ] Browse, search, Today lanes, and the reader header show \"Peter Pan: [Peter and Wendy]\" (and the other 36 cleaned titles) with no \"$b\" anywhere, and newly persisted progress and saved records store the cleaned title.\n- [ ] A live Gutendex search hit outside the mirror shows its real publisher cover in the results grid, and after saving or reading it, its cover appears in Saved rows, Recents rows, and the Today resume hero.\n- [ ] Searching for a term with no local hits while offline shows only the italic \"Nothing on the shelf for that. Try another title or author.\" line, with no error card above it.\n- [ ] A book whose download fails with an HTTP error shows the detail \"Could not download the book (404).\" (with the real status), never \"HTTP 404\" and never \"Aborted\".\n- [ ] A very slow tier 3 Gutenberg download keeps loading indefinitely instead of erroring at 60 seconds; the tier 2 mirror fetch still gives up at 30 seconds and falls through silently.\n- [ ] Cold starting the app with a light theme, custom wpm, and a book in progress paints the first frame already themed light with the resume hero showing; nothing flashes in from defaults.\n\n## Verification\n\nType check the native repo:\n\n```\ncd \"C:/Users/Michael/Desktop/Focus Reader Android\"\nnpx tsc --noEmit\n```\n\nThen reason through the running behavior carefully by reading the code paths you changed end to end. Do NOT use the Expo web build to verify anything: it opens blank localhost tabs in the real browser and the web bundle breaks on zustand's import.meta. On device checking is done by Michael on his Android phone.\n\nTell Michael to check these things on his phone, in plain words:\n\n1. Search for \"Peter Pan\". The title should read \"Peter Pan: [Peter and Wendy]\" with no dollar sign gibberish. Same for \"Black Beauty\".\n2. Search for something obscure that is not in the built in shelf, like \"Meditations Long\", so the app asks the live catalog. The results should show real book covers, not just the plain generated ones. Save one of those books and start reading it, then check that its cover shows up in the Library under Saved for later, in the reading list, and on the big resume card on the home page.\n3. Turn on airplane mode and search for something not on the built in shelf. You should see only the quiet \"Nothing on the shelf for that\" line, no error box.\n4. If a book ever fails to download, the message should be a full sentence like \"Could not download the book (404).\" and never something cryptic like \"HTTP 404\" or \"Aborted\".\n5. Switch to the light theme, set your speed to something unusual, read a few pages, then fully close the app and reopen it. It should open already in light theme with your book on the resume card, with no dark flicker and no split second of the wrong home page.\n\n## Final note\n\nWhen summarizing the work for Michael, use plain everyday language and avoid dashes in prose. Explain what changed and what he should notice, not implementation trivia.\n\n---\n\n## Outcome, recorded 2026-07-13\n\nImplemented in commit `1546115` on `feat/native-ui-web-parity` in the native repo.\n\nFiles changed: `App.tsx`, `src/components/SaveButton.tsx`, `src/components/rows.tsx`, `src/open/OpenTransition.tsx`, `src/screens/LibraryScreen.tsx`, `src/screens/ReaderScreen.tsx`, `src/screens/ResultsScreen.tsx`, `src/screens/TodayScreen.tsx`, `src/services/gutenberg.ts`, `src/services/library.ts`.\n\n### Issue by issue\n\n**1. Bundled catalog titles never cleaned (37 books show raw MARC markers)** (done)\n\nCATALOG in src/services/library.ts now maps every entry through cleanTitle at module load, matching web library.ts. Browse, search, Today lanes, reader header, and newly persisted progress and saved records all pick up the clean titles, and the generated cover hash seed now matches the web for those 37 books.\n\n**2. coverUrl dropped from BookMeta, live search results, and persisted records** (done)\n\nAdded coverUrl to BookMeta, mapped formats['image/jpeg'] in gutendexSearch, passed it to BookCard in ResultsScreen, persisted it in ReaderScreen.saveNow and SaveButton.toggleSaved, and read it back in rows.tsx (progressToBook, RecentRow, BookRow), LibraryScreen saved rows, and the TodayScreen resume hero (both the BookMeta and the BookCover). Also passed it to the open transition's floating cover so the cover does not swap mid animation (recorded as a judgment call).\n\n**3. Failed live search shows an error card instead of the quiet empty state** (done)\n\nAdded a shared async search(q) helper in src/services/library.ts mirroring webLibraryService.search: localSearch first, gutendexSearch inside try/catch resolving to []. ResultsScreen.run now calls it, so an offline search renders only the italic empty state. The error card code stays for genuinely unexpected failures.\n\n**4. Download failure copy says HTTP 404 instead of the web sentence** (done)\n\nfetchText now throws 'Could not download the book (status).' on a non ok response (safe for tier 2 since those failures are swallowed on both platforms) and remaps any abort rejection to 'Could not download the book (timed out).' so raw 'Aborted' text can never reach the reader error screen.\n\n**5. Native aborts slow downloads the web would complete** (done)\n\nfetchText's timeout parameter is now optional with no AbortController when absent. The tier 3 Gutenberg fetch passes no timeout and waits indefinitely like the web. The tier 2 mirror fetch keeps its explicit 30 second timeout with a comment marking it as a deliberate native only fast fallthrough optimization.\n\n**6. First paint uses store defaults because AsyncStorage rehydration is not awaited** (done)\n\nApp.tsx now gates first paint on both fonts and useStore.persist hydration, using hasHydrated for the initial state plus an onFinishHydration subscription (with a re check inside the effect to close the race where hydration finishes between first render and subscribe). All hooks stay above the early return.\n\n### Judgment calls made during implementation\n\n1) Timeout/abort copy: the prompt asked for 'Could not download the book' style copy on any abort that could reach the user; I chose 'Could not download the book (timed out).' and put the remap inside fetchText itself so no code path can ever leak the raw 'Aborted' string, even though after removing the tier 3 timeout no path should abort. 2) I also passed coverUrl to the floating BookCover in src/open/OpenTransition.tsx, which the prompt did not list; without it a live search book with real cover art would swap to the generated cover during the open animation and swap back after, and the change is one prop on the same BookMeta already in scope. 3) The standing memory rule about bumping expo.version in app.json every change round conflicts with this run's hard rule that app.json must not be modified; the hard rule wins, so the version bump is left for the session that owns app.json. 4) Hydration gate uses return null (matching the existing fonts gate) rather than holding the Expo splash screen; the prompt allowed either and the repo does not currently use expo-splash-screen's preventAutoHideAsync.\n\n### Testing performed\n\n- `npx tsc --noEmit` in the native repo: clean at commit time.\n- An independent adversarial review agent re-opened the uncommitted diff, checked every acceptance checklist item above against the native code and the cited web sources (exact constants, timings, easing curves, and copy strings), hunted for regressions (broken imports, accidental behavior changes, worklet violations), and re-ran the type check itself. Verdict: passed with no unresolved findings and zero fix rounds.\n- The commit step re-ran the type check once more before staging, and staged only the files listed above (no blanket `git add`).\n- Not yet done: the on-device checks in the Verification section above. Playback pacing and gesture feel only prove out on a real phone, so those remain for Michael on build 0.7.10 or later.\n"},{"id":"03","filename":"03-shared-cover-save-toast.md","title":"Native parity 03: shared components (BookCover, save ribbon, skeleton, toast)","content":"# Native parity 03: shared components (BookCover, save ribbon, skeleton, toast)\n\n> **Status: implemented and committed 2026-07-13.** Commit `30a2cd4` on `feat/native-ui-web-parity` in the native repo. Adversarial review passed with no unresolved findings. Michael chose to KEEP the native pinned cover inks (issue 3, option b); the matching web port landed separately in the web repo the same day.\n\n\n## Mission\n\nBring four shared visual components of the native Focus Reader app to pixel and behavior parity with the web app: BookCover (generated cover type sizes, ruled page lines, loading face, failed image retry, accessory ink colors), the leather save ribbon (grain texture and touch zones), CoverSkeleton (pulse animation and Today shelf sizing), and the Toast (exit motion). Nine issues, each described below with exact constants. Work only in the native repo.\n\n## Context\n\nFocus Reader is a cozy speed reading app for public domain books. Two codebases exist:\n\n- Web app (source of truth): `C:/Users/Michael/Desktop/Focus Reader`. This repo is READ ONLY for you. Open its files to check look and behavior, never modify anything in it.\n- Native app (where all changes go): `C:/Users/Michael/Desktop/Focus Reader Android`. Expo SDK 54, React Native 0.81, reanimated 4, gesture-handler 2.28, zustand, expo-image, expo-haptics, lucide-react-native, react-navigation native-stack.\n\nThis is a full React Native app. Never introduce a WebView. The goal for every issue is that the native component matches the web component exactly, using the same constants, copy strings, and timings.\n\n## Before you start\n\n1. Run `git status` in `C:/Users/Michael/Desktop/Focus Reader Android`. Expect branch `feat/native-ui-web-parity`.\n2. Another session may hold uncommitted changes in `src/reader/ReaderChrome.tsx`, `src/reader/displays.tsx`, `src/reader/useReelEngine.ts`, and `app.json`. Read the current state of any file before editing it, and do not revert changes you did not make.\n3. Line numbers below were verified recently but files move. If a listed line number has drifted, trust the described behavior and re-locate the code.\n\n## Issues to fix\n\n### 1. Generated cover title size must be fixed, not scaled by width\n\nWeb (`src/components/Input/BookCover.tsx:69-71`): titleSize is fixed per size prop. `sm` = 11px, `md` = 15px, regardless of rendered cover width. A 176px staff pick cover and a 144px card both use 15px; a 48px wide recent row cover (StoreFront.tsx:231-232 uses size='sm' inside a 48px slot) uses 11px. Eyebrow (7px sm / 8px md) and author (8px sm / 10px md) are fixed too. The web also applies `leading-tight` (line height 1.25) to cover titles (BookCover.tsx:104, 118, 132).\n\nNative (`src/components/BookCover.tsx:77`): `titleSize = sm ? Math.max(9, width * 0.125) : Math.max(11, width * 0.104)`. At width 144 this lands at about 15 and happens to match, but at width 176 (shelf cards) it becomes about 18.3px, and at width 48 (sm rows) it becomes 9px instead of 11px. Eyebrow and author sizes are already fixed at 7/8 and 8/10 and match.\n\nChange: `const titleSize = sm ? 11 : 15;`. Also give the title Text a line height of `titleSize * 1.25` (the `s.title` style at BookCover.tsx:213 has no lineHeight today; set it inline next to fontSize since it depends on titleSize).\n\n### 2. Ruled page lines must fill the whole revealed region\n\nWeb (`src/components/Input/BookCover.tsx:146-155`): the page revealed under the cover draws `repeating-linear-gradient(to bottom, rgba(107,85,68,0.30) 0 1px, transparent 1px 6px)` across a region inset 14% top and bottom, 40% left, 10% right, at opacity 0.5. That is a 1px line every 6px filling the whole region no matter the cover height. Visible whenever the cover peels during the open transition.\n\nNative (`src/components/BookCover.tsx:180-186` RuledLines, region style `s.ruled` at line 198): renders exactly 14 one pixel Views with marginBottom 5, so 84px of lines total. For a 144px wide cover the page is 216px tall and the ruled region is about 155px tall, so lines cover only the top 54% and the lower half of the revealed page is blank. Colors, 6px pitch, region insets (14% / 40% / 10%), and 0.5 opacity already match.\n\nChange: derive the line count from the region height. Pass the cover height (which is `width * 1.5`) into `RuledLines` and render `Math.ceil(height * 0.72 / 6)` lines (0.72 because 14% is inset top and bottom), keeping the 1px line, 5px gap, `rgba(107,85,68,0.30)` color, and the existing container. The region already has `overflow: 'hidden'` so a slight overshoot is fine. An SVG pattern that tiles the region is an acceptable alternative.\n\n### 3. Cover accessory inks: pinned vs theme derived\n\nThis was originally a divergence: the web app resolved cover styling tokens dynamically against the theme (leading to a dark mode issue where label text was drawn cream-on-white and was nearly unreadable). The native app resolved this by pinning label inks to fixed light-mode colors.\n\nThis has been reconciled. The web app was updated (in `src/components/Input/BookCover.tsx`) to match the native app's pinned behavior:\n* Image and label cover stitches and spines now use pinned RGBA colors (`rgba(251,245,234,0.4)` and `rgba(58,42,30,0.2)` / `rgba(58,42,30,0.15)`) rather than theme tokens.\n* Label author text is pinned to `#6B5544` and label title text is pinned to `#3A2A1E`.\n* Page edge and gutter shadow are pinned to `rgba(58,42,30,0.1)` and `rgba(58,42,30,0.15)`.\n\nNative (`src/components/BookCover.tsx`): matches the above pinned colors exactly. The solid variant's on tint text is set to `t.surface` in both modes for all tints.\n\n### 4. Cover image loading face, fade, and fetch priority\n\nWeb (`src/components/Input/BookCover.tsx:79-97` and `46-48`): while a cover image loads, the cover face has no background (`coverBg = ''`), so the under cover page (ruled lines, gutter shadow) shows through. The img pops in with no transition. `loading` is `'lazy'` (offscreen shelf covers do not fetch until scrolled near) unless `priority` is true (hero slots), which is eager plus `fetchPriority=\"high\"`. The web passes `priority` on exactly three hero slots: the hero pick (StoreFront.tsx:831), the resume hero (StoreFront.tsx:992), and today's pick (StoreFront.tsx:1065).\n\nNative (`src/components/BookCover.tsx:95-106`): `coverBg = t.surfaceSunken` paints a solid sunken block while loading; expo-image `transition={150}` crossfades the image in; every mounted cover fetches immediately (shelves are plain ScrollViews so all children mount), and BookCover exposes no priority prop.\n\nChange, three parts:\n\n1. When `showImage`, set `coverBg = 'transparent'` so the ruled page beneath shows through during load.\n2. Set `transition={0}` on the expo-image so the image pops in like the web.\n3. Add a `priority?: 'high' | 'low'` prop to native BookCover, default `'low'`, passed straight to expo-image's `priority` prop. Pass `priority=\"high\"` at the native hero call sites: `src/screens/TodayScreen.tsx:330` (resume hero), `src/screens/TodayScreen.tsx:385` (today's pick hero), and `src/screens/VibeScreen.tsx:177` (vibe hero pick). This approximates the web's lazy versus eager tiering.\n\nLeave `cachePolicy=\"disk\"` alone; it is the right native translation of the browser HTTP cache.\n\n### 5. Failed cover flag must reset when the URI changes\n\nWeb (`src/components/Input/BookCover.tsx:62-66`): failure state is the failed URL string, not a boolean. `showImage = !!coverUrl && failedUrl !== coverUrl`, so when the same mounted BookCover is handed a different coverUrl the image is attempted again automatically.\n\nNative (`src/components/BookCover.tsx:60, 71-72, 105`): `const [failed, setFailed] = useState(false)` is set true in onError and never reset; `showImage = !!uri && !failed`, so a reused component instance whose `id` or `coverUrl` prop changes (recycled row, rotating hero slot) keeps the generated fallback forever.\n\nChange: track the failed URI. `const [failedUri, setFailedUri] = useState<string | null>(null)`, `showImage = !!uri && failedUri !== uri`, and `onError={() => setFailedUri(uri!)}`. No effect needed; the string comparison self resets exactly like the web.\n\n### 6. Leather ribbon grain texture (bake PNGs) and drape shadow blur\n\nWeb (`src/components/Input/LeatherBookmark.tsx:20-60`): the strap is rasterized once per theme to a PNG at 120x278 (3x of the 36px on cover width; viewBox 64x148) from an SVG that layers a base fill (`#6e4a2b` light, `#e7ddc9` dark) through a feTurbulence fractalNoise grain (baseFrequency `0.5 0.55` light, `0.42 0.46` dark, numOctaves 4, seed 11) lit by feDiffuseLighting (surfaceScale 1.7 light / 1.05 dark, diffuseConstant 1.05, lighting color `#ffffff`, distant light azimuth 235, elevation 58 light / 60 dark) blended multiply, giving visibly textured leather, plus the sheen gradient, loop highlight, fold shade, edge stroke (`#34200f` / `#9a8a6c`, opacity 0.55, width 1.6), and dashed stitching (`#ecd7a8` / `#5d3f23`, width 1.7, dasharray `3 3.4`). The full SVG string is built by `leatherSvgMarkup()` in that file. Separately, the drape's cast shadow is blurred: `filter: blur(3px)` on the radial gradient span (web `src/components/Input/SaveButton.tsx:82`).\n\nNative (`src/components/SaveButton.tsx:36-66`): same strap and stitch paths, sheen, loop highlight, fold shade, and stroke colors drawn with react-native-svg, but no grain layer at all; the component's own comment concedes the leather reads flatter. The drape shadow SVG (SaveButton.tsx:136-146, radial gradient stopping at opacity 0.34 center, 0 at 72%) has no blur.\n\nChange: bake the two themed bookmark PNGs offline and bundle them as assets, exactly what the web does at runtime.\n\n1. Copy `leatherSvgMarkup()` from the web file and emit two SVG files (light and dark) at 120x278.\n2. Rasterize each to PNG. A dependable route is a tiny node script using `@resvg/resvg-js` (it supports feTurbulence and feDiffuseLighting); headless Chrome screenshotting the SVG also works. Do the baking in a scratch folder, not the repo, and only commit the PNGs.\n3. Read the generated PNGs with your image reading tool to confirm the grain is actually visible before bundling (a silent filter failure yields a flat fill, which defeats the purpose).\n4. Put them in the native repo assets (for example `assets/bookmark-light.png` and `assets/bookmark-dark.png`), `require()` them, and render with expo-image at width RIBBON_W (36) and height `RIBBON_W * 148 / 64`, replacing the `LeatherArt` SVG component. Keep the same clip window reveal animation.\n5. Soften the drape shadow to match the web's 3px blur: either widen the radial gradient falloff (push the transparent stop outward and lower the peak slightly so edges feel diffuse) or bake a small blurred shadow image alongside the straps.\n\n### 7. Ribbon touch exclusion zone must track the ribbon's live bounds\n\nWeb (`src/components/Input/SaveButton.tsx:41-48, 69-95`): the ribbon button's own onPointerDown calls stopPropagation for its full live bounds. Geometry: width 36 at left 16%; edge = 40 * 36 / 64 = 22.5 (the tip pokes 22.5px above the cover top, `top: -edge`); when unsaved the button height is `edge + 14`, so it reaches 14px below the cover top; when saved the height is the full bookmark, 148 * 36 / 64 = 83.25, so it reaches 60.75px below the cover top. A tap anywhere on the visible ribbon only toggles the save and can never start the gesture that opens the book.\n\nNative (`src/components/BookCard.tsx:50-89`, `src/components/SaveButton.tsx:111-156`): BookCard's lift and tap gestures fail themselves only when the touch is inside `x in [width*0.16 - 8, width*0.16 + 44], y <= 36` (card coordinates, 8px slop each side horizontally, matching the Pressable's hitSlop of 8). Two bugs follow. When SAVED, the ribbon Pressable extends about 60.75px below the cover top (68.75 with hitSlop), so touches in the y band 36 to 68.75 land on both the ribbon Pressable (zIndex 10, a sibling of the GestureDetector) and the card's gestures, likely unsaving AND opening at once. When UNSAVED, the Pressable only responds down to about 22px below the cover top (14px overhang plus 8px hitSlop), so y 22 to 36 in that column is a dead strip where the web would open the book but native does nothing.\n\nChange: make the exclusion zone depend on saved state.\n\n1. In `src/components/SaveButton.tsx`, extend the exported `RIBBON_HITBOX` (line 156) with the below cover extents: `belowCoverUnsaved: 14`, `belowCoverSaved: ((VIEW.h - EDGE) * RIBBON_W) / VIEW.w` (60.75), and `hitSlop: 8`.\n2. In `src/components/BookCard.tsx`, make `inRibbon` read the live saved state, `useStore.getState().savedById[book.id]`, inside the onTouchesDown check (an imperative read keeps the gesture memo stable), and gate y at `belowCoverUnsaved + hitSlop` (22) when unsaved and `belowCoverSaved + hitSlop` (68.75) when saved. Both the lift and tap gestures use the same check.\n\nResult: exactly the ribbon toggles, everything else opens. Note for the device pass: the saved drape double trigger depends on gesture-handler hit testing of overlapping siblings, so it must be confirmed on the phone.\n\n### 8. Toast exit motion: drop 8px, ease out\n\nWeb (`tailwind.config.js:47` and `60-65`): `toastPop` runs 2.4s with the CSS `ease-out` keyword (cubic-bezier(0, 0, 0.58, 1), applied per keyframe segment). It enters from translateY(16px) and opacity 0 to 0 and 1 by 12% (288ms), holds to 85% (2040ms), then fades out while moving to translateY(8px). The exit drop is half the entry distance.\n\nNative (`src/components/Toast.tsx:20-33`): the timing envelope matches (290ms in, 1750ms hold, 360ms fade out ending at 2400ms) but translateY is tied to `(1 - visible.value) * 16`, so the exit drops the full 16px, and each withTiming uses the default in out easing.\n\nChange: drive translateY with its own shared value (enter 16 to 0 over 290ms, hold, exit 0 to 8 over the 360ms fade), and pass `Easing.bezier(0, 0, 0.58, 1)` (or `Easing.out(Easing.quad)`) to every withTiming call. Everything else about the toast already matches (pill metrics, colors, medallion, 13px semibold text, bottom `max(28, inset + 16)`, z order, non interactive, re trigger on a new toast id).\n\n### 9. CoverSkeleton pulse and Today shelf sizing\n\nWeb (`src/components/Input/StoreFront.tsx:91-97`): CoverSkeleton is a 144px wide block (`w-36`): cover block with aspect 2:3, rounded left 3px and right 12px, background espresso at 0.07; a 12px tall title bar at 75% width with 10px top margin; a 10px tall author bar at 50% width, espresso at 0.05, with 6px top margin. Every block runs Tailwind's `animate-pulse`: opacity 1 to 0.5 to 1 over 2s, cubic-bezier(0.4, 0, 0.6, 1), infinite. On the Today Popular shelf (`StoreFront.tsx:1115-1116`), 4 skeletons render, each inside a 176px (`w-44`) snap slot, while the skeleton itself stays 144px.\n\nNative (`src/components/ui.tsx:124-134`, `src/screens/TodayScreen.tsx:155-156`): CoverSkeleton draws the same static blocks (sizes and radii already match) with no pulse, and TodayScreen passes `width={176}` so the skeleton fills the whole slot.\n\nChange: wrap the skeleton in an Animated.View whose opacity loops 1 to 0.5 to 1 over 2s, `Easing.bezier(0.4, 0, 0.6, 1)` on both halves, `withRepeat(..., -1)`. In TodayScreen, render each skeleton at width 144 inside a 176px wide slot View so spacing matches the loaded cards. On native the Today catalog is bundled so this loading state is nearly unreachable there, but CoverSkeleton is shared with vibe pages where loading is visible, so it matters.\n\n## Acceptance checklist\n\n- [ ] 1. Generated covers show 15px titles on md covers and 11px on sm covers at every width (176px shelf cards no longer oversize, 48px rows no longer undersize), with line height 1.25 on the title.\n- [ ] 2. During the cover peel of the open transition, faint ruled lines fill the revealed page from 14% down to 14% up, with no blank lower half, at any cover size.\n- [ ] 3. Michael was asked about pinned versus theme derived cover inks and his choice is implemented (or explicitly left pinned); the solid cover's text, rule, and Leaf use the surface color on every tint in both light and dark mode.\n- [ ] 4. A loading cover shows the ruled page through a transparent face (no sunken block), the image pops in with no crossfade, and hero covers on Today and vibe pages load at high priority while shelf covers load at low priority.\n- [ ] 5. A cover that failed to load retries automatically when the same mounted component receives a different cover URI (recycled rows and rotating hero slots recover).\n- [ ] 6. The save ribbon shows visible leather grain texture from bundled baked PNGs (brown strap in light themes, cream in dark), and the drape's cast shadow looks soft edged like the web's 3px blur.\n- [ ] 7. Tapping anywhere on a saved ribbon's lower drape only toggles the save (never also opens the book), and tapping the strip just below an unsaved ribbon's tip opens the book instead of doing nothing.\n- [ ] 8. The toast slides up 16px on entry and drops only 8px on exit, both with ease out timing, inside the same 2.4s envelope.\n- [ ] 9. Skeleton placeholders pulse (opacity 1 to 0.5 to 1 every 2s), and Today's four shelf skeletons are 144px wide sitting in 176px slots.\n\n## Verification\n\n- Type check the native repo: `npx tsc --noEmit` in `C:/Users/Michael/Desktop/Focus Reader Android`. Fix any errors you introduced.\n- Reason through the running behavior carefully for each issue: trace the gesture math for issue 7 with concrete numbers (a 144 wide card: ribbon x band roughly 15 to 67, y limit 22 unsaved and 68.75 saved), the animation timelines for issues 8 and 9, and the state transitions for issue 5.\n- Do NOT use the Expo web build to verify anything. Its dev server opens blank localhost tabs in Michael's real browser and the web bundle breaks on zustand's import.meta. All on device checking is done by Michael on his Android phone.\n- Read the two baked bookmark PNGs as images to confirm the grain rendered before you bundle them.\n\nEnd your session by telling Michael exactly what to look at on his phone, in plain everyday English. Cover at least these:\n\n1. Open Today and look at the book shelf. Titles on the made up covers (the ones without real cover art) should look a touch smaller and match the smaller cards elsewhere.\n2. Press and hold a book so the cover lifts and starts to peel. The notebook style lines on the page underneath should now run all the way down instead of stopping halfway.\n3. On a fresh install or after clearing the app's storage, watch covers load. You should briefly see the page lines behind a see through cover instead of a gray block, and the picture should appear instantly rather than fading in.\n4. Look at the little leather bookmark on any book cover. It should now have a subtle leathery texture instead of looking flat, in both light and dark theme.\n5. Save a book so the bookmark drapes down the cover, then tap the long draped part. It should only unsave the book. Before this fix it could unsave and open the book at the same time.\n6. With a book unsaved, tap just below the bookmark's little tip. The book should open normally, no dead spot.\n7. Save or unsave any book and watch the little confirmation bubble at the bottom. When it leaves it should settle down gently by a small amount, not slide away as far as it came in.\n8. Open a vibe page on a slow connection. The gray placeholder cards should gently pulse while things load.\n\n## Final note\n\nWhen summarizing your work for Michael, use plain everyday language and avoid dashes in prose. Explain what changed in terms of what he will see, not in terms of code internals.\n\n---\n\n## Outcome, recorded 2026-07-13\n\nImplemented in commit `30a2cd4` on `feat/native-ui-web-parity` in the native repo.\n\nFiles changed: `src/components/BookCard.tsx`, `src/components/BookCover.tsx`, `src/components/SaveButton.tsx`, `src/components/Toast.tsx`, `src/components/ui.tsx`, `src/screens/TodayScreen.tsx`, `src/screens/VibeScreen.tsx`, `assets/bookmark-dark.png`, `assets/bookmark-light.png`.\n\n### Issue by issue\n\n**1. Generated cover title size fixed per size prop, not scaled by width** (done)\n\ntitleSize is now 11 for sm and 15 for md at every width, with lineHeight titleSize * 1.25 set inline on all three variant titles (solid, label, framed).\n\n**2. Ruled page lines fill the whole revealed region** (done)\n\nRuledLines now takes the cover height and renders Math.ceil(height * 0.72 / 6) lines; a 144 wide cover gets 26 lines (156px) covering the whole 155.5px region, clipped by the existing overflow hidden.\n\n**3. Cover accessory inks: pinned vs theme derived** (done)\n\nPer Michael's pre made decision the pinned inks stay as they are. The uncontested change is applied: the solid variant's onTint is now t.surface in both modes for every tint. Reminder recorded that the web needs a matching follow up to port the pinning back (separate task).\n\n**4. Cover image loading face, fade, and fetch priority** (done)\n\ncoverBg is 'transparent' while the image shows, transition is 0 (pop in), and a priority prop ('high'/'low', default 'low') feeds expo-image. priority=\"high\" passed at the resume hero and today's pick hero in TodayScreen and the vibe hero pick in VibeScreen. cachePolicy=\"disk\" left alone.\n\n**5. Failed cover flag resets when the URI changes** (done)\n\nBoolean failed state replaced with failedUri string; showImage = !!uri && failedUri !== uri; onError stores the failing uri. Self resets exactly like the web.\n\n**6. Leather ribbon grain texture (baked PNGs) and drape shadow blur** (done)\n\nBaked light and dark 120x278 PNGs in the scratchpad with @resvg/resvg-js from the web's leatherSvgMarkup (turbulence grain plus diffuse lighting rendered correctly; both PNGs visually inspected, grain clearly visible, ~50KB each which also confirms noise content). Bundled at assets/bookmark-light.png and bookmark-dark.png, rendered via expo-image inside the same clip reveal animation. Drape shadow softened by widening the radial falloff (peak 0.30, mid stops 0.16/0.05, transparent at the rim, rx/ry widened to 58%/62%) to approximate the web's 3px blur.\n\n**7. Ribbon touch exclusion zone tracks live bounds** (done)\n\nRIBBON_HITBOX extended with belowCoverUnsaved: 14, belowCoverSaved: 60.75, hitSlop: 8. BookCard's inRibbon now reads useStore.getState().savedById[book.id] imperatively and gates y at 22 unsaved / 68.75 saved (144 card x band 15.04 to 67.04). Both lift and tap gestures share the check. The saved drape double trigger still needs confirming on the phone per the prompt.\n\n**8. Toast exit motion: drop 8px, ease out** (done)\n\ntranslateY now has its own shared value (16 to 0 over 290ms, hold 1750ms, 0 to 8 over the 360ms fade) and every withTiming uses Easing.bezier(0, 0, 0.58, 1), the CSS ease-out curve, inside the same 2.4s envelope.\n\n**9. CoverSkeleton pulse and Today shelf sizing** (done)\n\nSkeleton wrapped in an Animated.View pulsing opacity 1 to 0.5 to 1 over 2s with Easing.bezier(0.4, 0, 0.6, 1) on both halves, repeated forever. Today's four shelf skeletons render at 144 wide inside 176 wide slot Views. ResultsScreen's grid skeletons (already 144) pick up the pulse for free.\n\n### Judgment calls made during implementation\n\n1) Issue 3 was resolved per the instructions given for this run: the native pinned label and page inks stay pinned, and only the solid cover's on tint color changed to the surface token in both modes. The web still needs a follow up task to port the pinning back so the two apps match. 2) Drape shadow blur: instead of baking a separate shadow image, I widened the radial gradient falloff (lower peak, two mid stops, transparent stop at the rim, slightly larger radii) which reads as a diffuse soft edge without a runtime blur filter; exact stop values are a judgment call that should be eyeballed on the phone. 3) The baked strap PNG renders through expo-image with contentFit fill at 36 by 83.25, keeping the exact geometry the old SVG used, so the clip reveal animation needed no changes. 4) In BookCard the saved state is read imperatively inside the touch check rather than subscr
