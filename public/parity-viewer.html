    const DOCS = [{"id":"00","filename":"00-INDEX.md","title":"Native Parity Tracker","content":"# Native Parity Tracker\n\nA full audit of the native Android app against the web app ran on 2026-07-13. Thirteen auditors combed both codebases surface by surface, a second pass re-verified every claim against the code, and the confirmed differences were grouped into 16 work packages. Every one is now built and committed, so each page below is a record of what shipped, followed by a short checklist of what to confirm on your phone.\n\n**Status: COMPLETE, plus a reader feel dial-in and a QA pass on top.** All 16 packages were implemented the same day, in two sequential background runs, one commit per package on `feat/native-ui-web-parity` in the native repo. Every package passed an adversarial review on the first try, with zero fix rounds. Since then, a dedicated reader dial-in added six more commits and an independent QA pass verified the whole thing. The app version is now 0.7.11, and everything is committed and pushed to both GitHub repos. See [Beyond the 16 packages](#beyond-the-16-packages) below.\n\n**The audit numbers:** 188 differences confirmed, 68 were duplicate reports of the same underlying issue, leaving 120 unique fixes. All 120 are implemented except two drawer swipe details in pack 05 that the prompt itself marked optional.\n\n## Results\n\n| # | File | What it fixed | Issues | Commit |\n|---|------|---------------|--------|--------|\n| 01 | [01-typography-and-type-metrics.md](01-typography-and-type-metrics.md) | Inter italic faces, letter spacing, line heights, header alignment | 9 | `ddfed5b` |\n| 02 | [02-data-services-parity.md](02-data-services-parity.md) | Catalog title cleanup, cover URL threading, fetch and error semantics, hydration gate | 6 | `1546115` |\n| 03 | [03-shared-cover-save-toast.md](03-shared-cover-save-toast.md) | BookCover details, save ribbon, skeletons, toast exit | 9 | `30a2cd4` |\n| 04 | [04-book-pickup-and-instant-open.md](04-book-pickup-and-instant-open.md) | Hold to open thresholds, touch slop, open origins, slot hiding | 9 | `abf2cff` |\n| 05 | [05-navigation-and-drawer-model.md](05-navigation-and-drawer-model.md) | Hardware back, drawer behavior, stack resets, transitions | 11 | `5de8738` |\n| 06 | [06-reel-engine-playback-core.md](06-reel-engine-playback-core.md) | Seek freezing playback, stuck drag flag, final word dwell, WPM reset, reduce motion | 6 | `0bfbcde` |\n| 07 | [07-reader-gesture-zoning.md](07-reader-gesture-zoning.md) | Band scoped scrub vs stage wide race, tap and skip zones, swipe down exit | 10 | `90e77e1` |\n| 08 | [08-display-text-measurement.md](08-display-text-measurement.md) | Real text measurement, focal pinning, strip widths, centering | 8 | `8e27908` |\n| 09 | [09-open-transition-internals.md](09-open-transition-internals.md) | Close motion, error card, spinner, faux text, phase skips | 10 | `61d1926` |\n| 10 | [10-reading-progress-and-sessions.md](10-reading-progress-and-sessions.md) | Save triggers, restart position, session accounting | 5 | `295bbb7` |\n| 11 | [11-shelf-snap-and-virtualization.md](11-shelf-snap-and-virtualization.md) | Shelf snapping, list virtualization, grid spacing | 5 | `ef4bf3e` |\n| 12 | [12-app-shell-branding-washes.md](12-app-shell-branding-washes.md) | App icon and splash, page washes, shell padding, theme cross fade | 6 | `d34a4d3` |\n| 13 | [13-press-feedback-micromotion.md](13-press-feedback-micromotion.md) | Press scale feedback everywhere, header collapse, search pill polish | 11 | `07605cf` |\n| 14 | [14-paragraph-mode-polish.md](14-paragraph-mode-polish.md) | Active word scale, slide in easing, highlight pill, word gap | 5 | `269e27b` |\n| 15 | [15-reader-chrome-polish.md](15-reader-chrome-polish.md) | Play glyphs, pill animation, fill easing, chrome typography | 6 | `8a14767` |\n| 16 | [16-accessibility-parity.md](16-accessibility-parity.md) | TalkBack roles, labels, selected states, live region toast | 4 | `d82603b` |\n\nEach page opens with its done status and commit hash, records what changed issue by issue, and ends with a short on-device checklist you can tick off as you test on your phone. Your checkmarks are saved in this browser.\n\n## Beyond the 16 packages\n\nAfter the packages landed, three more workstreams followed, all committed and pushed. They are in the sidebar too.\n\n- **[Reader dial-in](17-reader-dial-in.md)** — six more commits tuning the reading screen feel against the mined playbook: crisp flick stops, catch tap accuracy, paragraph centering, chrome peek zones, and more. It carries a checklist of what to feel for on the phone. This is what took the version to 0.7.11.\n- **[QA and verification](18-qa-and-verification.md)** — an independent pass that re-checked every claim against the code. Verdict: safe to ship. It grep verified every constant in the playbook against live code and found the shipping code clean; the handful of findings were documentation corrections, now made.\n- **[Reader feel playbook](reader-feel-playbook.md)** — the settled record of how the reader must feel, mined from fifteen device tuning sessions plus git history. This is the reference spec for any future reader work, and it is the \"Reference\" entry at the bottom of the sidebar.\n\nThe next step is a real installable APK, so the feel can be judged on a phone instead of through Expo Go's development overhead.\n\n## Deliberate divergences from the web\n\nThree places where the implementation intentionally does not copy the web pixel for pixel, each documented in a code comment at the site. Michael can overrule any of them:\n\n1. **Cover inks stay pinned (pack 03, Michael's decision).** The web's theme derived label cover inks go nearly invisible in dark mode. Native keeps warm pinned inks, and the web `BookCover.tsx` was updated the same day to adopt the identical pinning, so both apps now match on the readable behavior.\n2. **A controls seek beats a coasting fling (pack 06).** On the web, a fling in progress swallows an explicit skip press, which was judged accidental. Native honors the press immediately.\n3. **Reader fades use Tailwind's real ease out curve (pack 15).** The audit spec named the CSS keyword value, but the web actually ships Tailwind's `cubic-bezier(0, 0, 0.2, 1)`. Native matches what the web really renders.\n\nAlso of note: Sentence view has no swipe down exit anywhere because the web has none (pack 07). Flagged in case it should exist on both.\n\n## What this folder is now\n\nThe prompts remain useful as the reference spec for what exact parity means on each surface: every constant, timing, and copy string was verified against the web source. If a future regression appears on some surface, re running that single package's prompt in a fresh session is a targeted way to restore parity. The audit method (13 surface auditors, skeptical verification, planner, per package prompts) is repeatable if the web app grows new features that need porting.\n","kicker":"Index"},{"id":"01","filename":"01-typography-and-type-metrics.md","title":"Typography foundation: Inter italic faces and type metrics","content":"# Typography foundation: Inter italic faces and type metrics\n\n**Done.** Implemented and committed as `ddfed5b` on `feat/native-ui-web-parity`, 2026-07-13, independent review passed with no unresolved findings. This foundation package brought the native Android storefront typography to exact parity with the web app: it loaded the Inter italic face, exposed it as a `FONTS.sansItalic` token that several later packages consume, and corrected a set of letter spacing and line height drifts across the storefront.\n\n## What this fixed\n\nBefore this pack, the native app never loaded an Inter italic face at all. `App.tsx` loaded Fraunces 400, 400 italic, 500, 600 and Inter 400, 500, 600, 700 upright, so every italic on native fell back to `FONTS.serifItalic` (Fraunces_400Regular_Italic). That flattened the web's deliberate distinction between two italic voices: Inter sans italic is the metadata voice (subtitles, author lines, helper text) and Fraunces serif italic is the editorial voice (hero author line, today's pick blurb, recap text, empty states). On top of that, section and swimlane titles, numerals, card and row titles, author lines, and the Stats, About, and EmptyTab text blocks carried small letter spacing and line height drifts, and the Vibe out header's coffee icon bottom aligned instead of top aligning. This pack loaded a real Inter italic face, swept every metadata italic onto it, and nudged all the type metrics onto the web's computed values.\n\nThe first step was loading the face. `Inter_400Regular_Italic` (already shipped by the installed `@expo-google-fonts/inter` 0.4.2, no new dependency) was added to the import and the `useFonts` map in `App.tsx`, and a token was added to `FONTS` in `src/theme.ts`:\n\n```ts\n/** italic without font-serif on the web — the metadata voice (Inter italic). */\nsansItalic: 'Inter_400Regular_Italic',\n```\n\nFiles changed: `App.tsx`, `src/theme.ts`, `src/screens/TodayScreen.tsx`, `src/components/BookCard.tsx`, `src/components/rows.tsx`, `src/components/ui.tsx`, `src/screens/ResultsScreen.tsx`, `src/screens/StatsScreen.tsx`, `src/screens/SettingsScreen.tsx`, `src/screens/AboutScreen.tsx`, `src/screens/ReaderScreen.tsx`.\n\n## What changed\n\n### 1. Section subtitles, vibe row subtitles, and card/row author lines moved to Inter italic\n\nOn the web these strings are styled `italic` without `font-serif`, so they render in Inter italic: the Popular section subtitle 'The most read on Focus Reader' (`text-[12px] text-mocha italic mt-1`), the Vibe out section subtitle 'Pick a feeling, not a genre.' (same classes), each vibe row's subtitle (`block text-[12px] italic text-mocha mt-0.5`), the BookCard author line (`text-[11px] text-mocha mt-0.5 italic line-clamp-1`), and the RecentRow and BookRow author lines (`text-[11px] text-mocha italic line-clamp-1 mt-0.5`). Native was rendering all of them in `FONTS.serifItalic`. Switched `sectionSub` and the VibeRow subtitle in TodayScreen, the BookCard `author` style, and `rowAuthor` in rows.tsx (used by both RecentRow and BookRow) to `FONTS.sansItalic`. Sizes, colors, and margins already matched, so only the family changed.\n\nThis was a systematic substitution, so all 26 `FONTS.serifItalic` usages in the native repo were audited against the web class list. Serif italic was kept only where the web has both `font-serif` and `italic`: the Today hero author line, the today's pick blurb, the scene recap text, the note from the room quote, the Setting the table loading line, the EmptyTab body, the Library intros, the Stats hero pace line 'at about N words a minute', the About subtitle 'A calm place to read the classics.' and the About closing line 'Made with care, over many cups of coffee.', the vibe page intro and vibe hero author, and the generated BookCover author (web `BookCover.tsx` uses `font-serif italic`).\n\n### 2. Search no results line moved to Inter italic\n\nOn the web (StoreFront.tsx:935) the line 'Nothing on the shelf for that. Try another title or author.' is a `<p>` with `text-center text-[14px] text-mocha italic py-10` inside the `font-sans` page root: Inter italic, 14px, mocha, 40px vertical padding, centered, no `font-serif`. Native was matching everything but the family, using `FONTS.serifItalic`. The Results screen no results Text now uses `FONTS.sansItalic`, size 14, centered, 40px vertical padding unchanged.\n\n### 3. Two italic lines on the Stats page moved to Inter italic\n\nOn the web the benchmark card's line 'The same {pages} pages would take an average reader about {time}.' is `text-[11px] text-mocha/80 italic mt-2` (11px italic Inter), and the saved footnote '{n} book{s} saved for later in your Library.' is `text-center text-[12px] text-mocha italic mt-9` (12px italic Inter, centered, 36px top margin). Native had both on `FONTS.serifItalic`. Both now use `FONTS.sansItalic`; sizes, colors (mutedA(0.8) and textMuted), margins (8 and 36) and centering were already correct. The hero's 'at about N words a minute' line is serif italic on the web and stays serif italic on native, untouched.\n\n### 4. Settings helper texts: subtitle typeface and system font sweep\n\nOn the web the Reading speed subtitle 'Used when you open a book. You can still change it while reading.' is `text-[12px] text-mocha/80 italic mb-3` (12px italic Inter), 'Currently {wpm} words a minute.' is 12px regular Inter with a `font-semibold tabular-nums` span, and the fit mode descriptions ('Every word colours a middle letter so it fits.' and friends) are `text-[12px] text-mocha/80 leading-snug` regular Inter. Native had the subtitle on `FONTS.serifItalic`, and the 'Currently …' outer Text and the fit mode description Text set no fontFamily at all, so they rendered in Roboto/system instead of Inter. The subtitle now uses `FONTS.sansItalic` at 12px; the 'Currently …' outer Text and the fit mode descriptions got `fontFamily: FONTS.sans`. The whole screen was swept, and those two were the only Texts without an explicit fontFamily. The About spillover was handled too: the body copy at AboutScreen.tsx:53-58 and the Getting around tip rows at AboutScreen.tsx:64-77 (both edited under issue 8 anyway) got `fontFamily: FONTS.sans`.\n\n### 5. Type metric drift on Today: tracking and line heights\n\nCorrected to the web's computed values. Section `h2` titles (Popular, Vibe out) are 22px `tracking-tight` = -0.025em = -0.55px, so `sectionTitle` letterSpacing moved from -0.4 to -0.55. Swimlane `h3` titles are 18px `tracking-tight` = -0.45px, so the swimlane title letterSpacing moved from -0.3 to -0.45. The 'Your Reading' stat numbers are 28px `leading-none`, so the 28px stat numbers got lineHeight 28 (they previously had none and took the taller platform default). The BookCard title is 14px `leading-snug` = 19.25px, so its lineHeight moved from 18 to 19. The RecentRow title is 15px `leading-snug` = 20.6px, so `rowTitle` lineHeight moved from 19 to 21. Fonts and weights (Fraunces 500/600, Inter 500/600) were already correct.\n\n### 6. leading-none line heights on section, swimlane, and Reading now titles\n\nThe web's swimlane titles are `font-serif text-[18px] font-semibold tracking-tight leading-none` (line height exactly 18px) and the Today section titles are 22px `tracking-tight leading-none` (line height 22px). Native set no lineHeight on either. Swimlane title got lineHeight 18, Today `sectionTitle` got lineHeight 22, and the Stats 'Reading now' heading (same web style, StoreFront.tsx:1452, 18px `tracking-tight leading-none`) went to letterSpacing -0.45 with lineHeight 18. This matters because the 'see all' control is bottom aligned (flex-end) against these titles, so the extra default leading was shifting the baseline. `includeFontPadding: false` was added on these so Android does not clip descenders (the p in Popular) at the tight line height.\n\n### 7. Row text metrics: author line height and tabular percent\n\nOn the web row titles are 15px `leading-snug` (20.625px) and author lines carry no leading utility, inheriting the Tailwind preflight default of 1.5, about 16.5px at 11px. The RecentRow percent label is `text-[10px] font-semibold tracking-[0.1em] tabular-nums`, so digits are fixed width and the label does not jitter. Native had `rowAuthor` with no lineHeight (tighter than 16.5 under RN defaults) and the percent label with fontSize 10, letterSpacing 1, `FONTS.sansSemiBold` but no tabular numerals. `rowAuthor` got lineHeight 16.5 and the percent label got `fontVariant: ['tabular-nums']`. Row sum check: title 21 + author 16.5 + 2 margin + 8 progress gap tracks the web's 20.6 + 16.5 + 2 + 8 within a pixel.\n\n### 8. Stats, About, and EmptyTab line heights\n\nMatched to the web's computed values. The Stats hero figure is 44px serif `leading-none`, so its lineHeight moved from 48 to 44; the four headline figures are 30px `leading-none`, so theirs moved from 33 to 30 (both with `includeFontPadding: false`). Unstyled web text inherits the preflight 1.5 line height, so: EmptyTab's 20px title got lineHeight 30 and its 10px footnote got 15; the About hero title (26px) got 39, the subtitle (14px) got 21, the Getting around tips (13px) got 19.5, and the GETTING AROUND label got 15; the Stats eyebrows and 10px labels got 15 and the benchmark 12px label rows ('You' / 'Average reader') got 18. The already matching paragraphs were left alone: the About body copy (14px, lineHeight 23, web `leading-relaxed`), the benchmark takeaway (web `leading-snug`, native 18), and the EmptyTab body (13px, lineHeight 21).\n\n### 9. Coffee icon top aligns in the Vibe out header\n\nOn the web the Vibe out header row is `flex items-start justify-between` with the Coffee icon (size 18, `text-mocha/50`) given `mt-1`, so it sits at the top of the header, level with the title, while the Popular header is `items-end`. Native shared one `sectionHead` style with `alignItems: 'flex-end'` across both, so the icon (18, mutedA(0.5), marginTop 4 inert under flex-end) sat at the bottom, level with the subtitle. A `sectionHeadTop` style with `alignItems: 'flex-start'` was added and used only by the Vibe out header, so the icon's marginTop 4 now does its job and it sits level with the title. Popular keeps the flex-end `sectionHead`.\n\n## Judgment calls\n\n- **Reader open error detail switched too.** The `{error}` Text in the not ready branch of `src/screens/ReaderScreen.tsx` is plain italic in the web's Inter base stack (src/App.tsx:378), so it was switched to `sansItalic`. ReaderScreen was not a protected file this run.\n- **One reader italic deliberately skipped.** The reader scrub peek snippet in `src/reader/ReaderChrome.tsx` (around line 260) uses `serifItalic`, but the web (Controls.tsx:205, `text-sm text-mocha italic`) is Inter italic. That file was owned by another active session this run, so it was left alone; a follow up should change that one Text to `FONTS.sansItalic`.\n- **`includeFontPadding: false` applied more broadly than suggested.** It was added to every Text set to a lineHeight equal to its fontSize (Today section titles, swimlane titles, Stats Reading now, Today stat numbers, Stats hero and headline figures), not just the two Stats numerals, because Android clips glyphs at tight line heights and Popular has a descender.\n- **Two extra Stats Texts got a fontFamily.** While adding issue 8's line heights to the Stats '{n} wpm' value and the 10px 'Average adult silent reading' footnote, both were given `fontFamily: FONTS.sans` (they had none and rendered in the system font), following the pack's own spillover principle. The benchmark takeaway paragraph still has no explicit fontFamily but sat on the do-not-touch list, so it was left; worth a later pass.\n- **Fractional line heights kept as specified.** 16.5 and 19.5 were used directly; React Native accepts fractional values.\n- **App version not bumped in this pack.** `app.json` was owned by another active session this run, so the `expo.version` bump was left to the commit step or that session.\n\n## Check on your phone\n\n- [ ] Confirm: on the home screen, the small lines under Popular and under Vibe out, and the author names under book covers and in rows, look like slanted plain text (Inter italic), while the big greeting area and the empty boxes still show the fancy bookish italic (Fraunces).\n- [ ] Confirm: a search with no results shows 'Nothing on the shelf for that. Try another title or author.' in the plain slanted style at 14px.\n- [ ] Confirm: on Stats, the two small italic lines near the bottom read in the plain slanted style, while the hero 'at about N words a minute' stays the fancy bookish italic.\n- [ ] Confirm: in Settings, all the small helper text (including 'Currently N words a minute.' and the fit mode descriptions) looks like the same clean font as the rest of the app, not the system font.\n- [ ] Confirm: the little coffee cup next to Vibe out sits up beside the title, while Popular keeps its 'see all' down at the bottom.\n- [ ] Confirm: titles and rows everywhere look a hair tighter, the big Stats numbers sit snug in their boxes, and nothing looks clipped or cut off at the bottom of letters.\n\nEverything else in this package was verified in code and by review.\n","kicker":"Package 01"},{"id":"02","filename":"02-data-services-parity.md","title":"Data and Services Parity: Catalog Titles, Cover URLs, Fetch Semantics, Hydration Gate","content":"# Data and Services Parity: Catalog Titles, Cover URLs, Fetch Semantics, Hydration Gate\n\n**Done.** Implemented and committed as `1546115` on `feat/native-ui-web-parity`, 2026-07-13, independent review passed with no unresolved findings. This package brought the native Android app's data and services layer up to the web's exact semantics: catalog title cleanup, cover art threading, search and download error behavior, download timeouts, and the cold start hydration gate.\n\n## What this fixed\n\nBefore this pass, six data layer behaviors diverged from the web. The bundled catalog skipped the title cleanup pass, so 37 books showed raw MARC markers like \"$b\". Live search results and anything saved or resumed from them dropped the real publisher cover the web keeps. A failed live search popped an error card the web never shows. The book download failure message read \"HTTP 404\" instead of a full sentence. Native aborted slow downloads at 60 seconds that the web would let finish. And a cold start painted its first frame from store defaults, flashing the wrong theme and the wrong home page before snapping to persisted state. All six now match the web.\n\n## What changed\n\n### 1. Bundled catalog titles are now cleaned (37 books no longer show raw MARC markers)\n\nThe web maps every bundled catalog entry through `cleanTitle` at module load (`src/services/library.ts:45-49`):\n\n```ts\nconst CURATED: BookMetadata[] = (curatedJson as BookMetadata[]).map((b) => ({\n    ...b,\n    title: cleanTitle(b.title),\n    coverUrl: hostedCoverUrl(b),\n}));\n```\n\n`cleanTitle` (web `src/services/gutendex.ts:37-43`) strips MARC subfield markers and collapses whitespace:\n\n```ts\n.replace(/\\s*:\\s*\\$[a-z]\\b\\s*/gi, ': ').replace(/\\s+\\$[a-z]\\b\\s*/gi, ' ').replace(/\\s+/g, ' ').trim()\n```\n\nNative previously exported `CATALOG = catalogJson as BookMeta[]` with no cleanTitle mapping, so 37 of 988 titles rendered verbatim in the Browse grid, localSearch results, Today lanes, the reader header, and were persisted raw into `progressById` and `savedById`. `CATALOG` in `src/services/library.ts` now maps every entry through `cleanTitle` at module load, matching web `library.ts`:\n\n```ts\nexport const CATALOG: BookMeta[] = (catalogJson as BookMeta[]).map((b) => ({ ...b, title: cleanTitle(b.title) }));\n```\n\n`cleanTitle` already existed in native `src/services/gutenberg.ts:55-61`, character identical to the web's, and was imported into `library.ts`. This changes exactly 37 of 988 titles: id 16 \"Peter Pan : $b [Peter and Wendy]\" becomes \"Peter Pan: [Peter and Wendy]\", id 271 \"Black Beauty : $b The autobiography of a horse\" becomes \"Black Beauty: The autobiography of a horse\", id 2350 \"His last bow : $b Some later reminiscences of Sherlock Holmes\" is cleaned, and id 33016 has a double space collapsed. Because BookCover hashes title plus author for its generated fallback, cleaning the title also realigns the generated cover hash seed for those 37 books with the web. VibeScreen and `gutendexSearch` (`src/services/gutenberg.ts:95`) already cleaned their own paths, so only the bundled catalog path needed the fix. Already opened books keep the dirty title in Recents or Saved until reopened; progress records self heal on next open since updateProgress overwrites title, and saved records heal on re toggle. No migration was needed.\n\n### 2. coverUrl is now threaded through BookMeta, live search results, and persisted records\n\n`BookMetadata` on the web carries `coverUrl?: string` (`src/services/types.ts:17`), the live Gutendex search maps `coverUrl: b.formats['image/jpeg']` (web `src/services/gutendex.ts:75`), and that stored cover renders across Recents rows, the Today resume hero, and Saved rows, so a book saved or resumed from live search keeps its real cover everywhere. Native's `BookMeta` (`src/services/gutenberg.ts:13-21`) had id, title, author, downloads, textUrl, and words but no coverUrl, `gutendexSearch` dropped `formats['image/jpeg']` entirely, and the save and progress paths omitted it, so a live search book not in the mirror 404'd on the id keyed cover (`src/components/BookCover.tsx:71`: `uri = coverUrlProp ?? coverUrl(id)`) and fell back to the generated cover everywhere.\n\nThe fix, end to end: added `coverUrl?: string` to `BookMeta` in `src/services/gutenberg.ts`; mapped `coverUrl: b.formats?.['image/jpeg']` in `gutendexSearch`; passed `coverUrl={book.coverUrl}` to BookCard in `ResultsScreen`; persisted `coverUrl: book.coverUrl` in `ReaderScreen.saveNow` and `SaveButton.toggleSaved` (the store's `ReadingProgress` and `SavedBook` interfaces already declared it at `src/store.ts:23` and `:32`); and read it back everywhere the web does, in `src/components/rows.tsx` (`progressToBook`, RecentRow's BookCover, BookRow's BookCover), `src/screens/LibraryScreen.tsx` saved rows, and the `src/screens/TodayScreen.tsx` resume hero (both the BookMeta and the BookCover). The floating cover in `src/open/OpenTransition.tsx` also got `coverUrl` so it does not swap mid animation (recorded as a judgment call below). For the 988 bundled books nothing changed visually since both platforms use the id keyed mirror plus generated fallback; this only shows on live Gutendex search hits and anything saved or resumed from them.\n\n### 3. A failed live search now shows the quiet empty state instead of an error card\n\nOn the web, `webLibraryService.search` (`src/services/library.ts:148-158`) runs localSearch first and, on zero local hits, calls `gutendex.search` inside try/catch and returns `[]` on any failure, so the error card copy \"Search failed. Please check your connection and try again.\" is never reached for a text search. An offline search renders only the italic centered empty state \"Nothing on the shelf for that. Try another title or author.\" Native previously called `gutendexSearch` directly, which throws `Search failed (${res.status})` on failure or a network TypeError when offline, so an offline search rendered both the dismissable accent tinted error card and the empty state line below it.\n\nA shared async `search(q)` helper was added to `src/services/library.ts` mirroring `webLibraryService.search`: localSearch first, then `gutendexSearch` inside try/catch resolving to `[]`. `ResultsScreen.run` now calls it, so a failed or offline search shows only the \"Nothing on the shelf for that. Try another title or author.\" empty state with no error card. The empty state copy already matched word for word, and the error card code stays in place for genuinely unexpected failures.\n\n### 4. Download failure copy now reads the full web sentence instead of \"HTTP 404\"\n\nThe web's tier 3 fetch (`src/services/library.ts:199`) throws `Could not download the book (${res.status}).`, shown verbatim in the error UI's italic detail line alongside its two siblings \"No readable plain-text edition is available for this title.\" and \"The downloaded file appears to be empty.\" Native's `fetchText` previously threw `HTTP ${res.status}` for both tier 2 and tier 3, so the reader error screen showed \"HTTP 404\", and a timeout abort surfaced the raw \"Aborted\" text.\n\n`fetchText` now throws `Could not download the book (${res.status}).` on a non ok response. This is safe for tier 2 because those failures are swallowed on both platforms (web's fetchHostedBook returns undefined, native's try/catch falls through to tier 3). Any abort rejection is remapped to `Could not download the book (timed out).`, so the raw \"Aborted\" string can never reach the reader error screen. The other two native error strings already matched the web exactly.\n\n### 5. Slow tier 3 downloads now wait indefinitely like the web\n\nThe web's tier 2 and tier 3 fetches use plain `fetch()` with no application timeout, so a multi megabyte book over a slow link keeps downloading until it succeeds or genuinely fails while the \"Brewing your book…\" state persists. Native's `fetchText` wrapped fetch in an AbortController: 30_000 ms for the mirror tier and 60_000 ms for the live Gutenberg tier, so a download still in flight at 60 seconds rejected even though it would have completed given more time.\n\n`fetchText`'s timeout parameter is now optional, with no AbortController created when it is absent. The tier 3 Gutenberg fetch passes no timeout and waits indefinitely like the web. The tier 2 mirror fetch keeps its explicit 30_000 ms timeout, now carrying a code comment marking it as a deliberate native only fast fallthrough optimization (the typical mirror fetch is about 9 ms, so 30 seconds is generous). Combined with issue 4, no abort should ever reach the reader error screen.\n\n### 6. First paint now waits for AsyncStorage rehydration\n\nThe web's zustand persist uses the default localStorage storage (`src/store/useStore.ts:97`, no `storage` option), which rehydrates synchronously at store creation, so the very first render already carries the persisted themeIndex, mode, wpm, visMode, fitMode, progressById, savedById, and stats. A light theme user never sees a dark flash, and the Today resume hero renders the in progress book immediately. Native's persist uses `createJSONStorage(() => AsyncStorage)` (`src/store.ts:118`), which rehydrates asynchronously, and `App.tsx` gated first paint only on fonts, so a cold start rendered defaults (mode 'dark', themeIndex 0, wpm 300, empty progressById, so Today briefly showed today's pick instead of the resume hero) and snapped to persisted state a beat later.\n\n`App.tsx` now gates first paint on both fonts and store hydration, using `useStore.persist.hasHydrated()` for the initial state plus an `onFinishHydration` subscription:\n\n```tsx\nconst [hydrated, setHydrated] = useState(() => useStore.persist.hasHydrated());\nuseEffect(() => {\n    const unsub = useStore.persist.onFinishHydration(() => setHydrated(true));\n    return unsub;\n}, []);\nif ((!fontsLoaded && !fontError) || !hydrated) return null;\n```\n\nThe effect re checks `hasHydrated` inside itself to close the race where hydration finishes between first render and subscribe. All hooks stay above the early return. The first rendered frame now already reflects persisted theme, mode, wpm, visMode, fitMode, progress, saved books, and stats. AsyncStorage rehydration is fast (a few ms), so no separate loading UI was needed.\n\n## Judgment calls\n\n1. **Timeout copy.** Any abort rejection is remapped to `Could not download the book (timed out).`, with the remap placed inside `fetchText` itself, so no code path can leak the raw \"Aborted\" string even though after removing the tier 3 timeout no path should abort.\n2. **Open transition cover.** `coverUrl` was also passed to the floating BookCover in `src/open/OpenTransition.tsx`, which the prompt did not list. Without it, a live search book with real cover art would swap to the generated cover during the open animation and swap back after. The change is one prop on a BookMeta already in scope.\n3. **Version bump deferred.** The standing rule to bump `expo.version` in `app.json` every change round conflicted with this run's hard rule that `app.json` must not be modified. The hard rule won, so the version bump was left for the session that owns `app.json`.\n4. **Hydration gate shape.** The gate uses `return null` (matching the existing fonts gate) rather than holding the Expo splash screen. The prompt allowed either, and the repo does not currently use expo-splash-screen's preventAutoHideAsync.\n\n## Check on your phone\n\n- [ ] Confirm: searching \"Peter Pan\" shows the title \"Peter Pan: [Peter and Wendy]\" with no dollar sign gibberish, and \"Black Beauty\" reads \"Black Beauty: The autobiography of a horse\".\n- [ ] Confirm: an obscure live search hit not on the built in shelf shows a real book cover in the results grid, not the plain generated one.\n- [ ] Confirm: after saving and reading one of those live search books, its real cover shows up in Library under Saved for later, in the reading list, and on the big resume card on the home page.\n- [ ] Confirm: with airplane mode on, searching for something not on the shelf shows only the quiet \"Nothing on the shelf for that. Try another title or author.\" line, with no error box above it.\n- [ ] Confirm: a book that fails to download shows a full sentence like \"Could not download the book (404).\" and never \"HTTP 404\" or \"Aborted\".\n- [ ] Confirm: switching to light theme, setting an unusual reading speed, reading a few pages, then fully closing and reopening the app opens already in light theme with your book on the resume card, with no dark flicker and no split second of the wrong home page.\n\nEverything else in this package (the coverUrl type threading, the shared search helper, and the indefinite tier 3 wait versus the silent 30 second tier 2 fallthrough) was verified in code and by review.\n","kicker":"Package 02"},{"id":"03","filename":"03-shared-cover-save-toast.md","title":"Native parity 03: shared components (BookCover, save ribbon, skeleton, toast)","content":"# Native parity 03: shared components (BookCover, save ribbon, skeleton, toast)\n\n**Done.** Implemented and committed as `30a2cd4` on `feat/native-ui-web-parity`, 2026-07-13, independent review passed with no unresolved findings. This package brought four shared visual pieces of the native app to parity with the web: the generated BookCover, the leather save ribbon, the CoverSkeleton placeholder, and the confirmation Toast.\n\n## What this fixed\n\nBefore this, the native versions of the shared components drifted from the web in ways that showed up across the whole app, on covers, on the save ribbon, on loading placeholders, and on the little save confirmation bubble. Generated cover titles were sized by a width formula that oversized shelf cards and undersized row covers, the ruled page under a peeling cover only filled its top half, loading covers painted a solid gray block instead of letting the page show through, the leather ribbon had no grain and read flat, the ribbon's touch zone did not track its saved bounds so a saved drape could unsave and open at once, the toast dropped the full entry distance on exit, and the skeleton placeholders never pulsed. Nine issues, each fixed to the web's exact constants.\n\n## What changed\n\n**1. Generated cover title size is fixed, not scaled by width.** The web sizes cover titles per size prop, `sm` = 11px and `md` = 15px, regardless of rendered width, with the eyebrow (7px sm / 8px md) and author (8px sm / 10px md) fixed too, and `leading-tight` (line height 1.25) on the title. Native had been computing `titleSize = sm ? Math.max(9, width * 0.125) : Math.max(11, width * 0.104)`, which happened to match at width 144 but became about 18.3px on 176px shelf cards and dropped to 9px on 48px sm rows. It is now `const titleSize = sm ? 11 : 15;` with `lineHeight` of `titleSize * 1.25` set inline on all three variant titles (solid, label, framed). Eyebrow and author were already fixed at 7/8 and 8/10 and matched.\n\n**2. Ruled page lines fill the whole revealed region.** The web draws `repeating-linear-gradient(to bottom, rgba(107,85,68,0.30) 0 1px, transparent 1px 6px)` at opacity 0.5 across a region inset 14% top and bottom, 40% left, 10% right, so a 1px line every 6px fills the entire region at any cover height. Native had rendered exactly 14 one-pixel Views with marginBottom 5, only 84px of lines, so on a 144px cover the lower half of the peeled page was blank. `RuledLines` now takes the cover height and renders `Math.ceil(height * 0.72 / 6)` lines (0.72 because 14% is inset top and bottom), keeping the 1px line, 5px gap, and `rgba(107,85,68,0.30)` color. A 144 wide cover now gets 26 lines (156px) covering the whole 155.5px region, clipped by the existing `overflow: 'hidden'`.\n\n**3. Cover accessory inks: pinned, with the solid on-tint fix applied.** This was originally a divergence: the web resolved cover inks against the theme, which drew label text cream-on-white and nearly unreadable in dark mode, and native pinned the inks to fixed light-mode colors. It has since been reconciled by porting the pinning back into the web `BookCover.tsx`. Native matches the pinned colors exactly: stitches and spines at `rgba(251,245,234,0.4)` and `rgba(58,42,30,0.2)` / `rgba(58,42,30,0.15)`, label author text `#6B5544`, label title text `#3A2A1E`, page edge and gutter shadow `rgba(58,42,30,0.1)` and `rgba(58,42,30,0.15)`. The uncontested part of the issue was applied here: the solid variant's on-tint text (text, rule, and Leaf) is now `t.surface` in both light and dark mode for every tint.\n\n**4. Cover image loading face, fade, and fetch priority.** On the web a loading cover has no background (`coverBg = ''`) so the ruled page and gutter shadow show through, the img pops in with no transition, and `loading` is `'lazy'` except on three hero slots that get `priority` (eager plus `fetchPriority=\"high\"`). Native had painted a solid `t.surfaceSunken` block while loading and crossfaded the image in with `transition={150}`. Now `coverBg` is `'transparent'` while the image shows, `transition` is `0` so the image pops in, and a `priority?: 'high' | 'low'` prop (default `'low'`) feeds expo-image's `priority`. `priority=\"high\"` is passed at the three native hero call sites: the resume hero and today's pick hero in `TodayScreen.tsx`, and the vibe hero pick in `VibeScreen.tsx`. `cachePolicy=\"disk\"` was left alone as the right native translation of the browser HTTP cache.\n\n**5. Failed cover flag resets when the URI changes.** The web tracks failure as the failed URL string, not a boolean, so `showImage = !!coverUrl && failedUrl !== coverUrl` retries automatically when a mounted BookCover is handed a different URL. Native had a `const [failed, setFailed] = useState(false)` that was set true on error and never reset, so a recycled row or rotating hero slot kept the generated fallback forever. It now tracks `failedUri` as a string: `const [failedUri, setFailedUri] = useState<string | null>(null)`, `showImage = !!uri && failedUri !== uri`, and `onError={() => setFailedUri(uri!)}`. The string comparison self-resets exactly like the web, no effect needed.\n\n**6. Leather ribbon grain texture (baked PNGs) and drape shadow blur.** The web rasterizes the strap once per theme to a 120x278 PNG (3x of the 36px on-cover width, viewBox 64x148) from an SVG that layers a base fill (`#6e4a2b` light, `#e7ddc9` dark) through a feTurbulence fractalNoise grain (baseFrequency `0.5 0.55` light / `0.42 0.46` dark, numOctaves 4, seed 11) lit by feDiffuseLighting (surfaceScale 1.7 light / 1.05 dark, diffuseConstant 1.05, lighting color `#ffffff`, distant light azimuth 235, elevation 58 light / 60 dark) blended multiply, plus the sheen gradient, loop highlight, fold shade, edge stroke (`#34200f` / `#9a8a6c`, opacity 0.55, width 1.6) and dashed stitching (`#ecd7a8` / `#5d3f23`, width 1.7, dasharray `3 3.4`). Native had drawn the paths with react-native-svg but no grain layer at all. The two themed PNGs were baked offline with `@resvg/resvg-js` from the web's `leatherSvgMarkup()` (turbulence grain plus diffuse lighting rendered correctly, both PNGs visually inspected with the grain clearly visible, about 50KB each), bundled at `assets/bookmark-light.png` and `assets/bookmark-dark.png`, and rendered via expo-image at width RIBBON_W (36) and height `RIBBON_W * 148 / 64` (83.25) inside the same clip-window reveal animation, replacing the old SVG component. The drape's cast shadow, which the web blurs with `filter: blur(3px)`, was softened by widening the radial gradient falloff: peak 0.30, mid stops 0.16 and 0.05, transparent at the rim, rx/ry widened to 58%/62%.\n\n**7. Ribbon touch exclusion zone tracks the live saved bounds.** On the web the ribbon button stops propagation for its full live bounds: width 36 at left 16%, edge = `40 * 36 / 64` = 22.5 (tip pokes 22.5px above the cover top), unsaved height `edge + 14` reaching 14px below the cover top, saved height `148 * 36 / 64` = 83.25 reaching 60.75px below the cover top. Native's exclusion zone had been a fixed `y <= 36` band, which left two bugs: when saved the ribbon Pressable extended about 60.75px below the top so touches from y 36 to 68.75 hit both the ribbon and the card gestures (unsaving and opening at once), and when unsaved the Pressable only reached about 22px so y 22 to 36 was a dead strip. `RIBBON_HITBOX` was extended with `belowCoverUnsaved: 14`, `belowCoverSaved: 60.75` (`((VIEW.h - EDGE) * RIBBON_W) / VIEW.w`), and `hitSlop: 8`. In `BookCard.tsx`, `inRibbon` now reads `useStore.getState().savedById[book.id]` imperatively (keeping the gesture memo stable) and gates y at 22 when unsaved and 68.75 when saved (144 card x band 15.04 to 67.04). Both the lift and tap gestures share the check.\n\n**8. Toast exit motion: drop 8px, ease out.** The web `toastPop` runs 2.4s with the CSS `ease-out` keyword (`cubic-bezier(0, 0, 0.58, 1)`), entering from translateY(16px) and opacity 0 to 0 and 1 by 12% (288ms), holding to 85% (2040ms), then fading while moving to translateY(8px), so the exit drop is half the entry distance. Native had matched the timing envelope but tied translateY to `(1 - visible.value) * 16`, dropping the full 16px on exit with the default in-out easing. translateY now has its own shared value (16 to 0 over 290ms, hold 1750ms, 0 to 8 over the 360ms fade), and every withTiming uses `Easing.bezier(0, 0, 0.58, 1)`, inside the same 2.4s envelope. Pill metrics, colors, medallion, 13px semibold text, and bottom `max(28, inset + 16)` already matched.\n\n**9. CoverSkeleton pulse and Today shelf sizing.** The web CoverSkeleton is a 144px block (cover aspect 2:3, rounded left 3px and right 12px, background espresso at 0.07; a 12px title bar at 75% width with 10px top margin; a 10px author bar at 50% width, espresso at 0.05, 6px top margin) running Tailwind's `animate-pulse` (opacity 1 to 0.5 to 1 over 2s, `cubic-bezier(0.4, 0, 0.6, 1)`, infinite), and on the Today Popular shelf four skeletons render inside 176px snap slots while each skeleton stays 144px. Native had drawn the static blocks with no pulse and passed `width={176}` so the skeleton filled the whole slot. The skeleton is now wrapped in an Animated.View whose opacity loops 1 to 0.5 to 1 over 2s with `Easing.bezier(0.4, 0, 0.6, 1)` on both halves and `withRepeat(..., -1)`, and Today's four shelf skeletons render at width 144 inside 176px slot Views. ResultsScreen's grid skeletons (already 144) picked up the pulse for free.\n\n## Judgment calls\n\n- Issue 3 was resolved per the instructions for this run: the native pinned label and page inks stay pinned, and only the solid cover's on-tint color changed to the surface token in both modes. The web still needs a follow-up task to port the pinning back so the two apps match, and that reminder was recorded.\n- Drape shadow blur (issue 6) was approximated by widening the radial gradient falloff (lower peak, two mid stops, transparent stop at the rim, slightly larger radii) rather than baking a separate blurred shadow image. It reads as a diffuse soft edge without a runtime blur filter, but the exact stop values are a judgment call to eyeball on the phone.\n- The baked strap PNG renders through expo-image with contentFit fill at 36 by 83.25, keeping the exact geometry the old SVG used, so the clip reveal animation needed no changes.\n- In BookCard the saved state is read imperatively inside the touch check rather than subscribed, exactly as specified, so the gesture memo stays stable.\n- ResultsScreen's skeletons also gained the pulse since CoverSkeleton is shared, which matches the web, where skeletons pulse everywhere.\n\n## Check on your phone\n\n- [ ] Confirm: on Today, titles on the generated covers (the ones without real cover art) look a touch smaller and match the smaller cards elsewhere, with no oversized shelf-card titles.\n- [ ] Confirm: press and hold a book so the cover lifts and peels, and the notebook-style ruled lines on the page underneath run all the way down instead of stopping halfway.\n- [ ] Confirm: on a fresh install or after clearing storage, a loading cover briefly shows the page lines through a see-through face (not a gray block) and the picture appears instantly rather than fading in.\n- [ ] Confirm: the little leather bookmark on any cover has a subtle leathery grain texture instead of looking flat, in both light and dark theme, and its draped shadow looks soft-edged.\n- [ ] Confirm: save a book so the bookmark drapes down, then tap the long draped part, and it only unsaves the book (it never also opens the book).\n- [ ] Confirm: with a book unsaved, tap just below the bookmark's tip and the book opens normally, with no dead spot.\n- [ ] Confirm: save or unsave any book and watch the confirmation bubble at the bottom, which settles down gently by a small amount on exit instead of sliding away as far as it came in.\n- [ ] Confirm: on a vibe page loading over a slow connection, the gray placeholder cards gently pulse while things load.\n\nEverything else in this package (the pinned solid on-tint color, the failed-cover URI reset, fetch priority threading, and the type-safe hitbox constants) was verified in code and by review.\n","kicker":"Package 03"},{"id":"04","filename":"04-book-pickup-and-instant-open.md","title":"Book pickup thresholds and instant-open origins","content":"# Book pickup thresholds and instant-open origins\n\n**Done.** Implemented and committed as `abf2cff` on `feat/native-ui-web-parity`, 2026-07-13, with an independent review that passed and left no unresolved findings. This package brought the native Android app's book pickup gesture and instant open animation into exact parity with the web app.\n\n## What this fixed\n\nPicking up and tap opening books on native felt off in several ways at once. The hold to pick up committed at 250ms instead of the web's 130ms, so every lift started a fifth of a second late. A sloppy press whose thumb rolled a little opened nothing, because the tolerances were about 8 to 10px instead of the web's 22px. The Resume and Start Reading buttons flew the cover out of the middle of the screen instead of the hero card, quick taps blanked the origin card into an empty slot, and the empty lifted slot still took taps (which could restart the animation mid flight), stayed visible to screen readers, and lacked the web's soft shadow and fade. This package fixed all nine of those, so the pickup feels snappy, sloppy presses still work, opens fly from the right place, tap opens never hide the card, and the lifted slot is inert and polished.\n\n## What changed\n\n### 1. Hold to pick up now commits at 130ms\n\nThe pickup used to commit at 250ms of hold on grid cards, search results, and the Today hero cover, a fifth of a second later than the web. Native `DEFAULT_HOLD_MS` is now `130` in `BookCard`, matching the web's `DEFAULT_HOLD_MS = 130`, and the hero cover uses the same shared gesture so it also picks up at 130ms. `SHELF_HOLD_MS` stays `400` for shelf and swimlane cards, and every shelf and swimlane call site still passes it, so a sideways swipe there still scrolls the shelf rather than lifting a book. This latency is the single most felt storefront gesture.\n\n### 2. Touch tolerance raised to 22px on both paths\n\nThe tap gesture used to fail past `maxDistance(10)` and the lift pan died once movement passed Android's internal touch slop of about 8dp, so a press whose contact patch rolled 10 to 22px opened nothing at all. Both paths now match the web's `DEFAULT_TOUCH_SLOP = 22`. The tap allows 22px of drift, and the lift is a manual activation pan that times the 130ms itself and only gives up if the finger wanders past 22px before the hold lands, so gesture handler's 8dp internal slop no longer kills a deliberate press. The save ribbon corner check (`inRibbon`) still vetoes both gestures so that corner toggles save instead. One platform ceiling remains: Android's own page scroller can still natively claim a touch that rolls mostly vertically past the OS slop before 130ms, and that exists on any Android app, outside what the gesture config controls.\n\n### 3. Resume and Start Reading open from the measured hero cover\n\nBoth buttons used to open the cover from `centerRect()`, a synthetic 110x165 rect in the middle of the window, so the cover always animated from mid screen instead of the hero card. The web always passes `heroOrigin()`, the hero cover's real on screen rect. Native now keeps the cover ref in `HeroResume` and `HeroPick` and passes it into `HeroCover`, so both buttons measure the real cover with `measureInWindow` and pass that rect to `open.begin`. `centerRect()` is now only the fallback when the ref is gone. Both buttons use the `kbd` slot id (see issue 6) so the hero cover never hides on these opens.\n\n### 4. Vibe hero's Start reading opens from the centered 110x165 rect\n\nNative's `startReadingMeasured()` used to measure the 84px rotated vibe cover and, on failure, fall back to a hardcoded `{ x: 40, y: 260, width: 84, height: 126 }`. The web opens this button from a viewport centered fallback, `new DOMRect(window.innerWidth / 2 - 55, window.innerHeight / 2 - 82.5, 110, 165)`, with no haptic. Native now begins the instant open from the shared `centerRect()`, which is `{ x: windowWidth / 2 - 55, y: windowHeight / 2 - 82.5, width: 110, height: 165 }`. The `measureInWindow` call and the `40,260` fallback are gone. The slot id changed from `` `vibe-pick:${heroPick.id}` `` to `` `kbd:${heroPick.id}` `` to match the web's instant open convention, the open still runs `instant: true`, and no haptic was added. The pick card underneath stays fully visible.\n\n### 5. Resume and Start Reading fire at 130ms of hold with no pressed dim\n\nNative's `Pressable onPress` used to fire only on release regardless of hold, and the pressed style dimmed the button to opacity 0.9, feedback the web button does not show. The web wires both `onPress` and `onActivate`, so a hold of 130ms opens the book while the finger is still down. A new `useHoldFire` hook now starts a 130ms timer on press in that opens while the finger is still down, an earlier release opens on release, and a fired flag that only rearms on a fresh touch guarantees exactly one open per press. The pressed opacity 0.9 dim is removed from both buttons, so they stay at `opacity: 1`; the accent background and shadow are unchanged.\n\n### 6. Quick tap opens no longer blank the origin card\n\nNative's `BookCard.beginInstant` and `HeroCover`'s tap used to call `open.begin` with the same physical slot id as the lift path plus `instant: true`, so `openingSlotId` matched and the card swapped to the empty slot (cover opacity 0, inset slot view, title and author dimmed to 0.4) on every tap open. On the web, instant opens use slot id `` `kbd:${book.id}` ``, which never matches any physical slot (`'hero'`, `'shelf:84'`), so nothing hides. Native's instant tap in `BookCard`, `HeroCover`'s tap, both hero buttons, and the vibe button now all begin with `` `kbd:${book.id}` ``, so the origin card or hero cover stays fully drawn under the flying cover. The empty inset slot now appears only during a genuine press and hold lift. The row slot ids were left alone as instructed, since `RecentRow` and `BookRow` never check `openingSlotId` and so already matched the web.\n\n### 7. The lifted empty slot is now inert and hidden from accessibility\n\nNative used to render the `GestureDetector` unconditionally, so the hidden empty slot still took taps and holds, and a press called `open.begin` again, resetting the pending transition mid flight and glitching openness back to 0 without unmounting. It also stayed accessible while hidden. Fresh touches on a hidden card now fail immediately in both gestures. This was not done with `.enabled(false)`, because flipping it mid gesture cancels the very pan doing the lifting; instead new touch downs are refused while the card is hidden, and gesture state lives in a ref so the handler swap when hiding does not drop the active touch. The lift pan now also tracks only the first pointer, so a second finger tapping the slot neither cancels nor restarts anything. For accessibility, the slot drops its `accessibilityRole` and `accessibilityLabel` while hidden, sets `accessible={!hidden}`, and adds `accessibilityElementsHidden={hidden}` plus `importantForAccessibility` set to `no-hide-descendants`, matching the web's `aria-hidden`.\n\n### 8. The empty slot gained the inset shadow, 0.2s fade in, and eased text dim\n\nNative's slot views had the fill `t.inkA(0.13)` and border `t.inkA(0.1)` but no inset shadow, appeared instantly, and jumped the title and author to opacity 0.4 with no transition. The web's slot is `bg-espresso/[0.13]` plus `ring-1 ring-espresso/10` plus an inset shadow `inset 0 3px 10px rgba(58,42,30,0.22)`, mounts with `animate-fade-in` (opacity 0 to 1 over 0.2s ease out), and fades the title, author, and badge to opacity 0.4 over the default 150ms. A new shared `EmptySlot` component (exported from `BookCard`, used by both `BookCard` and `HeroCover`) now mounts with `FadeIn.duration(200)` ease out and approximates the inset depression with a 10px `expo-linear-gradient` strip from `rgba(58,42,30,0.22)` to transparent, clipped by the slot's 3/12 corner radii (3 on the left corners, 12 on the right corners). The title, author, and badge now ease to 0.4 over 150ms with the web's `cubic-bezier` easing. The hero cover also now stays mounted at opacity 0 under the slot like the web, instead of unmounting.\n\n### 9. The rows' no measurement fallback uses the shared centered rect\n\n`useRowOpen`'s no node branch used to pass `{ x: 0, y: 0, width: 48, height: 72 }`, so a cover with no measurable ref would spring from the top left corner at a different start scale. The web substitutes `fallbackRect()`, a 110x165 rect centered in the viewport, for any opener that cannot capture a rect. `centerRect` moved into a new small module `src/open/centerRect.ts`, and `useRowOpen`'s no node branch now uses it. `TodayScreen`, `VibeScreen`, and `BookCard` import the same helper, so every no measurement open now originates from screen center like the web. This is a rare path, hit only when a cover ref is unexpectedly null.\n\n## Judgment calls\n\n- **Manual pan instead of LongPress for issue 2.** Android's `LongPress` cancels itself if the finger travels past `maxDistance` even after it activates, which would sever the finger follow mid lift, so a manual activation pan was used instead.\n- **Dropped `maxPointers(1)` from the lift pan.** Android cancels an active pan when a second pointer lands once `maxPointers` is exceeded, which would have cancelled the lift during the issue 7 test (a second finger tapping the empty slot). Touches are now filtered by the first pointer's id instead, and release and abort are driven from per pointer touch events, so a cancelled lift (for example the scroller stealing the touch) springs back to the slot instead of accidentally committing.\n- **Did not use `.enabled(!hidden)` for issue 7.** Disabling a handler cancels it while active, which would kill the lift the moment it begins. Refusing new touch downs while hidden achieves the same inertness safely.\n- **`centerRect` lives in a new file `src/open/centerRect.ts`** rather than inside `OpenTransition.tsx`, which the open-transition-internals package owns.\n- **Kept the vibe Start reading button's small pressed dim.** Issue 4 scoped its changes to the origin rect, slot id, and haptic only, so the button's existing pressed dim was left in place. This differs from the Resume and Start Reading buttons on the Today hero, whose dim was removed under issue 5.\n- **Platform caveat for testing.** The gestures now tolerate the full 22px roll, but Android's own scroll container can still claim a strongly vertical roll past roughly 8dp before the 130ms hold lands. That is an OS level ceiling, not a gesture config issue.\n\n## Check on your phone\n\n- [ ] Confirm: a still press on a grid card, a search result, or the Today hero cover starts lifting the book after about 130ms, noticeably quicker than before; shelf and swimlane cards still need the longer 400ms hold so sideways swipes scroll.\n- [ ] Confirm: a sloppy press where your thumb rolls a little still opens on a quick release or lifts on a hold instead of doing nothing; the save ribbon corner still toggles save.\n- [ ] Confirm: tapping Resume or Start Reading on the Today hero flies the cover open from the hero card's own position, not from the middle of the screen, and the hero cover never blinks out on a quick tap.\n- [ ] Confirm: on a vibe page, tapping Start reading pops the cover open from the exact center of the screen while the pick card underneath stays fully visible.\n- [ ] Confirm: holding Resume or Start Reading down opens the book while your finger is still on it, a quick tap opens on release, and the button never dims while pressed.\n- [ ] Confirm: a quick tap on any cover opens the book while the origin card stays fully drawn under the flying cover; the dented empty slot appears only when you actually press and hold to lift.\n- [ ] Confirm: press and hold a cover so it lifts, then tap the empty dented slot with another finger; nothing happens and the in flight open never restarts.\n- [ ] Confirm: when a lift begins, the empty slot fades in over about 0.2s with a soft shadow at its top, and the title, author, and badge dim smoothly to about 40 percent rather than snapping.\n\nEverything else in this package, including the shared `kbd` slot ids, the exported `centerRect` helper for the rows' rare no measurement fallback, and the hiding of the lifted slot from screen readers, was verified in code and by the independent adversarial review.\n","kicker":"Package 04"},{"id":"05","filename":"05-navigation-and-drawer-model.md","title":"Native parity 05: Navigation model, back handling, and drawer behavior","content":"# Native parity 05: Navigation model, back handling, and drawer behavior\n\n**Done.** Implemented and committed as `5de8738` on `feat/native-ui-web-parity`, 2026-07-13, independent review passed with no unresolved findings. This package rebuilt the native app's navigation so hardware back, drawer behavior, stack resets, and screen transitions all match the web app's one level deep model exactly.\n\n## What this fixed\n\nBefore this work, the native navigation drifted from the web in eleven ways. Hardware back popped the screen behind the open drawer instead of closing the drawer. Drawer Browse choices pushed onto whatever stack existed, so backing out could resurrect a Vibe or Results page the web would have discarded. The More pages carried a hamburger the web never shows there, opening a book from Stats left Stats in the stack, screens slid with the Android default animation where the web swaps instantly, and several smaller details (scroll reset, search box clearing, drawer active tab logic, easing curves, swipe dismiss, drawer spacing) sat off the web's values. The package brought all of these to parity. Today is now the single home, inner pages always back out to Today, More pages close back onto whatever was beneath them, and the drawer feels like the web's.\n\n## What changed\n\n### 1. Hardware back closes the open drawer\n\nHardware back had no drawer integration, so react-navigation's native-stack owned the back button and popped the screen behind the scrim (or exited the app when Today was the only route), leaving the drawer floating over a new screen. On the web the drawer is dismissed three ways, all funneled through `closeMenu()`, which fires `haptics.tick()`, animates the panel offscreen over `DRAWER_MS = 240` ms, then unmounts. MenuDrawer now registers a `BackHandler` while `menuOpen` is true and runs the same close path as the scrim tap: a haptic tick plus `setMenuOpen(false)` so the 240 ms slide out plays, returning `true` so the stack never pops and the app never exits beneath the drawer. `app.json` already sets `android.predictiveBackGestureEnabled: false`, so the BackHandler works reliably.\n\n### 2. Drawer Browse choices reset the stack\n\n`MenuDrawer.go()` called `navigationRef.navigate(route)` for Library and Notebook, which pushed onto the existing stack. From Today, then a Vibe page, then the drawer, then Library, the stack became [Today, Vibe, Library], so backing out returned to the Vibe page first. The web runs `haptics.tick(); clearResults(); setActiveTab(key); closeMenu()`, discarding any open vibe or results page so one back press lands on Today. Library and Notebook now reset the stack to [Today, tab]:\n\n```ts\nnavigationRef.reset({ index: 1, routes: [{ name: 'Today' }, { name: route }] });\n```\n\nOne back press always lands on Today and any Results or Vibe screens are dropped, exactly like `clearResults()` on web. Today keeps its single route reset, and the More routes (Stats, Settings, About) stay plain pushes, which already matches the web's overlay pop behavior.\n\n### 3. Stats, Settings, and About lost the hamburger\n\nAll three More screens passed `onMenu={() => { haptics.tick(); setMenuOpen(true); }}` to InnerPageHeader, rendering a hamburger the web never allows there. On the web the More pages render InnerPageHeader without the `onMenu` prop and show only [back][title]. The `onMenu` prop was removed from the Stats, Settings, and About headers, and the now unused `setMenuOpen` lines were cleaned up (AboutScreen also dropped its whole `useStore` import). Library, Notebook, Results, Vibe, and the reader keep their hamburgers. As a side effect the drawer is no longer reachable from More pages, which also removed the odd state where no Browse item was highlighted on those routes.\n\n### 4. Per screen transitions: instant swaps and a 200 ms fade\n\nThe Stack.Navigator set only `headerShown: false`, so every screen got the Android native-stack default animation (a system slide and fade of roughly 300 to 400 ms) on push and pop, and the reader's `animation: 'fade'` also played on pop, fading where the web is instant. The web has three treatments: Library, Notebook, results, and vibe swap with no transition (the only motion is scroll resetting to top); Stats, Settings, and About mount with `animate-fade-in`, which is `fadeIn 0.2s ease-out` (opacity 0 to 1, 200 ms) and unmount instantly; the reader is an instant viewMode swap covered by the book open overlay. Library, Notebook, Results, Vibe, and Reader now use `animation: 'none'` (instant swap; the open overlay covers reader entry). Stats, Settings, and About use `animation: 'fade'` with `animationDuration: 200`. Note that `animationDuration` may be ignored on some Android versions of the native-stack fade, but the system fade already sits close to 200 ms, which the prompt accepted.\n\n### 5. Scroll to top when backing out to Today\n\nEach native screen owned a fresh ScrollView, so inner pages opened at their top but popping back restored the previous screen exactly as left, keeping the old Today scroll offset. The web runs a `useLayoutEffect` calling `window.scrollTo(0, 0)` whenever `mode` or `activeTab` changes, so backing out always lands on Today scrolled to the very top. TodayScreen now adds a navigation focus listener that skips the first mount and scrolls its PageShell ScrollView to `y: 0` without animation on every return visit, including returns from the reader (which also matches web, where the storefront remounts fresh).\n\n### 6. Today search box empty after returning from Results\n\nTodayScreen held its own `query` state and stayed mounted beneath Results, and `submitSearch` navigated without clearing, so after backing out the Today pill still showed the stale query with the clear X visible. On the web, backing out of results calls `clearResults()`, which runs `setQuery('')` so the Today header search box is always empty (placeholder \"Search Focus Reader\", no X button) when the user lands back home. `submitSearch` now clears the query right after navigating to Results. Results still prefills its own box from `route.params.query`, matching the web's shared query state.\n\n### 7. Opening a book from Stats pops Stats first\n\nStatsScreen rendered `<RecentRow key={r.bookId} r={r} />` with no way to customize the open action, and `OpenTransition.tsx` did `navigationRef.navigate('Reader', ...)`, pushing Reader on top of Stats so backing out of the reader returned to Stats. On the web each \"Reading now\" RecentRow gets a custom onOpen that runs `setStatsOpen(false)` before `onOpenBookInstant`, closing the Stats overlay before the book opens so exiting the reader lands on whatever page Stats had covered. RecentRow gained an optional `beforeOpen` prop that runs after the cover rect is measured but before `open.begin`, and StatsScreen passes `navigation.goBack` there. The cover flight starts from the real row rect, Stats leaves the stack, and exiting the reader lands on whatever was beneath Stats. Other RecentRow call sites are untouched, and `OpenTransition.tsx` itself needed no change.\n\n### 8. Drawer marks Today active when opened from a Vibe page\n\nThe native active check was `active = activeRoute === key || (key === 'Today' && activeRoute == null)`, so on a Vibe route no Browse item was highlighted. On the web active state is `mode !== 'results' && activeTab === t.key`, and a vibe page is `mode='vibe'` with `activeTab` still `'today'`, so the drawer shows Today highlighted (cream card, coral border, 2.4 stroke icon, trailing Check); only `mode='results'` shows no active tab. The check now treats the Vibe route as Today, exactly the expression from the prompt:\n\n```ts\nconst active = activeRoute === key || (key === 'Today' && (activeRoute == null || activeRoute === 'Vibe'));\n```\n\n### 9. Drawer and header animation easing curves\n\nAll the drawer and header timings used `withTiming` with no easing argument, which defaults to `Easing.inOut(Easing.quad)`, so the native drawer started slower and landed harder than the web's decelerate curve. The durations already matched (240 ms panel, 200 ms scrim in, 240 ms scrim out, 300 ms header collapse); only the curves were off. Easing is now passed explicitly:\n\n- `Easing.bezier(0.2, 0.8, 0.25, 1)` for the drawer panel's open, close, swipe commit, and swipe snap back (the web panel slides with `transform 240ms cubic-bezier(.2,.8,.25,1)`, the house curve, in both directions).\n- `Easing.out(Easing.quad)` for the scrim fade in (web `fadeIn 200ms ease-out`) and the InnerPageHeader collapse (web `duration-300 ease-out`).\n- `Easing.bezier(0.25, 0.1, 0.25, 1)`, the CSS `ease` equivalent, for the scrim fade out (web `opacity 240ms ease`).\n\n### 10. Drawer swipe dismiss details (partial)\n\nThe native pan used `Gesture.Pan().activeOffsetX(12).failOffsetY([-16, 16])` and a committed swipe close called `runOnJS(setMenuOpen)(false)` with no haptic. The web ignores pointer down on `'button, input, [role=\"button\"], a, label, select, textarea'`, claims the gesture only after dx exceeds 8 px rightward, bails if the move is vertical dominant (`|dy| > |dx| + 4` and `|dy| > 8`) or leftward past 8 px, and commits close if dx exceeds 35% of panel width or average velocity exceeds 0.5 px per ms, always firing `haptics.tick()` before the 240 ms slide out. The commit thresholds already matched (`translationX > 0.35 * panelW`, `velocityX > 500` px per s, which is 0.5 px per ms). The core fixes were applied: `runOnJS(haptics.tick)()` on the swipe commit branch and `activeOffsetX` lowered from 12 to 8. The two parts the prompt marked optional were skipped: the exact vertical dominance bail (gesture-handler cannot express the relational comparison declaratively, and the existing `failOffsetY` window of plus or minus 16 approximates it) and refusing pans that begin on interactive rows (would need manual touch target inspection with real regression risk to row taps).\n\nWeb quirk worth knowing: selecting a Browse or More item on web double ticks (the item handler ticks, then closeMenu ticks again about 0 ms later, effectively one buzz at 5 ms vibrations); native `go()` single ticks, which matches the intent, so no change was made there.\n\n### 11. Drawer MORE label spacing, active row shadow, and cleanups\n\nThe MORE label had `marginTop: 8` and inherited groupLabel's `marginBottom: 12`, leaving only 36 px from the last tab row and 12 px to the first More row, and the active tab row had no shadow. On the web the \"More\" label has `mt-7 mb-2` (28 px above, 8 px below), and with the Browse tab list's `mb-7` (28 px) above it, 56 px separate the last tab row from the MORE label; the active Browse tab row is `bg-cream ring-coral-accent/50 shadow-sm` with a `0 1px 2px rgba(0,0,0,0.05)` drop shadow. The MORE label is now `marginTop: 28`, `marginBottom: 8`. The active Browse row carries a hairline shadow matching `shadow-sm`: `shadowOpacity: 0.05`, `shadowRadius: 2`, `shadowOffset: { width: 0, height: 1 }`, `elevation: 1`. The drawer scroll content bottom padding became `Math.max(24, insets.bottom + 8)` so the About row clears the Android gesture navigation band on edge to edge devices. The dead `src/components/InnerHeader.tsx` (zero importers) was verified unreferenced and deleted.\n\n## Judgment calls\n\n1. Issue 6: chose the `setQuery('')` right after navigate option rather than a focus listener, since Results swaps in with no animation so the clear is invisible and it cannot accidentally clear while the user is typing.\n2. Issue 7: implemented `beforeOpen` so it runs after the cover rect is measured but before `open.begin`, otherwise popping Stats first would unmount the row and lose the rect the cover flight starts from.\n3. Issue 4: kept `animationDuration: 200` on the three fade screens as the prompt specified, accepting the symmetric pop fade rather than building self fading mounts for exact asymmetry.\n4. Issue 10: skipped the optional exact vertical dominance bail and the interactive row pan exclusion, as noted above.\n5. Reader animation set to `none` for both push and pop per the prompt; the book open overlay covers the entry visually.\n6. The package 03 cover inks decision needed no action here: `BookCover.tsx` already has `onTint = t.surface` from the earlier package, and this package touches no cover ink code.\n\n## Check on your phone\n\n- [ ] Confirm: with the drawer open on any screen, pressing hardware back plays a haptic tick and slides the drawer closed over about 240 ms; the screen beneath never changes and the app never exits.\n- [ ] Confirm: from Today, open a Vibe page, open the drawer, tap Library; one back press lands on Today with the Vibe page gone. Same for Notebook.\n- [ ] Confirm: Stats, Settings, and About headers show only the back button and title, with no hamburger on any of the three.\n- [ ] Confirm: entering or leaving Library, Notebook, Results, or Vibe swaps instantly with no slide; Stats, Settings, and About fade in over about 200 ms; leaving the reader plays no fade.\n- [ ] Confirm: scroll deep on Today, descend into an inner page, back out, and Today is scrolled to the very top.\n- [ ] Confirm: search something from Today, then back out of Results, and the Today search box is empty with its placeholder showing and no clear X.\n- [ ] Confirm: open a book from the Stats page's \"Reading now\" list, then exit the reader, and you land on the screen that was beneath Stats, not on Stats.\n- [ ] Confirm: open the drawer while on a Vibe page and the Today row is highlighted (cream card, coral border, bolder icon, trailing check).\n- [ ] Confirm: the drawer opens and closes with a fast start and gentle settle, and a committed swipe dismiss fires a haptic tick.\n\nEverything else in this package was verified in code and by review.\n","kicker":"Package 05"},{"id":"06","filename":"06-reel-engine-playback-core.md","title":"Reel engine playback correctness: match web's useRSVP state machine","content":"# Reel engine playback correctness: match web's useRSVP state machine\n\n**Done.** Implemented and committed as `0bfbcde` on `feat/native-ui-web-parity`, 2026-07-13, independent review passed with no unresolved findings. This package brought the native reader's core playback engine (`src/reader/useReelEngine.ts`) into line with the web app's `useRSVP` hook and kinetic scrubber, closing six behavior gaps in how words advance, dwell, and hand off between playing and scrubbing.\n\n## What this fixed\n\nBefore this pack, the native engine merged playback and scrubbing into one worklet but diverged from the web on six behaviors. The headline bug: seeking during playback silently froze word advancement while the button still showed the Pause icon, so the user had to tap play twice to recover. Alongside it, a `dragging` flag could stick true after a tap or failed pan and keep the reel on its heavyweight interacting path, the final readable word got zero dwell time, changing speed mid playback did not restart the current word, the OS reduce motion setting was ignored, and catching a coasting reel re-gripped from a fractional position instead of the committed whole word. All six are now committed, and the deliberate divergence around a controls seek beating a coasting fling is kept and documented in a code comment. Every change lives in the native repo; the web app was the read only source of truth.\n\n## What changed\n\nThe feel constants stayed verbatim throughout: FRICTION_K 0.0035, HANDOFF_V 0.004, MAX_V 0.4, SETTLE_MS 260, easeOutCubic, the 64ms frame delta cap, and clamp at bounds with velocity zeroed. Only the six behaviors below changed. All edits landed in `src/reader/useReelEngine.ts`.\n\n### 1. Seek during playback keeps words flowing, Pause icon stays correct\n\nBefore, `useReelEngine.seek()` set `mode.value = 0` (idle) but never called `setPlaying(false)`, so if mode was 1 (playing) the frame loop's play branch stopped: words froze, the `playing` React state stayed true, the Controls button kept showing the Pause icon, and `useImmersive` kept treating the reader as playing. The web's `useRSVP.seek(index)` only clamps the index, sets `currentIndex` and `indexRef`, and resets `accumulatedTimeRef` to 0; it never touches `isPlaying`, and its rAF loop is keyed to `isPlaying`, so playback continues seamlessly at the new spot with the new word getting its full delay.\n\n`seek()` now leaves mode 1 alone when playing: it moves `pos.value` to the clamped target and resets `acc.value = 0`, exactly like the web, and still drops fling or settle (mode 2 or 3) to idle. Sentence skips (prev and next sentence buttons wired in `src/reader/ReaderChrome.tsx`), word taps (paragraph words call `onSeek(tok.id)` in `src/reader/displays.tsx`; the sentence strip passes `onWordPress={engine.seek}` in `src/screens/ReaderScreen.tsx`), and swipe skips during playback all now continue reading from the new index. Only explicit pause, `togglePlay`, and the AppState listener ever flip `playing`. The Controls progress bar drag was left alone because it already pauses explicitly before seeking, matching web.\n\n### 2. Stuck `dragging` flag after a tap or failed pan\n\nBefore, `pan.onBegin` set `dragging.value = true` at touch down, and only `pan.onEnd` reset it. `onEnd` never fires when a pan is cancelled or fails (a tap wins the Race, or a horizontal move trips `failOffsetX([-24, 24])`), and there was no `onFinalize`, so `dragging` stuck true and the frame loop pinned `interacting` true forever. That kept the reel mounting its whole nine row neighbour window and firing a redundant per word `setReel` state push during playback, a hot path churn that breaks the documented invariant of rendering just the centred word at rest and during playback. The web shows only the centred word whenever the user is not scrubbing: an effect syncs `frac` to `currentIndex` with speed 0, so `motion = min(1, speed / 0.02) = 0` (NEIGHBOR_FULL_SPEED is 0.02) and every neighbour renders at `opacity = distanceFade * motion = 0`.\n\nAdded `pan.onFinalize(() => { 'worklet'; dragging.value = false; })` to the scrub gesture. `onFinalize` fires for completed, cancelled, and failed gestures, so a tap or failed pan can no longer leave `dragging` and `interacting` stuck. Verified in `displays.tsx` that `useReelFrame` then mounts only the centred row with no per word `setReel` pushes during playback. The web's own tap quirk (its `onUp` tap path returns without firing `onSettle`, so `RSVPDisplay`'s `scrubbing` ref sticks true) was deliberately not replicated; the parity target is the intended invariant both codebases document, not the web's accidental freeze.\n\n### 3. Final readable word gets its full dwell, and play works at the readable end\n\nBefore, the play branch checked `if (i >= endSV.value)` at the top of the frame, so the moment `pos` reached `effectiveEnd` it flipped to paused with zero dwell on the final word (its 3x sentence end pause was never served), and the chrome popped back in while the last word barely flashed. And `togglePlay` refused to start unless `cur < effectiveEnd`, so play did nothing at or past the readable end. The web's tick only ends playback inside the `accumulatedTime >= wordDelay` branch, so the token at `effectiveEnd` is displayed for its full delay (base times multiplier, for example 3x for a closing period, DELAY_SENTENCE_END = 3.0) before `setIsPlaying(false)` and `onComplete` fire; the web's `play()` is guarded by `currentIndex < tokens.length - 1` (the raw last token, not `effectiveEnd`), so at the readable end pressing play shows the word for one delay then auto pauses.\n\nMoved the end check inside the `acc >= wordDelay` branch: the word at (or past) `effectiveEnd` accumulates its full delay, including the 3x sentence end multiplier, before mode drops to 0 and `setPlayingJS(false)` fires. The `togglePlay` guard changed from `cur < effectiveEnd` to `max > 0 && cur < max`, matching the web's `play()` which blocks only at the raw last token; the `max > 0` part mirrors the web's `tokens.length > 0` so play stays blocked while the parse is still empty.\n\n### 4. WPM change during playback restarts the current word's dwell\n\nBefore, a WPM change only wrote `baseDelay.value` (`useEffect(() => { baseDelay.value = wpmToDelay(wpm); }, [wpm, baseDelay])`); `acc.value` kept its accumulated time, so the current word's remaining dwell became the new delay minus `acc` and words kept flowing while the user tapped plus or minus. The web makes `wpm` a dependency of the tick callback, and the start and stop effect re-runs on a WPM change (cancelAnimationFrame, `lastTimeRef = 0`, `accumulatedTimeRef = 0`, new rAF), so the word on screen gets a fresh full delay at the new rate.\n\nThe existing wpm effect now also resets `acc.value = 0` when `mode.value === 1`, so each plus or minus tap gives the on screen word a fresh full delay at the new rate, like the web's loop restart. Only observable while playing and adjusting speed.\n\n### 5. OS reduce motion setting honored\n\nBefore, the fling (mode 2, exponential friction) and the 260ms easeOutCubic settle (mode 3) always ran regardless of Android's Remove animations accessibility setting; the pan's `onEnd` always routed into mode 2 or 3. The web's `prefersReducedMotion()` checks `matchMedia('(prefers-reduced-motion: reduce)')`, and on release, if reduced moti
