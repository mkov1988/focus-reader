a id: `chrome-open-error-flow-divergence`. Severity: medium. This overlaps issue 2; coordinate so the flow is not double fixed.\n\nWeb (`src/App.tsx:170-217`, `373-384`; `src/components/Reader/BookOpenTransition.tsx:344-353`, `416-424`): fetch and parse happen during the open transition; on failure the transition fires `haptics.error()` and cancels back to the storefront, then the dismissible error card from issue 2 appears. There is no retry affordance and the reader never mounts. The reader itself has no loading screen; loading lives inside BookOpenTransition's 'Brewing your book…' badge over the storefront.\n\nNative (`src/screens/ReaderScreen.tsx:56-70`, `154`, `226-254`): navigation commits to ReaderScreen before content resolves. While loading it shows a full screen page: a pill badge with ActivityIndicator plus 'Brewing your book…' and the book title beneath, plus a bare '‹' back glyph. On error it swaps to serif \"Couldn't open that book.\" (19px Fraunces medium), the message in italic 13px Fraunces, and a coral 'Try again' pill that re-runs `fetchContent` via `setAttempt`, with `haptics.error()` fired on error (line 154).\n\nChange: match the web flow. With issue 1 fixed, transition driven opens never reach ReaderScreen before content is ready, so this path only fires on cold mounts. On a ReaderScreen fetch failure: fire `haptics.error()` (web does too), return the user to the previous screen (`navigation.goBack()`, falling back to navigating to `Today` if there is nothing to go back to), and show the same persistent dismissible error card from issue 2 with the error detail. Remove the full screen error page and the 'Try again' pill entirely. Keep the plain loading view (badge plus title) for cold mounts only, per issue 1.\n\n### 4. Instant opens must not clamp the anchor to the viewport\n\nDelta id: `transition-instant-anchor-clamp`. Severity: medium.\n\nWeb (`src/components/Reader/BookOpenTransition.tsx:142-149`, `210-217`): in `autoCommit` mode the anchor is initialised to the tracking rect centre, raw and unclamped, and the tick only eases and clamps the anchor toward the finger while `phase === 'tracking'`; opens that mount already committed never move or clamp it. Tapping a Library row whose 48px cover sits at an x centre of about 58 makes the 180x270 cover expand centred on that point, hanging about 32px off the left edge of the viewport. `clampToViewport` (half cover plus a 12px margin) applies only to finger following during gesture tracking.\n\nNative (`src/open/OpenTransition.tsx:117-132`): `begin()` with `instant: true` clamps:\n\n```ts\nconst anchored = opts.instant ? clampToViewport(cx, cy) : { x: cx, y: cy };\n```\n\nso the same row tap expands the cover fully on screen, shifted right and down relative to the web position.\n\nChange: for instant opens set the anchor to the raw origin centre without clamping, i.e. `const anchored = { x: cx, y: cy };` regardless of `opts.instant`. (The audit noted the native clamp is arguably nicer, but web is the source of truth; if you think it should be ported back to web instead, say so in your summary, do not act on it.)\n\n### 5. Freeze all cover motion the instant the closing fade starts\n\nDelta id: `transition-close-motion-not-frozen`. Severity: medium.\n\nWeb (`src/components/Reader/BookOpenTransition.tsx:355-377`): the closing effect cancels the requestAnimationFrame loop before applying the CSS fade: `cancelAnimationFrame(rafRef.current)` then transition `opacity 240ms ease-out` on the wrap and scrim. The cover freezes wherever the spring had reached (for a cached or bundled book that loads in about 50ms, that is barely above the slot, openness around 0.1 to 0.3) and fades out in place.\n\nNative (`src/open/OpenTransition.tsx:238-267`, `275-287`): the `useFrameCallback` keeps integrating the spring through phase 2 (closing): openness keeps moving toward target. Gesture commits froze target at the commit openness so drift is negligible, but instant opens have target = 1, so when load resolves before the spring settles the cover continues expanding and translating toward the screen anchor for the whole 240ms fade. Most visible on the three bundled books and any cached book, the most common tap open case after a first read.\n\nChange: when phase enters 'closing', stop mutating openness. Either set `target.value = openness.value` and `velocity.value = 0` in the closing effect (before or alongside `phaseSV.value = 2`), or guard the spring integration in the frame callback with `if (phaseSV.value < 2)`. Either way the cover must fade out frozen in place exactly like the web.\n\n### 6. Faux page text must be dashed word strips, not solid ruled lines\n\nDelta id: `transition-fauxtext-solid-lines`. Severity: medium.\n\nWeb (`src/components/Reader/BookOpenTransition.tsx:451-504`): each 2px line is a repeating gradient of ink dashes: `repeating-linear-gradient(90deg, ink 0 {wordPx}px, transparent {wordPx}px {wordPx + 2.4}px)` with `wordPx = 3.6 + ((row * 3) % 4) * 0.5` varying per row so dashes do not grid align; `ink = 'rgba(74,55,40,0.32)'`; line width is `calc(w% - indentPx)` with a 7px `marginLeft` indent on each paragraph's first line. The component comment states the text is deliberately broken, not solid ruled lines.\n\nNative (`src/open/OpenTransition.tsx:351-376`, `421`): lines are solid Views: backgroundColor ink at full width `${w}%` (indent not subtracted, so first lines extend 7px further right than web) with `opacity: 0.75 + ((row % 3) * 0.06)` as a stand in for the dash variation. No word gaps at all. (Native also increments `row` before computing opacity, but that variation is being removed anyway.)\n\nChange: render each line as a row of small dash Views reproducing the web pattern: dash width `wordPx = 3.6 + ((row * 3) % 4) * 0.5`, 2.4px gap between dashes, 2px height, borderRadius 999, constant color `rgba(74,55,40,0.32)`. Remove the opacity variation entirely. Handle the indent so first lines end at the same right edge as web: a container of width `${w}%` with `paddingLeft: 7` and `overflow: 'hidden'` reproduces web's `calc(w% - 7px)` width plus `marginLeft: 7` exactly (dashes start 7px in, right edge lands at w% of the column). Render enough dashes to overfill and let `overflow: 'hidden'` clip, since RN has no repeating gradient. Keep everything that already matches: paragraph line widths `[97, 92, 95, 67]`, `[94, 90, 96, 85, 51]`, `[92, 88, 94, 60]`, the heading mark (centred, 46% width, 3px height, opacity 0.9, marginBottom 9), gap 5 between lines, 8px paragraph spacing, and container insets (top and bottom 14%, left 39%, right 9%, at `s.fauxWrap` line 421).\n\n### 7. Skip the 'committed' phase when content is already loaded at release\n\nDelta id: `transition-committed-badge-flash`. Severity: low.\n\nWeb (`src/components/Reader/BookOpenTransition.tsx:287-301`): `onUp` checks a ref mirror synchronously: `setPhase(loadedRef.current ? 'closing' : 'committed')`. If the fetch and parse finished while the finger was still down, the badge is never rendered; the fade begins immediately on release.\n\nNative (`src/open/OpenTransition.tsx:161-173`, `270-272`): `release()` unconditionally sets phase 'committed' (and `phaseSV.value = 1`); the `loaded && phase === 'committed'` effect then flips to 'closing' after the commit render paints, so the badge row mounts and can flash for a frame or two.\n\nChange: in `release()`, read the current loaded state synchronously (add a ref mirror of `loaded` in the provider, as the web does with `loadedRef`; the `loaded` state variable itself is stale inside the callback) and when already loaded go straight to 'closing' with `phaseSV.value = 2`, bypassing 'committed'. Still freeze the cover (`target.value = openness.value`) on that path, consistent with issue 5.\n\n### 8. Replace the ActivityIndicator with a spinning 14px Loader2\n\nDelta id: `transition-badge-spinner-icon`. Severity: low.\n\nWeb (`src/components/Reader/BookOpenTransition.tsx:416-424`): the badge is `bg-cream/95 rounded-full px-4 py-2` with 8px gap, `ring-1 ring-espresso/10 shadow-lg`, fixed 40px from the bottom, centred, containing lucide `Loader2` at size 14 in `text-coral-accent` with `animate-spin` (1s linear infinite rotation) plus 'Brewing your book…' at 12px font medium espresso.\n\nNative (`src/open/OpenTransition.tsx:339-346`, `413-420`): same container metrics (`t.paperA(0.95)`, border `t.inkA(0.1)`, padding 16/8, gap 8, bottom 40, radius 999) and identical copy and typography, but the spinner is `<ActivityIndicator size=\"small\" color={t.accent} />`, Android's material arc at about 20dp, a different glyph, size, and motion.\n\nChange: replace the ActivityIndicator with lucide-react-native's `Loader2` at size 14 in `t.accent`, wrapped in a reanimated view spinning 360 degrees per second, linear, infinite (`withRepeat(withTiming(360, { duration: 1000, easing: Easing.linear }), -1)` driving a rotate transform). Apply the same swap to the ReaderScreen loading badge (ReaderScreen.tsx:234-237) if that view survives issues 1 and 3.\n\n### 9. Verify the cover scaling model coincides at rest\n\nDelta id: `transition-cover-scaling-model`. Severity: low. This one is verify first, change only if needed.\n\nWeb (`src/components/Reader/BookOpenTransition.tsx:152-170`; `src/components/Input/BookCover.tsx:143-172`): `apply()` resizes the layout box each frame (`wrap.style.width/height = COVER_W * scale`) and positions with translate3d only, no scale transform. The BookCover re-lays-out at the current size, so its 12px right radius, 1px ring, stitch inset, and text sizes are constant CSS pixels at every openness; at openness 0 the floating cover is pixel identical to the md card cover it replaces.\n\nNative (`src/open/OpenTransition.tsx:293-308`; `src/components/BookCover.tsx:58-91`): the wrap is a fixed 180x270 render transform scaled about its centre (translateX, translateY, then scale). Centre point math matches the web exactly, but constant pixel details scale: at a 144px card the radii render at 12 * 0.8 = 9.6px and borders at 0.8px, diverging slightly from the card underneath at pickup and from web mid flight. Native cover type is width proportional (BookCover.tsx:77-79), so the scaled type coincidentally matches the card at openness 0 but grows toward 180px sized type at full open, where web type stays fixed.\n\nChange: geometry (position and size envelope) already matches; this is only the interior constant pixel details. Layout animating width and height on the UI thread is more expensive in RN than a transform scale, so do NOT switch wholesale. Instead: reason through (and let Michael eyeball on device) whether the openness 0 overlay visually coincides with the card cover it replaces. If a visible seam exists at pickup, counter scale the radii and border widths (divide by the current scale inside the animated style) rather than animating layout. If it coincides at rest, leave the model as is and note the residual mid flight divergence in your summary.\n\n### 10. Reader screen navigation animation should be 'none'\n\nDelta id: `transition-reader-nav-fade`. Severity: low.\n\nWeb (`src/App.tsx:196-211`, `228-231`; `src/components/Reader/BookOpenTransition.tsx:366-376`): `onComplete` fires exactly `CLOSE_FADE_MS = 240` ms after closing starts and synchronously sets viewMode 'READING': the storefront unmounts and the fully parsed reader appears the same frame. Total handoff is the 240ms fade, nothing more. Exiting the reader (back, swipe down) is likewise an instant swap back to the storefront with no animation.\n\nNative (`App.tsx:81-85` in the native repo root; `src/open/OpenTransition.tsx:275-287`): the same 240ms timer calls `navigationRef.navigate('Reader')`, but the Reader screen is registered with `options={{ animation: 'fade' }}`, adding the native stack fade (roughly 350ms default on Android) on top before the reader is fully visible; goBack from the reader plays the reverse fade, which the web does not have.\n\nChange: set the Reader screen's options to `{ animation: 'none' }` so it appears and disappears instantly after the cover fade. Note the native root `App.tsx` is currently clean in git, but `app.json` nearby is dirty from the other session; touch only the screen options line.\n\n## Acceptance checklist\n\n- [ ] 1. Opening a book via the transition lands in a fully rendered reader the frame the 240ms fade completes; the ReaderScreen 'Brewing your book…' loading view never appears on transition driven opens (only on cold mounts), because `setLoaded(true)` now fires after `parseText` plus scene chapter mapping, and ReaderScreen consumes the cached ParsedText.\n- [ ] 2. A failed open springs the cover back, and only after the spring settles shows a persistent bottom card (cream surface, 16px radius, accent border at 30% alpha, zIndex >= 90) reading \"Couldn't open that book.\" in bold 13px with the real error detail in italic below and a 16px X that is the only way it goes away; no transient toast pill fires for this path.\n- [ ] 3. ReaderScreen has no full screen error page and no 'Try again' button; a cold mount failure fires haptics.error(), goes back, and shows the same dismissible error card.\n- [ ] 4. An instant open (quick tap) expands the cover centred on the raw origin centre; tapping a Library row near the screen edge lets the open cover hang off screen exactly as the web does, with no viewport clamp.\n- [ ] 5. When the closing fade starts, the cover freezes in place; a fast loading bundled or cached book fades out barely above its slot instead of continuing to fly toward full open during the 240ms.\n- [ ] 6. Holding a book past roughly 55% open shows faux page text made of small dashes (dash width 3.6 to 5.1px varying per row, 2.4px gaps, 2px tall, constant ink rgba(74,55,40,0.32), no per row opacity variation) with first lines indented 7px and ending at the same right edge as other lines.\n- [ ] 7. Releasing a held book whose text already finished loading goes straight to the fade with no 'Brewing your book…' badge flashing for a frame.\n- [ ] 8. The brewing badge (and any surviving ReaderScreen badge) uses a 14px Loader2 icon in the accent color rotating once per second linearly, not the platform ActivityIndicator.\n- [ ] 9. The cover scaling model was verified: at openness 0 the floating cover visually coincides with the card cover, or radii and borders were counter scaled to make it so; the decision and reasoning appear in the summary.\n- [ ] 10. The Reader screen is registered with `animation: 'none'`; total open handoff is the 240ms cover fade with no extra stack fade, and backing out of the reader swaps instantly.\n\n## Verification\n\n1. Type check the native repo: run `npx tsc --noEmit` in `C:/Users/Michael/Desktop/Focus Reader Android`. Fix any errors you introduced.\n2. Reason through the running behavior carefully for each delta: the phase state machine ('tracking' → 'committed' → 'closing', or → 'cancelling'), the shared value phases (0 through 4), what the frame callback does in each, and the order of setLoaded, parse, fade, navigate. Walk the three open paths (hold and release inside, hold and release outside, quick tap) plus the failure path end to end on paper.\n3. Do NOT use the Expo web build to verify anything. Its dev server opens blank localhost tabs in the real browser and the web bundle breaks on zustand's import.meta. On device checking is done by Michael on his Android phone.\n\nEnd your summary by telling Michael exactly what to look at on his phone, in plain everyday English. Cover at least these checks:\n\n- Tap a book you have read before. The cover should freeze and melt away where it is, not keep growing while it fades, and the reading page should be there the instant the cover is gone, with no extra fade and no brewing message inside the reader.\n- Turn on airplane mode and tap a book you have never opened. The cover should slide back to its shelf first, then a cream card should appear at the bottom saying it could not open the book, with the actual reason in smaller italic text and a little X. The card should stay until the X is tapped. There should be no Try again button and no error page.\n- In the Library list, tap a book in a row near the left edge. The opened cover is allowed to hang off the edge of the screen, that matches the web.\n- Press and hold a book until the page peeks out. The fake text on the page should look like rows of tiny dashes, like blurred words, not solid drawn lines.\n- Keep holding a slow book until the brewing pill appears. The spinner should be a thin coral line icon spinning smoothly, small, not the standard Android spinner.\n- Hold a book for a few seconds so it finishes loading, then let go. It should fade out right away without the brewing pill blinking on screen first.\n\n## Final note\n\nWhen summarizing work for Michael, use plain everyday language and avoid dashes in prose. Restructure sentences with commas or periods instead.\n\n---\n\n## Outcome, recorded 2026-07-13\n\nImplemented in commit `61d1926` on `feat/native-ui-web-parity` in the native repo.\n\nFiles changed: `App.tsx`, `src/components/BookCover.tsx`, `src/components/OpenErrorCard.tsx`, `src/components/Spinner.tsx`, `src/open/OpenTransition.tsx`, `src/screens/ReaderScreen.tsx`, `src/services/library.ts`, `src/store.ts`.\n\n### Issue by issue\n\n**1. Close the transition on parse completion, not download completion** (done)\n\nbegin() now parses the downloaded text and applies the scene to chapter mapping while the cover is still up, stashes the ParsedText in library.ts (stashParsed/consumeParsed, cleared on consumption), and only then sets loaded. ReaderScreen consumes the stash on mount so it renders fully formed the frame the fade ends; the fetch plus parse path remains only as a cold mount fallback. A cancelled open skips the parse so nothing stale is stashed.\n\n**2. Persistent dismissible error card after the cancel spring settles** (done)\n\nThe rejection handler keeps haptics.error() and the cancel, drops the toast, and parks the real error message (fallback 'Could not open that book.') in a ref. clear(), which runs from finishCancel after the spring settles, promotes it to new store state openError. New OpenErrorCard component matches the web card: surface background, radius 16, accent border at 30 percent alpha, shadow, 16/12 padding, bottom 24 plus safe inset, maxWidth 384, width screen minus 32, zIndex 90, bold 13px headline, italic muted detail, 16px X dismiss. begin() dismisses any lingering card, same as the web.\n\n**3. Remove ReaderScreen's full screen error page and Try again** (done)\n\nError page, Try again pill, error/attempt state, and the error haptic effect are gone. A cold mount fetch failure fires haptics.error(), shows the same persistent card via the store, and goes back (falls back to navigating to Today when there is nothing to go back to). The loading badge view survives for cold mounts only.\n\n**4. Instant opens must not clamp the anchor** (done)\n\nbegin() now always anchors on the raw origin centre; the provider's clampToViewport helper was removed. The finger follow clamp inside the frame callback (tracking phase only) is untouched, matching the web.\n\n**5. Freeze all cover motion when the closing fade starts** (done)\n\nSpring integration in the frame callback is guarded with phaseSV.value !== 2, and the closing effect (plus the loaded at release fast path) also sets target = openness and velocity = 0. Note: the prompt suggested a 'phaseSV.value < 2' guard, but that would also freeze the cancel spring (phase 3), so the not equal 2 form was used.\n\n**6. Faux page text as dashed word strips** (done)\n\nEach line is now a clipped row of small dash Views: dash width 3.6 + ((row*3)%4)*0.5 computed before the row increment (matching the web's sequence exactly), 2.4px gaps, 2px tall, radius 999, constant rgba(74,55,40,0.32), no opacity variation. First lines use a container of w% with paddingLeft 7 and overflow hidden so the right edge lands at w% like the web's calc. Heading mark, line widths, gaps, paragraph spacing, and insets unchanged.\n\n**7. Skip 'committed' when content is already loaded at release** (done)\n\nA loadedRef mirror is set with setLoaded and read synchronously in release(); when already loaded the phase goes straight to 'closing' with phaseSV = 2, target frozen at the current openness and velocity zeroed, so the badge never mounts.\n\n**8. Replace ActivityIndicator with spinning 14px Loader2** (done)\n\nNew shared Spinner component (lucide Loader2 inside a reanimated view, withRepeat withTiming 360deg over 1000ms linear, infinite). Used in both the transition badge and the surviving ReaderScreen cold mount badge; both ActivityIndicator usages removed.\n\n**9. Verify the cover scaling model at rest** (done)\n\nVerified on paper: it did NOT coincide at rest. The transform scaled wrap shrinks the 12px/3px corner radii and 1px borders with the cover (a 48px row cover rested at roughly 3.2px visual radius versus the card's 12px, popping at pickup and at cancel settle). Fix applied: an animated style in the Overlay counter scales the four radii by 1/scale on both the page (new pageStyle prop on BookCover) and the cover face (merged into faceStyle), so the on screen radii are constant 12px/3px at every openness, exactly like the web's layout resize model. Border widths were deliberately left scaled: borderWidth is a layout prop in RN and animating it would relayout every frame; the divergence is a fraction of a pixel. Residual divergence noted in the summary (generated cover type size, interior insets); Michael should eyeball pickup on device.\n\n**10. Reader screen navigation animation 'none'** (done)\n\nNo change needed: App.tsx already registers Reader with animation: 'none' (landed with the earlier navigation parity package). Verified in the current file; entry and exit are instant swaps around the 240ms cover fade.\n\n### Judgment calls made during implementation\n\n1. The error card state lives in the zustand store (openError, showOpenError, dismissOpenError, never persisted) with the card mounted once at the app root. That lets the transition and the ReaderScreen share one card exactly the way the web shares App level pendingError, instead of duplicating card UI in two places. 2. The prompt's suggested frame callback guard (phaseSV.value < 2) would have frozen the cancel spring too, since cancelling is phase 3; I used phaseSV.value !== 2 and also froze target and velocity on the closing paths, so both suggested mechanisms are effectively in place. 3. For issue 9 I judged that a seam does exist at rest (corner radii and hairline borders shrink with the transform scale) and applied the counter scale the prompt described, but only to the radii: animating borderWidth forces a full layout pass every frame in React Native, which is the exact cost the prompt said to avoid, and the border divergence is under a pixel. Generated cover text still renders about 20 percent smaller than the card at pickup (the overlay draws at 180 wide and scales down while card type is fixed per size); fixing that would mean scaling type dynamically inside the shared BookCover, which I left alone and flagged for an on device look. 4. A cancelled open that finishes downloading mid spring skips the parse and stash entirely, so no orphaned ParsedText is retained. 5. The package 03 decision about cover accessory inks did not come up in this package; nothing was changed there. 6. Error card shadow uses the warm espresso shadow color the toast already uses rather than pure black, keeping the two bottom cards consistent; metrics follow the web exactly.\n\n### Testing performed\n\n- `npx tsc --noEmit` in the native repo: clean at commit time.\n- An independent adversarial review agent re-opened the uncommitted diff, checked every acceptance checklist item above against the native code and the cited web sources (exact constants, timings, easing curves, and copy strings), hunted for regressions (broken imports, accidental behavior changes, worklet violations), and re-ran the type check itself. Verdict: passed with no unresolved findings and zero fix rounds.\n- The commit step re-ran the type check once more before staging, and staged only the files listed above (no blanket `git add`).\n- Not yet done: the on-device checks in the Verification section above. Playback pacing and gesture feel only prove out on a real phone, so those remain for Michael on build 0.7.10 or later.\n"},{"id":"10","filename":"10-reading-progress-and-sessions.md","title":"Reading progress persistence and session accounting","content":"# Reading progress persistence and session accounting\n\n> **Status: implemented and committed 2026-07-13.** Commit `295bbb7` on `feat/native-ui-web-parity` in the native repo. Adversarial review passed with no unresolved findings.\n\n\n## Mission\n\nBring the native Android app's progress saving and reading session bookkeeping into exact parity with the web app. Five confirmed deltas: Saved for later rows must open at the first readable word instead of resuming, index 0 must be treated the way the web treats it (both when opening and when saving), progress must persist whenever the index changed since the last save (including index 0), the in flight reading session must be recorded on every exit path including Android system back, and zero word or zero length spans must never reach the stats store.\n\n## Context\n\nFocus Reader is a cozy speed reading app for public domain books. It shows one word (or a small window of words) at a time, tracks reading progress per book, and keeps cumulative reading stats (total words read, total time read) that drive a \"Your Reading\" card and a Stats page.\n\nTwo repos are involved:\n\n- **Web app (READ ONLY source of truth): `C:/Users/Michael/Desktop/Focus Reader`.** This is the reference for all look and behavior. You may read any file there. **Never modify anything in the web repo.**\n- **Native app (where ALL your changes go): `C:/Users/Michael/Desktop/Focus Reader Android`.** Expo SDK 54, React Native 0.81, reanimated 4, gesture-handler 2.28, zustand, expo-image, expo-haptics, lucide-react-native, react-navigation native-stack. This is a full React Native app. **Never introduce a WebView.**\n\nShared vocabulary you will meet in the code:\n\n- `parseText` produces a `ParsedText` with `tokens` (the word list), `readableStartWord` (index of the first word after Gutenberg front matter, 0 when no front matter is detected), and `readableEndWord`.\n- `progressById` in the zustand store maps book id to `{ currentIndex, totalTokens, ... }`. It feeds the Library's Reading list, Recents ordering, and the Today screen resume hero.\n- `addSession(words, ms)` in the store accumulates `stats.wordsRead` and `stats.msRead`, which feed the Stats page and the Today screen's average WPM.\n- A \"span\" is one stretch of continuous playback, from play to pause. Each span becomes one session via `addSession`.\n- On both platforms `PROGRESS_SAVE_INTERVAL_MS = 2000` (web `src/App.tsx:29`, native `src/screens/ReaderScreen.tsx:37`).\n\n## Before you start\n\nRun `git status` in `C:/Users/Michael/Desktop/Focus Reader Android`. Expect branch `feat/native-ui-web-parity`.\n\n**Important: another session may hold uncommitted changes** in `src/reader/ReaderChrome.tsx`, `src/reader/displays.tsx`, `src/reader/useReelEngine.ts`, and `app.json`. Read the current state of each file before editing it, base your edits on what is actually there, and do not revert or overwrite changes you did not make. This matters most for `src/reader/useReelEngine.ts` (issue 5 below edits `endSpan` there) and `src/screens/ReaderScreen.tsx` (issues 1 through 4 edit it). Rebase your edits on the current working tree, not on the line snapshots in this document.\n\nIf a line number cited below has drifted, trust the described behavior and re-locate the code by searching for the quoted identifiers.\n\n## Issues to fix\n\n### 1. Saved for later rows must open at the first readable word, not resume\n\n**Web behavior.** The Library's Saved for later list renders `BookRow`, whose click handler calls `onOpen(book, coverRect)` with NO `startIndex` (web `src/components/Input/StoreFront.tsx:262`, the row component spans 253 to 278; list usage around 1240 to 1249). `App.completePendingOpen` then applies the rule at web `src/App.tsx:203-207`:\n\n```ts\nif (pending.startIndex && pending.startIndex > 0) {\n    pendingSeekRef.current = pending.startIndex;\n} else if (pendingParsed.readableStartWord > 0) {\n    pendingSeekRef.current = pendingParsed.readableStartWord;\n}\n```\n\nSo a saved book always opens at the first readable word, even when `progressById` already holds a position for it partway through the book. Progress is honored only on surfaces that explicitly pass it: RecentRow passes `r.currentIndex`, vibe and search cards pass `progressById[book.id]?.currentIndex`.\n\n**Native behavior today.** `LibraryScreen` renders `BookRow` without a `startIndex` (native `src/screens/LibraryScreen.tsx:74-83`, `src/components/rows.tsx:75-107`), which matches the web. But `ReaderScreen` computes:\n\n```ts\ninitialIndex: Math.min(\n    startIndex ?? saved?.currentIndex ?? parsed.readableStartWord,\n    Math.max(0, parsed.tokens.length - 1),\n),\n```\n\nwhere `saved = progressById[book.id]` (native `src/screens/ReaderScreen.tsx:56` and 92 to 95). With `startIndex` undefined the `?? saved?.currentIndex` fallback wins, so a saved book that was ever read resumes partway through (or at the end, if finished) instead of restarting. `OpenTransition.tsx:282` passes `startIndex` through unchanged, so Library taps really do reach `ReaderScreen` with `startIndex` undefined.\n\n**Change.** Remove the `?? saved?.currentIndex` fallback from `initialIndex`, and also from the `lastIndex` ref init at native `src/screens/ReaderScreen.tsx:85` (`const lastIndex = useRef(startIndex ?? saved?.currentIndex ?? 0)`). An absent `startIndex` must mean \"open at `readableStartWord`\", exactly like the web. Resume positions must come only from an explicit `startIndex` passed by the opener. This is safe: every other native surface already passes explicit progress the way the web does (TodayScreen hero passes `progress.currentIndex`; VibeScreen and ResultsScreen cards pass `progressById[book.id]?.currentIndex`). Once nothing reads `saved`, you can drop the `saved` selector from ReaderScreen entirely.\n\n### 2. Index 0 edge cases: startIndex 0 must fall through, and index 0 must be saveable\n\n**Web behavior.** Two web rules involve index 0:\n\n(a) `completePendingOpen` treats a `startIndex` of 0 as falsy (`pending.startIndex && pending.startIndex > 0`, web `src/App.tsx:203`), so a recent row whose stored `currentIndex` is 0 still opens at `readableStartWord`, never in the Gutenberg front matter.\n\n(b) The progress persist effects (web `src/App.tsx:254-294`) save whenever the index changed since the last save, including index 0, because `lastSavedIndexRef` starts at `-1` (web `src/App.tsx:256`). So merely opening a book (the post open seek lands on `readableStartWord`, or stays at 0 if there is none) and immediately backing out creates a Reading row in the Library at 0%.\n\n**Native behavior today.** (a) `startIndex ?? saved?.currentIndex ?? readableStartWord` honors an explicit 0, so a 0 index progress entry would open at token 0, inside the front matter. (b) `saveNow` guards `if (lastIndex.current > 0 && tokenCount > 0)` (native `src/screens/ReaderScreen.tsx:121`), so a book whose `readableStartWord` is 0 (weak or no chapter structure), opened and exited without advancing, never appears in the Library's Reading list, while on the web it appears at 0%.\n\nEdge (a) is currently latent on native because native's own `saveNow` never writes 0 index entries; it becomes live the moment the guard in (b) is fixed. Most books have `readableStartWord > 0`, and `useReelEngine` fires `onIndexChange` with the initial index on mount (native `src/reader/useReelEngine.ts:151`, fed by the hydration effect at 140 to 149), so the common open and leave case already matches.\n\n**Change.** Only apply `startIndex` when it is `> 0`, falling through to `readableStartWord` otherwise (mirror the web's `startIndex && startIndex > 0` truthiness rule). And persist progress using the web's \"index changed since last save\" rule instead of the `> 0` guard, which is issue 3 below. Together these make Reading list membership match the web for books with `readableStartWord === 0`.\n\n### 3. Progress must save whenever the index changed since the last save, including index 0\n\n**Web behavior.** Web's throttled save (web `src/App.tsx:257-277`) fires whenever the index CHANGED from the last saved value (sentinel `lastSavedIndexRef = useRef(-1)` at `src/App.tsx:256`), gated by `(!rsvp.isPlaying || sinceSave >= PROGRESS_SAVE_INTERVAL_MS)` with the interval at 2000ms. Since the reader opens paused, the very first effect run saves progress at the current index, even 0. So merely opening a book immediately records it in `progressById`: it shows in Library > Reading, in Recents ordering, and on the Today resume hero at 0%. A second effect (web `src/App.tsx:281-294`) saves unconditionally on leaving the reader if the index differs from the last save, including a save at index 0 after scrubbing back to the start.\n\n**Native behavior today.** `saveNow` (native `src/screens/ReaderScreen.tsx:120-131`) guards `if (lastIndex.current > 0 && tokenCount > 0)`. `lastIndex` starts at `startIndex ?? saved?.currentIndex ?? 0` (line 85). For a fresh book whose parse yields `readableStartWord` 0, opening and backing out writes nothing, so the book never enters `progressById` and is absent from Reading, Recents, and the resume hero, unlike the web. (Books with detected front matter do get saved once the engine hydrates to `readableStartWord > 0` and `onIndexChange` bumps `lastIndex`.) Also, scrubbing back to word 0 and then exiting keeps the stale higher position, because the 0 save is skipped in both the throttled effect (lines 133 to 141) and the AppState/unmount effect (lines 143 to 152).\n\n**Change.** Replace the `lastIndex.current > 0` guard with web semantics: save whenever the index differs from the last persisted value. Track a `lastSavedIndex` ref seeded to `-1`, compare `lastIndex.current !== lastSavedIndex.current` (plus `tokenCount > 0`), and update `lastSavedIndex` after each successful save. Apply this in both the throttled path and the unmount/background path.\n\nOne caution: the old `> 0` guard was presumably added to avoid clobbering a real resume point with 0 before the engine hydrates. Keep that safety a different way: only enable saves after the engine's one time hydration jump. `ReaderScreen` already gates the effects on `ready` (which is `parsed.tokens.length > 0`), and `useReelEngine` hydrates in the same commit that flips tokens non empty (the hydration effect at `useReelEngine.ts:140-149` sets the index to `initialIndex` and `onIndexChange` at line 151 immediately updates `lastIndex`). Seed `lastIndex` from the hydrated initial index instead of forbidding 0. Verify the ordering in the current working tree so a save at index 0 can never fire before hydration lands on `initialIndex`.\n\n### 4. Android system back while playing must not drop the in flight session\n\n**Web behavior.** Every reader exit on the web goes through `handleBack` (web `src/App.tsx:228-231`), which calls `rsvp.pause()`; the `isPlaying` effect in the always mounted App (web `src/App.tsx:296-314`) then fires `addSession(words, ms)` for the play to pause span. Backgrounding also pauses (visibilitychange), so a span can never be silently lost. Stats (the \"Your Reading\" card and the Stats page) always include the last stretch read.\n\n**Native behavior today.** The span lives in a ref inside `useReelEngine` on the `ReaderScreen` (native `src/reader/useReelEngine.ts:159-170`). Header back and the menu button call `engine.pause()` first, so the session is recorded, and AppState backgrounding pauses too (`useReelEngine.ts:331-336`). But the Android hardware or gesture back pops the screen directly: the unmount cleanup (native `src/screens/ReaderScreen.tsx:148-152`) only calls `sub.remove()` and `saveNow()` for progress. Nothing calls `pause()` or `endSpan()` (grep confirms no `beforeRemove` listener exists anywhere in the native `src`), so the pending play span is discarded and stats lose that session's words and time. Progress position IS saved on this path; only session stats are lost.\n\n**Change.** On any unmount or `beforeRemove` of `ReaderScreen` while playing, end the span first (call `engine.pause()`, or `endSpan` with the current index) so `addSession` fires, matching the web's guarantee that every exit records the session. Either a `navigation.addListener('beforeRemove', ...)` or a `pause()` call in the effect cleanup before `saveNow()` works; make sure the pause runs before the progress save so both the session and the final position land. Note `engine.pause()` is a no op when not playing (`useReelEngine.ts:321-326` early returns on `!playing`), so calling it unconditionally on the way out is safe.\n\n### 5. Discard zero word or zero length spans so stats are never inflated\n\n**Web behavior.** On each play to pause boundary the web computes `ms = Date.now() - at` and `words = Math.max(0, currentIndex - index)`, then calls `addSession` ONLY `if (ms > 0 && words > 0)` (web `src/App.tsx:309`). Tapping play then pause in place, or a span where the reader ended at or behind the start index, contributes nothing to `stats.wordsRead` or `stats.msRead`.\n\n**Native behavior today.** `useReelEngine.endSpan` (native `src/reader/useReelEngine.ts:161-165`) calls `onSession(Math.max(0, i - span.i), Date.now() - span.t)` unconditionally whenever a span existed, and the store's `addSession` (native `src/store.ts:102-107`) clamps negatives but happily adds `words = 0` with positive ms. Play then immediate pause, or play followed immediately by a scrub (the scrub gesture's `onBegin` at `useReelEngine.ts:264-266` ends the span at the current index before any words advanced), accumulates `msRead` with 0 words. Over time the Stats page's time read grows and any pace figure derived from words over time (TodayScreen's `avgWpm = wordsRead / minutes`) drops relative to the web. Stats are cumulative and persisted, so the drift is permanent once written; fixing this early matters more than the per event size suggests.\n\n**Change.** Guard the emission with the web's condition: only call `onSession` when both `ms > 0` and `words > 0`. Do it either inside `endSpan` in `useReelEngine.ts` or inside the `onSession` handler ReaderScreen passes in; inside `endSpan` covers every pause path at once (`togglePlay`, `pause`, the end of book stop, and the scrub `onBegin`), since all of them route through it. **Reminder: `useReelEngine.ts` has uncommitted changes from another active session. Read the file first and apply this guard to whatever `endSpan` currently looks like.**\n\n## Acceptance checklist\n\n- [ ] Tapping a Saved for later row in the Library for a book with stored progress opens the reader at the book's first readable word, not at the stored position (issue 1).\n- [ ] A progress entry with `currentIndex` 0 opens the book at `readableStartWord`, never inside the Gutenberg front matter, because a `startIndex` of 0 falls through just like on the web (issue 2).\n- [ ] Opening a book with no detected front matter (`readableStartWord === 0`) and backing out immediately creates a Reading row in the Library at 0% and places the book in Recents and on the Today resume hero, and scrubbing back to word 0 then exiting persists position 0 instead of the stale higher position (issue 3).\n- [ ] Exiting the reader with the Android system back gesture or hardware back while playback is running records the session: total time and words on the Stats page grow by that stretch (issue 4).\n- [ ] Tapping play then pause without advancing, or play then an immediate scrub, adds nothing to total time read or words read; average WPM on Today and the Stats page no longer drifts down from zero word spans (issue 5).\n\n## Verification\n\n1. Type check the native repo: run `npx tsc --noEmit` in `C:/Users/Michael/Desktop/Focus Reader Android`. It must pass.\n2. Reason through the running behavior carefully, path by path: fresh open with and without front matter, open from Saved for later with existing progress, header back, system back while playing, backgrounding while playing, scrub to 0 then exit, and play/pause in place. Confirm each matches the web rules quoted above.\n3. Do NOT use the Expo web build to verify anything. Its dev server opens blank localhost tabs in the real browser and the web bundle breaks on zustand's `import.meta`. On device checking is done by Michael on his Android phone.\n\nWhen you finish, tell Michael exactly what to check on his phone, in plain everyday English. Suggest checks like these:\n\n- Save a book you have already read partway, then open it from the Saved for later list. It should start from the beginning of the actual story, not where you left off.\n- Open a brand new book, then back out right away without reading. It should now show up under Reading in the Library at 0 percent and on the Today screen.\n- Start a book playing, then leave the reader with the phone's own back gesture. Check the Stats page: the time and words from that little stretch should be counted.\n- Tap play and then pause right away a few times without reading. Your total reading time on the Stats page should not go up from that.\n\n## Final note\n\nWhen summarizing your work for Michael, use plain everyday language, explain what changed and why it matters without jargon, and avoid dashes in prose. Use commas or separate sentences instead.\n\n---\n\n## Outcome, recorded 2026-07-13\n\nImplemented in commit `295bbb7` on `feat/native-ui-web-parity` in the native repo.\n\nFiles changed: `src/screens/ReaderScreen.tsx`, `src/reader/useReelEngine.ts`, `app.json`.\n\n### Issue by issue\n\n**1. Saved for later rows open at the first readable word, not the stored resume point** (done)\n\nRemoved the progressById fallback from ReaderScreen entirely (the saved selector is gone). An absent startIndex now always means open at readableStartWord. Library rows pass no startIndex, so they restart at the story; Today hero, vibe cards, search cards, and recents still pass explicit progress and resume, exactly like the web.\n\n**2. startIndex 0 falls through to readableStartWord, and index 0 is saveable** (done)\n\nThe opening position is now `startIndex && startIndex > 0 ? startIndex : parsed.readableStartWord`, mirroring the web truthiness rule in completePendingOpen, so a stored index of 0 never opens inside the Gutenberg front matter. The saveability half is delivered by the issue 3 change.\n\n**3. Progress saves whenever the index changed since the last save, including index 0** (done)\n\nReplaced the `lastIndex.current > 0` guard with the web rule: `lastSavedIndexRef` seeded to sentinel -1, save fires when `lastIndex.current !== lastSavedIndexRef.current` (plus tokenCount > 0), lastSavedIndex updated only on a real save, throttle timestamp bumped only on a real save (web parity). Applied in both the throttled effect and the AppState/unmount path. lastIndex is now seeded from the same hydrated initialIndex expression, and the engine's hydration effect runs before ReaderScreen's save effects in the same commit, so a save cannot fire before the position lands on the opening word.\n\n**4. Android system back while playing records the in flight session** (done)\n\nTwo layers: a navigation `beforeRemove` listener calls engine.pause() the moment the pop starts (so the span ends at exit time, not after the pop animation), and the unmount cleanup now calls engineRef.current.pause() before saveNow() as a safety net for any other unmount. pause() is a no op when not playing, so header back and menu exits are unaffected.\n\n**5. Zero word or zero length spans never reach the stats store** (done)\n\nendSpan in useReelEngine now computes words and ms and only calls onSession when both are > 0, matching web App.tsx. Placed inside endSpan so every pause path is covered at once: togglePlay, pause, end of book stop, scrub touch down, AppState backgrounding, and the new exit paths.\n\n### Judgment calls made during implementation\n\n1) The state note said app.json should hold an uncommitted bump from 0.7.2 to 0.7.3; in reality the tree was clean at 0.7.7 (all prior sessions committed). Per the standing rule to bump every change round, I set it to 0.7.8. 2) For issue 4 I implemented both suggested mechanisms rather than picking one: beforeRemove ends the span at the instant the pop starts (more accurate span length), and a pause() in the effect cleanup before saveNow() covers non navigation unmounts; both are safe because pause() no ops when idle. 3) The zero span guard lives inside endSpan (the prompt's preferred spot) so every pause route is covered by one check. 4) Cold mounts (deep link or state restore) can briefly persist the pre hydration index for one commit before the corrected index is written in the same synchronous flush; I verified the web has the identical one commit transient (its persist effect runs before rsvp.seek's state commits), so I matched the web instead of adding extra gating. 5) Kept the tokenCount > 0 guard inside saveNow, same as the web's total === 0 early return.\n\n### Testing performed\n\n- `npx tsc --noEmit` in the native repo: clean at commit time.\n- An independent adversarial review agent re-opened the uncommitted diff, checked every acceptance checklist item above against the native code and the cited web sources (exact constants, timings, easing curves, and copy strings), hunted for regressions (broken imports, accidental behavior changes, worklet violations), and re-ran the type check itself. Verdict: passed with no unresolved findings and zero fix rounds.\n- The commit step re-ran the type check once more before staging, and staged only the files listed above (no blanket `git add`).\n- Not yet done: the on-device checks in the Verification section above. Playback pacing and gesture feel only prove out on a real phone, so those remain for Michael on build 0.7.10 or later.\n"},{"id":"11","filename":"11-shelf-snap-and-virtualization.md","title":"Shelf snapping, list virtualization, and grid spacing","content":"# Shelf snapping, list virtualization, and grid spacing\n\n> **Status: implemented and committed 2026-07-13.** Commit `ef4bf3e` on `feat/native-ui-web-parity` in the native repo. Adversarial review passed with no unresolved findings.\n\n\n## Mission\n\nMake the native app's horizontal shelves and results grids scroll like the web app and perform like a native app should. Five fixes: add card snapping to the Popular shelf and every vibe swimlane, virtualize the Popular shelf (100 cards), virtualize the Browse results grid (988 cards), stop the bookmark ribbon tips from clipping on horizontal shelves, and correct the results grid's vertical spacing. Every change goes in the native repo. When you finish, all five acceptance checkboxes must describe true behavior.\n\n## Context\n\nFocus Reader is a cozy speed reading app for public domain books (think warm coffeeshop aesthetic: cream paper, espresso ink, coral accents, stitched leather book covers). It exists in two repos:\n\n- **Web app (source of truth, READ ONLY): `C:/Users/Michael/Desktop/Focus Reader`.** A React + Vite + Tailwind app. It defines the exact look, copy, timings, and interaction feel. Read any file you need there, but NEVER modify anything in that repo.\n- **Native app (where ALL your changes go): `C:/Users/Michael/Desktop/Focus Reader Android`.** An Expo SDK 54 app on React Native 0.81 with reanimated 4, gesture-handler 2.28, zustand, expo-image, expo-haptics, lucide-react-native, and react-navigation native-stack. This is a full React Native port of the web app. Never introduce a WebView anywhere; every screen is real native UI.\n\nThe goal of this work stream is pixel and behavior parity: when the web and native apps are held side by side, they should look and feel identical, except where a real native control is clearly better.\n\nRelevant shared facts:\n\n- The catalog is identical on both sides: web `src/services/curated.json` and native `src/services/catalog.json` each hold exactly 988 books. The Popular shelf is the top 100 by downloads.\n- `BookCard` (native `src/components/BookCard.tsx`) is the storefront card: an SVG generated cover, a `Gesture.Race(Pan, Tap)` detector (tap opens instantly, press and hold lifts the cover), and an animated leather `SaveButton` ribbon whose tip pokes ABOVE the cover's top edge.\n- The ribbon geometry is identical on web and native: bookmark art viewBox 64 wide by 148 tall, `EDGE = 40`, rendered 36px wide. Tip height above the cover = 40 * 36 / 64 = **22.5px**. (Web: `src/components/Input/LeatherBookmark.tsx:12-15` and `SaveButton.tsx:65-73`. Native: `src/components/SaveButton.tsx:25-26` and `RibbonButton` at lines 111 to 133.)\n- Card widths: the Popular shelf and the \"Deeper cuts\" vibe lane use **176** (web `w-44`); all other swimlanes use the `BookCard` default of **144** (web `w-36`). Gap between cards is **20px** everywhere (web `gap-5`), content inset is **20px** (web `px-5`), and each shelf ends with a **4px** trailing spacer (web `w-1`, native `<View style={{ width: 4 }} />`).\n\n## Before you start\n\n1. Run `git status` in `C:/Users/Michael/Desktop/Focus Reader Android`. Expect to be on branch `feat/native-ui-web-parity`. If you are on a different branch, stop and say so before changing anything.\n2. Another session may hold uncommitted changes in `src/reader/ReaderChrome.tsx`, `src/reader/displays.tsx`, `src/reader/useReelEngine.ts`, and `app.json`. None of those files are yours to touch in this task. Always read the current state of any file before editing it, and never revert changes you did not make.\n3. This package ideally runs after the `shared-cover-save-toast` package. If `src/components/BookCard.tsx`, `src/components/SaveButton.tsx`, or `src/components/ui.tsx` look different from the descriptions below, that package probably landed first; adapt to the current code rather than restoring the described state.\n4. Line numbers below were checked on 2026-07-13 but may drift. If a listed line does not match, trust the described behavior and re-locate the code.\n\n## Issues to fix\n\n### 1. Horizontal shelves snap cards on web but scroll freely on native\n\nDelta id: `gestures-shelf-snap-missing` (severity medium, interaction).\n\n**What the web does.** The Popular shelf scroller (`src/components/Input/StoreFront.tsx:1114`) and every `Swimlane` scroller (`StoreFront.tsx:194-212`, scroller div at line 206) carry the classes `flex gap-5 overflow-x-auto snap-x snap-mandatory scroll-pl-5 -mx-5 px-5 pt-7 -mt-4`, with `snap-start flex-shrink-0` on each card wrapper. That is CSS mandatory scroll snap with a 20px scroll padding inset: after any fling or drag, momentum always settles with a card's left edge aligned to the 20px inset. The shelf can never rest between cards.\n\n**What native does.** `src/screens/TodayScreen.tsx:149-168` (Popular shelf) and the shared `Swimlane` in `src/components/ui.tsx:98-122` (used by every vibe lane in `src/screens/VibeScreen.tsx`) are plain horizontal `ScrollView`s with `contentContainerStyle` of `paddingHorizontal: 20, gap: 20` (Today inline at line 153; Swimlane via `s.laneRow` at `ui.tsx:204`) and the default `decelerationRate`. No `snapToInterval`, `snapToOffsets`, or `disableIntervalMomentum`. Flings settle at arbitrary offsets.\n\n**Change.** Add card start snapping to both shelf scrollers:\n\n- `snapToOffsets = cards.map((_, i) => i * (cardWidth + 20))` where `cardWidth` is 176 for the Popular shelf and the \"Deeper cuts\" lane, and 144 for all other swimlanes. Because the content container already carries `paddingHorizontal: 20`, offset 0 naturally puts the first card's left edge at the 20px inset, so the formula needs no inset correction.\n- `decelerationRate=\"fast\"` so the settle feels like CSS mandatory snap rather than a long native glide.\n- Prefer `snapToOffsets` over `snapToInterval` because the trailing 4px spacer makes the content length a non multiple of the interval.\n- Snapping must apply after momentum (the default for these props), so a hard fling still lands on a card edge.\n\nThe shared `Swimlane` takes `children`, so it cannot see the card width or count today. Give it two new optional props (for example `cardWidth?: number` default 144 and use `React.Children.count(children)` minus the trailing spacer, or pass the item count explicitly) and compute the offsets inside. `VibeScreen.tsx` renders \"Deeper cuts\" cards at width 176 (`VibeScreen.tsx:229`); that lane must get 176 based offsets while every other lane keeps 144.\n\nIf you do issue 2 first and the Popular shelf becomes a `FlatList`, apply these same props to the `FlatList`; it accepts all `ScrollView` props.\n\n### 2. The Popular shelf mounts all 100 cards eagerly\n\nDelta id: `today-popular-shelf-not-virtualized` (severity medium, performance).\n\n**What the web does.** Web also maps all 100 popular books into the scroller (`StoreFront.tsx:1114-1140`), but they are cheap DOM nodes; Today paints instantly from bundled data.\n\n**What native does.** `TodayScreen.tsx:149-168` renders `popular.map(...)` inside a horizontal `ScrollView`: 100 `BookCard` instances, each with an rn-svg generated cover (gradients, stitching), a `GestureDetector` (Pan plus Tap race), and an animated `SaveButton` ribbon, all instantiated synchronously when Today mounts. The repo's own legacy `src/components/Shelf.tsx:25-36` already demonstrates the virtualized pattern (`FlatList`, `initialNumToRender={4}`, `windowSize={5}`, `removeClippedSubviews`) but is unused, nothing imports it.\n\n**Change.** Convert the Popular shelf to a horizontal `FlatList`:\n\n- `initialNumToRender` around 4 to 6, a small `windowSize` (5 is fine), `removeClippedSubviews`.\n- Keep the exact card look: `BookCard` with `width={176}`, `holdMs={SHELF_HOLD_MS}`, `slotId={`shelf:${book.id}`}`, `startIndex={progressById[book.id]?.currentIndex}`.\n- Keep 20px gaps between cards, 20px content insets (`paddingHorizontal: 20` on `contentContainerStyle`), the full bleed `style={{ marginHorizontal: -20 }}`, the ribbon headroom (see issue 4), and the snap behavior from issue 1.\n- Keep the trailing 4px spacer, for example via `ListFooterComponent`.\n- Keep the loading state: when `popular.length === 0`, four `CoverSkeleton` placeholders at width 176 (either outside the list as today, or as `ListEmptyComponent`).\n\nToday must feel instant on device like the web. Caution from the audit: `removeClippedSubviews` clips offscreen rows AND can clip children that overflow their bounds. The ribbon tips overflow 22.5px above each cover, so after wiring the headroom fix in issue 4, verify ribbons still poke above the covers. If `removeClippedSubviews` eats the tips even with correct headroom, drop that one flag and keep the windowing.\n\n### 3. Browse mounts all 988 catalog cards with no virtualization\n\nDelta id: `search-browse-results-unvirtualized-988-cards` (severity medium, performance).\n\n**What the web does.** `openBrowse` (`StoreFront.tsx:541-545`) loads the full curated list (988 books) into the same 2 column grid (`StoreFront.tsx:936-954`); the DOM tolerates roughly 1000 simple card nodes and the page stays responsive with instant scroll.\n\n**What native does.** `src/screens/ResultsScreen.tsx:118-130` maps `results` into `<View style={s.cell}>` cells inside `PageShell`'s `ScrollView` (`src/components/ui.tsx:161-189`). For Browse that is 988 `BookCard`s, each with a `Gesture.Race(Pan, Tap)` detector, an SVG leather save ribbon, and a generated multilayer cover, all mounted eagerly, nothing clipped or recycled.\n\n**Change.** Render the results grid with a virtualized 2 column list (`FlatList` with `numColumns={2}`; prefer `FlatList` over FlashList so no new dependency is added) so Browse opens and scrolls as instantly as the web page, while keeping the cell layout identical: cells at `width: '50%'` with `alignItems: 'center'`, centered 144px cards, 24px row gap (`rowGap: 24` today), and the same `slotId={`search:${book.id}`}` and `startIndex` wiring.\n\nStructural note: a vertical `FlatList` inside `PageShell`'s vertical `ScrollView` would NOT virtualize (React Native disables windowing for same orientation nesting and warns). The `FlatList` must become the screen's scroller. Two workable routes:\n\n- Extend `PageShell` so a caller can supply the scrolling element (for example a `renderScroll` prop or a sibling `PageShellList` component), keeping the theme background, `PageWash`, and header slot, or\n- Build the screen from `PageWash` plus `InnerPageHeader` plus a `FlatList` directly in `ResultsScreen`, moving the error card and search pill into `ListHeaderComponent` and the empty state into `ListEmptyComponent`.\n\nEither way the list's `contentContainerStyle` must replicate `PageShell`'s column exactly: `width: '100%'`, `maxWidth: 448` (`PAGE_MAX_W`), `alignSelf: 'center'`, `paddingHorizontal: 20`, `paddingTop: 20`, `paddingBottom: Math.max(48, insets.bottom + 16)` (see issue 5 for the extra 28). Carry over `keyboardShouldPersistTaps='handled'` to the list (the screen currently gets it via `PageShell`'s `keyboardPersist` prop). Keep the 6 skeleton grid while `searching` and the copy \"Nothing on the shelf for that. Try another title or author.\" for zero results.\n\nThe rendered output is functionally identical; the delta is time to interactive and scroll smoothness on device. Expo dev mode exaggerates the cost, so judge on hardware.\n\n### 4. Popular shelf ribbon headroom is clipped by the ScrollView viewport\n\nDelta id: `today-shelf-ribbon-headroom-clip` (severity medium, visual).\n\n**What the web does.** The scroller div (`StoreFront.tsx:1114`, same in `Swimlane` at line 206) carries `pt-7 -mt-4`: 28px padding INSIDE the scrollable box and a 16px negative margin pulling the whole box up. The ribbon pokes 22.5px above each cover (36px wide ribbon, `EDGE` 40 of viewBox 64, so 40 * 36 / 64 = 22.5, per `SaveButton.tsx:65-73`), and with 28px of interior headroom it stays fully inside the box, so nothing clips.\n\n**What native does.** `TodayScreen.tsx:153` puts `paddingTop: 28` AND `marginTop: -16` both in `contentContainerStyle`. The negative margin shifts the content view up 16px within the `ScrollView`'s viewport (which clips on Android), leaving only 12px of effective headroom above cover tops. The 22.5px ribbon tips (native `SaveButton.tsx` uses the same `EDGE` 40, `VIEW` 64 by 148, `RIBBON_W` 36 geometry) lose their top 10px or so. `ui.tsx:204` (`laneRow`, used by `Swimlane`) has the identical construction.\n\n**Change.** In both places, move `marginTop: -16` out of `contentContainerStyle` and onto the `ScrollView`'s own `style` (alongside the existing `marginHorizontal: -20`), leaving `paddingTop: 28` in `contentContainerStyle`. The box itself then shifts up 16px while the full 28px of interior top padding remains as clip safe headroom. This was a static analysis finding, so confirm visually on device; if Android still clips, the fallback is `paddingTop: 28` on the scroller with `marginTop: -16` on the surrounding section `View`. Apply the same treatment to the Popular shelf `FlatList` from issue 2.\n\n### 5. Results grid vertical spacing deviates from web\n\nDelta id: `search-results-grid-vertical-spacing` (severity low, visual).\n\n**What the web does.** The results `<section>` has `mb-7`, a 28px bottom margin before the page's bottom padding (`StoreFront.tsx:902`). The grid itself (`grid grid-cols-2 gap-y-6 justify-items-center`, lines 930 to 937) has zero top padding, so first row save ribbon tips (22.5px tall) poke up into the 20px gap under the search box (the form has `mb-5`), slightly overlapping its bottom edge. That overlap is intentional web behavior.\n\n**What native does.** `ResultsScreen.tsx:144` gives `s.grid` a `paddingTop: 12`, pushing the first row down so ribbons no longer reach the search pill, and there is no 28px bottom spacer after the grid; content ends at `PageShell`'s `paddingBottom` of `Math.max(48, insets.bottom + 16)`.\n\n**Change.** Drop the grid's top padding to 0 (letting first row ribbon tips overlap the 20px gap exactly as on web; the native search pill already has `marginBottom: 20` matching web `mb-5`) and add a 28px bottom margin below the whole grid, no results, or skeleton block. After the issue 3 conversion, that means `paddingTop: 0` where the grid style used to apply and 28 extra points of bottom spacing in the list, for example `paddingBottom: 28 + Math.max(48, insets.bottom + 16)` on the list's `contentContainerStyle` or a 28px tall `ListFooterComponent`. React Native's default `overflow` is visible on both platforms so removing the padding should not clip the ribbons, but verify on Android since ancestor overflow rules differ from web.\n\n## Acceptance checklist\n\n- [ ] Flinging the Popular shelf and any vibe swimlane (including \"Deeper cuts\" and \"Where you left off\") always settles with a card's left edge on the 20px inset, never resting between cards, with a quick decisive stop (`decelerationRate=\"fast\"`).\n- [ ] The Popular shelf is a horizontal `FlatList` that mounts only a handful of cards up front (`initialNumToRender` 4 to 6, small `windowSize`, `removeClippedSubviews` unless it clips ribbons); Today opens instantly and the shelf looks pixel identical (176px cards, 20px gaps, 20px insets, 4px trailing spacer, skeletons while empty).\n- [ ] Browse renders its 988 results in a virtualized 2 column list that opens fast and scrolls smoothly, with identical cells (50% width, centered 144px cards, 24px row gaps), working tap and press and hold gestures, save ribbons, `keyboardShouldPersistTaps='handled'`, the 6 skeleton loading grid, and the same empty state copy.\n- [ ] On the Popular shelf and every swimlane, the full leather bookmark tip (22.5px) is visible above each cover top, nothing shaved off, because the 16px negative margin sits on the scroller's own style, not inside the content container.\n- [ ] In results, the first row of ribbon tips pokes up into the 20px gap under the search pill (slightly overlapping its bottom edge like the web), and there is 28px of breathing room between the last row and the page's bottom padding.\n\n## Verification\n\n1. Type check the native repo: run `npx tsc --noEmit` in `C:/Users/Michael/Desktop/Focus Reader Android`. It must pass clean.\n2. Reason through the running behavior carefully: trace the snap offset math for both card widths, confirm the `FlatList`s are the actual scrollers (no vertical list nested in a vertical `ScrollView`), and confirm no gesture, slot id, or `startIndex` wiring was lost in the conversions.\n3. Do NOT use the Expo web build to verify anything. Its dev server opens blank localhost tabs in the real browser and the web bundle breaks on zustand's `import.meta`. Do not start it.\n4. On device checking is done by Michael on his Android phone. End your summary by telling him exactly what to look at, in plain everyday English, for example: \"On your phone, open the app and flick the Popular shelf hard. It should glide and then stop with a book lined up neatly on the left edge, every time. The screen should appear right away with no stutter. Look at the little leather bookmarks on top of the covers, the whole rounded tip should be visible, not cut flat. Then tap see all next to Popular. The full book list should show up quickly and scroll smoothly all the way down. The first row of bookmarks should peek up close to the search box, and after the last row there should be a bit of extra space before the bottom. Open a vibe like a bedtime shelf and flick the rows sideways, they should also click into place on a book. Also check that tapping a book still opens it and holding a book still picks it up, both on the shelf and in the list.\"\n\n## Final note\n\nWhen summarizing your work for Michael, use plain everyday language, no jargon, and avoid dashes in prose. Write in short clear sentences.\n\n---\n\n## Outcome, recorded 2026-07-13\n\nImplemented in commit `ef4bf3e` on `feat/native-ui-web-parity` in the native repo.\n\nFiles changed: `src/components/ui.tsx`, `src/screens/TodayScreen.tsx`, `src/screens/VibeScreen.tsx`, `src/screens/ResultsScreen.tsx`.\n\n### Issue by issue\n\n**1. Add card snapping to the Popular shelf and every vibe swimlane** (done)\n\nPopular shelf FlatList and the shared Swimlane ScrollView both got snapToOffsets (one offset per card at i * (cardWidth + 20)) plus decelerationRate fast. Swimlane grew an optional cardWidth prop (default 144) and counts cards with React.Children.count; VibeScreen passes cardWidth 176 to the Deeper cuts lane so its offsets use 196 steps while every other lane uses 164.\n\n**2. Virtualize the Popular shelf (100 cards)** (done)\n\nConverted to a horizontal FlatList with initialNumToRender 5, windowSize 5, removeClippedSubviews, and the same card wiring (width 176, holdMs SHELF_HOLD_MS, slotId shelf:id, startIndex from progressById). 20px gaps ride as an ItemSeparatorComponent and the tail is a 24px footer (20 gap + the web 4px spacer) instead of flex gap in the content container, because container gap throws off the windowing spacer offsets. The 4 skeleton row still renders when popular is empty, in a plain View with identical styling.\n\n**3. Virtualize the Browse results grid (988 cards)** (done)\n\nResultsScreen now builds its own page from the theme background, PageWash, InnerPageHeader, and a numColumns 2 FlatList as the screen scroller (no nesting inside PageShell's ScrollView, so windowing is real). Error card and search pill moved into ListHeaderComponent; the 6 skeleton grid and the empty copy live in ListEmptyComponent. Cells keep width 50 percent, centered 144px cards, 24px row gaps via marginTop on cells past the first row, slotId search:id, startIndex, and keyboardShouldPersistTaps handled. Content container replicates PageShell exactly (100 percent width, maxWidth 448, centered, 20px side padding, 20 top).\n\n**4. Stop bookmark ribbon tips clipping on horizontal shelves** (done)\n\nIn both the Popular shelf (TodayScreen) and Swimlane (ui.tsx), marginTop -16 moved out of contentContainerStyle onto the scroller's own style next to marginHorizontal -20, leaving the full paddingTop 28 as interior headroom. Needs the on device look Michael does anyway; if Android still clips, the documented fallback is moving the negative margin to the section View.\n\n**5. Correct the results grid vertical spacing** (done)\n\nGrid top padding dropped from 12 to 0 (first row ribbon tips now poke into the 20px gap under the search pill like the web) and the list paddingBottom is 28 + Math.max(48, insets.bottom + 16), giving the web mb-7 breathing room after the grid, the empty state, or the skeleton block.\n\n### Judgment calls made during implementation\n\n1) Used an ItemSeparatorComponent (20px) plus a 24px ListFooterComponent on the Popular FlatList instead of flex gap in contentContainerStyle: virtualized lists compute unmounted region sizes from measured cell frames, and container level gap is invisible to that math, causing content jumps mid fling. Separators live inside each cell's measured frame so spacing is exact and visually identical. 2) Kept removeClippedSubviews on the Popular shelf per the prompt; ribbon tips stay inside the scroller bounds thanks to the 28px headroom, but Michael should confirm on device and we drop just that flag if tips vanish. 3) For Browse I chose the prompt's second route (PageWash + InnerPageHeader + FlatList directly in ResultsScreen) rather than extending PageShell, to avoid churning a shared component other screens use. 4) Left removeClippedSubviews off the vertical results grid so ribbon overflow above rows near the viewport edge can never pop in late. 5) Row gaps in the results grid use marginTop 24 on cells at index 2 and up (margins are inside measured frames) rather than rowGap, same virtualization reasoning; the non virtualized skeleton grid keeps rowGap 24. 6) Did NOT bump expo.version in app.json: that file is explicitly off limits this run (another session holds it), so the version bump memory rule is deferred to whoever commits.\n\n### Testing performed\n\n- `npx tsc --noEmit` in the native repo: clean at commit time.\n- An independent adversarial review agent re-opened the uncommitted diff, checked every acceptance checklist item above against the native code and the cited web sources (exact constants, timings, easing curves, and copy strings), hunted for regressions (broken imports, accidental behavior changes, worklet violations), and re-ran the type check itself. Verdict: passed with no unresolved findings and zero fix rounds.\n- The commit step re-ran the type check once more before staging, and staged only the files listed above (no blanket `git add`).\n- Not yet done: the on-device checks in the Verification section above. Playback pacing and gesture feel only prove out on a real phone, so those remain for Michael on build 0.7.10 or later.\n"},{"id":"12","filename":"12-app-shell-branding-washes.md","title":"App identity, page washes, and shell spacing","content":"# App identity, page washes, and shell spacing\n\n> **Status: implemented and committed 2026-07-13.** Commit `d34a4d3` on `feat/native-ui-web-parity` in the native repo. Adversarial review passed with no unresolved findings. expo-splash-screen was installed and the stock blue adaptiveIcon backgroundImage removed so the warm beige plate shows.\n\n\n## Mission\n\nBring the native Android app's shell up to exact parity with the web app in six places: the app's launcher identity (name, adaptive icon background, splash), the warm radial page washes (they must scroll away with content and appear as a single mustard wash on the More pages), PageShell's bottom padding formula, the missing end-of-scroll whitespace on vibe pages, and a 300ms cross-fade of the page background and text color when the theme or light/dark mode changes. Every change happens in the native repo. The web repo is read only reference.\n\n## Context\n\nFocus Reader is a cozy speed-reading app for public-domain books, with a warm coffeeshop visual identity (warm beige pages, espresso ink, mustard and coral accent glows).\n\nThere are two repos:\n\n- **Web app (READ ONLY source of truth):** `C:/Users/Michael/Desktop/Focus Reader`. This is a React + Vite web app. It defines the exact look and behavior you are matching. Open its files to check constants, copy, and timings, but never modify anything in this repo.\n- **Native app (where ALL changes go):** `C:/Users/Michael/Desktop/Focus Reader Android`. Expo SDK 54, React Native 0.81, reanimated 4, gesture-handler 2.28, zustand, expo-image, expo-haptics, lucide-react-native, react-navigation native-stack.\n\nThis is a full React Native app. Never introduce a WebView, and never suggest one.\n\nKey native files for this task:\n\n- `app.json` at the repo root (Expo config, launcher identity).\n- `src/components/ui.tsx` holds `PageWash` (roughly lines 136 to 157) and `PageShell` (roughly lines 159 to 189). PageShell is the shared page scaffold used by every storefront-style screen.\n- `src/screens/` holds `TodayScreen.tsx`, `LibraryScreen.tsx`, `NotebookScreen.tsx`, `VibeScreen.tsx`, `ResultsScreen.tsx`, `StatsScreen.tsx`, `SettingsScreen.tsx`, `AboutScreen.tsx`, `ReaderScreen.tsx`.\n- `src/theme.ts` holds `useTheme()` (roughly lines 140 to 156), which returns plain color strings from zustand state.\n\nKey web files for this task (read only):\n\n- `vite.config.ts` lines 56 to 63 (PWA manifest branding).\n- `src/components/Input/StoreFront.tsx` lines 682 to 689 (page shell with both washes), 139 to 153 (OverlayPage for Settings/About), 1356 to 1373 (Stats layer), 737 to 740 (home main padding), 753 (vibe section margin).\n- `src/index.css` lines 42 to 49 (body color transition).\n- `src/App.tsx` lines 69 to 87 (theme variables applied on change).\n\n## Before you start\n\nRun `git status` in `C:/Users/Michael/Desktop/Focus Reader Android`. Expect the branch `feat/native-ui-web-parity`.\n\n**Important warning:** another session may hold uncommitted working-tree changes in `src/reader/ReaderChrome.tsx`, `src/reader/displays.tsx`, `src/reader/useReelEngine.ts`, and `app.json`. In particular, `app.json` already carries an uncommitted `\"predictiveBackGestureEnabled\": false` entry under `expo.android`. Read the current state of every file before editing it, merge your edits into what is there, and do not revert or overwrite changes you did not make. This matters most for `app.json`, which you must edit for issue 1.\n\nIf any line number in this document has drifted, trust the described behavior and re-locate the code by searching for the constants or identifiers quoted here.\n\n## Issues to fix\n\n### 1. App identity is still the default Expo template (high severity)\n\n**What the web does.** The PWA manifest in `vite.config.ts` lines 56 to 63 brands the app: name `Focus Reader`, short_name `Focus Reader`, description `A calm, focused reader for public-domain books.`, theme_color `#3a2a1e` (espresso), background_color `#f3ead9` (warm beige), display `standalone`. Note the web has NO branded icon art of its own: `index.html` line 5 still links the stock `/vite.svg` favicon and the manifest declares no icons array.\n\n**What the native app does.** In `app.json`, `expo.name` and `expo.slug` are both `focus-reader-android`, so the Android launcher shows the raw slug as the app name. `expo.android.adaptiveIcon.backgroundColor` is `#E6F4FE`, the Expo default pale blue. `assets/icon.png` and the `android-icon-*` files are the stock Expo blue blueprint-chevron placeholder. There is no splash configuration at all (no `expo-splash-screen` plugin and no `expo.splash` block); `assets/splash-icon.png` exists but is the stock grid-and-circles placeholder and is unreferenced by `app.json`.\n\n**What to change.**\n\n- Set `expo.name` to `Focus Reader`. Leave `expo.slug` as `focus-reader-android` (the slug is a project identifier, changing it would repoint the Expo project).\n- Set `expo.android.adaptiveIcon.backgroundColor` to warm beige `#F3EAD9` (espresso `#3A2A1E` is the acceptable alternative if a dark plate reads better behind the current foreground art, but warm beige is the default choice).\n- Add a splash configuration in the same palette so launch matches the cozy theme: add the `expo-splash-screen` plugin to `expo.plugins` with `backgroundColor` `#F3EAD9`, referencing `./assets/splash-icon.png` as the image. The splash image itself is still placeholder art; wiring it up with the warm background is the parity fix.\n- Do NOT attempt to draw replacement icon art. Replacing `icon.png`, the `android-icon-*` set, and `splash-icon.png` with Focus Reader artwork needs a new design asset. The web has no branded icon to copy (its favicon is stock vite.svg), so the art itself is branding work, not web parity. The name and the colors are the direct parity fixes here. If you want, leave a short TODO comment or note for Michael that icon art is still stock.\n- Merge carefully: `app.json` has uncommitted changes from another session (`predictiveBackGestureEnabled`). Preserve everything already in the file.\n\n### 2. Page washes are a fixed 420px viewport overlay instead of page-sized scrolling backgrounds\n\n**What the web does.** The storefront page div (`StoreFront.tsx` lines 682 to 689) carries two background radial gradients sized against the full page element: mustard `radial-gradient(120% 80% at 50% -10%, rgba(212,154,63,0.10), transparent 55%)` plus coral `radial-gradient(90% 60% at 100% 0%, rgba(194,103,75,0.07), transparent 50%)`. Because they are backgrounds of the scrolled container, the glow scrolls up and away with the content. When you scroll down a long page the warm glow leaves the screen.\n\n**What the native app does.** `PageWash` (`src/components/ui.tsx` lines 136 to 157) is an absolutely positioned 420px-tall SVG rendered BEHIND the ScrollView (PageShell renders `<PageWash />` as a sibling before the ScrollView, lines 170 to 186). So the glow never scrolls: it stays glued to the viewport top while content scrolls over it. Its ellipse geometry also only approximates the web (washA uses rx `width*0.75`, ry `h`, washB uses rx `width*0.6`, ry `h*0.7` at x = width, versus the web's 120%w by 80%h and 90%w by 60%h). The colors and stop offsets already match: washA `#D49A3F` at opacity 0.10 fading to 0 at stop 0.55, washB `#C2674B` at opacity 0.07 fading to 0 at stop 0.5.\n\n**What to change.** Move the wash SVG inside the ScrollView's content, as the first child, absolutely positioned at the top, so it scrolls away with the content. Size it against the content like the web's percentages: washA spans 120% of the width and 80% of the page height centered at x 50% y minus 10%, washB spans 90% of the width and 60% of the height anchored at x 100% y 0%. If measuring true content height is awkward, sizing against at least the viewport (window) height is the acceptable floor, but never the hardcoded 420. Keep the existing colors and stop offsets, they are already correct. Remember the wash must not block touches (`pointerEvents=\"none\"`) and must sit behind the page content (zIndex or render order).\n\n### 3. Stats, Settings, and About should get only the mustard wash\n\n**What the web does.** The storefront page shell uses TWO gradients (mustard top-center plus coral top-right, exact strings in issue 2). But the More overlays use ONLY the mustard gradient: `OverlayPage` (`StoreFront.tsx` line 146) and the Stats layer (line 1362) both set `backgroundImage: 'radial-gradient(120% 80% at 50% -10%, rgba(212,154,63,0.10), transparent 55%)'` with no coral top-right wash.\n\n**What the native app does.** `PageShell` always renders `PageWash`, which draws both ellipses (washA `#D49A3F` at 0.10 and washB `#C2674B` at 0.07) on every screen, including `StatsScreen.tsx`, `SettingsScreen.tsx`, and `AboutScreen.tsx` (all three use PageShell).\n\n**What to change.** Give PageWash and PageShell a prop, for example `wash?: 'single' | 'double'` defaulting to `'double'`, and pass `wash=\"single\"` from StatsScreen, SettingsScreen, and AboutScreen so only the mustard ellipse renders there. washB's web geometry is 90% by 60% at 100% 0%; the native ellipse is an approximation and that is fine, the fix on these three pages is simply omitting it.\n\n### 4. PageShell bottom padding adds 16px the web does not have\n\n**What the web does.** Every page column uses `paddingBottom: 'max(3rem, env(safe-area-inset-bottom))'`, that is max(48px, inset) with nothing added on top of the inset. Verified in three places: the home main (`StoreFront.tsx` lines 737 to 740), the Stats overlay main (lines 1370 to 1373), and OverlayPage's main (line 149).\n\n**What the native app does.** PageShell's ScrollView `contentContainerStyle` uses `paddingBottom: Math.max(48, insets.bottom + 16)` (`src/components/ui.tsx` line 182). On devices where the bottom inset exceeds 32 (for example 48dp three-button navigation) the native page gets up to 16px more bottom padding than the web.\n\n**What to change.** Change the formula to `Math.max(48, insets.bottom)`. This affects every screen using PageShell, which is intended. The two formulas are identical when `insets.bottom <= 32`, so the cha
