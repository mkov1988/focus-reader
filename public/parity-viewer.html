src/screens/TodayScreen.tsx`, `src/screens/VibeScreen.tsx`, `src/screens/ResultsScreen.tsx`.\n\n## What changed\n\n**1. Today press states and the vibe row inset shadow.** The web vibe row carries `transition-[transform,box-shadow,border-color] duration-150` on the default `cubic-bezier(0.4,0,0.2,1)` curve: while pressed the ring becomes `coral-accent/40`, scale drops to `0.99`, and an inset shadow `inset 0 1px 4px rgba(58,42,30,0.08)` fades in, with the icon chip tweening to scale `1.10` and rotate `-6deg` and the chevron sliding `translateX` 4px and its color to coral, all over 150ms; the Today menu button uses `active:scale-90` over 150ms. Native applied the same pressed values but as instant style swaps with no inset shadow. Fixed: the new `usePressScale` hook now drives the vibe row scale to 0.99, the ring color to coral, the icon tilt, the chevron slide plus a color cross fade, and a fading top inset shadow at `rgba(58,42,30,0.08)`, all over 150ms both ways, and the Today menu button tweens its shrink to 0.9.\n\n**2. Library rows and the plain save button.** On the web, RecentRow and BookRow use `active:scale-[0.99]` with `transition-[transform,border-color] duration-150`, so the 0.99 press scale eases both ways while the ring color change to `coral-accent/40` stays instant (the ring is a box shadow, not in the transition list). The plain SaveButton uses `active:scale-90` with `transition-[transform,background-color,color] duration-150`, so its shrink to 0.9 and its background and icon color flip (cream/mocha when unsaved, coral accent with accent text when saved) all ease over 150ms. Native swapped all of these instantly. Fixed: RecentRow and BookRow now ease their 0.99 scale over 150ms while the border color swap stays instant, matching the web. The plain save button eases its 0.9 shrink and its saved color flip (background plus icon, via a cross fade of two bookmark icons) over 150ms, and its ring swap stays instant like the web.\n\n**3. Filter chips and the ribbon shadow easing.** The web FilterChip uses `active:scale-[0.97]` with a 150ms transition on transform, background color, text color, and border color, and the ribbon bookmark's drape shadow fades with `opacity .4s ease`, where `ease` is `cubic-bezier(0.25, 0.1, 0.25, 1)`. Native snapped the chip and used reanimated's default in/out easing on the ribbon shadow's 400ms `withTiming`. Fixed: FilterChip now eases its 0.97 press scale and its active color flips (background, border, label) over 150ms with the shared curve, and the ribbon drape shadow's 400ms fade now uses the CSS ease curve, `bezier 0.25, 0.1, 0.25, 1`.\n\n**4. Inner page header round buttons.** The web back and menu circles both carry `active:scale-90 transition-[transform,color] duration-150`, so the scale to 0.90 and back tweens over 150ms. Native toggled `transform: [{ scale: pressed ? 0.9 : 1 }]` instantly in both directions. Fixed: both circles now tween to 0.9 and back over 150ms via the shared hook. The web's `hover:text-coral-accent` has no native analogue and was not ported.\n\n**5. Reader header collapse easing.** The web collapse animates `grid-template-rows` 1fr to 0fr plus opacity with `transition-[grid-template-rows,opacity] duration-300 ease-out`. Under Tailwind 3.4.17 the `ease-out` utility compiles to `cubic-bezier(0, 0, 0.2, 1)`, a strong decelerate that starts fast and lands gently, not the CSS `ease-out` keyword's `cubic-bezier(0, 0, 0.58, 1)`. Native ran `withTiming` at 300ms with no easing, so reanimated's default `Easing.inOut(Easing.quad)` applied and started slow. Fixed: the collapse now uses `bezier 0, 0, 0.2, 1` at 300ms. The line had drifted (an earlier round had added an `Easing.out` quad), so it was replaced with the exact Tailwind ease out curve. Only `InnerPageHeader.tsx` was touched, nothing under `src/reader/`.\n\n**6. Today Popular \"see all\" icon and feedback.** On the web this is 13px semibold coral accent with an **ArrowRight** icon (size 14, `ml-1` so 4px left margin); while active the text dims to `coral-accent/70` (this button has `transition-colors`, so the dim tweens) and the arrow translates 4px right over 150ms. Native rendered **ChevronRight** at size 14 with a flat `opacity: 0.7` on the whole row and no icon slide. Fixed: ChevronRight was replaced with ArrowRight size 14, and while held the label and arrow now fade toward 70 percent and the arrow slides 4px right, both over 150ms with the shared curve, easing back on release. The copy (\"see all\", lowercase), size 13, semibold weight, and accent color already matched and were left alone.\n\n**7. Swimlane \"see all\" arrow.** The web swimlane button is coral accent 13px semibold with an ArrowRight size 14 icon (4px left margin); while active the label and icon color drop to `coral-accent/70` **instantly** (no color transition on this button, unlike issue 6) and the arrow translates 4px right over 150ms. Native applied `opacity: 0.7` to the whole control and never moved the arrow. Fixed: the arrow now slides 4px right over 150ms with `Easing.bezier(0.4, 0, 0.2, 1)` while pressed and returns on release, and the 0.7 dim stays instant, matching the web's untransitioned color drop. This is the shared Swimlane component, so the fix lands everywhere it is used.\n\n**8. Vibe hero Start reading pressed dim.** The web \"Start reading\" button (coral pill, `py-3.5` so 14px vertical padding, 15px semibold, BookOpen size 18, `shadow-md shadow-coral-accent/25`) has no active or pressed style classes and shows no visual press feedback; the open animation itself is the response. Native set `opacity: pressed ? 0.9 : 1`. Fixed: the pressed opacity was removed so the button is visually inert on press, exactly like the web.\n\n**9. Resume hero progress bar.** The web coral fill inside the 6px tall track has `transition-[width] duration-300` on the default `cubic-bezier(0.4,0,0.2,1)` curve, so when the percentage changes (for example returning from the reader with new progress) the bar eases to the new width over 300ms. Native was a plain View whose width was the template string `${pct}%`, so it jumped. Fixed: the fill width now animates through a shared value with `withTiming` at 300ms and the default Tailwind curve, built as a percent width inside `useAnimatedStyle`. The track and fill geometry (height 6, radius 3, `t.inkA(0.1)` track, `t.accent` fill) were left untouched.\n\n**10. Today top bar shadows, focus ring, and text size.** On the web the search pill is `bg-cream` with `ring-1 ring-espresso/10`, an inset shadow `inset 0 1px 3px rgba(58,42,30,0.08)`, and on focus the ring becomes `coral-accent/40` (`focus-within:ring-coral-accent/40`, `transition-shadow`); its input text is 16px in Inter `font-medium`, espresso, placeholder `mocha/60`; the 48px menu circle adds `shadow-sm`, which is `0 1px 2px rgba(0,0,0,0.05)`. Native had a `t.inkA(0.1)` border with no inset shadow, no focus change, a 15px `sansMedium` input, and no menu shadow. Fixed: a shared `TopInsetShadow` overlay was added inside the pill at `rgba(58,42,30,0.08)`, the border turns to accent at 0.4 alpha while the input is focused, the input text was bumped to 16, and the menu button was given `shadowOpacity` 0.05, `shadowRadius` 2, `shadowOffset` {width 0, height 1}, and `elevation` 1.\n\n**11. Both search pills, inset shadow and exact height.** Both web pills (home and results) are cream with a 1px `espresso/10` ring, the inset shadow `inset 0 1px 3px rgba(58,42,30,0.08)`, and a `coral-accent/40` focus ring; input text is 16px Inter `font-medium`, espresso, placeholder `mocha/60`; icons are Search 18 at `mocha/70` and clear X 16 at `mocha/60`. The home pill's padding is 20 by 14 (`px-5 py-3.5`); the results pill's is 20 by 12 (`px-5 py-3`), which with the inherited 1.5 line height on 16px text makes it exactly 12 + 24 + 12 = 48px tall. Native rendered the results pill flat at about 40px with a 15px input. Fixed: the results pill got the same inset shadow, focus border swap to `t.accentA(0.4)`, and 16px text, plus 12px vertical container padding (input padding dropped to 0, minHeight 48) so it lands at about 48px. The Today pill's height was left alone as instructed. The shared treatment lives in one `TopInsetShadow` component in `ui.tsx`.\n\n## Judgment calls\n\n1. The inset shadow ink is hardcoded to `rgba(58,42,30,0.08)` instead of the theme ink helper. The web hardcodes that exact color, so in dark mode the shading stays dark; the theme ink would have flipped it into a light highlight, which would look wrong for a shadow.\n2. The icon color tweens (vibe row chevron, plain save bookmark) use the suggested two stacked icons cross fading from one shared value, rather than animated SVG props.\n3. The rows keep their instant border swap through a tiny pressed state flag set inside `onPressIn` and `onPressOut`, since a plain style function cannot ride on an animated pressable cleanly.\n4. The Popular \"see all\" dim is an opacity fade to 0.7 on the label and arrow, which reads the same as the web's color drop to accent at 70 percent over its color transition.\n5. The results pill lands at about 48px by pairing the 12px container padding with zero input padding and a 48 minimum height, since stacking 12px on top of the old 10px input padding would have made it about 64px tall.\n6. The header collapse line had drifted from the prompt's snapshot (it already carried a quad ease out), so the described target was trusted and set to the exact `bezier 0, 0, 0.2, 1`.\n7. No `app.json` version bump this round: another session held changes there, so the commit step handled the `expo.version` bump instead.\n8. The package 03 cover inks decision did not intersect this package, so nothing was needed for it.\n\n## Check on your phone\n\n- [ ] Confirm: pressing a Vibe out row on Today eases its scale, ring color, icon tilt, and chevron slide in over 150ms and back out on release, with a faint inner shadow along the top edge fading in while held, and the Today menu button's shrink to 0.9 tweens both ways.\n- [ ] Confirm: Recents rows and Library book rows ease their 0.99 press scale in and out while the border color change stays instant, and the plain bookmark save button eases its shrink to 0.9 plus its background and icon color flip.\n- [ ] Confirm: filter chips on vibe pages ease their 0.97 press scale and color changes, and the round back and menu buttons on any inner page header tween to 0.9 and back rather than snapping.\n- [ ] Confirm: when the reader starts playing, the header collapse starts fast and lands gently rather than starting slow.\n- [ ] Confirm: Today's Popular \"see all\" shows a straight ArrowRight icon (not an angle bracket), and while held the label dims and the arrow slides 4px right and back; every swimlane \"see all\" arrow slides the same way while its color dim stays instant.\n- [ ] Confirm: the vibe hero's Start reading button shows no visual change at all while pressed.\n- [ ] Confirm: the resume hero's coral progress fill eases to its new width over 300ms after you back out of the reader, instead of jumping.\n- [ ] Confirm: Today's search pill has a faint inner top shadow, its border turns coral while the keyboard focus is in the input, its text renders at 16px, the menu circle casts a subtle drop shadow, and the results page pill matches and stands about 48px tall.\n\nEverything else in this package (the shared hook wiring, type safety, and the single shared `TopInsetShadow` and `usePressScale` structure) was verified in code and by review.\n","kicker":"Package 13"},{"id":"14","filename":"14-paragraph-mode-polish.md","title":"Paragraph Display Visual Polish (Native Parity Package 14)","content":"# Paragraph Display Visual Polish (Native Parity Package 14)\n\n**Done.** Implemented and committed as `269e27b` on `feat/native-ui-web-parity`, 2026-07-13, independent review passed with no unresolved findings. This package brought the native paragraph reading view up to exact visual parity with the web app on five fine details.\n\n## What this fixed\n\nBefore this, the native paragraph view read close to the web but felt subtly off in five ways: the active word stayed the same size as its neighbors instead of popping slightly, new paragraphs hesitated at the start of their slide because the easing began slow, word colors cut hard from one to the next instead of crossfading, the highlight pill hugged the glyph box exactly instead of overhanging the word, and the gap between words was a fixed pixel value that ran too wide in hybrid mode. This package matched all five to the web: the active word pops to 105% size, the paragraph slides in with a decelerating ease out curve, word colors crossfade over 100ms, the highlight pill overhangs the word by 4px on each side without moving neighbors, and the word gap scales with the paragraph font size.\n\n## What changed\n\nFiles changed: `src/reader/displays.tsx`, `app.json`.\n\n### 1. Active paragraph word scales to 105%\n\nThe web (`src/components/Reader/ParagraphDisplay.tsx:229-247`) gives the active word span the classes `bg-focal/20 text-focal scale-105` together with `inline-block`, so the current word renders 5% larger than its neighbors. The scale applies instantly, with no animation, because the span only transitions colors (`transition-colors`), not transform. Because it is an inline block scale, the enlarged word overlaps its neighbors slightly without reflowing the line. Native previously gave the active word the focal color and a `t.focalA(0.2)` background only, with no scale, so the word stayed at normal size.\n\nA static `transform: [{ scale: 1.05 }]` was added to the active word's style, applied instantly with no animation, alongside the focal color and the 20% focal background. RN transforms never affect layout, so the pop overlaps neighbors without reflowing the line, matching the web's inline-block scale. It was applied directly on the `Text` element (the prompt's first-choice approach); the `View`-wrapper fallback was not needed for types or layout math, though on-device rendering quality is Michael's to confirm.\n\n### 2. Paragraph slide in uses the CSS ease out curve\n\nThe web (`src/index.css:97-106` and `src/components/Reader/ParagraphDisplay.tsx:201-224`) remounts each new paragraph keyed by its first token id and plays `para-enter-up` or `para-enter-down`: opacity 0 to 1 and translateY from plus or minus `enterDist` to 0, declared as `animation: 0.3s ease-out both`. CSS `ease-out` equals `cubic-bezier(0, 0, 0.58, 1)`, which decelerates from the very start. The distance and duration grow with how many paragraphs a flick jumped: `enterDist = 28 + (count - 1) * 42` pixels and `duration = 300 + (count - 1) * 150` ms. The paragraph enters from below when going forward and from above when going back. The animation is effectively disabled under `prefers-reduced-motion` (`src/index.css:150-153` forces `animation-duration` to 0.01ms with `!important`). Native's `EnterPara` previously drove opacity and translateY with `withTiming(1, { duration: dur })`, whose default `Easing.inOut(Easing.quad)` starts slow, so the paragraph appeared to hesitate before sliding in.\n\n`EnterPara`'s `withTiming` now uses `Easing.bezier(0, 0, 0.58, 1)`, the exact CSS ease out, defined as the module constant `EASE_OUT`. `Easing` was added to the reanimated import. The distance and duration jump scaling and the direction flip were left untouched, since they already matched. Reduce motion is honored via `ReduceMotion.System` on the timing config, which snaps to the end state exactly like the web's `prefers-reduced-motion` animation kill.\n\n### 3. Word colors crossfade over 100ms\n\nThe web (`src/components/Reader/ParagraphDisplay.tsx:234-242`) carries `transition-colors duration-100` on every word span. As playback advances, each word's text color and highlight background crossfade over 100ms between three states: active is focal text plus `focal/20` background, passed is `mocha/50`, upcoming is `espresso/85`. Native previously changed colors and background instantly on index change, so the highlight jumped with a hard cut.\n\nA new `FadingWord` component was added: an `Animated.Text` whose color and background color run through `interpolateColor`, driven by a 100ms `withTiming` using Tailwind's actual transition curve `cubic-bezier(0.4, 0, 0.2, 1)`. Only the two words that changed state on the last tick render animated, the word gaining the highlight and the word losing it, tracked via a `prevIndex` ref; the rest of the paragraph stays plain `Text`, so a long paragraph never carries hundreds of animated nodes. Distant passed and upcoming flips on multi word jumps cut instantly, which is the prompt's sanctioned cheap approach. The passed and upcoming alpha colors are `t.mutedA(0.5)` and `t.inkA(0.85)`. The crossfade also snaps under system reduce motion, matching the web's transition kill.\n\n### 4. Highlight pill overhangs the word by 4px each side\n\nThe web (`src/components/Reader/ParagraphDisplay.tsx:234-242`) gives word spans `rounded px-1 -mx-1 inline-block`: 4px horizontal padding cancelled by a negative 4px margin, so the `focal/20` background pill overhangs the word by 4px on each side, with a 4px corner radius, without shifting neighboring words. Native previously applied `borderRadius: 4` and the `t.focalA(0.2)` background directly to the `Text`, so the pill was exactly the glyph box, visibly tighter than web.\n\nEvery word now carries `paddingHorizontal: 4` with `marginHorizontal: -4`, alongside the existing `borderRadius: 4`. The padding and negative margin cancel in Yoga's flexWrap math, so line breaks and effective word spacing are unchanged while the pill extends 4px past the glyphs. Tap targets get 4px wider per side, an improvement, and the `onLayout` y bookkeeping for auto centering was untouched since only horizontal geometry changed.\n\n### 5. Word gap is 0.25em of the paragraph font size, not a fixed 8px\n\nThe web (`src/components/Reader/ParagraphDisplay.tsx:220-224` and `205-217`) uses `gap-x-[0.25em]` on the wrap row, so the gap scales with the computed `displaySize` (`Math.max(24, Math.min(fontSize * 0.6, 48))`, line 199). That gives 8.4px in the standalone paragraph view (displaySize 33.6 from the default reader font size 56) and 6px in hybrid mode (hybrid passes fontSize 28, so `28 * 0.6 = 16.8` clamps up to displaySize 24, and `24 * 0.25 = 6`). Container horizontal padding is `px-4 sm:px-8`, meaning 16px, and 32px only at viewports 640px or wider. Native previously used `paraWrap: { flexDirection: 'row', flexWrap: 'wrap', columnGap: 8 }`, a fixed 8 that roughly matched standalone (8 vs 8.4) but ran 33% too wide in hybrid mode (8 vs 6).\n\n`columnGap` is now computed inline as `displaySize * 0.25` (8.4px standalone at displaySize 33.6, 6px in hybrid at displaySize 24), and the fixed `columnGap: 8` was removed from the `paraWrap` stylesheet entry. Container padding was kept at 16px, since the web's 32px only applies at 640px or wider viewports; that is left for if tablets become a target.\n\n## Judgment calls\n\n- **Crossfade scope.** Implemented the prompt's recommended cheap path, animating only the two words that changed state per tick rather than per-word animated styles, bounding the cost to two animated nodes per paragraph.\n- **Reduce motion plumbing.** Used reanimated's `ReduceMotion.System` option on both the slide in and the color fade rather than `AccessibilityInfo` plumbing. The web's `prefers-reduced-motion` block kills both animations and transitions, so both now snap natively too.\n- **Easing fidelity.** The color fade uses Tailwind's real transition curve `cubic-bezier(0.4, 0, 0.2, 1)` (what `transition-colors` actually ships), not linear; the slide in uses the exact CSS ease out bezier rather than the `Easing.out(Easing.cubic)` fallback.\n- **Transparent pill hue.** The transparent pill state is focal color at alpha 0 (`t.focalA(0)`) instead of the `transparent` keyword, so the background interpolation stays inside the focal hue rather than fading through black.\n- **Scale on Text, not a wrapping View.** The 1.05 scale was applied directly on `Text` since the prompt prefers that and nothing forced the fallback; flagged for the device check.\n- **Version bump.** The working tree was clean and `app.json` was already committed at 0.7.5, so per the standing rule it was bumped to 0.7.6 for this change round.\n\n## Check on your phone\n\nOpen a book in Paragraph mode and press play, then confirm each of these on the real APK:\n\n- [ ] Confirm: the word being read looks about 5% larger than its neighbors, and it pops to that size instantly on each step without pushing the other words around or reflowing the line.\n- [ ] Confirm: swiping to a new paragraph glides it in fast then settles softly, with no hesitation at the start; bigger flicks travel farther and take longer, and going backward it enters from the other direction.\n- [ ] Confirm: as reading moves word to word, the text colors and the highlight background melt from one to the next over about 100ms instead of blinking.\n- [ ] Confirm: the highlight bubble behind the active word sticks out about 4px past the letters on each side with rounded corners, and word spacing looks unchanged.\n- [ ] Confirm: in Hybrid mode, the small context paragraph at the bottom has its words sitting a touch closer together than in the standalone paragraph view (about 6px versus 8.4px).\n\nEverything else in this package (the type check staying clean, the two-node animation budget, the tap-target geometry, and the auto-centering `onLayout` bookkeeping) was verified in code and by review.\n","kicker":"Package 14"},{"id":"15","filename":"15-reader-chrome-polish.md","title":"Reader chrome controls polish","content":"# Reader chrome controls polish\n\n**Done.** Implemented and committed as `8a14767` on `feat/native-ui-web-parity`, 2026-07-13, independent review passed with no unresolved findings. This package brought six small pieces of the native reader chrome up to exact web parity: the play and pause glyphs, the visualization mode pill, the progress bar fill, the chrome and header fade easing, the progress and scrubber typography, and slider accessibility on both tracks.\n\n## What this fixed\n\nBefore this pack, several bits of reader chrome drifted from the web. The play and pause glyphs were solid white shapes instead of hollow outlines, the visualization pill snapped between modes and fired a stray haptic, the progress fill jumped word by word rather than gliding, the chrome and header fades used reanimated's default curve instead of the web's ease out, the progress labels and the scrubber peek rendered in the wrong typefaces, and neither track was reachable by TalkBack. Each of these was a small, surgical fix that closed the gap without touching anything the approved reader feel already owned.\n\n## What changed\n\n### 1. Play and pause glyphs render as stroke outlines, not solid fills\n\nThe web coral play button (`p-5`, `rounded-full`, `shadow-lg shadow-coral-accent/30`) renders lucide `Play`/`Pause` at 32px (`w-8 h-8`) with lucide defaults: `stroke='currentColor'` (white), `fill='none'`, 2px stroke weight, and `ml-1` (4px) on `Play` for optical centering. Native was passing `fill=\"#fff\"` on both icons, so they rendered as solid filled glyphs while size 32, color `#fff`, padding 20, `marginLeft: 4` on `Play`, and the shadow already matched. The fix removed `fill=\"#fff\"` from both `Pause` and `Play` in `PlaybackButtonRow`; lucide-react-native defaults to stroke only, so the glyphs now render as white 2px outlines. Size, color, marginLeft, and shadow were left untouched.\n\n### 2. Visualization pill animates over 200ms and drops the extra haptic\n\nEach web mode button carries `transition-all duration-200`, so the coral background, white icon, `shadow-lg`, and `scale-105` of the active pill animate in over 200ms on a mode change. The order and icons are Focus=`Eye`, Ghost Trail=`ScanLine`, Sentence=`AlignLeft`, Paragraph=`AlignJustify`, Hybrid=`Layers`, all size 20, in an espresso 6% pill with 8px gaps, and the web fires `onActivity` then `onChangeVisMode` with no haptic. Native was firing `haptics.tick()` on the mode `onPress` and applying the active styling (accent background, `scale: 1.05`, elevation/shadow) instantly as a plain conditional style. The fix removed `haptics.tick()`, keeping the order `onInteract()` then `setVisMode(key)` (the now unused haptics import in `ReaderChrome.tsx` was removed), and extracted a `ModeButton` component whose shared value, driven by `active`, tweens the background color (accent at alpha 0 to `t.accent`, via `interpolateColor`) and scale (1 to 1.05) over 200ms with the reused `PRESS_EASE` curve. The icon color swap (white when active, `t.textMuted` otherwise) and the active shadow stayed instant.\n\n### 3. Progress bar fill glides 75ms per word, knob still steps\n\nThe web coral fill inside the 8px rail has `transition-all duration-75`, so each word advance eases the width over 75ms for a subtle glide during playback, while the 16px knob (`ring-2 ring-cream`, `shadow-md shadow-coral-accent/40`) has only `transition-transform` so its `left` moves stepwise. Native had both the fill width (`width: `${chapterInfo.progress}%``) and the knob `left` as plain style props re-rendered on every index change, so both stepped instantly; the knob already matched web, only the fill differed. The fix added a progress shared value in `Controls` retargeted with `withTiming(progress, { duration: 75, easing: PRESS_EASE })` on every change, and replaced the inner fill `View` with an `Animated.View` carrying an animated percent width. The knob's `left` stayed a plain style prop, stepping instantly like the web. (Not changed here, noted for a later shadow pass: the web knob shadow is coral tinted `shadow-coral-accent/40` while native still uses `shadowColor: '#000'` on both knobs.)\n\n### 4. Chrome fade and header collapse use the web's ease out curve\n\nThe web selector and controls fade with `transition-opacity duration-300 ease-out`, and the header collapses `grid-template-rows` 1fr to 0fr plus opacity with the same 300ms `ease-out`. The timing triggers, fade out 100ms after play starts, back instantly on pause, and re-hide 3000ms after the last peek or activity, were already matched on native (`PLAY_FADE_DELAY_MS` 100, `IDLE_TIMEOUT_MS` 3000) and were left alone. Native's `withTiming(..., { duration: 300 })` had no easing option, defaulting to `Easing.inOut(Easing.quad)`, a slower start with a different feel. The fix passed `easing: Easing.bezier(0, 0, 0.2, 1)` at 300ms in `src/screens/ReaderScreen.tsx` (the chrome fade). `src/components/InnerPageHeader.tsx` already carried this exact easing from a previously committed pack, so no edit was needed there. The curve differs from the prompt's stated `cubic-bezier(0, 0, 0.58, 1)`; see Judgment calls.\n\n### 5. Progress labels in Inter, peek snippet in Inter italic, kicker letterspacing 0.3\n\nThe web body font is Inter. The progress readout row under the bar (\"<Chapter title>: word X of Y\" on the left, \"NN%\" on the right) is Inter 400 14px in mocha. The scrubber peek snippet (first 9 words as a curly quoted string with an ellipsis, or an em dash when empty) is Inter 400 italic 14px mocha with truncate. The peek chapter kicker above it is Inter 500 12px uppercase coral with `tracking-wide`, which is 0.025em, meaning 0.3px letterspacing at 12px. Native was rendering the two label `Text`s with no `fontFamily` (Android's default Roboto), the snippet in `FONTS.serifItalic` which maps to `Fraunces_400Regular_Italic`, and the kicker in `FONTS.sansMedium` but with `letterSpacing: 0.6`, double the web's 0.3. The fix set `fontFamily: FONTS.sans` on both progress label `Text`s, switched the snippet from `FONTS.serifItalic` to `FONTS.sansItalic`, and changed the kicker `letterSpacing` from 0.6 to 0.3. The `sansItalic` entry already existed in `src/theme.ts` and `Inter_400Regular_Italic` was already in `App.tsx`'s `useFonts` map, so no font loading changes were needed. The copy, the 9 word slice, the curly quote characters, and the em dash fallback already matched exactly; this was purely typeface and spacing.\n\n### 6. Both tracks announce as adjustable sliders to TalkBack\n\nThe web main progress track is `role='slider'` with `aria-label='Chapter Progress'`, `aria-valuenow={chapterInfo.currentInChap}`, `aria-valuemin={1}`, `aria-valuemax={chapterInfo.totalInChap}`, and `tabIndex={0}`. The scrubber track is `role='slider'` with `aria-label='Scrub by paragraph'`, `aria-valuenow={peek.pIdx}`, `aria-valuemin={0}`, `aria-valuemax={Math.max(0, paragraphs.length - 1)}`, and `tabIndex={0}`. Native had both tracks as bare `Animated.View`s inside `GestureDetector`s with no accessibility props, so TalkBack users could not perceive or adjust either one. The fix added to the main track `accessibilityRole=\"adjustable\"`, `accessibilityLabel=\"Chapter Progress\"`, and `accessibilityValue={{ min: 1, max: chapterInfo.totalInChap, now: chapterInfo.currentInChap }}`, and to the scrubber track `accessibilityRole=\"adjustable\"`, `accessibilityLabel=\"Scrub by paragraph\"`, and `accessibilityValue={{ min: 0, max: Math.max(0, paragraphs.length - 1), now: peek.pIdx }}`. The `accessible` prop was also set on both so TalkBack can actually focus them, the parity match for the web's `tabIndex={0}`.\n\n## Judgment calls\n\n1. **Easing curve value.** The prompt named `Easing.bezier(0, 0, 0.58, 1)`, calling that CSS `ease-out`. But the web classes are Tailwind utilities, and Tailwind 3.4 (confirmed in the web repo's `package.json`, with no `transitionTimingFunction` override in `tailwind.config.js`) maps `ease-out` to `cubic-bezier(0, 0, 0.2, 1)`. The already committed `InnerPageHeader` fix uses exactly that curve with a comment explaining the same reasoning, so `Easing.bezier(0, 0, 0.2, 1)` went into `ReaderScreen.tsx` to match the real web behavior and keep both fade sites consistent, rather than the prompt's stale value.\n2. **Animation easing for the pill and fill.** The 200ms pill and 75ms fill animations were passed the repo's existing `PRESS_EASE` constant (`cubic-bezier(0.4, 0, 0.2, 1)`, Tailwind's default transition curve) instead of leaving reanimated's default easing, because the web's `transition-all` utilities use that curve; the prompt's examples simply omitted easing.\n3. **Pill background alpha, not transparent.** The pill background interpolates from `t.accentA(0)` (the accent color at zero alpha) to `t.accent` instead of the literal `'transparent'`, so the tween keeps the coral hue while fading in rather than passing through a grey tint.\n4. **The `accessible` prop on both tracks.** This went in beyond the exact props listed, because on Android a View with only `accessibilityRole` is not focusable by TalkBack; without it the required announcement never happens.\n5. **Version bump.** The state update mentioned preserving an uncommitted `app.json` bump from 0.7.2 to 0.7.3, but the working tree was actually clean at version 0.7.6, so there was nothing to preserve; per the standing rule, `expo.version` was bumped to 0.7.7 for this change round.\n6. **No `App.tsx` or `src/theme.ts` changes.** None were needed: the typography pack had already landed `sansItalic` in `FONTS` and `Inter_400Regular_Italic` in the `useFonts` map.\n\n## Check on your phone\n\n- [ ] Confirm: the big coral button shows a hollow play triangle and hollow pause bars, not solid white shapes.\n- [ ] Confirm: tapping a visualization icon at the top slides the coral highlight and the slight grow onto the new one smoothly over about a fifth of a second, and the phone does not buzz.\n- [ ] Confirm: while a book is playing, the coral progress line flows along between word positions instead of ticking, while the round knob still steps.\n- [ ] Confirm: after you press play, the controls and the top bar both fade away starting quick and settling gently, over about a third of a second.\n- [ ] Confirm: with the scrubber open (the list button), the quoted sentence preview looks like the app's normal clean italic text, not the fancy book typeface.\n- [ ] Confirm: with TalkBack on, the progress bar and the scrubber each announce themselves as adjustable sliders named \"Chapter Progress\" and \"Scrub by paragraph\" with their current position.\n\nEverything else in this package (the type check, the accessible focus plumbing, and the ModeButton refactor) was verified in code and by review.\n","kicker":"Package 15"},{"id":"16","filename":"16-accessibility-parity.md","title":"Storefront accessibility roles, labels, and states","content":"# Storefront accessibility roles, labels, and states\n\n**Done.** Implemented and committed as `d82603b` on `feat/native-ui-web-parity`, 2026-07-13, independent review passed with no unresolved findings. This package closed the storefront accessibility gaps so TalkBack users get the same semantics the web app exposes through its aria attributes.\n\n## What this fixed\n\nBefore this, the native storefront ports carried most of their accessibility labels but were missing the metadata that turns those labels into a real screen reader experience. Tappable Pressables that mirror web `<button>` elements had no button role, so TalkBack read them as plain views. The save toggle and the filter chips never announced whether they were on or off. The resume hero cover always said \"Open\" even when a book was in progress, and it stayed in the accessibility tree while it was lifted into the open transition. The toast never announced saves, and the two search inputs lost their accessible name as soon as the user typed over the placeholder. This work added roles, selected states, hidden gating, a live region, and accessible names to match the web, with no change to visuals, layout, or behavior for sighted users.\n\n## What changed\n\nFiles touched: `src/components/InnerPageHeader.tsx`, `src/components/SaveButton.tsx`, `src/components/Toast.tsx`, `src/components/rows.tsx`, `src/components/ui.tsx`, `src/screens/ResultsScreen.tsx`, `src/screens/TodayScreen.tsx`.\n\n### Issue 1: Today hero cover label, hidden state, and button roles\n\n`HeroCover` used to always set `accessibilityRole=\"button\"` with a fixed `accessibilityLabel={\"Open \" + book.title}`, even when it wrapped the resume hero, and while lifted it kept the placeholder slab fully accessible with that stale label. The web gives the resume hero cover `role=\"button\"` with `aria-label={\"Resume \" + progress.title}` and the today's pick hero `aria-label={\"Open \" + todaysPick.title}`, and while `openingSlotId === 'hero'` it drops the role, sets `tabIndex={-1}`, clears the label, and sets `aria-hidden`. `HeroCover` got an optional `label` prop defaulting to `` `Open ${book.title}` ``. `HeroResume` now passes `` label={`Resume ${progress.title}`} `` (title only, no author) and `HeroPick` stays on the default. The hidden gating, where `accessible={!hidden}`, `accessibilityRole={hidden ? undefined : 'button'}`, `accessibilityLabel={hidden ? undefined : label}`, `importantForAccessibility={hidden ? 'no-hide-descendants' : 'auto'}`, and `accessibilityElementsHidden={hidden}` all flip together when the cover lifts, was already in place from an earlier package in this run, so only the new label was wired through it. `accessibilityRole=\"button\"` was added to the `VibeRow` Pressable, the Popular see-all Pressable, the menu Pressable (which already had `accessibilityLabel=\"Menu\"`), the Resume Pressable, the Recents Pressable (which already had `accessibilityLabel=\"Recently read\"`), and the Start Reading Pressable. Their text children (\"see all\", \"Resume\", \"Start Reading\", vibe titles) supply the accessible names, matching the web where the button content is the name.\n\n### Issue 2: Library rows and the save toggle roles and toggle state\n\n`RecentRow` and `BookRow` in `rows.tsx` carried matching `accessibilityLabel` strings (`\"Resume \" + r.title + \" by \" + r.author + \", \" + pct + \"% complete\"` and `\"Open \" + book.title + \" by \" + book.author`) but no `accessibilityRole`, so TalkBack read them as plain views. Both Pressables now carry `accessibilityRole=\"button\"`. `SaveButton` had the correct state dependent labels on both tones (`\"Remove \" + book.title + \" from saved\"` when saved, `\"Save \" + book.title + \" for later\"` when not) but no role and no state, so the toggle was never announced as one. Both tones, the plain circle Pressable and the ribbon `RibbonButton` Pressable, got `accessibilityRole=\"button\"` plus `accessibilityState={{ selected: saved }}` tied to the `saved` value, mirroring the web's `aria-pressed={saved}`.\n\n### Issue 3: Filter chip state, toast live region, and header button roles\n\n`FilterChip` in `ui.tsx` had no role and no selected state, so TalkBack never said whether the chip was active. It now announces as a button with `accessibilityRole=\"button\"` and `accessibilityState={{ selected: active }}`, matching the web's `aria-pressed={active}`. The shared `Swimlane` see-all Pressable got `accessibilityRole=\"button\"`, and both `InnerPageHeader` controls, the back Pressable (label `backLabel`) and the menu Pressable (`accessibilityLabel=\"Menu\"`), got `accessibilityRole=\"button\"`. `ToastHost` was silent to TalkBack; it now sets `accessibilityLiveRegion=\"polite\"` on the bubble container `Animated.View` (matching the web's `role=\"status\" aria-live=\"polite\"`) and additionally calls `AccessibilityInfo.announceForAccessibility(toast.message)` inside the existing toast effect. The explicit announcement is the reliable path on Android because the toast view remounts on each toast id (the `key={toast.id}`), and a freshly mounted live region does not always fire.\n\n### Issue 4: Search inputs missing accessible names\n\nBoth search fields lost their accessible name once text replaced the placeholder. The Today search TextInput now has `accessibilityLabel=\"Search Focus Reader\"` (matching its placeholder and the web's `aria-label`) and the Results search TextInput has `accessibilityLabel=\"Search all books\"`, so screen readers still announce each field's purpose even after the user types into it.\n\n## Judgment calls\n\n- The prompt described `HeroCover` as always accessible with a stale label while lifted, but an earlier package in this run had already added the full hidden gating. That work was kept as is and only the new label prop was layered on top, so nothing was reverted.\n- Michael's standing rule is to bump `expo.version` in `app.json` every change round, but this run forbid touching `app.json` because another session held uncommitted changes there. The bump was skipped and left for whoever handles the commit. Every edit in this package is screen reader metadata only, with no visual, layout, or behavior change anywhere.\n\n## Check on your phone\n\nTurn on TalkBack (Settings, then Accessibility, then TalkBack), open the app, and swipe through the home screen with one finger.\n\n- [ ] Confirm: with a book in progress the hero cover reads \"Resume {title}, button\", and with no progress it reads \"Open {title}, button\".\n- [ ] Confirm: while a cover is lifting into the open transition, TalkBack skips it entirely instead of reading a stale label.\n- [ ] Confirm: every vibe row, both see-all controls, the menu circle, Resume, Recents, Start Reading, and the book rows say \"button\" after their name.\n- [ ] Confirm: the save bookmark (both the cover ribbon and the small circle on rows) announces as a button and says \"selected\" once a book is saved, flipping back when you unsave.\n- [ ] Confirm: filter chips on vibe pages announce as buttons and say \"selected\" when active.\n- [ ] Confirm: saving a book makes the phone speak \"Saved for later\" on its own, and removing speaks \"Removed from shelf\", without focus jumping.\n- [ ] Confirm: the back and menu buttons in inner page headers announce as buttons.\n- [ ] Confirm: tap into a search box, type something, then touch the box again, and it still says \"Search Focus Reader\" (home) or \"Search all books\" (results) instead of going silent.\n\nEverything else in this package was verified in code and by review: the type check passed clean, no visuals changed, and the hidden gating props were confirmed to flip together.\n","kicker":"Package 16"},{"id":"17","filename":"17-reader-dial-in.md","title":"Reader dial-in","content":"# Reader dial-in\n\nAfter the 16 parity packages landed, the reading screen got a dedicated feel pass: six auditors checked every reader view against the mined reader feel playbook and the web reference, a skeptical triage dropped anything taste based or touching the approved golden standard, and the survivors were fixed one area at a time with adversarial review and a commit each. All six are committed and pushed on `feat/native-ui-web-parity`. The app version is now 0.7.11.\n\nThis work overlaps the reader files that packages 06, 07, 08, 14, and 15 also touched. The dial-in built on top of that work rather than replacing it, and QA confirmed the earlier pack fixes are all still in place.\n\n## What changed, by area\n\n- **Playback engine and scrub physics** (`ada3971`). A flick that lands almost exactly on a word now stops instantly instead of running a dead 260ms ease over no distance. Most noticeable flicking hard into the first or last word of a book. Also re-anchored the fallback scrub density from the old 117 to the pack 07 value 116.\n- **Focus reel** (`42387a2`). During a scrub, long neighbor words now flow off the screen edge and clip cleanly, like the web, instead of getting squeezed with an ellipsis next to the focal letter. The at rest and playback rendering you already approved is byte for byte unchanged.\n- **Sentence strip** (`ee4ca2d`). Tapping a word on a moving strip now lands on the exact word under your finger, because the hit test and the paint now share one formula. Also pinned the reader text so Android's system font size setting can no longer warp the reader's geometry.\n- **Ghost trail** (`423475d`). Ghost word spacing corrected to the web's exact proportion (it was measuring against the wrong font size), so the gap widens from about 13.8px to 16.8px at the default size.\n- **Paragraph view** (`21a64a4`). Five fixes: the first word of a new paragraph appears already centered instead of jumping one word late; multi paragraph slide animations can no longer restart mid flight; the overscroll barrier reads your finger every frame instead of every other; swipe direction is judged from touch down like the web; and a blocked advance at the book's edge can no longer leave a stale flag that breaks a later scrubber jump.\n- **Reader chrome and immersive** (`d950acd`). The hidden top and bottom chrome bands used to be dead zones; tapping them now peeks the chrome like tapping anywhere else, without firing a hidden control. All chrome fades also declare the system reduce motion setting explicitly.\n\n## What to feel for on the phone (build 0.7.11 or later)\n\nThese only prove out on a real device, so they are yours to check. Tick them off as you go.\n\n- [ ] Focus reel: flick it hard into the very first word of a book. It stops crisp, with no dead hang before it settles.\n- [ ] Sentence strip: while it is moving, tap a word. It lands on the word that was under your finger, not a neighbor.\n- [ ] Paragraph view: fast flick through a few paragraphs. Each one lands with its first word already centered, not centering a beat late.\n- [ ] Reader chrome: while a book is playing, tap the very top edge and the very bottom edge of the screen. The chrome peeks both times.\n- [ ] Ghost trail: scrub through it. Spacing looks even and the words never overlap.\n- [ ] Long words: open a book with a long title word (Frankenstein works) and scrub the Focus reel. The neighbors run off the screen edge cleanly and the focal letter stays dead centered.\n","kicker":"Dial-in"},{"id":"18","filename":"18-qa-and-verification.md","title":"QA and verification","content":"# QA and verification\n\nAfter the parity packs and the reader dial-in landed, an independent QA pass re-checked all of it against the actual code, on the principle that agent self reports and reviews are not proof. Fourteen agents read the committed code and the web reference and tried to falsify every claim. A QA lead then re-verified anything surprising before writing the verdict.\n\n**Overall verdict: safe to ship.** Nothing blocks the APK build.\n\n## What was confirmed\n\n- **The research is accurate where it matters most.** Every numeric constant stated in the reader feel playbook was grep verified against live code in both repos: the pacing multipliers, the scrub physics, the densities, the focus and paragraph constants, the haptics, all of it. Every number matched. The three corrections the deep pass made to the first draft were confirmed true in code.\n- **The shipping code is clean.** All six reader dial-in commits were checked for the per frame React work that is this app's recurring on device stutter bug, and they are free of it. The scrub worklet does no per frame allocation. All 16 parity packages are present, reachable on the branch, and their claimed file lists match what git actually shows.\n- **Ground truth checks pass.** Both repos type check clean, and the web test suite (the boilerplate strip and chapter detection pipeline) passes.\n\n## What was found, and what was done\n\nSeven findings. Six were in the documentation, not the code, and all are now fixed.\n\n- Playbook stated the cover peel as about 24 degrees and credited the wrong file; it is actually up to 50 degrees in `BookOpenTransition.tsx`. This one mattered because future book lift work would reference it. **Corrected.**\n- Playbook had a self contradiction about a phantom 8px lift on the Focus reel, an overly broad claim that no JavaScript runs while dragging, and two stale line references. **All corrected.**\n- The one genuine code finding was a nit: solid tint covers used label paper white instead of the web's cream for their stitching, imperceptible on a saturated tile but a real mismatch. **Fixed and committed** (`6aefe0c`).\n- One non issue: the reduce motion additions in the chrome commit turned out to be redundant, since the animation library already honors the system setting by default. The code is correct, the commit message just slightly oversold it. No change needed.\n\n## Bottom line\n\nThe code is sound and the research is now accurate too. The path to a real installable APK is clear. Once the APK is judged on device and the feel is signed off, the remaining housekeeping is merging the `feat/native-ui-web-parity` branch into the native repo's main line.\n","kicker":"Verification"},{"id":"99","filename":"reader-feel-playbook.md","title":"Reader feel playbook","content":"# Reader feel playbook\n\n**Version 2, 2026-07-14.** This document is the settled record of how Focus Reader must FEEL, and how it got that way. Version 1 was mined from seven sessions; this version goes deeper: fifteen mined transcripts across two passes (the kinetic scrub origin, the native parity saga, the centered focus saga, the scrubber and navigation session, the immersive mode QA, the storefront gesture foundation, the bookmark iteration loops, the scene recap sessions, and the Android conversion kickoff), plus git archaeology over every feel file in both repos, which reconstructs the early June iterations whose transcripts were deleted. Every constant below was cross checked against the current working trees of both repos (web at commit be846a8, native branch feat/native-ui-web-parity at commit 295bbb7) on 2026-07-14. Historical values are marked as historical.\n\nTwo ground rules before anything else:\n\n1. **The web app is the spec.** Native must match it exactly, not approximately. \"in the web view, it works perfectly exactly, but it in the native app it is very clunky.\"\n2. **Feel verdicts come only from Michael's thumb on a real phone.** Synthetic browser measurements passed repeatedly while the device felt choppy. Web QA of the native build covers logic, boot, resume, and navigation only; reanimated's frame loop never runs on web, so pacing and gesture feel are device only.\n\nAnd the standing rule of this document: **do not relitigate anything in here without new feedback from Michael.** He has said, about interaction nuances agreed in earlier sessions: \"we already had a deep conversation about all of the nuances of how this should interact earlier... ask what you need but try to find answers you should already have.\"\n\nA striking fact from the git archaeology: almost no feel constant has ever been re tuned. Each value was set once at introduction and survives. The delay multipliers are untouched since the 2026-02-09 initial commit; the reader gesture thresholds since 2026-05-30; the kinetic scrub constants since their birth. The only true re decisions in the whole history are the default focal placement (third in to middle, 2026-06-15), the Sentence view architecture (fade swap machine deleted for the kinetic strip), the native drag densities (spike guesses re anchored to measured web values), and the book pickup follow model (rubber band replaced by the weighted low pass). When a constant is right the first time, it stays; when Michael re decides, the old approach goes on the rejected list forever.\n\n---\n\n## The direction in Michael's own words\n\nEvery load bearing verbatim quote, grouped by theme. Voice dictation filler is kept as spoken.\n\n### The physics he wants\n\n> \"on the Single word view, for instance, when I scroll it'd be kinda like a date picker on an iPhone, where you can just kinda flick it and all the words fly by really fast and then they gradually slow down. Or if I go... if I scroll slowly, it would just be one word at a time.\"\n\nThe canonical analogy for the whole app. iOS date picker physics: flick means fast flyby with gradual deceleration, slow drag means one to one word stepping.\n\n> \"Okay. Great job on the single word view. It's very smooth. When I swipe it up, it it slowly... it's very smooth. It's not jagged. And when it kinda, like, uh, doesn't quite land on a letter, it very smoothly, uh, snaps to it, which is great. Feels great. That's how I want all of these to feel.\"\n\nThe tuned Focus reel is the golden standard. Smooth, not jagged, eased landing. This is the acceptance bar for every view.\n\n> \"So on the single word view, the scroll feels nice when I flick it as a very nice, uh, feeling to it.\"\n\nThe coast itself (FRICTION_K decay) passed on the first try and was explicitly liked. Only the landing, neighbor visibility, and play handoff were ever fair game after this.\n\n> \"When I slide it left and right, it's like chop, chop, chop, chop, chop. It's not smooth at all. It, like, instances each word is what it seems like.\"\n\nDiscrete word stepping reads as broken. Motion must be continuous pixel motion, never index increments.\n\n> \"it still feels choppy, it needs to smoothly scroll across\"\n\nHis rejection of the second Sentence rebuild, which had passed synthetic checks. He judges on the phone; anything that reads React or the DOM per frame fails there.\n\n> \"can you please put some lines in the book when it's peeking open. not straight lines but like simulating text. also make it so it's not 1:1 responsive with the finger. there should be some weight to it to make the interaction feel better\"\n\nThe weight doctrine. A picked up object trails the finger with mass, never tracking one to one. This produced FOLLOW_TAU (0.09 raised to 0.17), the tuning he later called perfect.\n\n> \"shouldn't we make so that the book being lifted up is responsive to the person finger, not like the person can drag it all over the screen, but with a hit area and it should move faster the closer it is to the original location and slower the farther it gets. is this making sense?\"\n\nHis own earlier words for tethered follow physics. Objects feel alive under the finger, never free floating and never rigid. (The specific rubber band implementation this produced was later replaced by the weighted low pass, but the intent statement stands.)\n\n> \"we need some kind of barrier. I actually don't know if I want you to do this. What do you think? How should we handle this? because if I swipe up really hard, I kinda want to go And then, you know, just fly through paragraphs. You know what? Let's do this. On a flick up, swipe a couple paragraphs like a strong flick up. Swipe a couple paragraphs and then have it slowly land at the top of, uh, the following paragraph after those couple fly by.\"\n\nHe designed the paragraph barrier himself, out loud. Reaching the edge does not advance; deliberate overscroll advances one; a hard flick flies a couple then slowly lands at a top.\n\n> \"And if you can make the threshold a little bit stronger than if I just kinda swipe up normal, it doesn't it doesn't jump to, like, the middle of the next paragraph. And then on a big flick, have it have it shoot a couple paragraphs up.\"\n\nThe two tier gesture vocabulary in Paragraph view, and the absolute rule that momentum never lands you mid paragraph.\n\n### Visual calm and the centred word\n\n> \"I don't want the actual words above and below to show all of the time. That's very disconcerting.\"\n\nVisual calm at rest. The Focus view is one clean word when nothing moves. Context earns screen space only during motion.\n\n> \"I only want the words above and below to show when I flick, and they should fade. They shouldn't be a static, um, a static opacity when I'm flicking. They should they should fade out. And when the flick lands, it kinda snaps into place, and I don't want it to snap. I don't want it to, like, smoothly, slowly get to its word.\"\n\nNeighbor opacity must be dynamic and tied to motion speed, melting out as the flick dies, and landings must be a smooth ease, never a hard snap. (The last sentence is a dictation stumble; his intent, confirmed by his later praise, is that it SHOULD smoothly, slowly get to its word.)\n\n> \"as as the as the flick is landing, the other... the words above and below should fade out.\"\n\nThe neighbor fade out and the settle are one combined moment.\n\n> \"this solutions doesn't work for me, commencment is cut off, and I don't like the focused letter not being in the center. I never Would have had you do this if I would have known what you were talking about when you were talking about sketchy radicals or whatever the hell you called it. I want the focus letter in the center. I want you to talk to me and play English and not use fancy words or acronyms. What are options here? You could turn the phone sideways, but then... but they have to hold it that way, and that's a lot less comfortable than holding it vertically. Think about ways to solve this while maintaining the experience and the central focus point.\"\n\nThe pivotal rejection of the off centre Spritz pin (\"sketchy radicals\" is his mangling of \"Spritz reticle\"). Three doctrines in one turn: the focal letter sits dead centre on screen, non negotiable; landscape rotation is rejected as less comfortable; and everything gets explained to him in plain everyday English, because he approved a change he did not understand and it stung.\n\n> \"How do you suppose we tackle this issue? I don't like the Idea of resizing dynamically as that would break the focus\"\n\nHis up front veto on dynamic per word resizing as the default. The research corpus later confirmed it: a size that pulses word to word is the \"strobe light\" instability. Shrink survives only as an opt in mode and as a silent backstop.\n\n> \"make all the words have a center highlight. actually, make all these different solutions  configurable in settings. Do the default one that we started with. Do the one where just the big words are made a little smaller. Do the ones where just the big words are... have the center highlights so they're moved over a little more to the left so they fit better. Do the ones where every word is centered.\"\n\nThe fitMode pivot: rather than pick one long word strategy, ship all four as a user setting so he and users can feel them and choose. Reading feel tradeoffs become settings, not unilateral defaults.\n\n> \"ok. change \\\"classic\\\" to be a slightly smaller text so nothing gets clipped, call \\\"classic\\\" something else and change the name of \\\"Center every word\\\" to \\\"classic\\\" and make it first on the list.\"\n\nThe final fitMode ruling, overriding the research matrix recommendation. Centre every word is \"Classic\", first and default. Nothing in the app ever clips.\n\n### Pacing\n\n> \"ok a little better. The pacing is all off, it stops longer in random places, review the rules and pacing in the web app and make sure the native app matches it.\"\n\nThe core pacing complaint. Playback rhythm must be even; an unexplained hold on a random word breaks reading flow instantly and he notices every time.\n\n> \"no it's still stopping in random places, also every time you make a change please update the version number at the bottom, so  after the changes you make for this it should say 0.7.2\"\n\nSecond rejection of the same bug, plus the version bump rule: he verifies every round by the version at the bottom of Today.\n\n> \"try again\"\n\nAfter two failed pacing passes he wanted no more explanation, just a deeper attempt at the root cause.\n\n> \"you QA it and test it\"\n\nAfter two rounds of being the test harness he expects the assistant to prove a pacing fix itself (automated timing comparisons, live QA) before handing it back for a device feel check.\n\n### Smoothness and the native bar\n\n> \"1. this is going to be an app people download on the google play store. you saying \\\"chrome\\\" makes me think you don't know that.\\n2. It's important to me that everything feels butter smooth and therefor uses as many native components as possible. are you sure it's wise to just use the existing gesture code? \\n3. or any other existing UI code for that matter?\"\n\nSmoothness is the nonnegotiable bar, and on Android he defines it as truly native. He is actively suspicious of reused web code in the interaction layer. This produced the doctrine \"keep the recipe, not the code.\"\n\n> \"the feel is mostly there, we'll dial it in later. start the full conversion please\"\n\nThe native feel spike passed with the web constants ported verbatim. A device dial in session is still owed (see Open threads).\n\n> \"ok it's working but it doesn't look anything like my app, is this just a test screen to make sure it works?\"\n\nHe measures anything native against HIS app instantly; a bare test rig is tolerable only once explained as deliberate.\n\n> \"the reader isn't workign properly. in the first (single word) view every word jumps up and down. it should stay perfectly center. in the second view the words overlap. in the third view the words move at 1000 wpm when it's set to 300 wpm. please throroughly qa and fix the reader view\"\n\nThe three native display bugs in one report. Note the third: perceived pace is real pace. The Sentence engine was timed correctly the whole time; the lurching render read as 3x speed.\n\n> \"is this consequential at all? I'm building a native app here what does it matter if doesn't work as a website?\"\n\nOn device feel is the only thing that counts for the native app. The Expo web build is never a proxy for feel.\n\n### Continuity, and the finger always wins\n\n> \"there is a bug in the reader view where when you try to scroll the actual text it goes back. the functionality should be text moves up and down when i scroll\"\n\nThe baseline: touching text moves text, never navigates away. This bug report started the entire kinetic scrub project.\n\n> \"i think playback should pause if i start scrolling don't you?\"\n\nHe proposed pause on scroll himself. Nothing fights the finger for position.\n\n> \"something happened with the book load. it was much smoother before, now it takes a while to load and the book gets put back down when it's done loading. the book should stay floating the whole time\"\n\nContinuity of motion is sacred. Once the user commits, the object never retreats or resets. His reaction to the fix: \"ahhh thats better.\"\n\n> \"it appears that after flicking, the play doesn't actually play, or it does. It's just... it... it's very touching, I guess. ... I think maybe if it's not on the word exactly and you hit play, it doesn't play. I don't know. There's something going on there. Check that out.\"\n\nThe play after flick bug (\"touching\" is likely \"touchy\"). Play must cancel in flight momentum and read from wherever you are.\n\n> \"can you differentiate between a scrolling touch and selecting touch, currently just trying to scroll through picks up the book\"\n\nOrigin of the swipe versus select doctrine. Any drag on a scrollable surface is a scroll; pickup requires a tap or a deliberate hold.\n\n> \"it should go towards the persons finger. we already had a deep conversation about all of the nuances of how this should interact earlier, either in this session or a different one. ask what you need but try to find answers you should already have. concerning the horizontal scroll, it's the same with the vertical scroll. idk how other apps do it but they can tell the difference between me trying to swipe and navigate vs me trying to select. we need to do the same\"\n\nThe definitive gesture doctrine: finger follow is mandatory, and swipe/navigate versus press/select is disambiguated on both axes the way native apps do it, by time and platform, not direction. Also: settled nuances are law; recover them, do not re ask.\n\n> \"No that wasn't it, they are not responding at all. we are going backwards fast, stop messing things up. I specifically asked you to give me a slower drag on the finger yesterday and when i left last night it was perfect, now it doesn't work at all on my phone or on desktop. FIX THIS IMMEDIATELY!!!\"\n\nRegression fury. The weighted finger follow (\"slower drag on the finger\") is a protected, loved behavior, and breaking a declared perfect feel while tuning something else is the cardinal sin.\n\n> \"1, doesn't work, I must tap to open a book, click and drag is completely non responsive.\\n\\nI don't want you to revert as we have done MUCH work since then, I want you to figure this out and fix it.\"\n\nFix forward doctrine. Never revert accumulated work to escape a bug; diagnose and repair in place. (The one exception: when iteration has actively drifted from the goal, he orders a full revert to the last good baseline himself, as he did on the bookmark: \"undo everything you just did.\")\n\n> \"it mostly works, still a few issues, but i think we just table for now as it'll prbably change when we flip to android, what do you think?\"\n\nPragmatic tabling: do not over polish mobile web gesture edge cases, because touch semantics change in the native target.\n\n### Navigation without stopping the train\n\n> \"We've built a bullet train for reading, but right now, the user has no easy way to check the map or change stops without bringing the whole thing to a grinding halt.\"\n\nThe framing that produced the scrubber. His long brief named three problems: frontmatter friction, blind wayfinding (\"Word 45,000\" means nothing), and the cognitive context switch (a TOC modal \"shatters the exact immersion the tool is designed to build\"). Navigation must live inside the temporal reading modality.\n\n> \"give me a ui scrubber to navigate across scrubbers, get rid of the start over button and instead make it some icon that would mean this and then all the controls swap out with the scrubber while it's active. ask if you have questions before starting\"\n\nThe scrubber commission (he meant \"navigate across chapters\"). The scrubber is a mode: all reader controls swap out for it while active.\n\n> \"I want it to be easy to go across both paragraphs and chapters, I think scrub paragraph and give like a double arrows flanking the scrubber to switch chapters\"\n\nTwo navigation grains on one surface: the track scrubs by paragraph, chapter jumps are discrete chevrons.\n\n> \"since paragraph scrubbing just show first few words of sentence in paragraph\"\n\nThe live peek while dragging: first words of the target paragraph, so you never navigate blind.\n\n> \"ok next feature! we need to retain where someone was at in a book regardless if they start a new book. additionally we need a recents section. ... I think getting rid of restart in general, or severely hidden it in the IA of the reader view in a book is a good call because someone is going to be PISSED if they lose their spot on a fat finger.\"\n\nReading position is sacred. Per book position always retained; no destructive control within fat finger reach in the reader. Restart was deleted entirely; dragging the scrubber to the start is the only start over.\n\n> \"This is probably over kill, but could it be by scene? or event? like you know how youtube videos have timestamps of the diff topics?\"\n\nThe scene map idea in his words: position expressed as narrative scenes, like YouTube chapter timestamps. It became the authored scene labels and spoiler safe recaps on the scrubber and resume hero.\n\n> \"Wait what? I'm so confused. I just want the summaries on the scrubbers of the front page and vibe books, what in the fuck are you talking about a llama for?\"\n\nScrubber summaries are plain authored text shipped with the app. No local LLM, no pipeline, no cloud, ever.\n\n### Motion restraint, immersion, and craft\n\n> \"I don't think it needs as dramatic as an interaction as you have. I think if it just maybe expands ten percent or twenty percent or maybe goes down ten percent or twenty percent, not as not that you have a goal in, like, fifty percent or something right now. Just a little little app animation.\"\n\nThe animation restraint doctrine: micro interactions move roughly 10 to 20 percent, never dramatic 50 percent transforms. A settle, not a show.\n\n> \"I don't like that they come off of the top of the book title when they're clicked. That's very immersion breaking.\"\n\nImmersion is a hard criterion. Elements stay physically attached to their object; motion that detaches from the physical metaphor is disqualifying.\n\n> \"You're right that it is very granular at the phone level and this little icon on it, but these are the details that are gonna make this stand out. So you need to get it right.\"\n\nPhone scale micro details are the product's differentiator. Tiny is not an excuse.\n\n> \"Maybe, like, the first time on load, it just kinda, like, wiggles a little. Like, it kinda moves up and down a little so people know that it's there and that it's interactable.\"\n\nHis affordance pattern: one small one time motion on first appearance to teach tappability, then it settles. Transferable to teaching reader gestures.\n\n> \"So maybe you need to change the image you're working with instead of trying to apply all these effects to it.\"\n\nMethod doctrine: when a feel target keeps missing, stop layering compensating effects on the wrong base and rebuild the underlying medium. He detects and rejects faked physicality (shaders, gradients standing in for real geometry) every time.\n\n> \"Make the transition feel calm and intentional, consistent with the cozy, warm aesthetic.\"\n\nFrom his immersive mode PRD. Chrome motion is calm and cozy, never snappy or mechanical. The reading field is the \"espresso field.\"\n\n> \"Keep all controls one gesture away — never buried, never modal.\"\n\nImmersion never costs reachability; one tap restores everything.\n\n> \"remember to optimize for mobile. there is no mouse on mobile, only taps. go ahead and make it so that the tap on gives interesting interactions on all the elements, and the tap off is the actual \\\"click\\\". ... keep them subtle, and above all else do not interfere with the user experience\"\n\nThe founding interaction doctrine: press previews, release commits, everything subtle, and no gesture may ever fight scrolling.\n\n> \"fix but not at the expense of the general use, we put a lot of work into that interaction and I don't want to lose it. so if it's like add a tag or something thats fine, but don't change the base experience\"\n\nOnce a gesture feels right it is protected. Accessibility and refactors bolt on around it (the autoCommit path); they never alter it.\n\n> \"obviously if someoen changes a setting it should stay that setting, I'm just giving you a default\"\n\nDefaults are for fresh installs only. Never write a migration that stomps a chosen setting. Applies to theme, mode, WPM, fitMode, everything.\n\n### Speed of getting to the words\n\n> \"just a question, don't act just tell me: is there a way to cut down on the delay between clicking the book and getting to read it in the focus reader?\"\n\nTap to reading latency is a feel problem he cares about deeply. He built prefetch on touchdown himself over a weekend to attack it.\n\n> \"How are serving up these books? the ones on the front page load into the reader instant but the ones in cozy corners take 5 seconds\"\n> \"NO I NEED you to think harder about this, what is the best and fastest and most performant way to serve people the books they want to read?\"\n\nHe rejected the incremental fix (cache after first read) and demanded a first principles answer. Result: the build time mirror plus the three tier fetch ladder; a mirrored book opens in ~9ms versus ~8000ms live. Opening a book into the reader must feel instant.\n\n---\n\n## Pacing rules\n\nThe playback timing model is identical on web and native, verified word for word by an automated side by side test (16 of 16 pass, millisecond identical timings even on a deliberately janky frame timeline).\n\n### Per word delay multipliers\n\nLive in `src/utils/textProcessing.ts` (web) and `Focus Reader Android/src/textProcessing.ts` (native, verbatim copy whose header states \"these constants ARE the reading feel\"). Every value below was set in the 2026-02-09 initial commit and has never been re tuned. The comments cite the RSVP research: punctuation multipliers approximate natural reading pauses.\n\n| Constant | Value | Meaning | History |\n|---|---|---|---|\n| base delay | `60000 / wpm` ms | one beat per word | initial commit, unchanged |\n| `DELAY_SENTENCE_END` | 3.0 | words ending `.!?` hold three beats. **Assignment, not addition**: it overrides any long word extras on the same word. This is also the only pause at paragraph ends today. | initial commit, unchanged |\n| `DELAY_COMMA` | 2.0 | words ending with a comma hold two beats (also an override) | initial commit, unchanged |\n| `DELAY_MINOR_PUNCTUATION` | +0.5 | added for words ending `;` or `:` | initial commit, unchanged |\n| `DELAY_LONG_WORD_8` | +0.2 | added for words longer than 8 characters | initial commit, unchanged |\n| `DELAY_LONG_WORD_12` | +0.3 | further added past 12 characters (cumulative with the +0.2) | initial commit, unchanged |\n| `DELAY_PARAGRAPH` | 5.0 | **Live code, dead behavior.** A `[P]` token would hold five beats, but tokenization (2026-02-13) consumes `[P]` markers as paragraph boundaries and they never become timed tokens. Paragraph breaks add no extra pause beyond the sentence end 3.0x. Michael was invited directly to say whether a paragraph break should \"breathe\" and never answered. Do not wire it up without asking. | dormant since 2026-02-13 |\n\n`DEFAULT_WPM` is 300 (`src/store/useStore.ts`). The default WPM control lives in Settings as preset chips from 200 to 600, set in the Settings/About session (commit 4308fd4); the in reader speed control still adjusts live. On native the WPM stepper is ±50 per tap clamped 100..1000 (`ReaderChrome.tsx`); it was ±25 in the spike and was doubled in the d1640f5 reconcile.\n\nProgress saves every 2 seconds during playback (`PROGRESS_SAVE_INTERVAL_MS` 2000 in web `src/App.tsx` and native `ReaderScreen.tsx`), plus on pause, on app background, and on exit, because Android kills apps without running unmount cleanup (native commit 52c0613 fixed the save only on exit bug found in the parity audit). Two accounting rules from parity pack 10 (295bbb7): saves fire only when the index actually changed since the last persisted value (sentinel −1, so index 0 counts and merely opening a book records it at 0%), and zero word or zero millisecond play spans are discarded, because a zero word span grows msRead with 0 words and permanently drags the persisted average WPM down.\n\nPlayback also pauses on visibility loss: web listens to `visibilitychange` and calls `rsvp.pause()` on screen lock or app switch (commit e758e4a, from the Android readiness audit, so timing never drifts in the background and reading stats never inflate); native uses an AppState listener that auto pauses whenever the app leaves active (8be93b8), plus keep awake while reading, plus a navigation beforeRemove listener that pauses on Android system back (295bbb7).\n\n### Sentence mode extras\n\nIn `src/App.tsx` lines 23 to 25 (web) and `useReelEngine.ts` (native), applied **only when visMode is 'sentence'**. All three born 2026-02-13 with the multi view reader, values never changed:\n\n- `SENTENCE_START_MULTIPLIER` 1.8: the first word of a sentence holds longer.\n- `SENTENCE_START_OFFSET` 500: a flat 500ms added at sentence starts. (One earlier summary mislabeled this a paragraph breath. It is a sentence start offset. The code is the truth.)\n- `LINE_START_MULTIPLIER` 1.5: extra beat at each visual line wrap. **Vestigial on web since 2026-07-05**: the kinetic Sentence strip no longer reports line break indices (`onLineBreaksChange` is accepted but unused), so the multiplier no longer fires there either. On native it was never wired (TODO in the engine header, pending onTextLayout line measurement). Effectively the 1.5x is dead on both platforms today; know this before \"fixing\" a perceived divergence.\n\n### End of book and live speed changes (parity pack 06)\n\n- The word at the readable end serves its FULL dwell (e.g. 3x for a closing period) before playback completes; it does not get cut short.\n- A WPM change mid play resets the accumulator so the on screen word gets a fresh full dwell at the new rate (matches the web's rAF restart on WPM change).\n- Playback and progress are clamped to `readableStartWord`/`readableEndWord`: front matter (title page, copyright, TOC) is skipped at high or medium chapter confidence, back matter (index, glossary, ads, colophon) is clamped out conservatively (appendix, footnotes, endnotes deliberately kept), and a fresh book opens at the first readable word. A stored position of 0 never opens a book in front matter (pack 10 opening rule: explicit positive startIndex wins, everything else falls to the first readable word).\n\n### The clock itself, and why it is built this way\n\nThe pause rules were never the source of his pacing complaints. Both \"stops longer in random places\" bugs were frame loop lifecycle bugs, and these are the guardrails:\n\n1. **The frame worklet must be one stable memoized function, created once per book, reading only shared values** (`Focus Reader Android/src/reader/useReelEngine.ts`). The original inline worklet got a new identity every render, so every word swap tore down and re registered the frame callback, re serialized the whole book's delay table (~100k entries) to the UI thread, and stopped the reading clock for however long the phone happened to be busy. Measured cost: ~142ms of random extra hold per word on the old engine, zero on the new one. The stall tracked phone load, which is exactly why it felt random. Fixed in 1ad5ac3 (v0.7.2).\n2. **Playback accumulates the RAW wall clock frame delta.** `rawDt = fi.timeSincePreviousFrame ?? 16` drives `acc.value += rawDt`. The capped copy `dt = Math.min(64, rawDt)` exists only for fling coast and speed sampling, matching where the web clamps. Capping the playback delta made UI hitches stretch every word and was rejected as a fix on its own; it was real divergence but not the root cause.\n3. **Pressing Play cancels any in flight fling first** (guarded `stop()` in the web engine, equivalent in native), so playback reads from the word on screen with zero lurch. Letting inertia keep coasting after Play made Play feel broken.\n4. **During playback the displayed word pins to the committed integer React index.** The continuous UI thread `pos` drives the reel only while `interacting` (dragging, fling, or settle: `dragging || mode===2 || mode===3` as a shared value). Driving playback position from `pos` desyncs from React's index by one frame and every word visibly lurches before snapping. This was the \"every word jumps up and down\" bug (fixed 42e3fda).\n5. **Perceived pace is real pace.** The Sentence strip once read as 1000 wpm while set to 300 because async onLayout measurement lagged each step and the strip lurched. Engine timing was identical the whole time. If a view lurches, Michael reports it as a speed bug; fix the rendering, not the clock.\n6. **The engine hydrates once, to the true opening position, when tokens stream in.** An earlier version locked the start position before text loaded and always opened at file word 1, ignoring the saved spot and the title page skip.\n7. **Never write the store during render.** The session tracker once called addSession inside a setState updater and re rendered other subscribers mid render (fixed 56db3d1, play span in a ref). Reader exit pauses BEFORE saving so the in flight span lands in stats.\n\nThe engine architecture: a requestAnimationFrame loop with a time accumulator on web (`useRSVP.ts`, frame rate independent since the initial commit); a state machine on the phone's drawing thread on native, with per word delay tables mirrored to shared values once at book load.\n\n---\n\n## Scrub and inertia rules\n\n### The shared engine\n\nWeb: `src/hooks/useKineticScrub.ts`, one engine for every reader view, all feel knobs in one file (deliberately, for one file tuning). Native: `Focus Reader Android/src/reader/useReelEngine.ts`, rebuilt from scratch on the UI thread under the doctrine \"keep the recipe, not the code\": the scrub PHYSICS run entirely in UI-thread worklets with no per-frame JavaScript, while the reel RENDER intentionally mirrors the web by pushing one React update per changed frame during a drag (via `useReelFrame`); only the tuned numbers and pure logic carried over. The conversion plan carries an explicit warning **not** to use reanimated or gesture handler's built in fling and decay physics, because their friction model differs from the tuned feel; the custom friction loop was rebuilt with the exact web numbers instead.\n\n**Web and native use the same physics constants verbatim**, confirmed live in both files on 2026-07-14. All were born 2026-07-05 (web commit be846a8, native spike 78340a8) and none has ever moved:\n\n| Constant | Value | What it is |\n|---|---|---|\n| `FRICTION_K` | 0.0035 | Exponential fling decay per ms, `v *= exp(-FRICTION_K * dt)`. A hard flick coasts a bit over a second. This IS the flick feel Michael likes (\"the scroll feels nice when I flick it\"). Do not touch it. |\n| `HANDOFF_V` | 0.004 steps/ms | Below this speed the coast hands off to the eased settle |\n| `SETTLE_MS` | 260 | Duration of the easeOutCubic glide onto the nearest whole word. The \"smooth settle instead of snap.\" |\n| `MAX_V` | 0.4 steps/ms | Release velocity cap so one flick cannot rocket away |\n| `TAP_PX` / `TAP_MS` | 8 / 250 | Scrub axis movement under 8px released within 250ms counts as a tap (peek), not a scrub. On native, cross axis dri
