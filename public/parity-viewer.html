nge only shows on taller nav bars.\n\n### 5. Vibe pages end with 28px less bottom whitespace\n\n**What the web does.** The vibe content is a `<section className=\"mb-7\">` (28px bottom margin, `StoreFront.tsx` line 753) inside a main whose padding-bottom is `max(3rem, env(safe-area-inset-bottom))` (lines 737 to 740). Scrolled to the end there is 28px + 48px = 76px of space after the last swimlane.\n\n**What the native app does.** `VibeScreen.tsx` (content starts around line 141) renders its children straight into PageShell with no trailing margin, so the end-of-scroll gap is just PageShell's 48px.\n\n**What to change.** Add 28px of bottom margin to the VibeScreen content (a wrapper style or an `extraBottom` style hook on PageShell, whichever is cleaner) so the end-of-scroll gap is 76px like the web. Do this after issue 4 so the base is the corrected 48px formula. Other inner pages built on the same web section pattern may share this gap; if you notice one while working, check the web wrapper for that specific page before copying the margin, since some web tabs use different wrappers.\n\n### 6. Theme and light/dark switches snap instead of cross-fading over 300ms\n\n**What the web does.** The body element carries `transition: background-color 0.3s ease, color 0.3s ease` (`src/index.css` lines 42 to 49). When `App.tsx` (lines 69 to 87) rewrites the CSS variables on a theme or mode change, the page background and default ink cross-fade over 300ms. Individual components without their own transitions still snap; only the body layer fades.\n\n**What the native app does.** `useTheme()` (`src/theme.ts` lines 140 to 156) returns plain color strings; every backgroundColor and color re-renders to the new value in one frame, so the whole app snaps instantly.\n\n**What to change.** Animate at least the page-level background (PageShell or the screen root) and the default text color across theme changes with a 300ms ease timing. A clean approach with reanimated 4: keep a shared progress value, snapshot the previous palette when `themeIndex` or `mode` changes, kick the progress from 0 to 1 with `withTiming(1, { duration: 300, easing: Easing.ease })`, and drive the shell's colors through `interpolateColor(progress, [0, 1], [prevColor, nextColor])`. The web only fades the body layer, so a full app-wide animated color system is NOT required; matching the page shell background and its default text color is faithful parity. Make sure the reader screen's own background does not double-animate if it manages its own colors.\n\n## Acceptance checklist\n\n- [ ] The Android launcher shows the app as `Focus Reader`, the adaptive icon plate behind the (still stock) foreground art is warm beige `#F3EAD9`, and the splash screen background is warm beige instead of plain white, with the existing uncommitted `predictiveBackGestureEnabled` entry in app.json preserved.\n- [ ] On any long storefront page, scrolling down carries the warm glow up and off the screen with the content instead of the glow staying pinned to the top of the viewport, and the wash spans page-scale dimensions rather than a fixed 420px band.\n- [ ] Stats, Settings, and About show only the mustard top-center glow with no coral glow in the top-right corner, while Today, Library, Notebook, Vibe, and Results still show both.\n- [ ] On a device with a tall bottom nav bar (inset above 32), the space under the last item of any PageShell screen equals the inset exactly rather than inset plus 16; on gesture-nav devices nothing visibly changes.\n- [ ] Scrolled to the very end of a vibe page, there is 76px of empty space after the last swimlane (28px margin plus the 48px shell padding).\n- [ ] Changing theme or toggling light/dark in Settings fades the page background and default text color smoothly over about a third of a second instead of snapping, and colors land exactly on the new palette when the fade ends.\n\n## Verification\n\n1. Type-check the native repo: run `npx tsc --noEmit` in `C:/Users/Michael/Desktop/Focus Reader Android` and fix any errors you introduced.\n2. Reason through the running behavior carefully: re-read PageShell after your edits and confirm the wash is inside the scroll content, the padding formula is exact, the single-wash prop reaches all three More screens, and the theme fade cannot leave a stale color if the user switches themes twice quickly (the snapshot of the previous palette must update per switch).\n3. Do NOT use the Expo web build to verify anything. Its dev server opens blank localhost tabs in the real browser and the web bundle breaks on zustand's import.meta. It proves nothing about the Android app.\n4. On-device checking is done by Michael on his Android phone. End your session by telling him exactly what to look at, in plain everyday English, along these lines: check that the app on your home screen is now called Focus Reader and the icon sits on a warm beige circle instead of pale blue. Open the app and watch the very first flash of the launch screen, it should be warm beige, not white. Scroll down a long page like Library and watch the warm glow at the top, it should slide up and away with the page instead of staying put. Open Stats, Settings, and About and look at the top right corner, the faint reddish glow should be gone there but still present on the home page. Open a vibe page like Bedtime and scroll to the very bottom, there should be a bit more breathing room after the last row of books. Finally go to Settings and switch the theme and light or dark mode, the page color should melt into the new one over a blink rather than jumping instantly.\n\n## Final note\n\nWhen summarizing your work for Michael, use plain everyday language, skip jargon, and avoid dashes in prose sentences (use commas or periods instead). Hyphens are fine inside file paths and code identifiers.\n\n---\n\n## Outcome, recorded 2026-07-13\n\nImplemented in commit `d34a4d3` on `feat/native-ui-web-parity` in the native repo.\n\nFiles changed: `app.json`, `package.json`, `package-lock.json`, `src/components/ui.tsx`, `src/theme.ts`, `src/screens/ResultsScreen.tsx`, `src/screens/StatsScreen.tsx`, `src/screens/SettingsScreen.tsx`, `src/screens/AboutScreen.tsx`, `src/screens/VibeScreen.tsx`.\n\n### Issue by issue\n\n**1. App identity (name, adaptive icon color, splash)** (done)\n\nexpo.name is now Focus Reader, slug untouched, adaptive icon plate is warm beige #F3EAD9, expo-splash-screen plugin added with the existing splash-icon.png on a #F3EAD9 background. predictiveBackGestureEnabled preserved. The stock blueprint backgroundImage was removed so the beige plate can actually show (Android prefers the image over the color). Icon foreground, monochrome, and splash image remain stock Expo art, which the prompt said not to redraw.\n\n**2. Washes scroll away with content and use page scale dimensions** (done)\n\nPageWash now renders inside the scroll content as a zero height first child slot, so the glow slides off with the page. Geometry matches the web exactly: mustard 120% width by 80% page height at (50%, minus 10%), coral 90% by 60% at (100%, 0%), with page height measured from the ScrollView content (floored at window height). Results, being a virtualized FlatList, puts the wash in its list header sized on the window floor, which the prompt allows.\n\n**3. Stats, Settings, About get only the mustard wash** (done)\n\nPageWash and PageShell gained wash?: 'single' | 'double' defaulting to 'double'; the three More screens pass wash=\"single\" so the coral top right ellipse is omitted there.\n\n**4. PageShell bottom padding formula** (done)\n\nNow Math.max(48, insets.bottom) in PageShell, and ResultsScreen's hand rolled copy became 28 + Math.max(48, insets.bottom) to drop the same extra 16.\n\n**5. Vibe pages end with 76px of whitespace** (done)\n\nAll VibeScreen content is wrapped in a View with marginBottom 28, mirroring the web's section mb-7, on top of the corrected 48px shell padding.\n\n**6. 300ms theme cross fade** (done)\n\nNew useThemeFade hook in src/theme.ts drives the page shell background through interpolateColor with withTiming 300ms on the CSS ease curve bezier(0.25, 0.1, 0.25, 1). A second switch mid fade snapshots the color currently on screen as the new start, so it always lands exactly on the new palette. Applied in PageShell and the Results root. Text color is not animated because React Native has no inherited default text color (see decisions). The reader keeps its own plain colors, so no double animation.\n\n### Judgment calls made during implementation\n\n1) Removed expo.android.adaptiveIcon.backgroundImage (the stock pale blue blueprint PNG). Android uses the image instead of the color when both exist, so keeping it would have made the beige plate invisible. Foreground and monochrome stock art kept, per the prompt. 2) Installed expo-splash-screen ~31.0.13 via npx expo install, since the config plugin cannot resolve without the package; used the template defaults (imageWidth 200, resizeMode contain) with the warm beige background. Verified with npx expo config --type prebuild that the plugin resolves. 3) Bumped expo.version 0.7.8 to 0.7.9 per the standing version bump rule. The tree was clean at 0.7.8 when I started (the expected uncommitted 0.7.3 bump had already been committed by earlier rounds), so nothing was overwritten. 4) The fade animates the page background only, not a default text color. React Native has no inherited body text color, every Text already sets an explicit theme color, and on the web those same texts snap too because their colors come straight from the CSS variables. Background only is therefore the faithful twin of the web's body layer fade. 5) Results page: the wash is sized on the window height floor because the Browse list is virtualized (988 cards, tens of thousands of pixels of content), so content height sizing would allocate an absurd SVG. Also set removeClippedSubviews to false on that FlatList so Android does not clip the header slot's overflowing glow early. 6) The wash now starts at the top of the scroll content, just below the header, whereas the web's gradient origin includes the header band. Both headers are opaque theme background on both platforms, so the only difference is the glow sitting a header height lower, which I accepted as the clean approximation. 7) SVG canvas is capped at 35 percent of the page height, the point past which both gradients are fully transparent, so tall pages do not allocate huge empty layers.\n\n### Testing performed\n\n- `npx tsc --noEmit` in the native repo: clean at commit time.\n- An independent adversarial review agent re-opened the uncommitted diff, checked every acceptance checklist item above against the native code and the cited web sources (exact constants, timings, easing curves, and copy strings), hunted for regressions (broken imports, accidental behavior changes, worklet violations), and re-ran the type check itself. Verdict: passed with no unresolved findings and zero fix rounds.\n- The commit step re-ran the type check once more before staging, and staged only the files listed above (no blanket `git add`).\n- Not yet done: the on-device checks in the Verification section above. Playback pacing and gesture feel only prove out on a real phone, so those remain for Michael on build 0.7.10 or later.\n"},{"id":"13","filename":"13-press-feedback-micromotion.md","title":"Native parity 13: press feedback animation and header/search polish","content":"# Native parity 13: press feedback animation and header/search polish\n\n> **Status: implemented and committed 2026-07-13.** Commit `07605cf` on `feat/native-ui-web-parity` in the native repo. Adversarial review passed with no unresolved findings.\n\n\n**Mission.** Give the native Android app the web app's press micromotion and top bar polish. Every storefront press state should ease in and out over 150ms with the web's curve instead of snapping, the vibe hero's Start reading button should lose its extra pressed dim, the resume hero's progress bar should animate its width, and the search pills should gain the web's inset shadow, focus ring, 16px text, and correct height. Eleven precise deltas, all verified against current code on both sides.\n\n## Context\n\nFocus Reader is a cozy speed reading app for public domain books. It has a warm coffeeshop feel: cream and espresso tones, a coral accent, serif titles, book covers on shelves.\n\nTwo repos are involved:\n\n- **Web app (source of truth, READ ONLY): `C:/Users/Michael/Desktop/Focus Reader`.** A React + Tailwind PWA. It defines exactly how everything should look and behave. Open its files to check details, but **never modify anything in this repo**.\n- **Native app (all changes go here): `C:/Users/Michael/Desktop/Focus Reader Android`.** Expo SDK 54, React Native 0.81, `react-native-reanimated` 4, `react-native-gesture-handler` 2.28, zustand, `expo-image`, `expo-haptics`, `expo-linear-gradient`, `lucide-react-native`, react-navigation native stack. This is a full React Native app. **Never introduce a WebView.**\n\nUseful mappings between the two:\n\n- Web Tailwind tokens map to the native theme object from `useTheme()` in `src/theme`: `espresso` = `t.text` / `t.inkA(x)` for alpha, `mocha` = `t.textMuted` / `t.mutedA(x)`, `cream` = `t.surface` (and `t.paperA(x)`), `coral-accent` = `t.accent` / `t.accentA(x)`, accent text = `t.accentText`, `warm-beige` = `t.bg`.\n- The espresso ink rgb is `58,42,30`, so web shadows like `rgba(58,42,30,0.08)` equal `t.inkA(0.08)`.\n- Tailwind's default transition curve (used by every `transition-*` utility) is `cubic-bezier(0.4, 0, 0.2, 1)`. Tailwind 3.4's `ease-out` utility is `cubic-bezier(0, 0, 0.2, 1)`. The CSS `ease` keyword is `cubic-bezier(0.25, 0.1, 0.25, 1)`. These three curves each appear below; do not mix them up.\n\n## Before you start\n\n1. Run `git status` in `C:/Users/Michael/Desktop/Focus Reader Android`. Expect branch `feat/native-ui-web-parity`.\n2. **Another session may hold uncommitted changes** in `src/reader/ReaderChrome.tsx`, `src/reader/displays.tsx`, `src/reader/useReelEngine.ts`, and `app.json`. Read the current state of any file before editing it, and do not revert changes you did not make. None of the fixes below require touching those reader files; if a fix seems to lead there, stop and stay inside the files named in each issue.\n3. Line numbers below were verified against both repos on 2026-07-13. If a listed line has drifted, trust the described behavior and re-locate the code.\n\n### Suggested shared hook (covers issues 1 through 4, 6, 7)\n\nMost of the deltas are one bug repeated: native `Pressable` style functions swap pressed values instantly, while the web tweens them over 150ms. Build one small hook (for example `src/components/usePressScale.ts`) and use it at every call site:\n\n```tsx\nimport { Easing, useAnimatedStyle, useSharedValue, withTiming } from 'react-native-reanimated';\n\nconst PRESS_MS = 150;\nconst PRESS_EASE = Easing.bezier(0.4, 0, 0.2, 1); // Tailwind's default transition curve\n\nexport function usePressScale(pressedScale: number) {\n    const p = useSharedValue(0); // 0 = rest, 1 = pressed\n    const onPressIn = () => { p.value = withTiming(1, { duration: PRESS_MS, easing: PRESS_EASE }); };\n    const onPressOut = () => { p.value = withTiming(0, { duration: PRESS_MS, easing: PRESS_EASE }); };\n    const style = useAnimatedStyle(() => ({\n        transform: [{ scale: 1 + (pressedScale - 1) * p.value }],\n    }));\n    return { progress: p, onPressIn, onPressOut, style };\n}\n```\n\nExpose `progress` so call sites can derive extra animated styles from the same shared value (border color via `interpolateColor`, a translateX nudge, an overlay opacity). Use `Animated.createAnimatedComponent(Pressable)` or wrap the Pressable content in an `Animated.View`. For animating a lucide icon's color (the vibe row chevron), the simplest robust approach is to stack two icons (rest color and accent color) absolutely and cross fade their opacities from the same shared value; `interpolateColor` plus `useAnimatedProps` on the SVG stroke also works if you prefer.\n\nRN has no native inset box shadow. Approximate the web's inset shadows with an absolutely positioned overlay pinned to the top inside of the rounded container: a `LinearGradient` from `expo-linear-gradient` running top to bottom, from `rgba(58,42,30,0.08)` to transparent, a few pixels tall (or a 1px hairline at `t.inkA(0.08)` if the gradient looks wrong). Give it `pointerEvents=\"none\"` and match the container's border radius.\n\n## Issues to fix\n\n### 1. Today press states snap instantly; the pressed vibe row is missing its inset shadow\n\n**Web** (`src/components/Input/StoreFront.tsx:100-119` Vibe row, `:726-731` menu button):\n- The vibe row carries `transition-[transform,box-shadow,border-color] duration-150` with the default `cubic-bezier(0.4,0,0.2,1)` curve. While pressed: ring becomes `coral-accent/40`, scale drops to `0.99`, and an inset shadow appears: `inset 0 1px 4px rgba(58,42,30,0.08)`. Because box shadow and border color are in the transition list, the ring color and inset shadow tween too.\n- The icon chip animates to scale `1.10` and rotate `-6deg` over 150ms (`transition-transform duration-150`).\n- The chevron animates `translateX` 4px and its color to coral over 150ms (`transition-[transform,color] duration-150`).\n- The menu button has `active:scale-90` with `transition-transform` (150ms).\n\n**Native** (`src/screens/TodayScreen.tsx:226-253` VibeRow, `:105-111` menu button): the same pressed values are applied (scale 0.99, border `t.accentA(0.4)`, icon scale 1.1 rotate `-6deg`, chevron translateX 4 plus accent color, menu scale 0.9) but as instant Pressable style swaps with no animation, and the vibe row has no pressed inset shadow at all.\n\n**Fix:** drive every one of those pressed values through `withTiming(150ms, Easing.bezier(0.4, 0, 0.2, 1))` so they ease in AND out (the shared hook plus derived styles from its `progress`). Add the inset shadow approximation to the vibe row, fading it in and out with the same 150ms timing, at `rgba(58,42,30,0.08)` (note the vibe row's blur is 4px where the search pill's is 3px; visually a slightly softer overlay is fine). The recents and book rows are handled in issue 2; `FilterChip` is handled in issue 3.\n\n### 2. Library rows and the plain save button snap instead of animating over 150ms\n\n**Web** (`src/components/Input/StoreFront.tsx:228` RecentRow, `:264` BookRow, `src/components/Input/SaveButton.tsx:50-58`):\n- RecentRow and BookRow have `active:scale-[0.99]` with `transition-[transform,border-color] duration-150`, so the 0.99 press scale eases in and out over 150ms. Their ring color change to `coral-accent/40` is **instant**, because the ring is a box shadow and box shadow is not in the transition list.\n- The plain SaveButton has `active:scale-90` with `transition-[transform,background-color,color] duration-150`, so its shrink AND its background and icon color flip (cream/mocha when unsaved, coral accent with accent text when saved) all ease over 150ms.\n\n**Native** (`src/components/rows.tsx:48-55` and `:85-94`, `src/components/SaveButton.tsx:87-105`): all three use Pressable style functions that swap scale, border, and background instantly on the pressed flag (and, for SaveButton, on the saved flag); no timing animation.\n\n**Fix:** animate the pressed scale of both rows (1 to 0.99) and the plain SaveButton (1 to 0.9, plus its background and icon color, including the saved flag flip) through `withTiming` at 150ms. **Keep the row border color change instant**, exactly matching the web. The ribbon tone SaveButton already animates its reveal with `withTiming`; only the plain tone and the rows change here.\n\n### 3. Filter chips and other themed press scales snap; ribbon shadow easing is off\n\n**Web** (`src/components/InnerPageHeader.tsx:50` and `:65`, `src/components/Input/SaveButton.tsx:54`, `src/components/Input/StoreFront.tsx:185`):\n- Back and menu circles: `active:scale-90` with `transition-[transform,color] duration-150`.\n- Plain SaveButton: as in issue 2.\n- FilterChip: `active:scale-[0.97]` with a 150ms transition on transform, background color, text color, and border color.\n- The ribbon bookmark's drape shadow fades with `opacity .4s ease` (web `SaveButton.tsx:84`), where `ease` is `cubic-bezier(0.25, 0.1, 0.25, 1)`.\n\n**Native** (`src/components/InnerPageHeader.tsx:49-57` and `:67-78`, `src/components/SaveButton.tsx:87-105`, `src/components/ui.tsx:60-77`): all use `transform: [{ scale: pressed ? X : 1 }]` in the Pressable style function, jumping instantly in both directions. The ribbon drape shadow uses `withTiming(saved ? 1 : 0, { duration: 400 })` (native `SaveButton.tsx:122`) with reanimated's default in/out easing instead of the web's `ease` curve.\n\n**Fix:** route `FilterChip`'s pressed scale (0.97) and its color changes through the shared hook (header circles are issue 4's job, SaveButton is issue 2's; this issue owns the chip plus the shadow easing). Add `easing: Easing.bezier(0.25, 0.1, 0.25, 1)` to the ribbon shadow's 400ms `withTiming`.\n\n### 4. InnerPageHeader's round back and menu buttons snap to pressed scale\n\n**Web** (`src/components/InnerPageHeader.tsx:46-53` back, `:60-69` menu): both buttons carry `active:scale-90 transition-[transform,color] duration-150` (the class strings are at lines 50 and 65), so the scale to 0.90 and back tweens over 150ms.\n\n**Native** (`src/components/InnerPageHeader.tsx:49-58` back, `:67-78` menu): the Pressable style callback toggles `transform: [{ scale: pressed ? 0.9 : 1 }]` (lines 54 and 73) instantly with no timing in either direction.\n\n**Fix:** animate the press scale to 0.9 and back with the shared 150ms hook for both buttons. The web's hover color change (`hover:text-coral-accent`) has no native analogue and needs no port.\n\n### 5. InnerPageHeader's reader collapse uses the wrong easing curve\n\n**Web** (`src/components/InnerPageHeader.tsx:36-41`): the collapse animates `grid-template-rows` 1fr to 0fr plus opacity 1 to 0 with `transition-[grid-template-rows,opacity] duration-300 ease-out` (line 37). This project uses Tailwind 3.4.17, whose `ease-out` utility compiles to `cubic-bezier(0, 0, 0.2, 1)`, a strong decelerate: fast start, gentle landing. It is NOT the CSS `ease-out` keyword's `cubic-bezier(0, 0, 0.58, 1)`.\n\n**Native** (`src/components/InnerPageHeader.tsx:29-37`): `withTiming(collapsed ? 0 : 1, { duration: 300 })` at line 31 with no easing specified, so reanimated's default `Easing.inOut(Easing.quad)` applies. It starts slow, which differs visibly at the start of the collapse.\n\n**Fix:** pass `easing: Easing.bezier(0, 0, 0.2, 1)` to that `withTiming`, keeping the 300ms duration. One shared value drives both the height and the opacity, so this single change covers both. Only the reader exercises the `collapsed` prop and the reader chrome has uncommitted changes from another session; edit only `src/components/InnerPageHeader.tsx`, nothing under `src/reader/`.\n\n### 6. Today's Popular \"see all\" uses the wrong icon and wrong press feedback\n\n**Web** (`src/components/Input/StoreFront.tsx:1110-1112`): \"see all\" is 13px semibold coral accent with an **ArrowRight** icon (size 14, `ml-1` so 4px left margin). While active the text dims to `coral-accent/70` (this button has `transition-colors`, so the dim tweens) and the arrow translates 4px right (`transition-transform duration-150`, `group-active:translate-x-1`).\n\n**Native** (`src/screens/TodayScreen.tsx:144-147`): renders **ChevronRight** (size 14) instead of ArrowRight, and the pressed style is a flat `opacity: 0.7` on the whole row with no icon slide.\n\n**Fix:** import `ArrowRight` from `lucide-react-native` and use it here. On press, dim the label toward `t.accentA(0.7)` and translate the arrow 4px right, both animated over 150ms with the shared curve, easing back on release. Copy (\"see all\", lowercase), size 13, semibold weight, and accent color already match; leave them alone.\n\n### 7. Swimlane \"see all\" arrow never slides while pressed\n\n**Web** (`src/components/Input/StoreFront.tsx:200-204`): the button is coral accent 13px semibold with an ArrowRight size 14 icon (4px left margin). While active the label and icon color drop to `coral-accent/70` **instantly** (no color transition on this button, unlike issue 6's) AND the arrow translates 4px right (`group-active:translate-x-1`) with `transition-transform duration-150`.\n\n**Native** (`src/components/ui.tsx:104-109`): the Pressable applies `opacity: 0.7` to the whole control while pressed; the arrow never moves and nothing animates.\n\n**Fix:** while pressed, animate the ArrowRight 4px to the right over 150ms with `Easing.bezier(0.4, 0, 0.2, 1)`, and animate it back on release. Keep the dim instant: the existing `opacity 0.7` on coral text is a fair stand in for `text-coral-accent/70` and matches the web's instant color drop. This is the shared `Swimlane` component, so the fix lands everywhere it is used.\n\n### 8. Vibe hero's Start reading button has a pressed dim the web does not have\n\n**Web** (`src/components/Input/StoreFront.tsx:840-847`): the \"Start reading\" button (coral pill, `py-3.5` so 14px vertical padding, 15px semibold, BookOpen size 18, `shadow-md shadow-coral-accent/25`) has NO active or pressed style classes. It shows no visual press feedback; the open animation itself is the response.\n\n**Native** (`src/screens/VibeScreen.tsx:186-192`): the Pressable sets `opacity: pressed ? 0.9 : 1` at line 188.\n\n**Fix:** remove the pressed opacity change so the button is visually inert on press, exactly like the web. Parity direction is web to native; if press feedback ever seems desirable here, it should be added to the web first.\n\n### 9. Resume hero's progress bar fill jumps instead of easing over 300ms\n\n**Web** (`src/components/Input/StoreFront.tsx:1008-1010`): the coral fill inside the 6px tall track has `transition-[width] duration-300` (default curve `cubic-bezier(0.4,0,0.2,1)`), so when the percentage changes, for example returning from the reader with new progress, the bar visibly eases to the new width over 300ms.\n\n**Native** (`src/screens/TodayScreen.tsx:342-344`): a plain View whose width is the template string `${pct}%`, so it jumps instantly when `pct` changes.\n\n**Fix:** animate the fill width with `withTiming` at 300ms whenever `pct` changes. A clean pattern: keep a shared value updated from `pct` in an effect, and build the percent width inside `useAnimatedStyle` (reanimated accepts percentage string widths computed in a worklet). Track and fill geometry (height 6, radius 3, `t.inkA(0.1)` track, `t.accent` fill) and the label row above already match; do not touch them.\n\n### 10. Today's top bar is missing the search pill inset shadow, focus ring, 16px text, and menu button shadow\n\n**Web** (`src/components/Input/StoreFront.tsx:708-733`):\n- Search pill: `bg-cream`, `ring-1 ring-espresso/10`, inset shadow `inset 0 1px 3px rgba(58,42,30,0.08)`, and while the input is focused the ring becomes `coral-accent/40` (`focus-within:ring-coral-accent/40`, `transition-shadow`).\n- Input text is 16px (the browser base size; the input has no size class) in Inter `font-medium`, espresso color, placeholder `mocha/60`.\n- Menu button: 48px circle, `bg-cream`, ring `espresso/10`, plus `shadow-sm` which is `0 1px 2px rgba(0,0,0,0.05)`.\n\n**Native** (`src/screens/TodayScreen.tsx:86-113`, styles at `:423-428`): the pill has border `t.inkA(0.1)` but no inset shadow and the border never changes on focus; the input `fontSize` is 15 (`sansMedium`); the menu button has no shadow props or elevation.\n\n**Fix:**\n- Add the inset shadow approximation inside the pill (top inner gradient at `rgba(58,42,30,0.08)`, see the hook section).\n- Track focus with `onFocus`/`onBlur` on the TextInput and switch the pill's `borderColor` to `t.accentA(0.4)` while focused.\n- Bump the input `fontSize` to 16.\n- Give the menu button a subtle shadow: `shadowOpacity` about 0.05, `shadowRadius` 2, `shadowOffset` {width 0, height 1}, `elevation` 1.\n\nAlready matching, leave alone: placeholder color, icon sizes (Search 18, Menu 20, X 16), the 48px button, the roughly 68px minimum bar height, and the safe area padding.\n\n### 11. Both search pills (Today and results) lack the web's inset shadow, focus ring, 16px text, and exact height\n\n**Web** (`src/components/Input/StoreFront.tsx:708-724` home pill, `:905-921` results pill): both pills are cream with a 1px `espresso/10` ring, the inset shadow `inset 0 1px 3px rgba(58,42,30,0.08)`, and on focus within, the ring becomes `coral-accent/40` with a shadow transition. Input text is 16px Inter `font-medium`, espresso, placeholder `mocha/60`. The home pill's padding is 20 horizontal by 14 vertical (`px-5 py-3.5`); the results pill's is 20 by 12 (`px-5 py-3`), which with the inherited 1.5 line height on 16px text makes it exactly 12+24+12 = 48px tall. Icons: Search 18 at `mocha/70`; clear X 16 at `mocha/60`.\n\n**Native** (`src/screens/ResultsScreen.tsx:90-106`, styles at `:140-143`; `src/screens/TodayScreen.tsx:88-104`, styles at `:423-427`): the pills are flat, `borderColor` `t.inkA(0.1)` always, no inset shadow, no focus state change. The input is `fontSize` 15 `sansMedium` with `paddingVertical` 10. The results pill has no container vertical padding, so it renders about 40px tall, about 8px shorter than the web. Icon and X sizes and colors match.\n\n**Fix:** on BOTH pills, set the input `fontSize` to 16, add the focus driven border swap to `t.accentA(0.4)` (`onFocus`/`onBlur`), and add the inset shadow approximation. Give the results pill 12px vertical container padding so it lands at about 48px tall. The Today pill already carries `paddingVertical` 4 plus `minHeight` 50, close to the web's 52px home pill, so the height fix is specifically the results pill. This issue and issue 10 describe the same treatment for the Today pill; implement it once (a small shared SearchPill component or a shared style helper is a reasonable refactor, but keep it minimal).\n\n## Acceptance checklist\n\n- [ ] Pressing a Vibe out row on Today eases the row's scale, ring color, icon tilt, and chevron slide in over 150ms and back out on release, and a faint inner shadow along the top edge fades in while held; the Today menu button's shrink to 0.9 also tweens both ways.\n- [ ] Recents rows and Library book rows ease their 0.99 press scale in and out over 150ms while the border color change stays instant, and the plain bookmark save button eases its shrink to 0.9 plus its background and icon color flip over 150ms.\n- [ ] Filter chips on vibe pages ease their 0.97 press scale and color changes over 150ms, and the ribbon bookmark's drape shadow fades with the web's `ease` curve instead of reanimated's default.\n- [ ] The round back and menu buttons in every inner page header tween to 0.9 scale over 150ms on press and back on release.\n- [ ] When the reader starts playing, the header collapse starts fast and lands gently (decelerating curve) rather than starting slow.\n- [ ] Today's Popular \"see all\" shows an ArrowRight icon, and while held the label dims and the arrow slides 4px right over 150ms, sliding back on release.\n- [ ] Every swimlane \"see all\" arrow slides 4px right over 150ms while pressed and returns on release; the color dim stays instant.\n- [ ] The vibe hero's Start reading button shows no visual change at all while pressed.\n- [ ] The resume hero's coral progress fill eases to its new width over 300ms when progress changes, for example after backing out of the reader.\n- [ ] Today's search pill has a faint inner top shadow, its border turns coral toned while the keyboard focus is in the input, its text renders at 16px, and the menu circle casts a subtle drop shadow.\n- [ ] The results page search pill matches the same treatment and stands about 48px tall with 12px vertical padding.\n\n## Verification\n\n1. Run `npx tsc --noEmit` in `C:/Users/Michael/Desktop/Focus Reader Android` and fix every error you introduced.\n2. Reason carefully through runtime behavior: every `withTiming` must fire on both `onPressIn` and `onPressOut` (a press that never releases inside the bounds still gets `onPressOut`), shared values must not be recreated per render, and Pressable callbacks that previously depended on the `pressed` flag should not be left half migrated.\n3. Do NOT use the Expo web build to verify anything. It opens blank localhost tabs in the real browser and the web bundle breaks on zustand's `import.meta`. On device checking is done by Michael on his Android phone.\n\nWhen you finish, tell Michael to check these things on his phone, in plain words like these:\n\n- On the home page, press and hold one of the Vibe out rows. It should squeeze gently instead of jumping, the little icon should tip over smoothly, the arrow should glide right and turn coral, and a soft shading should appear along the top inside edge. Letting go should undo all of it just as smoothly.\n- Press and hold a book row in the Library. The row should shrink very slightly and smoothly, not jump.\n- Tap and hold the small round bookmark button next to Start reading. It should shrink smoothly, and when it flips to saved the color change should feel soft, not sudden.\n- Press and hold the round back button or menu button on any inner page. The shrink should feel like a gentle squeeze, not a snap.\n- Start the reader playing. The header should slide away quickly at first and settle softly at the end.\n- On the home page, press and hold \"see all\" next to Popular. The word should fade a touch and the little arrow should scoot to the right, then slide back when you let go. The arrow should now be a straight arrow, not an angle bracket. The same scoot should happen on the \"see all\" links inside the vibe pages.\n- On a vibe page, press the big Start reading button. It should not dim or flicker at all while your finger is on it.\n- Read a little, then back out to the home page. The orange progress bar under the book title should stretch smoothly to its new length instead of jumping.\n- Tap into the search box on the home page. The rim of the pill should warm up to coral while you type, the text should look a touch bigger, and the pill should have a faint shaded inner edge at the top. The round menu button next to it should sit with a whisper of a shadow under it. The search pill on the results page should look the same and a bit taller than before.\n\n## Final note\n\nWhen summarizing this work for Michael, use plain everyday language, no jargon, and avoid dashes in prose sentences. Use commas or periods instead.\n\n---\n\n## Outcome, recorded 2026-07-13\n\nImplemented in commit `07605cf` on `feat/native-ui-web-parity` in the native repo.\n\nFiles changed: `src/components/usePressScale.ts`, `src/components/ui.tsx`, `src/components/InnerPageHeader.tsx`, `src/components/SaveButton.tsx`, `src/components/rows.tsx`, `src/screens/TodayScreen.tsx`, `src/screens/VibeScreen.tsx`, `src/screens/ResultsScreen.tsx`.\n\n### Issue by issue\n\n**1. Today press states snap; vibe row missing pressed inset shadow** (done)\n\nNew shared hook usePressScale drives the vibe row scale to 0.99, the ring color to coral, the icon tilt, the chevron slide plus color cross fade, and a fading top inset shadow, all over 150ms both ways. The Today menu button now tweens its shrink to 0.9 too.\n\n**2. Library rows and plain save button snap** (done)\n\nRecentRow and BookRow ease their 0.99 scale over 150ms while the border color swap stays instant, matching the web. The plain save button eases its 0.9 shrink and its saved color flip (background plus icon, via a cross fade of two bookmark icons) over 150ms; its ring swap stays instant like the web.\n\n**3. Filter chips snap; ribbon shadow easing off** (done)\n\nFilterChip eases its 0.97 press scale and its active color flips (background, border, label) over 150ms with the shared curve. The ribbon drape shadow's 400ms fade now uses the CSS ease curve, bezier 0.25, 0.1, 0.25, 1.\n\n**4. Inner page header round buttons snap** (done)\n\nBack and menu circles tween to 0.9 and back over 150ms via the shared hook.\n\n**5. Reader header collapse wrong easing** (done)\n\nCollapse timing now uses bezier 0, 0, 0.2, 1 at 300ms. The line had drifted (an earlier round added Easing.out quad); replaced with the exact Tailwind ease out curve. Only InnerPageHeader.tsx touched, nothing under src/reader/.\n\n**6. Today Popular see all wrong icon and feedback** (done)\n\nChevronRight replaced with ArrowRight size 14. While held, the label and arrow fade toward 70 percent and the arrow slides 4px right, both 150ms with the shared curve, easing back on release.\n\n**7. Swimlane see all arrow never slides** (done)\n\nArrow now slides 4px right over 150ms while pressed and returns on release. The 0.7 dim stays instant via the existing style function, matching the web's untransitioned color drop.\n\n**8. Vibe hero Start reading has extra pressed dim** (done)\n\nPressed opacity removed; the button is visually inert on press like the web.\n\n**9. Resume hero progress bar jumps** (done)\n\nFill width now animates through a shared value with withTiming at 300ms and the default Tailwind curve, built as a percent width inside useAnimatedStyle. Track and fill geometry untouched.\n\n**10. Today top bar missing inset shadow, focus ring, 16px text, menu shadow** (done)\n\nShared TopInsetShadow overlay added inside the pill, border turns to accent at 0.4 alpha while the input is focused, input text bumped to 16, menu button given shadow opacity 0.05, radius 2, offset 0 and 1, elevation 1.\n\n**11. Both search pills lack the web treatment and exact height** (done)\n\nResults pill got the same inset shadow, focus border, and 16px text, plus 12px vertical container padding (input padding dropped to 0, minHeight 48) so it lands at about 48px. Today pill height left alone as instructed; the shared treatment lives in one TopInsetShadow component in ui.tsx.\n\n### Judgment calls made during implementation\n\n1. The inset shadow ink is hardcoded to rgba(58,42,30,0.08) instead of the theme ink helper. The web hardcodes that exact color in its class strings, so in dark mode the shading stays dark. Theme ink would have flipped it into a light highlight in dark mode, which would look wrong for a shadow. 2. Icon color tweens (vibe row chevron, plain save bookmark) use the prompt's suggested two stacked icons cross fading from one shared value, rather than animated SVG props. 3. The rows keep their instant border swap through a tiny pressed state flag set inside onPressIn and onPressOut, since a plain style function cannot ride on an animated pressable cleanly. 4. The Popular see all dim is an opacity fade to 0.7 on the label and arrow, which reads the same as the web's color drop to accent at 70 percent over its color transition. 5. The results pill lands at about 48px by pairing the 12px container padding with zero input padding and a 48 minimum height, since stacking 12px on top of the old 10px input padding would have made it about 64px tall. 6. The header collapse line had drifted from the prompt's snapshot (it already carried a quad ease out); I trusted the described target and set the exact bezier 0, 0, 0.2, 1. 7. No app.json version bump this round: the run's hard rules forbid touching app.json because another session holds changes there. The commit step should bump expo.version. 8. The package 03 cover inks decision did not intersect this package, so nothing was needed for it.\n\n### Testing performed\n\n- `npx tsc --noEmit` in the native repo: clean at commit time.\n- An independent adversarial review agent re-opened the uncommitted diff, checked every acceptance checklist item above against the native code and the cited web sources (exact constants, timings, easing curves, and copy strings), hunted for regressions (broken imports, accidental behavior changes, worklet violations), and re-ran the type check itself. Verdict: passed with no unresolved findings and zero fix rounds.\n- The commit step re-ran the type check once more before staging, and staged only the files listed above (no blanket `git add`).\n- Not yet done: the on-device checks in the Verification section above. Playback pacing and gesture feel only prove out on a real phone, so those remain for Michael on build 0.7.10 or later.\n"},{"id":"14","filename":"14-paragraph-mode-polish.md","title":"Paragraph Display Visual Polish (Native Parity Package 14)","content":"# Paragraph Display Visual Polish (Native Parity Package 14)\n\n> **Status: implemented and committed 2026-07-13.** Commit `269e27b` on `feat/native-ui-web-parity` in the native repo. Adversarial review passed with no unresolved findings.\n\n\n## Mission\n\nBring the paragraph reading view in the native Android app up to exact visual parity with the web app on five fine details: the active word pops to 105% size, the paragraph slides in with a decelerating ease out curve, word colors crossfade over 100ms instead of snapping, the highlight pill overhangs the word by 4px on each side without moving neighbors, and the gap between words scales with the paragraph font size instead of being a fixed 8px.\n\n## Context\n\nFocus Reader is a cozy speed reading app for public domain books. It exists in two repos:\n\n- Web app (READ ONLY source of truth for look and behavior): `C:/Users/Michael/Desktop/Focus Reader`. Read it freely to check constants, copy, and timings. Never modify anything in this repo.\n- Native app (where ALL your changes go): `C:/Users/Michael/Desktop/Focus Reader Android`. Expo SDK 54, React Native 0.81, reanimated 4, gesture-handler 2.28, zustand, expo-image, expo-haptics, lucide-react-native, react-navigation native-stack.\n\nThis is a full React Native app. Never introduce a WebView.\n\nThe paragraph view shows the whole current paragraph on a sunken card. The active word is highlighted, tapping any word jumps to it, and overscrolling an edge advances to the next paragraph. It also appears in hybrid mode, where a smaller faded paragraph sits under the single word reel.\n\n## Before you start\n\n1. Run `git status` in `C:/Users/Michael/Desktop/Focus Reader Android`. Expect to be on branch `feat/native-ui-web-parity`.\n2. **WARNING, THIS PACKAGE OVERLAPS THE ACTIVE READER FIX SESSION.** Another session may hold uncommitted changes in `src/reader/ReaderChrome.tsx`, `src/reader/displays.tsx`, `src/reader/useReelEngine.ts`, and `app.json`. This package edits `src/reader/displays.tsx`, which is one of those files. Always read the current state of a file before editing it, and never revert changes you did not make. If `git status` shows those files as modified, that is expected, work on top of what is there.\n3. This package should ideally run after the `display-text-measurement` package, which also edits `src/reader/displays.tsx`. Sequencing after it avoids conflicting edits in the same file. If that package has already landed, some line numbers below will have drifted.\n4. Line numbers throughout this file are anchors from an audit snapshot. If a listed line number has drifted, trust the described behavior and re-locate the code by searching for the identifiers and constants quoted here.\n\n## Issues to fix\n\n### 1. Active paragraph word should scale to 105%\n\nDelta id: `displays-paragraph-active-word-scale`. Severity: medium.\n\n**What the web does** (`src/components/Reader/ParagraphDisplay.tsx:229-247`): the active word span gets the classes `bg-focal/20 text-focal scale-105` together with `inline-block` (needed for the transform to apply). The current word renders 5% larger than its neighbors. The scale is applied instantly, with no animation, because the span only transitions colors (`transition-colors`), not transform. This gives each word a small pop as the highlight lands on it. Because it is an inline block scale, the enlarged word overlaps its neighbors slightly without reflowing the line.\n\n**What native does** (`C:/Users/Michael/Desktop/Focus Reader Android/src/reader/displays.tsx:537-559`): the active word gets the focal color and a `t.focalA(0.2)` background only. No scale transform. The word stays at normal size.\n\n**Change for parity**: apply `transform: [{ scale: 1.05 }]` to the active word's element, instantly, with no animation, while keeping the focal color and the 20% focal background. RN `Text` supports the `transform` style prop directly, so this can go straight into the existing inline style object (currently at lines 547-554). If Android renders it poorly on `Text` inside the wrapped row, wrap each word in a `View` and put the transform there instead. Either way, RN transforms do not affect layout, matching the web's behavior where the scale renders as overlap without reflow. Verify the scale does not shift line layout.\n\n### 2. Paragraph slide in should use the CSS ease out curve\n\nDelta id: `displays-paragraph-enter-easing`. Severity: low.\n\n**What the web does** (`src/index.css:97-106` and `src/components/Reader/ParagraphDisplay.tsx:201-224`): each new paragraph remounts (keyed by its first token id) and plays `para-enter-up` or `para-enter-down`: opacity 0 to 1 and translateY from plus or minus `enterDist` to 0, declared as `animation: 0.3s ease-out both`. CSS `ease-out` equals `cubic-bezier(0, 0, 0.58, 1)`, which decelerates from the very start. The distance and duration grow with how many paragraphs a flick jumped: `enterDist = 28 + (count - 1) * 42` pixels and `duration = 300 + (count - 1) * 150` ms (the duration is an inline `animationDuration` override). Direction: the paragraph enters from below when going forward and from above when going back. The whole animation is effectively disabled under `prefers-reduced-motion` (`src/index.css:150-153` forces `animation-duration` to 0.01ms with `!important`).\n\n**What native does** (`C:/Users/Michael/Desktop/Focus Reader Android/src/reader/displays.tsx:567-579`): the `EnterPara` component drives opacity and translateY from a single progress shared value using `withTiming(1, { duration: dur })`. Reanimated's default easing is `Easing.inOut(Easing.quad)`, which starts slow, so the paragraph appears to hesitate before sliding in. The distances, durations, and direction already match the web.\n\n**Change for parity**: pass an ease out curve: `withTiming(1, { duration: dur, easing: Easing.bezier(0, 0, 0.58, 1) })`. `Easing.out(Easing.cubic)` is an acceptable closest feel if the bezier misbehaves. Note that `Easing` is not currently in the reanimated import at the top of `displays.tsx` (line 27), so add it there. Also consider honoring the system reduce motion setting via `AccessibilityInfo.isReduceMotionEnabled` (or reanimated's `useReducedMotion`), since the web disables this animation under `prefers-reduced-motion`.\n\n### 3. Word colors should crossfade over 100ms\n\nDelta id: `displays-paragraph-word-color-transition`. Severity: low.\n\n**What the web does** (`src/components/Reader/ParagraphDisplay.tsx:234-242`): every word span carries `transition-colors duration-100`. As playback advances, each word's text color and highlight background crossfade over 100ms between the three states: active is focal text plus `focal/20` background, passed is `mocha/50`, upcoming is `espresso/85`. This softens the highlight hopping from word to word.\n\n**What native does** (`C:/Users/Michael/Desktop/Focus Reader Android/src/reader/displays.tsx:541-558`): colors and background change instantly when the index changes. The highlight jumps with a hard cut.\n\n**Change for parity**: animate `color` and `backgroundColor` over 100ms on state change for each word, for example `Animated.Text` with `useAnimatedStyle` plus `withTiming` at 100ms, or a small crossfade. At minimum, cover the words entering and leaving the active and passed states. Performance note: per word animated styles for a whole paragraph may be costly; a cheap approach is animating only the two words that changed state on each tick (the word becoming active and the word it just left). Reanimated interpolates colors, so `withTiming` on a color style works, but confirm the passed and upcoming alpha colors (`t.mutedA(0.5)`, `t.inkA(0.85)`) interpolate cleanly.\n\n### 4. Highlight pill should overhang the word by 4px each side\n\nDelta id: `displays-paragraph-highlight-padding`. Severity: low.\n\n**What the web does** (`src/components/Reader/ParagraphDisplay.tsx:234-242`): word spans carry `rounded px-1 -mx-1 inline-block`. That is 4px horizontal padding cancelled by a negative 4px margin, so the `focal/20` background pill overhangs the word by 4px on each side, with a 4px corner radius, without shifting neighboring words.\n\n**What native does** (`C:/Users/Michael/Desktop/Focus Reader Android/src/reader/displays.tsx:547-554`): `borderRadius: 4` and the `t.focalA(0.2)` background are applied directly to the `Text`, so the pill is exactly the glyph box, visibly tighter than web.\n\n**Change for parity**: give each word 4px horizontal padding compensated by a negative 4px margin (`paddingHorizontal: 4, marginHorizontal: -4`) so the pill overhangs identically without changing effective word spacing. This works together with the 0.25em gap fix in issue 5. Test that the negative margins do not upset the `flexWrap` row (`s.paraWrap`) on Android, and that tap targets (`onPress` per word) and the active word `onLayout` autoscroll bookkeeping still behave.\n\n### 5. Word gap should be 0.25em of the paragraph font size, not a fixed 8px\n\nDelta id: `displays-paragraph-word-gap-em`. Severity: low.\n\n**What the web does** (`src/components/Reader/ParagraphDisplay.tsx:220-224` and `205-217`): the wrap row uses `gap-x-[0.25em]`, so the gap scales with the computed `displaySize` (`Math.max(24, Math.min(fontSize * 0.6, 48))`, line 199). That gives 8.4px in the standalone paragraph view (displaySize 33.6 from the default reader font size 56) and 6px in hybrid mode (hybrid passes fontSize 28, so `28 * 0.6 = 16.8` clamps up to displaySize 24, and `24 * 0.25 = 6`). Container horizontal padding is `px-4 sm:px-8`, meaning 16px, and 32px only at viewports 640px or wider.\n\n**What native does** (`C:/Users/Michael/Desktop/Focus Reader Android/src/reader/displays.tsx:593-594`): the stylesheet has `paraWrap: { flexDirection: 'row', flexWrap: 'wrap', columnGap: 8 }`, a fixed 8. That roughly matches standalone (8 vs 8.4) but is 33% too wide in hybrid mode (8 vs 6). Container padding is fixed at 16 (`paraContent`, line 593), which is correct for phones.\n\n**Change for parity**: compute the gap as `displaySize * 0.25` inside the `ParagraphDisplay` component (its `displaySize` is at line 413, the same formula as web) and apply it as an inline `columnGap` on the wrap row instead of relying on the stylesheet constant. Keep the 16px container padding, since the web's 32px only applies at widths of 640px or more; consider it only if tablets become a target. This is pure polish, visible mainly in hybrid mode's denser context paragraph.\n\n## Acceptance checklist\n\n- [ ] The currently highlighted word in the paragraph view renders 5% larger than its neighbors, instantly on each step, without pushing surrounding words or reflowing the line.\n- [ ] A new paragraph slides in fast at first and settles gently (ease out), instead of hesitating at the start; distance and duration still grow when a flick jumps several paragraphs, and direction still flips when going backward.\n- [ ] As playback moves word to word, text colors and the highlight background fade over roughly 100ms instead of cutting hard.\n- [ ] The highlight pill behind the active word extends about 4px past the glyphs on each side with rounded corners, and word spacing is unchanged from before the fix.\n- [ ] The space between words equals a quarter of the paragraph font size: about 8.4px in the standalone paragraph view and 6px for the context paragraph in hybrid mode.\n\n## Verification\n\n1. Type check the native repo: run `npx tsc --noEmit` in `C:/Users/Michael/Desktop/Focus Reader Android` and fix any errors you introduced.\n2. Reason through the running behavior carefully: the active word transform must not affect layout, the color animation must not create hundreds of animated nodes per paragraph, the negative margins must not break wrapping or taps, and the enter animation must still respect the jump count scaling.\n3. Do NOT use the Expo web build to verify anything. Its dev server opens blank localhost tabs in the real browser and the web bundle breaks on zustand's `import.meta`. It proves nothing about the app.\n4. On device checking is done by Michael on his Android phone. End your session by telling him exactly what to look at, in plain everyday English without jargon. For this package, that is roughly: open a book in Paragraph mode and press play. The word being read should look slightly bigger than the rest and its little highlight bubble should stick out a bit past the letters on each side. As reading moves along, the colors should melt from one word to the next instead of blinking. Swipe to a new paragraph and it should glide in quickly then settle softly, with no pause before it starts moving. Then switch to Hybrid mode and check the small paragraph at the bottom, the words there should sit a touch closer together than before.\n\n## Final note\n\nWhen summarizing your work for Michael, use plain everyday language and avoid dashes in prose. Explain what changed the way you would to a friend, not a compiler.\n\n---\n\n## Outcome, recorded 2026-07-13\n\nImplemented in commit `269e27b` on `feat/native-ui-web-parity` in the native repo.\n\nFiles changed: `src/reader/displays.tsx`, `app.json`.\n\n### Issue by issue\n\n**1. Active paragraph word scales to 105%** (done)\n\nStatic transform [{ scale: 1.05 }] added to the active word's style, applied instantly with no animation. RN transforms never affect layout, so the pop overlaps neighbors without reflowing the line, matching the web's inline-block scale. Applied directly on the Text element as the prompt suggested first; the View-wrapper fallback was not needed for types or layout math, but rendering quality on device is Michael's to confirm.\n\n**2. Paragraph slide-in uses CSS ease-out curve** (done)\n\nEnterPara's withTiming now uses Easing.bezier(0, 0, 0.58, 1) (exact CSS ease-out), defined as module constant EASE_OUT. Easing added to the reanimated import. Distance/duration jump scaling and direction flip untouched. Reduce motion honored via ReduceMotion.System on the timing config, which snaps to the end state exactly like the web's prefers-reduced-motion animation kill.\n\n**3. Word colors crossfade over 100ms** (done)\n\nNew FadingWord component: Animated.Text whose color and backgroundColor run through interpolateColor driven by a 100ms withTiming, using Tailwind's actual transition curve cubic-bezier(0.4, 0, 0.2, 1). Only the two words that changed state on the last tick render animated (the word gaining the highlight and the word losing it, tracked via a prevIndex ref); the rest of the paragraph stays plain Text, so a long paragraph never carries hundreds of animated nodes. Distant passed/upcoming flips on multi-word jumps cut instantly, which is the prompt's sanctioned cheap approach. Crossfade also snaps under system reduce motion, matching the web's transition kill.\n\n**4. Highlight pill overhangs word by 4px each side** (done)\n\npaddingHorizontal: 4 with marginHorizontal: -4 on every word (plus the existing borderRadius: 4). The padding and negative margin cancel in Yoga's flexWrap math, so line breaks and effective word spacing are unchanged while the pill extends 4px past the glyphs. Tap targets get 4px wider per side (an improvement) and the onLayout y bookkeeping for auto-centering is untouched since only horizontal geometry changed.\n\n**5. Word gap is 0.25em of paragraph font size** (done)\n\ncolumnGap now computed inline as displaySize * 0.25 (8.4px standalone at displaySize 33.6, 6px in hybrid at displaySize 24); the fixed columnGap: 8 was removed from the paraWrap stylesheet entry. Container padding kept at 16px since the web's 32px only applies at 640px+ viewports.\n\n### Judgment calls made during implementation\n\n1) Crossfade scope: implemented the prompt's recommended cheap path, animating only the two words that changed state per tick instead of per-word animated styles, bounding the cost to two animated nodes per paragraph. 2) Reduce motion: used reanimated's ReduceMotion.System option on both the slide-in and the color fade rather than AccessibilityInfo plumbing; the web's prefers-reduced-motion block kills both animations AND transitions, so both now snap natively too. 3) Easing fidelity: the color fade uses Tailwind's real transition curve cubic-bezier(0.4, 0, 0.2, 1) (what transition-colors actually ships), not linear; the slide-in uses the exact CSS ease-out bezier rather than the Easing.out(Easing.cubic) fallback. 4) The transparent pill state is focal color at alpha 0 (t.focalA(0)) instead of the 'transparent' keyword so the background interpolation stays inside the focal hue rather than fading through black. 5) Scale applied directly on Text, not a wrapping View, since the prompt prefers that and nothing forced the fallback; flagged for device check. 6) Version bump: the working tree was clean and app.json was already committed at 0.7.5 (the 0.7.3 bump mentioned in the run instructions had long since landed), so per the standing rule I bumped it to 0.7.6 for this change round. 7) Ignored the preview-server verification hook: the prompt forbids using the Expo web build for verification and this package is native-only.\n\n### Testing performed\n\n- `npx tsc --noEmit` in the native repo: clean at commit time.\n- An independent adversarial review agent re-opened the uncommitted diff, checked every acceptance checklist item above against the native code and the cited web sources (exact constants, timings, easing curves, and copy strings), hunted for regressions (broken imports, accidental behavior changes, worklet violations), and re-ran the type check itself. Verdict: passed with no unresolved findings and zero fix rounds.\n- The commit step re-ran the type check once more before staging, and staged only the files listed above (no blanket `git add`).\n- Not yet done: the on-device checks in the Verification section above. Playback pacing and gesture feel only prove out on a real phone, so those remain for Michael on build 0.7.10 or later.\n"},{"id":"15","filename":"15-reader-chrome-polish.md","title":"Reader chrome controls polish","content":"# Reader chrome controls polish\n\n> **Status: implemented and committed 2026-07-13.** Commit `8a14767` on `feat/native-ui-web-parity` in the native repo. Adversarial review passed with no unresolved findings. Fades use the curve Tailwind actually ships for ease-out, cubic-bezier(0, 0, 0.2, 1), not the CSS keyword value the prompt named.\n\n\n## Mission\n\nBring six small pieces of the native reader chrome to exact web parity: stroke outline play/pause glyphs, a 200ms animated visualization pill with no extra haptic, a 75ms eased progress bar fill, CSS `ease-out` easing on the chrome and header fades, Inter typography on the progress labels and scrubber peek, and slider accessibility on both tracks. Every change is small and surgical. Do not refactor beyond what each issue requires.\n\n## Context\n\nFocus Reader is a cozy speed reading app for public domain books. It exists in two repos:\n\n- Web app (READ ONLY source of truth for look and behavior): `C:/Users/Michael/Desktop/Focus Reader`. Never modify anything in this repo. Open its files only to confirm the target behavior.\n- Native Android app (ALL changes go here): `C:/Users/Michael/Desktop/Focus Reader Android`. Expo SDK 54, React Native 0.81, reanimated 4, gesture-handler 2.28, zustand, expo-image, expo-haptics, lucide-react-native, react-navigation native-stack.\n\nThe native app is a full React Native app. Never introduce a WebView for any purpose.\n\nRelevant native files: `src/reader/ReaderChrome.tsx` (the VisualizationSelector pill row plus the Controls component with the progress bar, labels, playback buttons, and the paragraph scrubber face), `src/screens/ReaderScreen.tsx` (chrome fade), `src/components/InnerPageHeader.tsx` (header collapse), `App.tsx` (font loading), `src/theme.ts` (the `FONTS` map and `useTheme`).\n\n## Before you start\n\n**WARNING, OVERLAPS THE ACTIVE READER FIX SESSION:** another Claude session is actively fixing the reader and holds uncommitted changes in `src/reader/ReaderChrome.tsx`, `src/reader/displays.tsx`, `src/reader/useReelEngine.ts`, and `app.json` (there may also be an untracked `metro.config.js`). Audit the current working tree before touching `ReaderChrome.tsx`, read the current file state before every edit, and never revert or reformat changes you did not make. Keep your edits tightly scoped to the exact lines each issue names.\n\n1. Run `git status` in `C:/Users/Michael/Desktop/Focus Reader Android`. Expect branch `feat/native-ui-web-parity`. Expect the uncommitted files listed above; that is normal, do not clean them up.\n2. This package ideally runs after the `typography-and-type-metrics` package. That package is responsible for loading an Inter italic face. Check `src/theme.ts` for an Inter italic entry in `FONTS` before adding one yourself (details in issue 5).\n3. Line numbers below were verified on 2026-07-13 against the current working tree (uncommitted edits included). If a listed line number has drifted, trust the described behavior and re-locate the code.\n\n## Issues to fix\n\n### 1. Play/pause glyphs are solid filled, web uses stroke outlines\n\nWeb (`src/components/Reader/Controls.tsx:353-364`): the coral play button (`p-5`, `rounded-full`, `shadow-lg shadow-coral-accent/30`) renders lucide `Play`/`Pause` at 32px (`w-8 h-8`) with lucide defaults: `stroke='currentColor'` (white), `fill='none'`, 2px stroke weight. The glyphs are outlined, not filled. `Play` gets `ml-1` (4px) for optical centering.\n\nNative (`src/reader/ReaderChrome.tsx:106-110`, inside `PlaybackButtonRow`): both icons pass `fill=\"#fff\"` (lines 108 and 109), rendering solid filled glyphs. Size 32, color `#fff`, padding 20, `marginLeft: 4` on `Play`, and the shadow already match.\n\nChange: drop the `fill` prop (or set `fill=\"none\"`) on both `Play` and `Pause` so the glyphs render as white 2px outlines like web. `lucide-react-native` defaults to stroke only, so removing the prop is enough. Touch nothing else in the row.\n\n### 2. Visualization pill switches instantly and fires an extra haptic\n\nWeb (`src/components/Reader/VisualizationSelector.tsx:21-41`): each mode button has `transition-all duration-200`, so the coral background, white icon, `shadow-lg`, and `scale-105` of the active pill animate in over 200ms when the mode changes. Order and icons: Focus=`Eye`, Ghost Trail=`ScanLine`, Sentence=`AlignLeft`, Paragraph=`AlignJustify`, Hybrid=`Layers`, all size 20, in an espresso 6% pill with 8px gaps. Web (`src/components/Reader/ReaderView.tsx:78-83`): `onChange` fires `onActivity` then `onChangeVisMode`. No haptic. The web reserves haptics for the surface tap peek, the menu, errors, and commit moments.\n\nNative (`src/reader/ReaderChrome.tsx:36-60`): `onPress` at line 48 fires `haptics.tick()` in addition to `onInteract()` and `setVisMode(key)`, and the active styling (accent background, `scale: 1.05`, elevation/shadow) at lines 49 to 52 applies instantly as a plain conditional style. Icons, order, sizes, and the container already match.\n\nChange: remove `haptics.tick()` from the mode `onPress` (keep `onInteract()` and `setVisMode(key)` in that order), and animate the active pill's background and scale over 200ms using reanimated `withTiming(..., { duration: 200 })`. A clean approach: extract a small per mode button component that holds a shared value driven by `active`, with an animated style interpolating background color (transparent to `t.accent`) and scale (1 to 1.05), wrapped in an `Animated.View` inside or around the `Pressable`. The icon color swap (white when active, `t.textMuted` otherwise) may stay an instant prop; the required animation is background and scale. Keep the shadow appearing with the active state.\n\n### 3. Progress bar fill jumps per word, web eases it over 75ms\n\nWeb (`src/components/Reader/Controls.tsx:314-326`): the coral fill inside the 8px rail has `transition-all duration-75` (line 317), so each word advance eases the width over 75ms, giving the bar a subtle glide during playback. The 16px knob (`ring-2 ring-cream`, `shadow-md shadow-coral-accent/40`) has only `transition-transform` (a hover scale), so its left position moves stepwise without easing.\n\nNative (`src/reader/ReaderChrome.tsx`, playback face around lines 315 to 323): the fill width (line 320, `width: `${chapterInfo.progress}%``) and the knob `left` (line 322) are plain style props re-rendered on every index change. Both step instantly. The knob's per step jump already matches web; only the fill differs.\n\nChange: drive the fill width through an animated value with a 75ms timing on change, knob stays instant. For example: a `useSharedValue` holding the progress percent, a `useEffect` (or direct assignment in render logic) setting `sv.value = withTiming(chapterInfo.progress, { duration: 75 })`, and an animated style `{ width: `${sv.value}%` }` on an `Animated.View` replacing the inner fill `View`. Reanimated retargets smoothly when a new timing starts mid flight, which matches the web behavior at high WPM.\n\nOptional note for a later shadow pass, not required here: web's knob shadow is coral tinted (`shadow-coral-accent/40`) while native uses `shadowColor: '#000'` on both knobs (styles `knob` and `bigKnob`, lines 362 to 371).\n\n### 4. Chrome and header fades use the wrong easing curve\n\nWeb: the selector and controls fade with `transition-opacity duration-300 ease-out` (`src/components/Reader/ReaderView.tsx:79` and `:168`), and the header collapses `grid-template-rows` 1fr to 0fr plus opacity with the same 300ms `ease-out` (`src/components/InnerPageHeader.tsx:37`). CSS `ease-out` is `cubic-bezier(0, 0, 0.58, 1)`: fast start, soft landing. Timing triggers: fade out 100ms after play starts, back instantly on pause, re-hide 3000ms after the last peek or activity. All of those triggers are already matched on native (both immersive hooks use the 100ms fade delay and 3000ms idle; `PLAY_FADE_DELAY_MS` 100, `IDLE_TIMEOUT_MS` 3000). Do not touch the delays.\n\nNative: `withTiming(..., { duration: 300 })` with no easing option, which defaults to reanimated's `Easing.inOut(Easing.quad)`, a slower start and a different feel. Two call sites:\n\n- `src/screens/ReaderScreen.tsx:115`: `chromeSV.value = withTiming(chromeVisible ? 1 : 0, { duration: 300 })`\n- `src/components/InnerPageHeader.tsx:31`: `shown.value = withTiming(collapsed ? 0 : 1, { duration: 300 })`\n\nChange: pass `easing: Easing.bezier(0, 0, 0.58, 1)` in the options of both `withTiming` calls. Import `Easing` from `react-native-reanimated` in each file. Both sides already retarget smoothly when interrupted mid fade, so the curve is the only difference.\n\n### 5. Progress labels and scrubber peek use the wrong typefaces\n\nWeb: the body font is Inter (`src/index.css:42-49`). The progress readout row under the bar (\"<Chapter title>: word X of Y\" on the left, \"NN%\" on the right, `src/components/Reader/Controls.tsx:327-330`) is Inter 400 14px in mocha; the left span may wrap rather than truncate on web (native truncates to one line, which was not flagged as a required change, leave it). The scrubber peek snippet (`Controls.tsx:198-208`, first 9 words as a curly quoted string with an ellipsis, or an em dash when empty) is Inter 400 italic 14px mocha with truncate. The peek chapter kicker above it is Inter 500 12px uppercase coral with `tracking-wide`, which is 0.025em, meaning 0.3px letterspacing at 12px.\n\nNative (`src/reader/ReaderChrome.tsx`): the two label `Text`s (lines 326 and 329) set no `fontFamily`, so they render in Android's default Roboto. The snippet (line 260) uses `FONTS.serifItalic`, which maps to `Fraunces_400Regular_Italic` (`src/theme.ts:101`), a serif italic instead of Inter italic. The kicker (line 256) already uses `FONTS.sansMedium` correctly but sets `letterSpacing: 0.6`, double the web's 0.3. `App.tsx` (lines 49 to 52) currently loads only upright Inter weights 400/500/600/700 plus the Fraunces faces; no Inter italic is bundled yet.\n\nChange, three parts:\n\n1. Set `fontFamily: FONTS.sans` on both progress label `Text`s (the \"word X of Y\" label and the percent label).\n2. Render the snippet in Inter 400 italic. First check `src/theme.ts` for an Inter italic entry in `FONTS` (the `typography-and-type-metrics` package may have added one, for example `sansItalic`). If it exists, use it. If not: import `Inter_400Regular_Italic` from `@expo-google-fonts/inter` in `App.tsx`, add it to the `useFonts` map, add `sansItalic: 'Inter_400Regular_Italic'` to `FONTS` in `src/theme.ts`, then use `FONTS.sansItalic` on the snippet `Text` (keep `fontStyle` off, the face itself is italic).\n3. Change the kicker's `letterSpacing` from 0.6 to 0.3.\n\nThe copy, the 9 word slice, the curly quote characters, and the em dash fallback already match exactly. This issue is purely typeface and spacing.\n\n### 6. Progress bar and paragraph scrubber lack slider accessibility\n\nWeb: the main progress track (`src/components/Reader/Controls.tsx:292-300`) is `role='slider'` with `aria-label='Chapter Progress'`, `aria-valuenow={chapterInfo.currentInChap}`, `aria-valuemin={1}`, `aria-valuemax={chapterInfo.totalInChap}`, and `tabIndex={0}`. The scrubber track (`Controls.tsx:222-231`) is `role='slider'` with `aria-label='Scrub by paragraph'`, `aria-valuenow={peek.pIdx}`, `aria-valuemin={0}`, `aria-valuemax={Math.max(0, paragraphs.length - 1)}`, and `tabIndex={0}`.\n\nNative (`src/reader/ReaderChrome.tsx`): both tracks are bare `Animated.View`s inside `GestureDetector`s with no accessibility props. The main track is the `Animated.View` with style `s.mainTrackHit` (around lines 315 to 323); the scrubber track is the one with style `s.scrubTrackHit` (around lines 276 to 290). All the `Pressable` buttons already carry `accessibilityLabel`s matching the web aria labels; only the two tracks are missing. TalkBack users currently cannot perceive or adjust either track.\n\nChange: on the main track `Animated.View` add `accessibilityRole=\"adjustable\"`, `accessibilityLabel=\"Chapter Progress\"`, and `accessibilityValue={{ min: 1, max: chapterInfo.totalInChap, now: chapterInfo.currentInChap }}`. On the scrubber track `Animated.View` add `accessibilityRole=\"adjustable\"`, `accessibilityLabel=\"Scrub by paragraph\"`, and `accessibilityValue={{ min: 0, max: Math.max(0, paragraphs.length - 1), now: peek.pIdx }}`.\n\n## Acceptance checklist\n\n- [ ] The play and pause glyphs in the big coral button render as white outlines (2px stroke, hollow inside), not solid white shapes.\n- [ ] Tapping a visualization mode animates the coral background and the 1.05 scale onto the new pill over 200ms, and mode switching produces no haptic tick.\n- [ ] During playback the chapter progress fill glides between word positions over 75ms instead of stepping, while the knob still steps instantly.\n- [ ] The chrome fade (selector and controls) and the header collapse both start fast and land soft (CSS `ease-out` curve, `Easing.bezier(0, 0, 0.58, 1)`), still 300ms with the 100ms play delay and 3000ms idle re-hide untouched.\n- [ ] The \"Chapter: word X of Y\" and percent labels render in Inter, the scrubber peek snippet renders in Inter italic (not Fraunces italic), and the peek kicker letterspacing is 0.3.\n- [ ] With TalkBack, both the chapter progress bar and the paragraph scrubber announce as adjustable sliders named \"Chapter Progress\" and \"Scrub by paragraph\" with correct min, max, and current values.\n\n## Verification\n\n- Run `npx tsc --noEmit` in `C:/Users/Michael/Desktop/Focus Reader Android` and fix any errors you introduced.\n- Reason through the running behavior carefully: the 75ms fill timing retargeting per word at high WPM, the 200ms pill animation when switching modes rapidly, the easing change not altering durations or delays, and the font entries actually existing in the `useFonts` map before `FONTS` references them.\n- Do NOT use the Expo web build to verify anything. Its dev server opens blank localhost tabs in the real browser and the web bundle breaks on zustand's `import.meta`. Do not start it.\n- On-device checking is done by Michael on his Android phone. End your summary by telling him exactly what to look at, in plain everyday English, for example: open any book in the reader. The big coral button should now show a hollow play triangle and hollow pause bars instead of solid white shapes. Tap the little eye and lines icons at the top; the coral highlight should slide onto the new one smoothly and your phone should not buzz. Press play and watch the progress bar; the coral line should flow along instead of ticking. Let the controls fade out after you press play; the fade should feel like it starts quick and settles gently, same as the top bar shrinking away. Open the scrubber (the list button); the quoted sentence preview should look like the app's normal clean text in italics, not the fancy book typeface. If you use TalkBack, the progress bar and the scrubber should now announce themselves and their position.\n\n## Final note\n\nWhen summarizing your work for Michael, use plain everyday language, no jargon, and avoid dashes in prose sentences; use commas or periods instead.\n\n---\n\n## Outcome, recorded 2026-07-13\n\nImplemented in commit `8a14767` on `feat/native-ui-web-parity` in the native repo.\n\nFiles changed: `src/reader/ReaderChrome.tsx`, `src/screens/ReaderScreen.tsx`, `app.json`.\n\n### Issue by issue\n\n**1. Play/pause glyphs render as stroke outlines, not solid fills** (done)\n\nRemoved fill=\"#fff\" from both Pause and Play in PlaybackButtonRow; lucide-react-native defaults to stroke only. Size, color, marginLeft and shadow untouched.\n\n**2. Visualization pill animates over 200ms and drops the extra haptic** (done)\n\nRemoved haptics.tick() from the mode onPress (order kept: onInteract() then setVisMode(key); the haptics import is no longer used in ReaderChrome.tsx and was removed). Extracted a ModeButton component: a shared value driven by active tweens backgroundColor (accent at alpha 0 to accent, via interpolateColor) and scale (1 to 1.05) over 200ms with the reused PRESS_EASE curve (Tailwind's default transition curve, which is what the web's transition-all uses). Icon color and the active shadow stay instant per the prompt.\n\n**3. Progress bar fill glides 75ms per word, knob steps instantly** (done)\n\nAdded a progress shared value in Controls retargeted with withTiming(progress, { duration: 75, easing: PRESS_EASE }) on every change; the inner fill is now an Animated.View with an animated percent width. The knob's left stays a plain style prop, stepping instantly like the web.\n\n**4. Chrome fade and header collapse use the web's ease-out curve** (done)\n\nReaderScreen.tsx chrome fade now passes easing: Easing.bezier(0, 0, 0.2, 1) at 300ms; durations and the 100ms/3000ms triggers untouched. InnerPageHeader.tsx already had this exact easing from a previously committed pack, so no edit was needed there. Note the curve differs from the prompt's stated 0.58 value; see decisions.\n\n**5. Progress labels in Inter, peek snippet in Inter italic, kicker letterspacing 0.3** (done)\n\nBoth progress label Texts got fontFamily: FONTS.sans; the peek snippet switched from FONTS.serifItalic to FONTS.sansItalic (entry already existed in src/theme.ts and Inter_400Regular_Italic was already in App.tsx's useFonts map, so no font loading changes); kicker letterSpacing changed 0.6 to 0.3.\n\n**6. Both tracks announce as adjustable sliders to TalkBack** (done)\n\nMain track: accessibilityRole adjustable, label Chapter Progress, value min 1 / max totalInChap / now currentInChap. Scrub track: label Scrub by paragraph, value min 0 / max paragraphs.length - 1 (floored at 0) / now peek.pIdx. Also added the accessible prop on both so TalkBack can actually focus them (web parity with tabIndex 0).\n\n**Extra folded-in item: scrub peek snippet must be FONTS.sansItalic, not serifItalic** (done)\n\nVerified against web Controls.tsx: the snippet span is text-sm text-mocha italic with no font-serif class, so it renders in Inter italic. Covered by the issue 5 change.\n\n### Judgment calls made during implementation\n\n1. Easing curve value: the prompt says to use Easing.bezier(0, 0, 0.58, 1), calling that CSS ease-out. But the web's classes are Tailwind utilities, and Tailwind 3.4 (confirmed in the web repo's package.json, with no transitionTimingFunction override in tailwind.config.js) maps ease-out to cubic-bezier(0, 0, 0.2, 1). The already committed InnerPageHeader fix uses exactly that curve with a comment explaining the same reasoning. So I used Easing.bezier(0, 0, 0.2, 1) in ReaderScreen.tsx to match the real web behavior and keep both fade sites consistent, rather than the prompt's stale value. 2. For the 200ms pill and 75ms fill animations I passed the repo's existing PRESS_EASE constant (cubic-bezier(0.4, 0, 0.2, 1), Tailwind's default transition curve) instead of leaving reanimated's default easing, because the web's transition-all utilities use that curve; the prompt's examples simply omitted easing. 3. The pill background interpolates from t.accentA(0) (the accent color at zero alpha) to t.accent instead of the literal 'transparent', so the tween keeps the coral hue while fading in rather than passing through a grey tint. 4. I added the accessible prop to both tracks beyond the exact props listed, because on Android a View with only accessibilityRole is not focusable by TalkBack; without it the required announcement never happens. 5. The state update said to preserve an uncommitted app.json bump from 0.7.2 to 0.7.3, but the working tree was actually clean at version 0.7.6, so there was nothing to preserve; per Michael's standing rule I bumped expo.version to 0.7.7 for this change round. 6. No changes to App.tsx or src/theme.ts were needed: the typography pack had already landed sansItalic in FONTS and Inter_400Regular_Italic in the useFonts map.\n\n### Testing performed\n\n- `npx tsc --noEmit` in the native repo: clean at commit time.\n- An independent adversarial review agent re-opened the uncommitted diff, checked every acceptance checklist item above against the native code and the cited web sources (exact constants, timings, easing curves, and copy strings), hunted for regressions (broken imports, accidental behavior changes, worklet violations), and re-ran the type check itself. Verdict: passed with no unresolved findings and zero fix rounds.\n- The commit step re-ran the type check once more before staging, and staged only the files listed above (no blanket `git add`).\n- Not yet done: the on-device checks in the Verification section above. Playback pacing and gesture feel only prove out on a real phone, so those remain for Michael on build 0.7.10 or later.\n"},{"id":"16","filename":"16-accessibility-parity.md","title":"Storefront accessibility roles, labels, and states","content":"# Storefront accessibility roles, labels, and states\n\n> **Status: implemented and committed 2026-07-13.** Commit `d82603b` on `feat/native-ui-web-parity` in the native repo. Adversarial review passed with no unresolved findings.\n\n\n## Mission\n\nClose the s
