on is on, `startSettle` finalizes instantly with no 260ms ease, so the reel snaps to the nearest whole word with no coast and no animation.\n\nAdded a `reduceMotion` shared value fed by `AccessibilityInfo.isReduceMotionEnabled` plus a live `reduceMotionChanged` listener. On pan release, when enabled, mode 2 and mode 3 are skipped and the position finalizes instantly (`pos.value = Math.round(pos.value)` clamped, `vel` zeroed, `mode.value = 0`); the mode 3 settle branch is guarded the same way so any settle already in flight also lands instantly. This applies to every consumer of the shared engine (Focus, Sentence, and Trail) but the change lives entirely in this engine.\n\n### 6. Fling interruption semantics: re-grip, controls seek, play\n\nThree sub behaviors when the reel is coasting (mode 2):\n\n(a) **Catching the reel.** Before, `pan.onBegin` set `dragBase.value = pos.value`, the exact fractional position, so catching was seamless with no snap. The web seeds the new drag from `getIndex()`, the committed integer, so the reel visibly snaps up to half a row the moment you catch it. `dragBase` now seeds from the clamped `Math.round(pos.value)`, matching web; at rest and during playback `pos` is already an integer, so this only changes the catch during a fling or settle.\n\n(b) **Controls seek during a coast.** On the web, a controls seek (progress slider, skip buttons) during a coast does not stop the coast: the inertia loop keeps emitting `onCommit(round(frac))` every frame and overrides the seek until the fling settles. Native's `engine.seek()` sets mode 0, killing any in flight fling, so the seek wins immediately. Because the web behavior reads like an accident (a fling silently swallowing an explicit seek), native's seek wins behavior was kept, the deliberate divergence was documented in a code comment, and the question was put to Michael (see Judgment calls).\n\n(c) **Play during a fling.** The web stops the fling and finalizes onto the nearest word instantly; native's `togglePlay` zeroes `vel`, resets `acc`, and enters play mode. These already matched, and it was confirmed that none of the other edits changed that path.\n\n## Judgment calls\n\n1. **Reduce motion uses `AccessibilityInfo` with the `reduceMotionChanged` listener** rather than reanimated's `useReducedMotion` hook, because that hook only samples the setting at app launch while the web's media query check is live; the listener keeps the shared value current if the setting is flipped mid session.\n2. **A controls seek immediately beats a coasting fling on native (issue 6b), kept as is.** The web's fling swallowing an explicit seek reads like an accident, so native honors the press. Documented in a code comment and flagged to Michael: does he want exact web parity here (the fling overrides a controls seek until it settles), or should native's behavior be treated as correct and the web fixed to match later?\n3. **`togglePlay`'s new guard is `max > 0 && cur < max`** rather than just `cur < max`, mirroring the web's `tokens.length > 0` check so play cannot start on an empty or still loading parse (where the delay tables are empty and the worklet would compute NaN delays).\n4. **Version untouched.** The uncommitted 0.7.3 bump in `app.json` was left as is and not bumped further, reading this parity round as sharing that one bump since a separate step commits the round.\n5. **`ReaderChrome`'s progress bar and the `onBegin` pause at touch down were left alone.** The progress bar already pauses explicitly before seeking (matching web), and the over eager tap zone pause at touch down is owned by another session's package.\n\n## Check on your phone\n\n- [ ] Confirm: in Paragraph view, hit play, then tap the next sentence arrow. Reading keeps going from the new sentence instead of freezing, and one tap on the button pauses.\n- [ ] Confirm: tap the middle of a spinning word reel to peek the chrome, then hit play again. The reel shows just one word while it reads, with no faded neighbour words hanging around.\n- [ ] Confirm: let a book run to the very last word. The last word lingers for its full beat (a closing period holds about three times as long) before the controls come back.\n- [ ] Confirm: while a book reads, tap the speed plus button a few times fast. The current word holds still until you stop tapping.\n- [ ] Confirm: turn on Remove animations in Android's accessibility settings, then flick the reel. It lands instantly on the nearest word with no glide, in Focus, Sentence, and Trail views.\n- [ ] Confirm: flick the reel into a coast, then catch it. It snaps up to about half a row at the moment you grab it, matching the web.\n\nEverything else in this package was verified in code and by review.\n","kicker":"Package 06"},{"id":"07","filename":"07-reader-gesture-zoning.md","title":"Reader stage gesture zoning","content":"# Reader stage gesture zoning\n\n**Done.** Implemented and committed as `90e77e1` on `feat/native-ui-web-parity`, 2026-07-13, independent review passed with no unresolved findings. This package rebuilt the native reader's touch handling so each part of the reading stage owns the right gesture, the way the web app splits the screen into zones, and cleaned up nine smaller gesture and feel mismatches that hung off the same structure.\n\n## What this fixed\n\nBefore this, the native reader ran one `Gesture.Race(...)` over the whole reading stage, so every touch anywhere competed between scrub, swipe, and tap. That produced wrong outcomes all over: a horizontal swipe across the big focus word skipped a sentence, a downward flick on the trail ribbon exited the book, any touch anywhere paused playback, and fast flings in the split view could scrub the reel instead of scrolling the text. The web app instead splits the stage spatially: the display band owns the kinetic scrub, and the surrounding stage owns tap to peek, sideways sentence skips, and the swipe down exit. This package reproduced that zoning on native and brought the eight related gestures to match the web exactly.\n\n## What changed\n\n### 1. Stage wide race replaced with spatial zoning\n\nThe reader had a single `Gesture.Race` wrapping the whole stage, so scrub, skip, swipe down, and tap all competed on every touch. The kinetic scrub was scoped to the display band only. The scrub `GestureDetector` now sits directly on the `fontSize * 4` = 224px band view for Focus and Trail and Hybrid, and on a full stage wrapper in Sentence mode. The outer stage keeps a `Race(tap, resolver)`, where one release time Pan mirrors the web's single resolution at finger up (web `useReaderGestures`, constants `TAP_MS = 250`, `TAP_PX = 8`, `SWIPE_PX = 70`, `SWIPE_DOWN_PX = 110`): skip if `absX > absY && absX > 70` (left is forward, right is back), then exit if the touch did not start inside the hybrid paragraph card and `dy > absX && dy > 110`. Because dominance resolves once at release, steep diagonals still count. Zoning is deterministic without any activation order race: `onLayout` measured frames (the band, plus the hybrid paragraph card, both measured relative to the stage view so header collapse never stales them) are hit tested against the touch start point, and the resolver is marked `simultaneousWithExternalGesture` with the band scrub and the paragraph scroller so nothing cancels anything. Band taps pause playback at touch down then peek with a haptic; stage taps peek without pausing. Reel row height and scrub density stay `fontSize * 1.5` = 84px per word on Focus and `round(fontSize * 2.5)` = 140px per word on Trail.\n\n### 2. Focus and Hybrid swipe down exit added\n\nFocus and Hybrid had no swipe down exit at all: the old Race for `rsvp` and `hybrid` was `(scrubGesture, swipeSkip, tap)`, so the vertical scrub claimed every vertical drag and there was no downward flick exit. With the zoning in place, the resolver's exit branch is now active in `rsvp`, `hybrid`, and `trail`. A 110px vertically dominant flick starting off the band, and in Hybrid off the paragraph card, calls `handleBack` (pause plus return to the storefront). Gestures starting inside the hybrid card are suppressed via the measured card frame, so scrolling the bottom text never ejects the reader. The 110px threshold stays deliberately large so casual movement never exits.\n\n### 3. Scrub activation deadzone and cross axis bail removed\n\nThe scrub Pan used `activeOffsetY([-12, 12]).failOffsetX([-24, 24])` (mirrored on the x axis for Trail and Sentence), so the reel did not follow the finger until 12px of travel, 24px of perpendicular movement killed the scrub entirely, and the reel jumped about 12/84 of a word on activation because RNGH translation includes the pre activation travel. On web the reel moves fractionally from the very first pixel (1px = 1/84 word on the Focus reel) and perpendicular movement is simply ignored. Now that the scrub is scoped to the band, those offsets were removed. The pan uses `manualActivation` and activates in `onTouchesMove` at 2px of travel, translation is measured from touch down so there is no activation jump, and perpendicular movement never cancels. The 2px slack rather than literally zero keeps clean finger taps from activating the pan, which on Android would cancel native word presses; 2px is 1/42 of a reel row and imperceptible.\n\n### 4. Hybrid reel scrub no longer steals the paragraph half's scroll\n\nIn Hybrid the old `surfaceGesture` wrapped the whole stage including the bottom 45% ParagraphDisplay, so the reel scrub, the paragraph scroll, and a bare `edgePan` all raced every drag. A normal drag usually scrolled the text, but a fast fling whose first move event jumped past the 12px scrub threshold could scrub the reel instead, an outcome that depended on arbitration and touch sampling rather than a clean spatial split. This falls out of issue 1: the scrub detector only exists on the reel band, and the resolver, edgePan, and GHScrollView are all mutually simultaneous, so every vertical drag in the paragraph half, including fast flings, scrolls the paragraph, with the 34px edge advance barrier intact.\n\n### 5. Paragraph edgePan no longer claims all drags\n\nThe paragraph `edgePan` was a bare `Gesture.Pan()` that activated at the platform touch slop (about 8dp on Android) in any direction and called `onManualScroll?.()` on every update, so an 8dp horizontal drag over the paragraph paused playback (`handleManualScroll` is `poke()` plus `engine.pause()`), and because edgePan activated before the outer skip it prevented the sentence skip from ever firing in paragraph mode. Web only treats vertically dominant drags as manual scroll (`|dy| > 8 && |dy| > |dx|`), so a horizontal swipe there does not pause and, at release, fires the 70px sentence skip. The edgePan `onUpdate` now early returns unless `|dy| > 8 && |dy| > |dx|` before calling `onManualScroll` or the edge logic, with velocity samples still collected first like web, and it declares simultaneity with the stage resolver so a 70px horizontal swipe over the card reaches the skip. Web wheel handling (`WHEEL_MIN` 90 with magnitude mapping to 1, 2, or 3 paragraphs) is desktop only and needed nothing on native.\n\n### 6. Edge advance no longer repeats within one finger stroke\n\nAfter a paragraph over scroll advance, only the 420ms `advanceLock` guarded, so on a short paragraph that sits at its edge a continuous finger pull would fire another advance about every 420ms without lifting. Web sets `touchStart.current = null` in `triggerAdvance` and early returns while it is null, so the rest of that touch is inert and the user must lift and drag again. A `strokeConsumed` ref is now set in `trigger()` (mirroring the web nulling of `touchStart`), cleared in `onBegin`, and early returns in `onUpdate` while set, so at most one edge advance fires per finger stroke. The flick strength multi paragraph counts were left untouched: `V_TWO` 0.9, `V_THREE` 1.5, `OVERSCROLL_MIN` 34, `LANDING_MS` 420.\n\n### 7. Swipe down exit removed from the trail and sentence scrub surfaces\n\nThe trail and sentence Races included `swipeDown` across the entire stage including the scrub surface, and the x axis scrub failed on vertical drags via `failOffsetY`, handing them to `swipeDown`. On web both scrub displays stop propagation on pointer down, so the exit never arms for gestures starting on them: on the trail ribbon the exit only works on the stage area outside the 224px ribbon, and in Sentence mode it works nowhere. Now in Trail the exit fires only for touches starting outside the measured ribbon frame, and in Sentence the outer detector is not rendered at all, so there is no exit gesture anywhere, only the header back button. This matches web exactly. It is flagged below as a judgment call for Michael to overrule.\n\n### 8. Sentence strip tap no longer peeks\n\nThe stage level Tap in the sentence race fired `haptics.tick()` plus `peek()` on any tap. On web, `ReaderView` does not pass `onTap` to SentenceDisplay, so a tap on the strip is a no op; only tapping a word seeks, via the word's own handler. The tap peek and haptic were removed from sentence mode (no outer gestures, and the engine's `onTap` for sentence routes to word seek only). Word taps still seek two ways: the `Text` `onPress` is kept, and an analytic tap to word resolver driven by the scrub gesture's tap was added, gated on under 8px stillness on both axes (browser click semantics), because an activated pan cancels native presses for any wobbly tap. Both paths seek the same word so a double fire is idempotent. Web Trail and Focus still peek on a band tap; only Sentence changed. Flagged below as possibly a web oversight.\n\n### 9. Sentence scrub density and word gap corrected\n\nSentence scrub used a hardcoded `PX_PER_STEP_X = 117` and the strip gap was `displaySize * 0.5` = 22.4px, so words sat wider apart while the drag density stayed fixed, and the strip tracked the finger slightly differently than web. Web derives both from one size: `displaySize = max(32, min(fontSize * 0.8, 64))` = 44.8 at the fixed 56px reader size, `pxPerStep = Math.round(displaySize * 2.6)` = `Math.round(116.48)` = 116px of drag per word, and strip word gap = `displaySize * 0.4` = 17.9px. A `sentenceDisplaySize()` helper was exported from `displays.tsx`; the strip gap is now `displaySize * 0.4` (17.9px) and ReaderScreen passes `pxPerStep = Math.round(sentenceDisplaySize(READER_FONT_SIZE) * 2.6)` = 116, derived from the same size so a future font change stays in step. Trail (140) and Focus (84) already matched web exactly.\n\n### 10. Paragraph scroller Android overscroll stretch removed\n\nThe paragraph `GHScrollView` used the default `overScrollMode`, so on Android 12+ the content visibly stretched when pulled past an edge (a glow on older versions), accompanying the deliberate 34px `OVERSCROLL_MIN` barrier pull that web shows against a visually static page. The scroller now has `overScrollMode=\"never\"` and `bounces={false}`, so edges are a hard stop like web and the 34px barrier pull is the only pre advance feedback. All other paragraph feel constants already matched web: `EDGE_SLOP` 2, `OVERSCROLL_MIN` 34, `LANDING_MS` 420 with scroll disabled during landing, velocity thresholds 0.9 and 1.5, land at top, slide in `28 + 42(n-1)` px over `300 + 150(n-1)` ms.\n\n## Judgment calls\n\n- **Version bump.** The uncommitted 0.7.3 bump was preserved and, per the standing rule to bump every change round, `app.json` now reads 0.7.4.\n- **Scrub activation at 2px, not zero.** A literal 0px activation would cancel native word presses on the sentence strip on every real tap since fingers wobble a few pixels. 2px is 1/42 of a reel row and imperceptible, and translation is still measured from touch down so nothing jumps.\n- **Sentence word taps use two paths.** An analytic tap to word seek fed by the scrub gesture's tap (requiring under 8px stillness on both axes) was added alongside the `Text` `onPress`, because on native an activated pan cancels the press and `onPress` alone would drop most real taps. Both paths seek the same word, so double firing is harmless.\n- **Hybrid exit suppression by measured frame.** A hit test against the measured paragraph card frame is the native equivalent of the web's `startedInVerticalScroller` DOM walk.\n- **Paragraph mode has no exit branch anywhere,** following the gesture map (\"the whole surface is a scroller\"). On a very wide web screen a swipe outside the 672px card could technically exit, but on a phone the card covers the stage.\n- **Two web parity removals flagged for Michael.** Sentence view now has no swipe to exit and no tap to peek, applied to match the web exactly. Both are called out so Michael can overrule them if the web behavior was an oversight.\n\n## Check on your phone\n\n- [ ] Confirm: in Focus view, swiping sideways across the big word does not skip a sentence (a quick light brush there may flash the controls), and swiping sideways above or below it jumps a sentence.\n- [ ] Confirm: the reel and strip follow your finger from the first pixel, with no dead zone before they move and no jump when they catch.\n- [ ] Confirm: flicking straight down from an empty part of the Focus or Hybrid screen closes the book, and scrolling or flicking the Hybrid bottom text never closes it.\n- [ ] Confirm: in the split (Hybrid) view, dragging the small bottom text only ever scrolls that text, even on a fast fling.\n- [ ] Confirm: in Paragraph view, dragging sideways does not pause reading, and a longer sideways swipe jumps a sentence.\n- [ ] Confirm: pulling past the end of a paragraph and holding turns the page exactly once, then waits for you to lift your finger; the page edges feel like a firm wall with no stretchy glow.\n- [ ] Confirm: in the ribbon (Trail) view, swiping sideways off the ribbon jumps a sentence, and flicking down on the ribbon does nothing.\n- [ ] Confirm: in Sentence view, tapping the strip does not buzz or flash anything, tapping a word jumps to it, and the only way out is the back button.\n\nEverything else in this package was verified in code and by review.\n","kicker":"Package 07"},{"id":"08","filename":"08-display-text-measurement.md","title":"Native Reader Displays: Real Text Measurement and Centering Parity","content":"# Native Reader Displays: Real Text Measurement and Centering Parity\n\n**Done.** Implemented and committed as `8e27908` on `feat/native-ui-web-parity`, 2026-07-13, independent review passed with no unresolved findings. This package replaced the reader displays' per character width guesses with real Fraunces 400 text measurement and fixed every piece of geometry that depended on those guesses.\n\n## What this fixed\n\nThe native reader used to estimate every word's width with a flat 0.58em per character, because React Native has no synchronous canvas measurement like the web's `ctx.measureText`. That single approximation warped the geometry in three displays. The trail view's focal letter drifted off screen centre whenever the two sides had uneven ghosts, the sentence strip floated narrow words in oversized boxes and truncated wide words like CHAPTER with a trailing ellipsis, and long words shrank earlier and harder than they should. The paragraph view had a separate bug where the highlighted word sat about 128px low. This package built a shared measurement utility, rebuilt the trail and strip layouts on real widths, corrected the shrink math and the paragraph centering, and cleaned up four small visual constants, so all five displays now match the web word for word.\n\n## What changed\n\n### Text measurement utility (new `src/reader/measureText.tsx`)\n\nThere was no way to measure real text in the native reader, so every display fell back to a flat 0.58em per character estimate. The web caches canvas measurements in a `Map` per word and clears that cache when the font size changes. The new utility is the recommended hybrid: a glyph advance table, warmed once through hidden `onTextLayout` probes, answers synchronously, and exact per string widths overwrite the estimate a frame later. Everything is measured at one 100px reference size and scaled, so a measurement at the base size is a stable fixed point and font size changes need no cache flush. It exposes `measureTextWidth`, `useTextMeasurement` (a re-render subscription), and a hidden `MeasureHost` mounted inside each measuring display. Font is Fraunces 400 (`FONTS.serifRegular`), normal style, normal weight.\n\n### 1. Trail view: focal letter pinned to screen centre\n\nThe native trail was one centred flex row containing `[leftGhosts, before, focal, after, rightGhosts]`, so the current word's position depended on the total width of the left versus right ghosts. At book start and end, or anywhere the two sides had lopsided widths, the focal letter sat visibly off centre. Ghost spacing was `marginHorizontal: ghostFontSize * 0.14` (0.28em between ghosts) instead of the web's measured anchor.\n\nThe web keeps the focal letter always pinned to the exact horizontal centre of a full width, `overflow: hidden` container of height `fontSize * 4` (224px), using three absolutely positioned `inset-0` layers. Layer A holds the current word: `before` anchored `right: calc(50% + halfFocalpx)`, `focal` at `left: 50%` with `translateX(-50%)` in the focal accent color, `after` at `left: calc(50% + halfFocalpx)`, where `halfFocal` is the measured focal width divided by 2. Layer B is the left ghosts, a `flex items-baseline gap-[0.3em]` row anchored `right: calc(50% + halfFocalpx)` with `marginRight: beforeWidth + 8px` (else `8px`) and `direction: rtl` so the nearest ghost sits 8px past the measured end of the current word. Layer C mirrors it with `marginLeft: afterWidth + 8px`. Ghosts render at `ghostFontSize = renderFontSize * 0.82` in muted ink and clip hard at the container edges.\n\n`TrailDisplay` was rebuilt on that three layer geometry. The current word layer pins the focal box dead centre through equal flex sides, which produces geometry identical to the web's `left: 50%` `translateX(-50%)` pin but needs no measurement, so the pin never drifts while exact widths land. The ghost lanes are anchored at centre plus the measured `halfFocal` plus the measured `before` or `after` width plus 8px (just 8px when that half is empty), with the nearest ghost adjacent to the anchor, a 0.3em `columnGap` at the ghost size, and a hard clip at the container edges via `overflow: hidden`. This holds the user's red line from the RSVP work: the focal letter is always centred on screen.\n\n### 2. Sentence strip: measured widths, even gaps, no ellipsis\n\nThe strip estimated widths with `estWordWidth = Math.max(fontSize * 0.4, word.length * fontSize * 0.58)`, used the wrong gap constant `displaySize * 0.5`, and laid each word into a fixed width `Text` with `numberOfLines={1}` and `textAlign: 'center'`. Narrow words like \"ill\" and \"if\" floated in huge boxes, wide words like \"CHAPTER\" and Roman numerals overran the estimate and truncated to \"CHAPT…\", and the animated worklet interpolated only between the prev, current, and next centres, extrapolating linearly past one word on a fast fling.\n\nThe web measures each word exactly with a canvas context, caches it in a `Map`, and clears the cache when `displaySize` changes. `displaySize = Math.max(32, Math.min(fontSize * 0.8, 64))`, which is 44.8 at the 56 base. Cumulative lefts advance `x += width + gap` with `gap = displaySize * 0.4` (about 17.9px), words are absolutely positioned `whitespace-nowrap` spans with no width box at `top: 50%` `translateY(-50%)`, opacity is `Math.max(0.2, 1 - dist * 0.16)`, and the transform interpolates across the true centres of the whole window of 9 each side through a mids map, `at = m0 + (m1 - m0) * (f - i0)`.\n\nWord positions now come from `measureTextWidth` at `displaySize` with cumulative lefts plus the gap. The gap constant was already `0.4` in the committed tree, so it was verified rather than re-changed. The fixed width, `numberOfLines`, and `textAlign` were removed so nothing can truncate, and the strip carries an explicit width with 4em of slack so no box is ever clamped (`lineHeight: stripH` is kept for vertical centring). The worklet now interpolates across the full window through a plain array of centres plus the window's first index, clamped at the window edges, so a fast fling tracks real geometry the whole way. The playback pin to the committed index and the scrub follow of `pos` are unchanged.\n\n### 3. Long word shrink from real measurement\n\n`fitFontSize` estimated each half as `charCount * 0.58` em plus `0.5 * 0.58` em for the focal. That 0.58em per character constant is generous for Fraunces, so native shrank words the web would leave at full size, shrank earlier and by more, and was blind to glyph shapes, so \"illicit\" shrank as if it were as wide as \"mammoth\". The margin and floor constants `FIT_SIDE_MARGIN = 14` and `MIN_SCALE = 0.5` already matched the web.\n\nThe web measures `before + halfFocal` and `after + halfFocal` with the element's real computed font at the base size, sets `availableHalf = containerWidth / 2 - 14`, and only if the longer half exceeds it shrinks by the exact ratio `availableHalf / longerHalf`, floored at 0.5. `fitFontSize` now measures the `splitWord` halves plus half the focal in Fraunces 400 at the base size through the utility, cached per string, keeping the `containerW / 2 - 14` threshold, the exact ratio shrink, and the 0.5 floor. This one fix serves the reel, the trail, and the hybrid view. `splitWord` and `effectiveBaseFontSize` were left untouched.\n\n### 4. Paragraph auto centering plus the 128px content padding\n\nThe paragraph scroll target was `target = Math.max(0, wordY - layoutH / 2 + lineHeight / 2)`, where `wordY` is the word's `onLayout` y relative to the inner `paraWrap` view. The scroll content begins with `paddingVertical: 128` (`s.paraContent`), so the word's y in content coordinates is `wordY + 128` and every mid paragraph scroll landed 128px short, leaving the active word about two lines low at the 33.6px paragraph type. The web is padding independent: it measures `diff = elementCenter - containerCenter` from real rects and scrolls only when `|diff| > 2` px, instant on the first move then smooth.\n\nA shared `PARA_PAD_V = 128` constant now feeds both the `s.paraContent` style and the scroll target (`wordY + PARA_PAD_V - layoutH / 2 + lineHeight / 2`), so the active word sits at the vertical centre of the card. The web's skip when the correction is 2px or less was added, and the existing instant then smooth behavior was preserved.\n\n### 5. Focus reel \"Ready\" empty state font size\n\nThe reel's empty state rendered \"Ready\" at a hardcoded `fontSize: 24`. The web keeps the guide frame in a `fontSize * 4` (224px) box and lets the centred \"Ready\" span inherit the `fontSize` prop (56, wired from `DEFAULT_FONT_SIZE`) in muted ink Fraunces 400. It now renders at the display's `fontSize` prop (56), color `t.textMuted`, `FONTS.serifRegular`, inside the guide frame. This state is nearly unreachable, since both platforms gate the reader behind a successful parse, so it is cosmetic only.\n\n### 6. Trail \"Ready\" empty state font size\n\nThe trail's empty state had the same hardcoded `fontSize: 24`. It now renders \"Ready\" at the display's `fontSize` prop (56) in Fraunces 400, color `t.textMuted`, inside the guide frame, the same fix as issue 5.\n\n### 7. Farthest ghost opacity floor\n\nNative's ghost opacity floor was `Math.max(0.06, 1 - i * 0.2)`, so the fifth ghost sat at 6 percent. The web uses `Math.max(0.04, 1 - i * 0.2)` for i = 1 to 5, giving 0.8, 0.6, 0.4, 0.2, 0.04. The native floor is now `0.04`, so the fifth ghost sits at 4 percent. `TRAIL_COUNT = 5` and the 0.2 falloff already matched.\n\n### 8. Trail rows ride 4px above the guide frame centre\n\nThe single native trail row was centred exactly through `justifyContent: 'center'` with no offset, so the text sat 4px lower than on the web. The web wraps all three layers in `inset-0 flex items-center` boxes with `marginTop: '-8px'`, which stretches each box from y = -8 to y = 224 (resolved height 232) so the centred text line lands at y = 108, a net 4px above the geometric centre (112) of the 224px frame. All three rebuilt trail layers (the word layer and both ghost lanes) now carry `translateY(-4)` so they share one baseline. The Focus reel intentionally does not get the nudge, since the web reel is exactly centred (`top: '50%'`, `translateY(calc(-50% + offsetY))`, no margin), so the trail alone rides 4px high. This is strict parity with the web, and it is flagged below in case Michael prefers cross mode consistency instead.\n\n## Judgment calls\n\n- **Version bump.** `app.json` was clean and already committed at 0.7.4, with no uncommitted 0.7.3 bump to preserve, so per the standing rule to bump every change round it was moved from 0.7.4 to 0.7.5.\n- **Sentence gap already fixed.** The `displaySize * 0.4` gap was already in the committed tree from another session, so it was verified rather than re-changed.\n- **Focal pin construction.** The current word keeps the equal flex `FocalWord` construction instead of measured absolute spans, because it produces geometry identical to the web pin without depending on measurements, so the pin cannot shift while exact widths land. Measurements only position the ghost lanes.\n- **Ghost lanes.** The ghost rows live in 4000px wide invisible lanes anchored by inset with the row packed against the anchor edge, sized so Yoga can never clamp the row below its content (which would spill ghosts past the anchor). This also means the ghost words themselves never need measuring.\n- **Reference size scaling.** Measurement happens at one 100px reference size and scales linearly, so the base size fixed point holds by construction and no cache flush is needed on font size changes.\n- **MeasureHost placement.** `MeasureHost` is mounted inside each measuring display, since only one display is ever mounted at a time, to keep displays self contained instead of editing `ReaderScreen`.\n- **Worklet fallback.** The worklet fallback beyond the rendered window clamps to the window edge centre, the natural extension of the web's mids map fallback.\n- **2px scroll skip.** The optional 2px scroll skip was added to the paragraph view, since the prompt called it harmless and it matches the web.\n- **Trail 4px nudge is trail only.** Matching the web means the trail rides 4px high relative to the reel (issue 8); flagged so Michael can decide whether he prefers cross mode consistency.\n\n## Check on your phone\n\n- [ ] Confirm: in trail view at the very first word of a book, the big word sits exactly in the middle of the screen with the faded words trailing off to the right only.\n- [ ] Confirm: in trail view, scrub to a spot where one side has much longer words than the other, and the bright focal letter stays glued to the middle.\n- [ ] Confirm: in sentence view, find a chapter heading like CHAPTER I and the whole word is visible with no dots at the end, with even spacing between words.\n- [ ] Confirm: in paragraph view, read a few lines into a long paragraph and the highlighted word stays in the middle of the card instead of drifting toward the bottom.\n- [ ] Confirm: very long words shrink only when they truly need to, and about as much as on the web version.\n- [ ] Confirm: in trail view, scrub through and the ghost spacing looks even with the words never overlapping.\n\nEverything else in this package (the measurement utility internals, the two nearly unreachable \"Ready\" empty states, the 0.04 ghost opacity floor, and the 4px trail row offset) was verified in code and by review.\n","kicker":"Package 08"},{"id":"09","filename":"09-open-transition-internals.md","title":"Book Open Transition Internals and Error Flow","content":"# Book Open Transition Internals and Error Flow\n\n**Done.** Implemented and committed as `61d1926` on `feat/native-ui-web-parity`, 2026-07-13, independent review passed with no unresolved findings. This package brought the native book open transition, its loading path, and its error flow to exact parity with the web app's `BookOpenTransition`.\n\n## What this fixed\n\nBefore this package the native open transition drifted from the web in several ways at once. The transition closed on download completion rather than parse completion, so the reader mounted before it was ready and flashed its own full screen loading view with a duplicate badge while a large book parsed on the JS thread. A failed open fired the transient save toast pill instead of a proper error card, and ReaderScreen carried a full screen error page with a Try again button the web never had. Instant opens clamped the cover to the viewport, the cover kept flying during the closing fade, the faux page text was solid ruled lines instead of dashed word strips, the loading spinner was Android's material arc, and a held book that finished loading could flash the committed badge for a frame. This package parsed the book during the transition so the reader is fully formed the frame the fade ends, matched the web's spring back plus persistent dismissible error card, froze the cover the instant the fade starts, rendered the faux text as dashes, and swapped in a spinning Loader2. All committed as `61d1926`.\n\nFiles changed: `App.tsx`, `src/components/BookCover.tsx`, `src/components/OpenErrorCard.tsx`, `src/components/Spinner.tsx`, `src/open/OpenTransition.tsx`, `src/screens/ReaderScreen.tsx`, `src/services/library.ts`, `src/store.ts`.\n\n## What changed\n\n### 1. Close the transition on parse completion, not download completion\n\nThe web (`src/App.tsx`) fetches `library.fetchContent(book)`, runs `parseText(text)` synchronously, injects authored scene chapters into the parsed result, and only then sets `pendingParsed`, so the 240ms close fade starts only after the book is fully parsed and `onComplete` swaps into a ready reader with no in reader loading state. Native used to resolve on download of raw stripped text, fade, navigate, then re-await `fetchContent` and run `parseText` in ReaderScreen during render, showing a full screen loading view with its own back chevron and a duplicate 'Brewing your book…' badge while the synchronous parse of a large book blocked the JS thread after the fade already ended.\n\n`begin()` now parses the downloaded text and applies the scene to chapter mapping while the cover is still up, matching the web's synchronous main thread parse:\n\n```ts\nconst scenes = getScenes(pending.book.id);\nif (scenes.length > 0) {\n    parsed.chapters = scenes.map((s) => ({ title: s.label, wordIndex: s.startIndex, lineIndex: 0 }));\n    parsed.chapterConfidence = 'high';\n}\n```\n\nThe resulting `ParsedText` is stashed in `library.ts` (`stashParsed`/`consumeParsed`, keyed by book id and cleared on consumption), and only then does `setLoaded(true)` fire. ReaderScreen consumes the stash on mount so it renders fully formed the frame the fade ends and the 'Brewing your book…' screen never appears on transition driven opens. The fetch plus parse path survives only as a cold mount fallback (deep links, state restore). A cancelled open skips the parse so nothing stale is stashed.\n\n### 2. Persistent dismissible error card after the cancel spring settles\n\nThe web catch stores the error message (`e.message`, fallback `'Could not open that book.'`), fires `haptics.error()`, springs the cover back, and only after cancel completes and `pending` clears renders a fixed card: `bottom-6` (24px), centered (`left-1/2 -translate-x-1/2`), `z-[90]`, `max-w-sm` (384px), `w-[calc(100%-2rem)]`, `bg-cream rounded-2xl ring-1 ring-coral-accent/30 shadow-xl px-4 py-3 flex items-start gap-3`, holding a bold 13px \"Couldn't open that book.\" plus the specific error in italic mocha and a lucide `X` dismiss (size 16, mocha) that persists until dismissed. Native used to run `haptics.error()` then `showToast(\"Couldn't open that book.\")` immediately while the cover was still springing, using the store's transient bubble (in over 290ms, hold 1750ms, fade out 360ms) styled as the save confirmation pill with the coral Bookmark medallion, carrying no error detail and no dismiss control.\n\nThe rejection handler now keeps `haptics.error()` and the cancel (target 0, `phaseSV = 3`, phase 'cancelling'), drops the toast, and parks the real error message (fallback 'Could not open that book.') in a ref. `clear()`, which runs from `finishCancel` after the spring settles, promotes it to new store state `openError`. A new `OpenErrorCard` component matches the web card: surface background (`t.surface`), borderRadius 16, borderWidth 1 with the accent color at 30% alpha, shadow, paddingHorizontal 16, paddingVertical 12, bottom 24 plus safe area inset, centered, maxWidth 384, width screen minus 32, zIndex 90, bold 13px \"Couldn't open that book.\" headline, italic muted detail line, and a 16px lucide-react-native `X` dismiss. The detailed error strings from `src/services/library.ts` ('No readable plain-text edition is available for this title.', 'The downloaded file appears to be empty.', `HTTP ${res.status}`) now surface in the detail line instead of being swallowed. `begin()` dismisses any lingering card, same as the web.\n\n### 3. Remove ReaderScreen's full screen error page and Try again button\n\nThe web has no retry affordance and never mounts the reader on failure; loading lives inside the transition's 'Brewing your book…' badge over the storefront. Native used to commit to ReaderScreen before content resolved, showing a full screen loading page (pill badge with ActivityIndicator plus 'Brewing your book…' and the title, plus a bare '‹' back glyph), and on error swapping to serif \"Couldn't open that book.\" (19px Fraunces medium), the message in italic 13px Fraunces, and a coral 'Try again' pill that re-ran `fetchContent` via `setAttempt`.\n\nThe error page, Try again pill, the error/attempt state, and the error haptic effect are gone. With issue 1 fixed, transition driven opens never reach ReaderScreen before content is ready, so this path only fires on cold mounts. A cold mount fetch failure now fires `haptics.error()`, shows the same persistent card via the store, and goes back (`navigation.goBack()`, falling back to navigating to `Today` when there is nothing to go back to). The plain loading badge view survives for cold mounts only.\n\n### 4. Instant opens must not clamp the anchor to the viewport\n\nOn the web, `autoCommit` initialises the anchor to the tracking rect centre raw and unclamped, and `clampToViewport` (half cover plus a 12px margin) applies only to finger following during gesture tracking. So tapping a Library row whose 48px cover sits at an x centre of about 58 makes the 180x270 cover expand centred on that point, hanging about 32px off the left edge. Native used to clamp on instant opens (`const anchored = opts.instant ? clampToViewport(cx, cy) : { x: cx, y: cy };`), shifting the same tap right and down.\n\n`begin()` now always anchors on the raw origin centre (`const anchored = { x: cx, y: cy };`), and the provider's `clampToViewport` helper was removed. The finger follow clamp inside the frame callback (tracking phase only) is untouched, matching the web.\n\n### 5. Freeze all cover motion the instant the closing fade starts\n\nThe web closing effect cancels the requestAnimationFrame loop before applying the CSS `opacity 240ms ease-out` fade, so the cover freezes wherever the spring had reached (for a cached or bundled book that loads in about 50ms, openness around 0.1 to 0.3) and fades out in place. Native's `useFrameCallback` used to keep integrating the spring through the closing phase; gesture commits froze target so drift was negligible, but instant opens have target = 1, so a book that loaded before the spring settled kept expanding and translating toward the screen anchor for the whole 240ms fade, most visible on the three bundled books and any cached book.\n\nThe spring integration in the frame callback is now guarded with `phaseSV.value !== 2`, and the closing effect (plus the loaded at release fast path) also sets `target = openness` and `velocity = 0`, so the cover fades out frozen in place exactly like the web.\n\n### 6. Faux page text as dashed word strips, not solid ruled lines\n\nEach web line is a 2px repeating gradient of ink dashes: `repeating-linear-gradient(90deg, ink 0 {wordPx}px, transparent {wordPx}px {wordPx + 2.4}px)` with `wordPx = 3.6 + ((row * 3) % 4) * 0.5` varying per row, `ink = 'rgba(74,55,40,0.32)'`, line width `calc(w% - indentPx)` with a 7px `marginLeft` indent on each paragraph's first line, deliberately broken text. Native used to draw solid Views at full width `${w}%` (indent not subtracted, so first lines extended 7px too far right) with `opacity: 0.75 + ((row % 3) * 0.06)` as a stand in and no word gaps at all.\n\nEach line is now a clipped row of small dash Views: dash width `wordPx = 3.6 + ((row * 3) % 4) * 0.5` computed before the row increment (matching the web's sequence exactly), 2.4px gaps, 2px tall, borderRadius 999, constant color `rgba(74,55,40,0.32)`, and the per row opacity variation removed entirely. First lines use a container of width `${w}%` with `paddingLeft: 7` and `overflow: 'hidden'`, reproducing web's `calc(w% - 7px)` width plus `marginLeft: 7` so dashes start 7px in and the right edge lands at w% of the column; enough dashes are rendered to overfill and let the clip do the work, since RN has no repeating gradient. Everything that already matched stayed: paragraph line widths `[97, 92, 95, 67]`, `[94, 90, 96, 85, 51]`, `[92, 88, 94, 60]`, the heading mark (centred, 46% width, 3px height, opacity 0.9, marginBottom 9), gap 5 between lines, 8px paragraph spacing, and container insets (top and bottom 14%, left 39%, right 9%).\n\n### 7. Skip the 'committed' phase when content is already loaded at release\n\nOn the web, `onUp` checks a ref mirror synchronously (`setPhase(loadedRef.current ? 'closing' : 'committed')`), so if the fetch and parse finished while the finger was still down, the badge is never rendered and the fade begins immediately on release. Native's `release()` used to unconditionally set phase 'committed' (`phaseSV.value = 1`), then flip to 'closing' after the commit render painted, so the badge row could flash for a frame or two.\n\nA `loadedRef` mirror is now set alongside `setLoaded` and read synchronously in `release()`. When already loaded the phase goes straight to 'closing' with `phaseSV.value = 2`, the target frozen at the current openness and velocity zeroed (consistent with issue 5), so the badge never mounts.\n\n### 8. Replace the ActivityIndicator with a spinning 14px Loader2\n\nThe web badge is `bg-cream/95 rounded-full px-4 py-2` with 8px gap, `ring-1 ring-espresso/10 shadow-lg`, fixed 40px from the bottom, centred, containing lucide `Loader2` at size 14 in `text-coral-accent` with `animate-spin` (1s linear infinite rotation) plus 'Brewing your book…' at 12px font medium espresso. Native had the same container metrics (`t.paperA(0.95)`, border `t.inkA(0.1)`, padding 16/8, gap 8, bottom 40, radius 999) and identical copy and typography, but the spinner was `<ActivityIndicator size=\"small\" color={t.accent} />`, Android's material arc at about 20dp.\n\nA new shared `Spinner` component wraps lucide-react-native's `Loader2` at size 14 in `t.accent` inside a reanimated view spinning `withRepeat(withTiming(360, { duration: 1000, easing: Easing.linear }), -1)` driving a rotate transform, matching the web's once per second linear infinite rotation. It is used in both the transition badge and the surviving ReaderScreen cold mount badge; both `ActivityIndicator` usages are removed.\n\n### 9. Verify the cover scaling model at rest\n\nThe web `apply()` resizes the layout box each frame (`wrap.style.width/height = COVER_W * scale`) and positions with translate only, so the BookCover's 12px right radius, 1px ring, stitch inset, and text sizes are constant CSS pixels at every openness and at openness 0 the floating cover is pixel identical to the md card cover it replaces. Native uses a fixed 180x270 render transform scaled about its centre, so constant pixel details scaled: at a 48px row the 12px/3px corner radii rested at roughly 3.2px visual radius versus the card's 12px, popping at pickup and at cancel settle.\n\nVerified on paper that it did NOT coincide at rest, and the fix was applied. An animated style in the Overlay counter scales the four radii by `1/scale` on both the page (new `pageStyle` prop on BookCover) and the cover face (merged into `faceStyle`), so the on screen radii are a constant 12px/3px at every openness, exactly like the web's layout resize model. Border widths were deliberately left scaled: `borderWidth` is a layout prop in RN and animating it would relayout every frame, and the divergence is a fraction of a pixel. Residual divergence remains in the generated cover type size (the overlay draws at 180 wide and scales down while card type is fixed per size, so cover text renders about 20% smaller than the card at pickup); Michael should eyeball pickup on device.\n\n### 10. Reader screen navigation animation should be 'none'\n\nThe web `onComplete` fires exactly `CLOSE_FADE_MS = 240` ms after closing starts and synchronously sets viewMode 'READING', so the storefront unmounts and the parsed reader appears the same frame; exiting the reader is likewise an instant swap with no animation. No change was needed here: `App.tsx` already registers the Reader screen with `animation: 'none'` (landed with the earlier navigation parity package). Verified in the current file that entry and exit are instant swaps around the 240ms cover fade.\n\n## Judgment calls\n\n- The error card state lives in the zustand store (`openError`, `showOpenError`, `dismissOpenError`, never persisted) with the card mounted once at the app root, so the transition and ReaderScreen share one card the way the web shares App level `pendingError`, instead of duplicating card UI in two places.\n- The prompt suggested guarding the frame callback with `phaseSV.value < 2`, but that would also freeze the cancel spring (phase 3), so `phaseSV.value !== 2` was used and target plus velocity were frozen on the closing paths, putting both suggested mechanisms effectively in place.\n- For issue 9 the counter scale was applied only to the radii. Animating `borderWidth` forces a full layout pass every frame in RN, the exact cost the prompt said to avoid, and the border divergence is under a pixel. The generated cover text still renders about 20% smaller than the card at pickup; fixing that would mean scaling type dynamically inside the shared BookCover, which was left alone and flagged for an on device look.\n- A cancelled open that finishes downloading mid spring skips the parse and stash entirely, so no orphaned `ParsedText` is retained.\n- The error card shadow uses the warm espresso shadow color the toast already uses rather than pure black, keeping the two bottom cards consistent; every other metric follows the web exactly.\n\n## Check on your phone\n\n- [ ] Confirm: tap a book you have read before. The cover freezes and melts away where it is, not growing while it fades, and the reading page is there the instant the cover is gone, with no extra fade and no brewing message inside the reader.\n- [ ] Confirm: turn on airplane mode and tap a book you have never opened. The cover slides back to its shelf first, then a cream card appears at the bottom saying it could not open the book, with the actual reason in smaller italic text and a little X. It stays until you tap the X. No Try again button, no error page.\n- [ ] Confirm: in the Library list, tap a book in a row near the left edge. The opened cover is allowed to hang off the edge of the screen, matching the web.\n- [ ] Confirm: press and hold a book until the page peeks out. The fake text looks like rows of tiny dashes, like blurred words, not solid drawn lines.\n- [ ] Confirm: keep holding a slow book until the brewing pill appears. The spinner is a thin coral line icon spinning smoothly and small, not the standard Android spinner.\n- [ ] Confirm: hold a book for a few seconds so it finishes loading, then let go. It fades out right away without the brewing pill blinking on screen first.\n- [ ] Confirm: at the moment you press a book, the floating cover's corners look as round as the card underneath, with no visible pop or seam at pickup (the generated cover text still renders a touch smaller than the card, which is the one known residual).\n\nEverything else in this package (parse caching and data threading, the shared store error state, and the Reader screen's `animation: 'none'` registration) was verified in code and by review, including a clean `npx tsc --noEmit` and an independent adversarial pass that checked every constant, timing, and copy string against the web source with no unresolved findings.\n","kicker":"Package 09"},{"id":"10","filename":"10-reading-progress-and-sessions.md","title":"Reading progress persistence and session accounting","content":"# Reading progress persistence and session accounting\n\n**Done.** Implemented and committed as `295bbb7` on `feat/native-ui-web-parity`, 2026-07-13, independent review passed with no unresolved findings. This package brought the native Android app's progress saving and reading session bookkeeping into exact parity with the web app.\n\n## What this fixed\n\nBefore this pack, the native reader diverged from the web on five points that touched what shows up in the Library, in Recents, on the Today resume hero, and in the cumulative reading stats. Saved books resumed partway through instead of restarting at the story, an index of 0 was mishandled both when opening and when saving, books with no detected front matter never entered the Reading list, the Android system back gesture silently dropped the reading session that was in flight, and empty playback spans quietly inflated total time read. Each of these now behaves the way the web app behaves.\n\nFor reference, both platforms share `PROGRESS_SAVE_INTERVAL_MS = 2000` (web `src/App.tsx:29`, native `src/screens/ReaderScreen.tsx:37`). Files changed in this pack: `src/screens/ReaderScreen.tsx`, `src/reader/useReelEngine.ts`, `app.json`.\n\n## What changed\n\n**1. Saved for later rows now open at the first readable word, not the stored resume point.**\n\nBefore, an absent `startIndex` fell through to `?? saved?.currentIndex`, so a saved book that had been read once resumed partway through (or at the end, if finished). The web opens such rows with no `startIndex` at all (`onOpen(book, coverRect)` from `BookRow`), and `App.completePendingOpen` applies the rule at web `src/App.tsx:203-207`: use `pending.startIndex` only when it is truthy and `> 0`, otherwise fall back to `pendingParsed.readableStartWord`. The `?? saved?.currentIndex` fallback was removed from `initialIndex` and from the `lastIndex` ref init in native `ReaderScreen`, and the now-unused `saved` selector was dropped entirely. An absent `startIndex` now always means \"open at `readableStartWord`.\" Library rows pass no `startIndex` and restart at the story, while the Today hero (`progress.currentIndex`), vibe cards, search cards, and recent rows (`progressById[book.id]?.currentIndex`) still pass explicit progress and resume, exactly like the web.\n\n**2. A `startIndex` of 0 now falls through to `readableStartWord`, and index 0 is saveable.**\n\nBefore, `startIndex ?? saved?.currentIndex ?? readableStartWord` honored an explicit 0, so a 0-index progress entry opened at token 0, inside the Gutenberg front matter. The opening position is now `startIndex && startIndex > 0 ? startIndex : parsed.readableStartWord`, mirroring the web's `pending.startIndex && pending.startIndex > 0` truthiness rule, so a stored index of 0 never opens inside the front matter. The saveability half of this issue is delivered by the issue 3 change below.\n\n**3. Progress now saves whenever the index changed since the last save, including index 0.**\n\nBefore, `saveNow` guarded `if (lastIndex.current > 0 && tokenCount > 0)`, so a fresh book whose parse yields `readableStartWord === 0`, opened and backed out of, wrote nothing and never entered `progressById`, Reading, Recents, or the resume hero, unlike the web where merely opening a book records it at 0%. Scrubbing back to word 0 and exiting also kept the stale higher position. The `lastIndex.current > 0` guard was replaced with the web rule: a `lastSavedIndexRef` seeded to sentinel `-1` (matching web `src/App.tsx:256`), a save fires when `lastIndex.current !== lastSavedIndexRef.current` (plus `tokenCount > 0`), `lastSavedIndex` is updated only on a real save, and the throttle timestamp is bumped only on a real save, gated by `(!isPlaying || sinceSave >= PROGRESS_SAVE_INTERVAL_MS)` at 2000ms. This was applied in both the throttled effect and the AppState/unmount path (web `src/App.tsx:257-277` and `281-294`). The old `> 0` guard existed to avoid clobbering a real resume point with 0 before the engine hydrates; that safety was kept a different way. `lastIndex` is now seeded from the same hydrated `initialIndex` expression, and the engine's hydration effect (`useReelEngine.ts:140-149`, with `onIndexChange` at line 151) runs before `ReaderScreen`'s save effects in the same commit, so a save can never fire before the position lands on the opening word.\n\n**4. Android system back while playing now records the in-flight session.**\n\nBefore, header back and the menu button called `engine.pause()` first (so the session recorded), but the Android hardware or gesture back popped the screen directly and the unmount cleanup only called `sub.remove()` and `saveNow()` for progress. Nothing called `pause()` or `endSpan()`, so the pending play span was discarded and stats lost that session's words and time. The web routes every exit through `handleBack`, which calls `rsvp.pause()`, and the `isPlaying` effect then fires `addSession(words, ms)` (web `src/App.tsx:228-231` and `296-314`). Two layers now cover the native path: a navigation `beforeRemove` listener calls `engine.pause()` the moment the pop starts, so the span ends at exit time rather than after the pop animation, and the unmount cleanup calls `engineRef.current.pause()` before `saveNow()` as a safety net for any other unmount. `pause()` is a no-op when not playing (`useReelEngine.ts:321-326` early-returns on `!playing`), so header back and menu exits are unaffected and the pause runs before the progress save so both the session and the final position land.\n\n**5. Zero-word or zero-length spans no longer reach the stats store.**\n\nBefore, `useReelEngine.endSpan` called `onSession(Math.max(0, i - span.i), Date.now() - span.t)` unconditionally, and the store's `addSession` clamped negatives but happily added `words = 0` with positive ms. Tapping play then pause in place, or play followed immediately by a scrub (the scrub `onBegin` ends the span before any words advance), accumulated `msRead` with 0 words, permanently drifting the Stats page time up and the derived `avgWpm = wordsRead / minutes` down. `endSpan` now computes `words` and `ms` and only calls `onSession` when both are `> 0`, matching the web's `if (ms > 0 && words > 0)` at web `src/App.tsx:309`. Placing the guard inside `endSpan` covers every pause path at once: `togglePlay`, `pause`, the end-of-book stop, the scrub touch-down, AppState backgrounding, and the new exit paths.\n\n## Judgment calls\n\n- The state note expected an uncommitted `app.json` bump from 0.7.2 to 0.7.3, but the tree was clean at 0.7.7 with all prior sessions committed. Per the standing rule to bump every change round, `expo.version` was set to 0.7.8.\n- For issue 4, both suggested mechanisms were implemented rather than one: `beforeRemove` ends the span at the instant the pop starts for a more accurate span length, and a `pause()` in the effect cleanup before `saveNow()` covers non-navigation unmounts. Both are safe because `pause()` no-ops when idle.\n- The zero-span guard lives inside `endSpan`, the prompt's preferred spot, so every pause route is covered by one check.\n- Cold mounts (deep link or state restore) can briefly persist the pre-hydration index for one commit before the corrected index is written in the same synchronous flush. The web has the identical one-commit transient (its persist effect runs before `rsvp.seek`'s state commits), so the web behavior was matched rather than adding extra gating.\n- The `tokenCount > 0` guard was kept inside `saveNow`, mirroring the web's `total === 0` early return.\n\n## Check on your phone\n\n- [ ] Confirm: a Saved for later book you have already read partway opens from the beginning of the actual story, not where you left off.\n- [ ] Confirm: a book whose stored position is at the very start opens at the first readable word, never inside the Gutenberg front matter.\n- [ ] Confirm: opening a brand new book and backing out right away makes it appear under Reading in the Library at 0 percent, and on the Today resume hero.\n- [ ] Confirm: scrubbing back to the very start of a book and then exiting keeps the position at the start, not at the further-along spot you left earlier.\n- [ ] Confirm: leaving the reader with the phone's own back gesture while a book is playing counts that stretch, so the time and words on the Stats page grow.\n- [ ] Confirm: tapping play then pause a few times without reading adds nothing to total time read, and the average WPM on Today and the Stats page does not drift down.\n\nEverything else in this package was verified in code and by review, including the type check (`npx tsc --noEmit` clean at commit time) and an independent adversarial review that re-checked every acceptance item against the native code and the cited web sources with zero fix rounds.\n","kicker":"Package 10"},{"id":"11","filename":"11-shelf-snap-and-virtualization.md","title":"Shelf snapping, list virtualization, and grid spacing","content":"# Shelf snapping, list virtualization, and grid spacing\n\n**Done.** Implemented and committed as `ef4bf3e` on `feat/native-ui-web-parity`, 2026-07-13, independent review passed with no unresolved findings. This package made the native app's horizontal shelves and results grids scroll like the web app and perform like a native app should.\n\n## What this fixed\n\nThe native storefront had five gaps. Horizontal shelves scrolled freely and settled at arbitrary offsets instead of snapping to a card edge like the web. The Popular shelf mounted all 100 cards eagerly and the Browse grid mounted all 988, so both paid a full render cost up front rather than windowing like a native list should. The bookmark ribbon tips got shaved off the top of covers on horizontal shelves because a negative margin sat in the wrong place. And the results grid's vertical spacing drifted from the web. This package brought all five to parity: card snapping on every shelf, real virtualization on the two heavy lists, full ribbon headroom, and matched grid spacing.\n\n## What changed\n\n### 1. Card snapping on the Popular shelf and every vibe swimlane\n\nBefore, the web snapped and native did not. The web Popular shelf scroller (`src/components/Input/StoreFront.tsx:1114`) and every `Swimlane` scroller (`StoreFront.tsx:194-212`, scroller div at line 206) carry `flex gap-5 overflow-x-auto snap-x snap-mandatory scroll-pl-5 -mx-5 px-5 pt-7 -mt-4` with `snap-start flex-shrink-0` on each card wrapper: CSS mandatory scroll snap with a 20px scroll padding inset, so after any fling or drag momentum always settles with a card's left edge aligned to the 20px inset and the shelf never rests between cards. Native's `TodayScreen.tsx:149-168` and the shared `Swimlane` in `src/components/ui.tsx:98-122` were plain horizontal `ScrollView`s with `contentContainerStyle` of `paddingHorizontal: 20, gap: 20` and the default `decelerationRate`, no snapping, so flings settled anywhere.\n\nBoth scrollers got `snapToOffsets = cards.map((_, i) => i * (cardWidth + 20))`, one offset per card, plus `decelerationRate=\"fast\"` so the settle feels like CSS mandatory snap rather than a long native glide. `snapToOffsets` was used rather than `snapToInterval` because the trailing 4px spacer makes the content length a non multiple of the interval. Because the content container already carries `paddingHorizontal: 20`, offset 0 puts the first card's left edge at the 20px inset with no correction. Snapping applies after momentum (the default for these props), so a hard fling still lands on a card edge. The shared `Swimlane` grew an optional `cardWidth` prop (default 144) and counts its cards with `React.Children.count`; `VibeScreen.tsx` passes `cardWidth` 176 to the \"Deeper cuts\" lane (`VibeScreen.tsx:229`) so its offsets step by 196 while every other lane steps by 164.\n\n### 2. Virtualize the Popular shelf (100 cards)\n\nBefore, `TodayScreen.tsx:149-168` rendered `popular.map(...)` inside a horizontal `ScrollView`: 100 `BookCard` instances, each with an rn-svg generated cover, a `GestureDetector` (Pan plus Tap race), and an animated `SaveButton` ribbon, all instantiated synchronously when Today mounted. The web maps all 100 too (`StoreFront.tsx:1114-1140`) but they are cheap DOM nodes so Today paints instantly. The repo already had the virtualized pattern in the unused legacy `src/components/Shelf.tsx:25-36` (`FlatList`, `initialNumToRender={4}`, `windowSize={5}`, `removeClippedSubviews`).\n\nThe Popular shelf became a horizontal `FlatList` with `initialNumToRender` 5, `windowSize` 5, and `removeClippedSubviews`, keeping the exact card wiring: `BookCard` with `width={176}`, `holdMs={SHELF_HOLD_MS}`, `slotId={`shelf:${book.id}`}`, and `startIndex={progressById[book.id]?.currentIndex}`. The 20px gaps ride as an `ItemSeparatorComponent` and the tail is a 24px `ListFooterComponent` (20px gap plus the web 4px spacer) rather than a flex gap in the content container. The loading state still renders four `CoverSkeleton` placeholders at width 176 in a plain `View` with identical styling when `popular.length === 0`. The 20px content insets (`paddingHorizontal: 20`), the full bleed `marginHorizontal: -20`, the ribbon headroom from issue 4, and the snap behavior from issue 1 all carried over.\n\n### 3. Virtualize the Browse results grid (988 cards)\n\nBefore, `ResultsScreen.tsx:118-130` mapped `results` into `<View style={s.cell}>` cells inside `PageShell`'s `ScrollView` (`src/components/ui.tsx:161-189`): for Browse that was 988 `BookCard`s, each with a `Gesture.Race(Pan, Tap)` detector, an SVG leather save ribbon, and a generated multilayer cover, all mounted eagerly. The web's `openBrowse` (`StoreFront.tsx:541-545`) loads the same 988 books into a 2 column grid (`StoreFront.tsx:936-954`) and the DOM stays responsive.\n\n`ResultsScreen` now builds its own page from the theme background, `PageWash`, `InnerPageHeader`, and a `numColumns={2}` `FlatList` as the screen's scroller, so windowing is real (a vertical `FlatList` nested in `PageShell`'s vertical `ScrollView` would not virtualize). The error card and search pill moved into `ListHeaderComponent`; the 6 skeleton grid and the empty copy \"Nothing on the shelf for that. Try another title or author.\" live in `ListEmptyComponent`. Cells keep `width: '50%'` with `alignItems: 'center'`, centered 144px cards, 24px row gaps, `slotId={`search:${book.id}`}`, `startIndex`, and `keyboardShouldPersistTaps='handled'`. The content container replicates `PageShell` exactly: `width: '100%'`, `maxWidth: 448` (`PAGE_MAX_W`), `alignSelf: 'center'`, `paddingHorizontal: 20`, `paddingTop: 20`, and the bottom padding from issue 5.\n\n### 4. Full ribbon headroom on horizontal shelves\n\nBefore, the ribbon tips clipped. The web scroller (`StoreFront.tsx:1114`, same in `Swimlane` at line 206) carries `pt-7 -mt-4`: 28px padding inside the scrollable box and a 16px negative margin pulling the box up, so the ribbon that pokes 22.5px above each cover (36px wide ribbon, `EDGE` 40 of viewBox 64, so 40 * 36 / 64 = 22.5, per `SaveButton.tsx:65-73`) stayed fully inside the box. Native put both `paddingTop: 28` and `marginTop: -16` in `contentContainerStyle` (`TodayScreen.tsx:153`, and the identical `laneRow` at `ui.tsx:204`). The negative margin shifted the content view up 16px within the viewport, which clips on Android, leaving only 12px of effective headroom and shaving the top 10px or so off the 22.5px tips.\n\nIn both the Popular shelf (`TodayScreen`) and the `Swimlane` (`ui.tsx`), `marginTop: -16` moved out of `contentContainerStyle` onto the scroller's own `style`, next to the existing `marginHorizontal: -20`, leaving the full `paddingTop: 28` as interior clip safe headroom. The box shifts up 16px while all 28px of top padding remains. This was a static analysis finding, so it still wants the on device look; if Android still clips, the documented fallback is `paddingTop: 28` on the scroller with `marginTop: -16` on the surrounding section `View`.\n\n### 5. Results grid vertical spacing\n\nBefore, native diverged from the web. The web results `<section>` has `mb-7`, a 28px bottom margin before the page's bottom padding (`StoreFront.tsx:902`), and the grid itself (`grid grid-cols-2 gap-y-6 justify-items-center`, lines 930 to 937) has zero top padding, so first row save ribbon tips (22.5px tall) poke up into the 20px gap under the search box (the form has `mb-5`) and slightly overlap its bottom edge, which is intentional. Native's `s.grid` had `paddingTop: 12` (`ResultsScreen.tsx:144`) pushing the first row down, and no 28px bottom spacer after the grid.\n\nThe grid's top padding dropped from 12 to 0, so first row ribbon tips now poke into the 20px gap under the search pill exactly like the web (the native search pill already has `marginBottom: 20` matching web `mb-5`), and the list's bottom padding is `28 + Math.max(48, insets.bottom + 16)`, giving the web `mb-7` breathing room after the grid, the empty state, or the skeleton block.\n\n## Judgment calls\n\n- The Popular `FlatList` uses a 20px `ItemSeparatorComponent` plus a 24px `ListFooterComponent` instead of a flex gap in `contentContainerStyle`. Virtualized lists compute unmounted region sizes from measured cell frames and container level gap is invisible to that math, which causes content jumps mid fling. Separators live inside each cell's measured frame so the spacing is exact and visually identical.\n- `removeClippedSubviews` was kept on the Popular shelf per the prompt. The ribbon tips stay inside the scroller bounds thanks to the 28px headroom, but if the tips ever vanish on device the fix is to drop just that one flag and keep the windowing.\n- For Browse, the prompt's second route was chosen (`PageWash` plus `InnerPageHeader` plus a `FlatList` directly in `ResultsScreen`) rather than extending `PageShell`, to avoid churning a shared component other screens use.\n- `removeClippedSubviews` was left off the vertical results grid so ribbon overflow above rows near the viewport edge can never pop in late.\n- Row gaps in the results grid use `marginTop: 24` on cells at index 2 and up (margins sit inside measured frames) rather than `rowGap`, for the same virtualization reason; the non virtualized skeleton grid keeps `rowGap: 24`.\n- `expo.version` in `app.json` was not bumped: that file was explicitly off limits this run because another session held it, so the version bump was left to whoever commits next.\n\n## Check on your phone\n\n- [ ] Confirm: flicking the Popular shelf hard glides and then stops with a book lined up neatly on the left edge, every time, never resting between cards.\n- [ ] Confirm: flicking a vibe swimlane sideways (including \"Deeper cuts\" and \"Where you left off\") also clicks into place on a book with the same quick decisive stop.\n- [ ] Confirm: Today opens right away with no stutter, and the Popular shelf looks the same as before (176px cards, even gaps, a little space at the end).\n- [ ] Confirm: the whole rounded leather bookmark tip is visible above each cover on the shelves and swimlanes, not cut flat.\n- [ ] Confirm: tapping \"see all\" next to Popular opens the full book list quickly and it scrolls smoothly all the way down.\n- [ ] Confirm: in that list, the first row of bookmarks peeks up close to the search box and there is a bit of extra space after the last row before the bottom.\n- [ ] Confirm: tapping a book still opens it and holding a book still picks it up, both on the shelf and in the list.\n\nEverything else in this package was verified in code and by review.\n","kicker":"Package 11"},{"id":"12","filename":"12-app-shell-branding-washes.md","title":"App identity, page washes, and shell spacing","content":"# App identity, page washes, and shell spacing\n\n**Done.** Implemented and committed as `d34a4d3` on `feat/native-ui-web-parity`, 2026-07-13, independent review passed with no unresolved findings. This package brought the native Android app's shell up to exact parity with the web in six places: the launcher identity, the warm radial page washes, PageShell's bottom padding, the end of scroll whitespace on vibe pages, and a smooth color fade when the theme or light or dark mode changes.\n\n## What this fixed\n\nBefore this work the native shell still wore the default Expo template. The launcher showed the raw slug, the adaptive icon sat on Expo's pale blue plate, and there was no splash configuration. The warm glow behind every page was a fixed 420px band glued to the top of the viewport, so it never scrolled away and its geometry only approximated the web. The More pages drew both glows instead of just the mustard one, PageShell added 16px of bottom padding the web does not have, vibe pages ended 28px short of the web's breathing room, and every theme or light or dark switch snapped instantly. The package matched all six surfaces to what the web actually renders.\n\n## What changed\n\n**1. App identity (name, adaptive icon color, splash).** The launcher used to show the raw slug because `expo.name` and `expo.slug` were both `focus-reader-android`, the adaptive icon plate was Expo's default pale blue `#E6F4FE`, and there was no splash block at all. The web PWA manifest brands the app as name `Focus Reader`, short_name `Focus Reader`, description `A calm, focused reader for public-domain books.`, theme_color `#3a2a1e` (espresso), background_color `#f3ead9` (warm beige), display `standalone`. `expo.name` is now `Focus Reader` with the slug left untouched, the adaptive icon plate is warm beige `#F3EAD9` (espresso `#3A2A1E` was the acceptable alternative), and the `expo-splash-screen` plugin was added referencing `./assets/splash-icon.png` on a `#F3EAD9` background. The stock blueprint `adaptiveIcon.backgroundImage` was removed so the beige plate can actually show, and the existing uncommitted `predictiveBackGestureEnabled` entry was preserved. Icon foreground, monochrome, and splash art remain stock Expo placeholders, which the prompt said not to redraw since the web has no branded icon to copy (its favicon is still stock vite.svg).\n\n**2. Washes scroll away with content and use page scale dimensions.** The old `PageWash` was an absolutely positioned 420px tall SVG rendered behind the ScrollView, so the glow stayed pinned to the viewport top while content scrolled over it, and its ellipse geometry only approximated the web. The web storefront div carries two background radial gradients sized against the full page element: mustard `radial-gradient(120% 80% at 50% -10%, rgba(212,154,63,0.10), transparent 55%)` plus coral `radial-gradient(90% 60% at 100% 0%, rgba(194,103,75,0.07), transparent 50%)`, so the glow scrolls up and away with the content. `PageWash` now renders inside the scroll content as a zero height first child slot, so the glow slides off with the page. Geometry matches the web exactly: mustard 120% width by 80% page height at (50%, minus 10%), coral 90% by 60% at (100%, 0%), with page height measured from the ScrollView content and floored at the window height. Colors and stops were already correct and were kept: washA `#D49A3F` at opacity 0.10 fading to 0 at stop 0.55, washB `#C2674B` at opacity 0.07 fading to 0 at stop 0.5. The wash stays behind the content and does not block touches (`pointerEvents=\"none\"`). Results, being a virtualized FlatList, puts the wash in its list header sized on the window floor.\n\n**3. Stats, Settings, and About get only the mustard wash.** `PageShell` always drew both ellipses on every screen, including the three More pages. The web's More overlays use only the mustard gradient: `OverlayPage` and the Stats layer both set `backgroundImage: 'radial-gradient(120% 80% at 50% -10%, rgba(212,154,63,0.10), transparent 55%)'` with no coral top right wash. `PageWash` and `PageShell` gained a `wash?: 'single' | 'double'` prop defaulting to `'double'`, and StatsScreen, SettingsScreen, and AboutScreen now pass `wash=\"single\"` so the coral `#C2674B` ellipse is omitted there.\n\n**4. PageShell bottom padding formula.** PageShell's ScrollView `contentContainerStyle` used `paddingBottom: Math.max(48, insets.bottom + 16)`, which gave up to 16px more bottom padding than the web on devices with a tall bottom nav bar. The web uses `paddingBottom: 'max(3rem, env(safe-area-inset-bottom))'`, that is max(48px, inset) with nothing added on top. The formula is now `Math.max(48, insets.bottom)`, and ResultsScreen's hand rolled copy became `28 + Math.max(48, insets.bottom)` to drop the same extra 16. The two formulas are identical when `insets.bottom <= 32`, so the change only shows on taller nav bars.\n\n**5. Vibe pages end with 76px of whitespace.** VibeScreen rendered its children straight into PageShell with no trailing margin, so the end of scroll gap was just PageShell's 48px. The web vibe content is a `<section className=\"mb-7\">` (28px bottom margin) inside a main padded `max(3rem, env(safe-area-inset-bottom))`, so the end of scroll gap is 28px + 48px = 76px. All VibeScreen content is now wrapped in a View with `marginBottom` 28, mirroring the web's `mb-7`, on top of the corrected 48px shell padding.\n\n**6. 300ms theme cross fade.** `useTheme()` returned plain color strings, so every backgroundColor and color re-rendered to the new value in one frame and the whole app snapped instantly. The web body element carries `transition: background-color 0.3s ease, color 0.3s ease`, so when the CSS variables are rewritten on a theme or mode change the page background and default ink cross fade over 300ms. A new `useThemeFade` hook in `src/theme.ts` drives the page shell background through `interpolateColor` with `withTiming` 300ms on the CSS ease curve `bezier(0.25, 0.1, 0.25, 1)`. A second switch mid fade snapshots the color currently on screen as the new start, so it always lands exactly on the new palette. It is applied in PageShell and the Results root, and the reader keeps its own plain colors so nothing double animates.\n\n## Judgment calls\n\n1. Removed `expo.android.adaptiveIcon.backgroundImage` (the stock pale blue blueprint PNG), because Android uses the image instead of the color when both exist, so keeping it would have made the beige plate invisible. Foreground and monochrome stock art were kept.\n2. Installed `expo-splash-screen ~31.0.13` via `npx expo install`, since the config plugin cannot resolve without the package. Used the template defaults (imageWidth 200, resizeMode contain) with the warm beige background, verified with `npx expo config --type prebuild`.\n3. Bumped `expo.version` 0.7.8 to 0.7.9 per the standing version bump rule. The tree was clean at 0.7.8 at the start, so nothing was overwritten.\n4. The fade animates the page background only, not a default text color. React Native has no inherited body text color, every Text already sets an explicit theme color, and on the web those same texts snap too because their colors come straight from the CSS variables. Background only is the faithful twin of the web's body layer fade.\n5. On Results the wash is sized on the window height floor because the Browse list is virtualized (988 cards, tens of thousands of pixels of content), so content height sizing would allocate an absurd SVG. `removeClippedSubviews` was set to false on that FlatList so Android does not clip the header slot's overflowing glow early.\n6. The wash starts at the top of the scroll content, just below the header, whereas the web's gradient origin includes the header band. Both headers are opaque theme background on both platforms, so the only difference is the glow sitting a header height lower, accepted as the clean approximation.\n7. The SVG canvas is capped at 35 percent of the page height, the point past which both gradients are fully transparent, so tall pages do not allocate huge empty layers.\n\n## Check on your phone\n\n- [ ] Confirm: the app on your home screen is called `Focus Reader` and its icon sits on a warm beige circle instead of pale blue.\n- [ ] Confirm: the very first flash of the launch screen is warm beige, not white.\n- [ ] Confirm: scrolling down a long page like Library carries the warm glow up and off the screen with the content instead of the glow staying pinned to the top.\n- [ ] Confirm: Stats, Settings, and About show only the mustard glow at the top center, with the faint reddish coral glow gone from the top right, while Today, Library, Notebook, Vibe, and Results still show both.\n- [ ] Confirm: scrolled to the very bottom of a vibe page like Bedtime, there is a bit more breathing room after the last row of books.\n- [ ] Confirm: switching the theme or toggling light or dark in Settings melts the page color into the new one over about a blink instead of jumping instantly, and it lands exactly on the new palette.\n\nEverything else in this package was verified in code and by review.\n","kicker":"Package 12"},{"id":"13","filename":"13-press-feedback-micromotion.md","title":"Native parity 13: press feedback animation and header/search polish","content":"# Native parity 13: press feedback animation and header/search polish\n\n**Done.** Implemented and committed as `07605cf` on `feat/native-ui-web-parity`, 2026-07-13, independent review passed with no unresolved findings. This package gave the native Android app the web app's press micromotion and top bar polish across the storefront, the inner page headers, and the search pills.\n\n## What this fixed\n\nBefore this, native press states snapped instantly where the web tweens them, so pressing a row, chip, or button jumped rather than easing. The vibe hero's Start reading button carried a pressed dim the web does not have, the resume hero's progress bar jumped to its new width instead of animating, and the search pills were missing the web's inset shadow, focus ring, 16px text, and correct height. This package brought all eleven of those deltas to parity: every storefront press state now eases in and out over 150ms with the web's curve, the extra pressed dim is gone, the progress bar animates its width over 300ms, and the search pills gained the inset shadow, coral focus ring, 16px text, and correct heights.\n\nMost of the deltas were one bug repeated: native `Pressable` style functions swapped pressed values instantly while the web tweens them over 150ms. A single shared hook, `usePressScale` (new `src/components/usePressScale.ts`), was built to drive those values through `withTiming` at 150ms with `Easing.bezier(0.4, 0, 0.2, 1)`, Tailwind's default transition curve, and reused at every call site. Files changed: `src/components/usePressScale.ts`, `src/components/ui.tsx`, `src/components/InnerPageHeader.tsx`, `src/components/SaveButton.tsx`, `src/components/rows.tsx`, `
