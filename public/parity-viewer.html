ibed, exactly as the prompt asked, so the gesture memo stays stable. 5) ResultsScreen's skeletons also gained the pulse since CoverSkeleton is shared; that matches the web, which pulses skeletons everywhere.\n\n### Testing performed\n\n- `npx tsc --noEmit` in the native repo: clean at commit time.\n- An independent adversarial review agent re-opened the uncommitted diff, checked every acceptance checklist item above against the native code and the cited web sources (exact constants, timings, easing curves, and copy strings), hunted for regressions (broken imports, accidental behavior changes, worklet violations), and re-ran the type check itself. Verdict: passed with no unresolved findings and zero fix rounds.\n- The commit step re-ran the type check once more before staging, and staged only the files listed above (no blanket `git add`).\n- Not yet done: the on-device checks in the Verification section above. Playback pacing and gesture feel only prove out on a real phone, so those remain for Michael on build 0.7.10 or later.\n"},{"id":"04","filename":"04-book-pickup-and-instant-open.md","title":"Book pickup thresholds and instant-open origins","content":"# Book pickup thresholds and instant-open origins\n\n> **Status: implemented and committed 2026-07-13.** Commit `abf2cff` on `feat/native-ui-web-parity` in the native repo. Adversarial review passed with no unresolved findings.\n\n\n## Mission\n\nMake picking up and tap opening books in the native Android app feel exactly like the web app. That means committing a pickup at 130ms of hold instead of 250ms, allowing 22px of finger drift instead of 8 to 10, firing the hero buttons at 130ms of hold with no pressed dim, opening from the correct origin rects, never blanking the origin card on a quick tap, making the empty slot inert while a book is lifted, and polishing the empty slot visuals. Nine issues total, all listed below with exact constants.\n\n## Context\n\nFocus Reader is a cozy speed reading app for public domain books. The user browses a storefront (a Today page with a hero, shelves, search results, and vibe pages), picks up a book cover with a press and hold, and the cover physically lifts under the finger and springs open into the reader. A quick tap opens the book instantly with the same animation but no finger follow phase.\n\nTwo repos matter:\n\n- **Web app (read only source of truth):** `C:/Users/Michael/Desktop/Focus Reader`. This is the reference for every look and behavior. Read it as much as you like. Never modify anything in this repo.\n- **Native app (where all changes go):** `C:/Users/Michael/Desktop/Focus Reader Android`. Expo SDK 54, React Native 0.81, reanimated 4, gesture-handler 2.28, zustand, expo-image, expo-haptics, lucide-react-native, react-navigation native-stack.\n\nThis is a full React Native app. Never introduce a WebView.\n\nKey files on each side for this package:\n\n- Web: `src/utils/pressGesture.ts` (the press gesture engine), `src/components/Input/StoreFront.tsx` (Today page, heroes, vibe pages), `src/components/Input/BookCard.tsx` (grid/shelf card), `src/App.tsx` (open handlers and the fallback rect).\n- Native: `src/components/BookCard.tsx`, `src/screens/TodayScreen.tsx` (HeroCover, HeroResume, HeroPick, centerRect), `src/screens/VibeScreen.tsx`, `src/components/rows.tsx`, `src/open/OpenTransition.tsx` (the open transition context, consumed via `useOpenTransition`).\n\n## Before you start\n\nRun `git status` in `C:/Users/Michael/Desktop/Focus Reader Android`. Expect to be on branch `feat/native-ui-web-parity`.\n\n**Important warnings:**\n\n- Another session may hold uncommitted changes in `src/reader/ReaderChrome.tsx`, `src/reader/displays.tsx`, `src/reader/useReelEngine.ts`, and `app.json`. Read the current state of any file before editing it, and do not revert changes you did not make.\n- This package touches `src/components/BookCard.tsx` and the call sites of `src/open/OpenTransition.tsx`. A separate package named open-transition-internals edits `OpenTransition.tsx` itself. Do not restructure `OpenTransition.tsx` internals here; only change what its callers pass in (slot ids, origin rects) and, if strictly needed, add a small export. If `OpenTransition.tsx` has uncommitted changes, work with what is there.\n- Ideally this package runs after the shared-cover-save-toast package. If that work has not landed, proceed anyway against current file state.\n- Line numbers below were verified on 2026-07-13 but may drift. If a listed line number does not match, trust the described behavior and re locate the code by searching for the named identifiers.\n\n## Issues to fix\n\n### 1. Hold to pick up commits at 250ms on native, web commits at 130ms\n\n**Web behavior** (`src/utils/pressGesture.ts:24-32` and `121-155`): `DEFAULT_HOLD_MS = 130`. A touch held roughly still for 130ms commits the pickup (the cover lifts under the finger). A release before 130ms with little movement is a tap and opens instantly. Only cards inside horizontal shelves override this with `SHELF_HOLD_MS = 400` so a sideways swipe scrolls the shelf. The 130ms default applies to search results grid cards, vibe filtered grid cards (`gridCard`, `StoreFront.tsx:799-811`, which passes no `holdMs`), and the Today hero cover (`StoreFront.tsx:632` calls `press(book, heroOrigin(), ...)` via `startPressGesture` with no `holdMs`).\n\n**Native behavior** (`src/components/BookCard.tsx:23-26, 66-89` and `src/screens/TodayScreen.tsx:274-286`): `DEFAULT_HOLD_MS = 250` in BookCard (lift Pan uses `.activateAfterLongPress(holdMs)`, tap uses `.maxDuration(holdMs)`), and TodayScreen's HeroCover hard codes `activateAfterLongPress(250)` and `Tap().maxDuration(250)`. `SHELF_HOLD_MS = 400` already matches web for shelf and swimlane cards. So on grid cards, search results, and the hero, the lift starts 120ms later than web, and a still press of 130 to 250ms opens instantly (tap path) instead of lifting.\n\n**Change:** Set `DEFAULT_HOLD_MS` to `130` in `src/components/BookCard.tsx`, and change HeroCover in `TodayScreen.tsx` to use 130 on both the lift (`activateAfterLongPress(130)`) and the tap (`maxDuration(130)`). Keep `SHELF_HOLD_MS = 400` for shelf and swimlane cards. The 130/400 split is the disambiguation between \"pick up\" and \"scroll\": grid pages scroll only vertically, which is why web affords the much snappier 130ms there. This latency is the single most felt storefront gesture.\n\n### 2. Touch tolerance is 22px on web, roughly 8 to 10px on native, on both the tap and the hold paths\n\n**Web behavior** (`src/utils/pressGesture.ts:26-32` and `123-155`): `DEFAULT_TOUCH_SLOP = 22`. A touch may wander up to 22px (the contact patch rolls as you press down) and still count. A release before `holdMs` within that slop commits the tap (instant open), and a hold past `holdMs` within 22px commits the pickup. The source comment documents that 15 to 20px of drift is normal for a deliberate press on a phone, so this was an explicitly tuned fix.\n\n**Native behavior** (`src/components/BookCard.tsx:66-87` and `src/screens/TodayScreen.tsx:278-284`): The tap gesture uses `.maxDistance(10)`, so more than 10dp of drift fails the tap. The lift Pan is worse: react-native-gesture-handler fails a pan with `activateAfterLongPress` outright once pre activation movement exceeds the platform touch slop, which is about 8dp on Android (PanGestureHandler.kt:135 fails when dx squared plus dy squared exceeds scaledTouchSlop squared before the hold elapses). So a press whose contact patch rolls 10 to 22px opens nothing at all: the tap fails on distance and the lift never fires even if held.\n\n**Change:** Match web's 22px slop on both paths in BookCard and HeroCover. Raise `Tap().maxDistance` to `22`. Give the hold path a 22px pre activation tolerance: `activateAfterLongPress` alone cannot do this because its slop is gesture-handler's internal platform touch slop. Use for example a `manualActivation(true)` pan where you track touches and activate yourself after 130ms if movement stayed within 22px, or `Gesture.LongPress().minDuration(holdMs).maxDistance(22)` to trigger the lift (composed so the finger follow updates still flow to `open.finger`). Whatever construction you pick, preserve the existing behavior: lift begins at the hold threshold, `open.finger` tracks moves, `open.release` on end, `open.abort` on failure, and the save ribbon hitbox check (`inRibbon`) still fails the gesture in the ribbon corner.\n\n### 3. Resume and Start Reading open from screen center instead of the hero cover\n\n**Web behavior** (`src/components/Input/StoreFront.tsx:492, 637-639` and `src/App.tsx:31-35`): `keyboardOpenHero` always passes `heroOrigin()`, which is `heroCoverRef.current?.getBoundingClientRect() ?? null`, the actual on screen hero cover rect, to `onOpenBookInstant`. So pressing the Resume button (resume hero) or Start Reading button (today's pick hero) plays the open animation lifting from the hero cover's exact position. `App.tsx` `fallbackRect()` (110x165 centered) is used only when no rect could be captured (originRect null).\n\n**Native behavior** (`src/screens/TodayScreen.tsx:321-323` and `:378`): `HeroResume.instantOpen` and `HeroPick.instantOpen` call `open.begin(book, centerRect(), ...)` where `centerRect()` (TodayScreen.tsx:409-413) is a synthetic 110x165 rect centered in the window. Only a direct tap on the cover itself measures the real cover rect. So the primary button always animates the cover from mid screen, not from the hero card.\n\n**Change:** Resume and Start Reading must measure the hero cover View with `measureInWindow`, like HeroCover's tap path already does, and pass that rect to `open.begin`. Keep `centerRect()` strictly as the fallback when no rect can be measured. The measure helper already exists inside HeroCover; hoist it (or share the cover ref) so the buttons can reuse it. Also apply issue 6 here: these instant opens must use slot id `kbd:${book.id}` so the hero cover does not hide.\n\n### 4. Vibe hero's Start reading opens from the measured cover on native, web opens it from a screen centered fallback\n\n**Web behavior** (`src/components/Input/StoreFront.tsx:840-847` and `src/App.tsx:31-35, 158-168`): Pressing \"Start reading\" calls `onOpenBookInstant(heroPick, null, progressById[heroPick.id]?.currentIndex)`. App.tsx substitutes null with `fallbackRect()`: a 110x165 rect centered in the viewport, exactly `new DOMRect(window.innerWidth / 2 - 55, window.innerHeight / 2 - 82.5, 110, 165)`. So the floating cover appears 110px wide in the exact center of the screen, not over the hero card. The pending slotId becomes `kbd:${book.id}` with `keyboardActivated: true` (auto commit, no gesture phase). No haptic fires on this button.\n\n**Native behavior** (`src/screens/VibeScreen.tsx:118-139` and `:186-192`): `startReadingMeasured()` measures the hero BookCover with `measureInWindow` and begins the open from the cover's actual on screen rect (84px wide, rotated card position); if measurement fails it uses a hardcoded fallback `{ x: 40, y: 260, width: 84, height: 126 }`. slotId is `` `vibe-pick:${heroPick.id}` `` with `instant: true`.\n\n**Change:** Begin the instant open from a viewport centered 110x165 rect: `{ x: windowWidth / 2 - 55, y: windowHeight / 2 - 82.5, width: 110, height: 165 }` (that is the shared `centerRect()`, see issue 9 for exporting it). Drop the `measureInWindow` call and the `{ x: 40, y: 260, ... }` fallback. Use slotId `` `kbd:${heroPick.id}` `` to match the web's instant open convention (no visible difference today since no card carries either slot, but it keeps slot hiding logic consistent if it ever keys off the prefix). Both platforms correctly leave the hero card visible during the animation. Do not add a haptic to this button.\n\n### 5. Web's Resume and Start Reading buttons fire at 130ms of hold without waiting for release, and have no pressed dim\n\n**Web behavior** (`src/components/Input/StoreFront.tsx:1021-1025` and `1082-1086`, plus `src/utils/pressGesture.ts:121-155`): Both buttons wire `onPointerDown` to `startPressGesture` with `onPress` AND `onActivate` both invoking the instant open. So a quick tap opens on release, but holding the button 130ms opens the book while the finger is still down. The buttons have no pressed opacity or scale styling (only a focus visible ring).\n\n**Native behavior** (`src/screens/TodayScreen.tsx:354-361` and `395-403`): `Pressable onPress` fires only on release regardless of hold duration, and the pressed style dims the button to opacity 0.9, feedback the web button does not show.\n\n**Change:** Fire the instant open once the press has been held 130ms (or on release if sooner), and remove the pressed opacity dim (keep `opacity: 1` regardless of pressed state; the accent background and shadow stay as they are). You can reuse the same 130ms press logic built for issue 1, or a small Gesture.LongPress/Tap race, or a Pressable with `onPressIn` starting a 130ms timer that opens (guarded so release before the timer opens once via onPress and the timer is cancelled). Make sure the open fires exactly once per press.\n\n### 6. A quick tap open empties the origin card into the picked up slot on native; web taps never hide the card\n\n**Web behavior** (`src/App.tsx:158-168`, `src/components/Input/StoreFront.tsx:974-995`, and `src/components/Input/BookCard.tsx:71-77`): Instant opens (quick tap or keyboard) go through `handleOpenBookInstant`, which sets slotId to `` `kbd:${book.id}` ``. That never matches any physical slot id (`'hero'`, `'shelf:84'`), so `openingSlotId` hides nothing: the card or hero cover stays fully drawn beneath the floating transition cover. The empty inset shadow slot appears only during a genuine press and hold lift (slotId `'hero'` or `'shelf:id'`).\n\n**Native behavior** (`src/components/BookCard.tsx:60-64, 79-87` and `src/screens/TodayScreen.tsx:283-284, 298-299`): `BookCard.beginInstant` and HeroCover's tap call `open.begin` with the SAME physical slotId as the lift path plus `instant: true`, so `openingSlotId` matches and the card immediately swaps to the empty slot (cover opacity 0, inset slot view, title and author dimmed to 0.4) on every tap open.\n\n**Change:** Instant (tap) opens must use a slot id that matches no physical card, namely `` `kbd:${book.id}` ``, in `BookCard.beginInstant`, in HeroCover's tap, and in the HeroResume and HeroPick `instantOpen` paths (see issue 3). The origin rect still comes from the measured cover; only the slot id changes. Tap open is the most common open path, so this shows constantly. Rows (`rows.tsx` `useRowOpen`) already never hide since RecentRow and BookRow do not check `openingSlotId`; those already match web.\n\n### 7. While a book is lifted, the empty slot still accepts gestures and stays in the accessibility tree\n\n**Web behavior** (`src/components/Input/StoreFront.tsx:974-985` and `src/components/Input/BookCard.tsx:71-77`): When `openingSlotId` matches, the hero cover div drops `role`, `tabIndex`, and `aria-label`, sets `aria-hidden`, sets `pointerEvents: 'none'`, and detaches `onPointerDown` and `onKeyDown`. BookCard likewise passes undefined handlers and `tabIndex -1` while hidden. The slot cannot start a second open mid animation.\n\n**Native behavior** (`src/screens/TodayScreen.tsx:288-307` and `src/components/BookCard.tsx:92-128`): HeroCover and BookCard render their GestureDetector unconditionally. While hidden, the empty slot still accepts taps and holds, and a press calls `open.begin` again, resetting the pending transition mid flight. Because `begin()` with the same slotId keys the same Overlay (`OpenTransition.tsx:192`), the restart glitches openness back to 0 without unmounting. HeroCover also stays accessible (`accessible` plus `accessibilityLabel`) while hidden.\n\n**Change:** Gate the gestures while hidden, for example `.enabled(!hidden)` on both the lift and the tap gestures in BookCard and HeroCover (remember to include `hidden` in the gesture memo dependencies). Also drop the hidden slot out of the accessibility tree like web's `aria-hidden`: set `accessible={!hidden}`, remove `accessibilityRole` and `accessibilityLabel` while hidden, and add `accessibilityElementsHidden={hidden}` plus `importantForAccessibility={hidden ? 'no-hide-descendants' : 'auto'}`. Michael explicitly cares about interrupt mid animation behavior, so make sure a tap on the empty slot during a lift does nothing.\n\n### 8. The picked up empty slot lacks the web's inset shadow, 0.2s fade in, and eased text dim\n\n**Web behavior** (`src/components/Input/StoreFront.tsx:987-988`, `src/components/Input/BookCard.tsx:107-119`, `tailwind.config.js:43-45`): While a card or hero is lifted, the slot overlay is `bg-espresso/[0.13]` plus `ring-1 ring-espresso/10` plus inset shadow `inset 0 3px 10px rgba(58,42,30,0.22)`, and mounts with `animate-fade-in` (opacity 0 to 1 over 0.2s ease-out). The card's title, author, and badge fade to opacity 0.4 with `transition-opacity` (the default 150ms).\n\n**Native behavior** (`src/components/BookCard.tsx:111-126` and `src/screens/TodayScreen.tsx:298-299`): The slot views (BookCard `s.slot` and HeroCover's hidden placeholder) have the fill (`t.inkA(0.13)`) and border (`t.inkA(0.1)`) but no inset shadow and appear instantly. Title and author jump to opacity 0.4 with no transition.\n\n**Change:** Fade the slot in over 200ms ease-out on mount (reanimated `FadeIn.duration(200)` entering animation, or an Animated opacity you drive yourself). Approximate the inset depression with an inner top shadow around `rgba(58,42,30,0.22)`: React Native has no inset box shadow, so use an inner gradient trick, for example an absolutely positioned expo-linear-gradient (already available through Expo) or a stacked translucent strip about 10px tall at the top of the slot fading from `rgba(58,42,30,0.22)` to transparent, clipped by the slot's border radii (3 on the left corners, 12 on the right corners). Ease the title, author, and badge dim to 0.4 over about 150ms instead of jumping. The same fix serves both the hero placeholder in TodayScreen and BookCard, so consider a small shared EmptySlot component.\n\n### 9. The rows' no measurement fallback origin is a 48x72 rect at the screen's top left, web uses the centered 110x165 rect\n\n**Web behavior** (`src/App.tsx:31-35`, applied at `:148` and `:162-163`): Any opener that cannot capture a rect passes null and App substitutes `fallbackRect()`: a 110x165 DOMRect centered at the middle of the viewport, so the cover springs from screen center.\n\n**Native behavior** (`src/components/rows.tsx:24-36` and `src/screens/TodayScreen.tsx:409-413`): `useRowOpen`'s no node branch passes `{ x: 0, y: 0, width: 48, height: 72 }`, so the cover would spring from the top left corner at a different start scale. TodayScreen's `centerRect()` already matches the web's 110x165 centered rect; the rows just do not use it.\n\n**Change:** Export `centerRect` from a common module (for example move it into `src/open/OpenTransition.tsx` or a small shared util, then import it in TodayScreen, VibeScreen for issue 4, and rows.tsx) and make `useRowOpen`'s fallback use it, so all no measurement opens originate from screen center like the web. Rare path, only hit when the cover ref is unexpectedly null, but a one line fix once the helper is shared.\n\n## Acceptance checklist\n\n- [ ] 1. A still press on a grid card, search result card, or the Today hero cover lifts the book after 130ms (not 250ms); shelf and swimlane cards still need 400ms so sideways swipes scroll.\n- [ ] 2. A press whose finger rolls up to 22px still works on both paths: released early it opens instantly, held past the threshold it lifts; the ribbon corner still toggles save instead.\n- [ ] 3. Tapping Resume or Start Reading on the Today hero animates the cover open starting from the hero cover's actual position, not from screen center.\n- [ ] 4. Tapping Start reading on a vibe page's Our pick card animates the cover open from a 110x165 rect at the exact screen center, and the hero card underneath stays fully visible.\n- [ ] 5. Holding Resume or Start Reading for 130ms opens the book while the finger is still down; a quick tap opens on release; the button never dims while pressed.\n- [ ] 6. A quick tap on any card or the hero cover opens the book while the origin card stays fully drawn underneath the floating cover; the empty inset slot appears only during a real press and hold lift.\n- [ ] 7. While a book is lifted, tapping or holding the empty slot does nothing (the in flight transition never restarts), and the slot is invisible to screen readers.\n- [ ] 8. When a lift begins, the empty slot fades in over 0.2s with a soft inset shadow at its top, and the title, author, and badge ease down to 40 percent opacity over about 150ms.\n- [ ] 9. If a row's cover ref cannot be measured, the open starts from the shared centered 110x165 rect, not from the top left corner.\n\n## Verification\n\n- Type check in the native repo: `npx tsc --noEmit` run from `C:/Users/Michael/Desktop/Focus Reader Android`. Fix any errors you introduced.\n- Reason through the running behavior carefully, path by path: the gesture race between lift and tap at 130ms, the 22px slop on both paths, each open origin, each slot id, the enabled/disabled gesture while hidden, the fade timings. Re read your edited code with fresh eyes and trace a tap, a hold, a rolled press, and a tap during a lift.\n- Do NOT use the Expo web build to verify anything. Its dev server opens blank localhost tabs in the real browser and the web bundle breaks on zustand's import.meta. It proves nothing about the app.\n- On device checking is done by Michael on his Android phone.\n\nWhen you finish, tell Michael exactly this, in plain everyday English: press and hold a book cover on the Today page and it should start lifting almost right away, noticeably quicker than before. Try a sloppy press where your thumb rolls a little; it should still open or lift instead of doing nothing. Tap the Resume button and watch the little cover fly out of the hero card itself, not from the middle of the screen, and notice the book cover in the hero never blinks out on a quick tap. On a vibe page, tap Start reading and the cover should pop open from the center of the screen while the pick card stays put. Hold the Resume button down without letting go; the book should open while your finger is still on it, and the button should not dim. Finally, press and hold a cover so it lifts, then with another finger try tapping the empty dented slot left behind; nothing should happen, and the slot itself should have faded in gently with a soft shadow, with the title and author dimming smoothly under it.\n\n## Final note\n\nWhen summarizing your work for Michael, use plain everyday language, explain what changed in terms of what he will feel on the phone, and avoid dashes in prose. Use commas or separate sentences instead.\n\n---\n\n## Outcome, recorded 2026-07-13\n\nImplemented in commit `abf2cff` on `feat/native-ui-web-parity` in the native repo.\n\nFiles changed: `src/components/BookCard.tsx`, `src/components/rows.tsx`, `src/open/centerRect.ts`, `src/screens/TodayScreen.tsx`, `src/screens/VibeScreen.tsx`.\n\n### Issue by issue\n\n**1. Hold to pick up commits at 130ms instead of 250ms (grid, search, hero); shelf and swimlane cards keep 400ms** (done)\n\nDEFAULT_HOLD_MS is now 130 in BookCard and the hero cover uses the same shared gesture, so it also gets 130. SHELF_HOLD_MS stays 400 and every shelf and swimlane call site still passes it.\n\n**2. 22px touch tolerance on both the tap and the hold paths** (done)\n\nTap now allows 22px of drift. The lift is a manual activation pan that times 130ms itself and only gives up if the finger wanders past 22px before the hold lands, so gesture handler's 8dp internal slop no longer kills sloppy presses. The ribbon corner check still vetoes both gestures. One platform note: Android's page scroller can still natively claim a touch that rolls mostly vertically past the OS slop before 130ms; that ceiling exists on any Android app and is outside what the gesture config controls.\n\n**3. Resume and Start Reading open from the hero cover's measured position** (done)\n\nThe cover ref now lives in HeroResume and HeroPick and is passed into HeroCover, so both buttons measure the real cover with measureInWindow and pass that rect to open.begin. centerRect() is only the fallback when the ref is gone. Both use the kbd slot id so the cover never hides.\n\n**4. Vibe page Start reading opens from the centered 110x165 rect** (done)\n\nstartReadingMeasured and the hardcoded 40,260 fallback are gone. The button now begins from the shared centerRect() with slot id kbd:<id>, instant, and still no haptic. The pick card stays fully visible.\n\n**5. Resume and Start Reading fire at 130ms of hold, no pressed dim** (done)\n\nNew useHoldFire hook: press in starts a 130ms timer that opens while the finger is still down; an earlier release opens on release; a fired flag that only rearms on a fresh touch guarantees exactly one open per press. The pressed opacity 0.9 dim is removed from both buttons; accent background and shadow unchanged.\n\n**6. Quick taps never blank the origin card (kbd slot ids)** (done)\n\nBookCard's instant tap, HeroCover's tap, both hero buttons, and the vibe button all begin with kbd:<book.id>, which matches no physical slot, so the card or hero cover stays drawn under the flying cover. The empty slot now appears only during a real hold lift. Row slot ids left alone as instructed since rows never hide.\n\n**7. Lifted empty slot is inert and hidden from accessibility** (done)\n\nFresh touches on a hidden card fail immediately in both gestures. I did not use .enabled(false) because flipping it mid gesture cancels the very pan doing the lifting; instead new touch downs are refused while the card is hidden, and gesture state lives in a ref so the handler swap when hiding does not drop the active touch. Also, the lift pan now tracks only the first pointer, so a second finger tapping the slot neither cancels nor restarts anything (the old maxPointers(1) pan would have been cancelled by that second finger). Accessibility: accessible, role and label drop while hidden, plus accessibilityElementsHidden and importantForAccessibility no-hide-descendants.\n\n**8. Empty slot fade in, inset top shadow, eased text dim** (done)\n\nNew shared EmptySlot component (exported from BookCard, used by BookCard and HeroCover): FadeIn 200ms ease out on mount, plus a 10px expo-linear-gradient strip from rgba(58,42,30,0.22) to transparent clipped by the 3/12 corner radii. Title, author and badge now ease to 0.4 over 150ms with the web's cubic bezier. The hero cover also now stays mounted at opacity 0 under the slot like the web instead of unmounting.\n\n**9. Rows' no measurement fallback uses the shared centered rect** (done)\n\ncenterRect moved to a new small module src/open/centerRect.ts (OpenTransition.tsx untouched, since another package owns it). useRowOpen's no node branch now uses it instead of the 48x72 top left rect; TodayScreen, VibeScreen and BookCard import the same helper.\n\n### Judgment calls made during implementation\n\nConstruction choice for issue 2: the prompt offered a LongPress or a manual activation pan; I used the manual pan because Android's LongPress cancels itself if the finger travels past maxDistance even after it activates, which would sever the finger follow mid lift. Dropped maxPointers(1) from the lift pan and filter touches by the first pointer's id instead, because Android cancels an active pan when a second pointer lands once maxPointers is exceeded; without this, the issue 7 test (second finger taps the empty slot) would have cancelled the lift. Release and abort are now driven from per pointer touch events, so a cancelled lift (for example the scroller stealing the touch) springs back to the slot instead of accidentally committing. Did not use .enabled(!hidden) as literally suggested in issue 7 because disabling a handler cancels it while active, which would kill the lift the moment it begins; refusing new touch downs while hidden achieves the same inertness safely. centerRect lives in a new file src/open/centerRect.ts rather than inside OpenTransition.tsx, which the open-transition-internals package owns. Kept the vibe Start reading button's small pressed dim since issue 4 scoped its changes to origin, slot id and haptic only. The package 03 cover inks decision (keep native pinned inks) required no action here; this package never touches cover accessory colors. Platform caveat worth knowing when testing: our gestures now tolerate the full 22px roll, but Android's own scroll container can still claim a strongly vertical roll past roughly 8dp before the 130ms hold lands; that is an OS level ceiling, not a gesture config issue.\n\n### Testing performed\n\n- `npx tsc --noEmit` in the native repo: clean at commit time.\n- An independent adversarial review agent re-opened the uncommitted diff, checked every acceptance checklist item above against the native code and the cited web sources (exact constants, timings, easing curves, and copy strings), hunted for regressions (broken imports, accidental behavior changes, worklet violations), and re-ran the type check itself. Verdict: passed with no unresolved findings and zero fix rounds.\n- The commit step re-ran the type check once more before staging, and staged only the files listed above (no blanket `git add`).\n- Not yet done: the on-device checks in the Verification section above. Playback pacing and gesture feel only prove out on a real phone, so those remain for Michael on build 0.7.10 or later.\n"},{"id":"05","filename":"05-navigation-and-drawer-model.md","title":"Native parity 05: Navigation model, back handling, and drawer behavior","content":"# Native parity 05: Navigation model, back handling, and drawer behavior\n\n> **Status: implemented and committed 2026-07-13.** Commit `5de8738` on `feat/native-ui-web-parity` in the native repo. Adversarial review passed with no unresolved findings. The two drawer swipe details the prompt marked optional were skipped; everything else is in.\n\n\n## Mission\n\nRebuild the native app's navigation to match the web app's model exactly. Hardware back must close the open menu drawer instead of popping the screen underneath. Drawer Browse choices must reset the stack so one back press always lands on Today. Stats must pop itself before opening a book. The More pages lose their hamburger buttons. Screen transitions, scroll reset, search box clearing, drawer active tab logic, drawer easing curves, swipe dismiss details, and drawer spacing all get tuned to the web's exact values. There are 11 issues, each specified below with the exact web behavior to copy.\n\n## Context\n\nFocus Reader is a cozy speed reading app for public domain books. There are two repos:\n\n- **Web app (READ ONLY source of truth):** `C:/Users/Michael/Desktop/Focus Reader`. This is the reference for look and behavior. Read it as much as you like. Never modify anything in it.\n- **Native app (where ALL changes go):** `C:/Users/Michael/Desktop/Focus Reader Android`. Expo SDK 54, React Native 0.81, reanimated 4, gesture-handler 2.28, zustand, expo-image, expo-haptics, lucide-react-native, react-navigation native-stack.\n\nThis is a full React Native app. Never introduce a WebView.\n\nThe navigation model (both platforms): Today is the only home page. Library, Notebook, search Results, and Vibe pages are inner pages you back out of, always landing on Today. Stats, Settings, and About are \"More\" pages opened from the menu drawer that close back onto whatever was beneath them. The menu drawer slides in from the right and is the single navigation hub (there is no tab bar).\n\nKey files:\n\n- Web: `src/components/Input/StoreFront.tsx` (the storefront shell, drawer, overlays, and navigation state all live here), `src/components/InnerPageHeader.tsx`, `tailwind.config.js` (animation keyframes), `src/App.tsx`.\n- Native: `App.tsx` (stack navigator), `src/nav.ts` (navigationRef + route types), `src/components/MenuDrawer.tsx`, `src/components/InnerPageHeader.tsx`, `src/components/ui.tsx` (PageShell + useScrollTop), `src/components/rows.tsx` (RecentRow), `src/open/OpenTransition.tsx` (book open cover flight, navigates to Reader), `src/screens/*.tsx`, `app.json`.\n\nNative haptics live in `src/haptics.ts` as `haptics.tick()` etc, mirroring the web's `haptics` module.\n\n## Before you start\n\nRun `git status` in `C:/Users/Michael/Desktop/Focus Reader Android`. Expect branch `feat/native-ui-web-parity`.\n\nWarning: another session may hold uncommitted changes in `src/reader/ReaderChrome.tsx`, `src/reader/displays.tsx`, `src/reader/useReelEngine.ts`, and `app.json`. Read the current state of any file before editing it, and do not revert changes you did not make. `src/open/OpenTransition.tsx` and `src/components/InnerPageHeader.tsx` are shared surfaces with that reader work, so edit them surgically.\n\nIf a line number given below has drifted, trust the described behavior and re-locate the code.\n\n## Issues to fix\n\n### 1. Hardware back does not close the open drawer (high)\n\n**Web behavior** (`src/components/Input/StoreFront.tsx:361-372` and `:1262-1298`): the drawer is dismissed three ways, all funneled through `closeMenu()`: tap the scrim, tap the X button, or swipe right. `closeMenu` fires `haptics.tick()`, animates the panel offscreen over `DRAWER_MS = 240` ms, then unmounts. Nothing beneath the drawer is interactive while it is open (fixed `inset-0 z-[70]` captures everything).\n\n**Native behavior** (`src/components/MenuDrawer.tsx:37-107`, `App.tsx:72-90`, `app.json:19`): MenuDrawer has no BackHandler and no other back integration (grep for BackHandler across the repo returns nothing). react-navigation's native-stack still owns the hardware back button, so pressing back while the drawer is open pops the current screen behind the scrim (or exits the app when Today is the only route), leaving the drawer floating over the new screen. `app.json` sets `android.predictiveBackGestureEnabled: false`, so a BackHandler will work reliably.\n\n**Fix:** while `menuOpen` is true in the store, intercept the hardware back press. Register `BackHandler.addEventListener('hardwareBackPress', ...)` returning `true`, added and removed with `menuOpen`, and run the same close path as the scrim tap: `haptics.tick()` plus `setMenuOpen(false)` so the 240 ms slide out plays (this is exactly the existing `close` callback at `MenuDrawer.tsx:68-71`). No navigation may occur beneath the open drawer.\n\n### 2. Drawer Browse navigation accumulates a stack instead of resetting (medium)\n\n**Web behavior** (`StoreFront.tsx:1306-1322` and `:579-610`): the navigation model is strictly one level deep. Today is the only home, and Library, Notebook, results, and vibe pages ALWAYS back out directly to Today. Drawer Browse items run `haptics.tick(); clearResults(); setActiveTab(key); closeMenu()`, so any open vibe or results page is discarded, and the single back control on Library or Notebook (`goHome`) lands on Today. Example: Today, then a vibe page, then drawer, then Notebook, then back equals Today.\n\n**Native behavior** (`src/components/MenuDrawer.tsx:73-83`, `src/nav.ts:8-18`): `MenuDrawer.go()` calls `navigationRef.reset({index: 0, routes: [{name: 'Today'}]})` only for Today; for Library and Notebook (and the More routes) it calls `navigationRef.navigate(route)`, which pushes onto whatever stack exists. Example: Today, then Vibe, then drawer, then Library gives the stack [Today, Vibe, Library]; back from Library returns to the Vibe page, then back again reaches Today. Two steps, and a resurrected page the web would have discarded.\n\n**Fix:** when a Browse tab (Library or Notebook) is chosen from the drawer, reset the stack to [Today, tab]:\n\n```ts\nnavigationRef.reset({ index: 1, routes: [{ name: 'Today' }, { name: route }] });\n```\n\nso one back press always lands on Today and any Results or Vibe screens are dropped, exactly like `clearResults()` on web. Leave the More routes (Stats, Settings, About) as plain pushes; on web those are overlays that close back onto whatever page was beneath, which plain push and pop already matches.\n\nNote: `navigate()` does pop back to an existing instance of the same route, so the stack does not grow unboundedly today, but the intermediate history (Vibe, Results, the other tab) survives back navigation, which never happens on web.\n\n### 3. Stats, Settings, and About must not show a hamburger (medium)\n\n**Web behavior** (`StoreFront.tsx:139-154` OverlayPage, `:1364-1369` Stats header, `:1479` Settings, `:1580` About): the More pages render InnerPageHeader WITHOUT the `onMenu` prop. OverlayPage passes only title, eyebrow, backLabel, and onBack, and the Stats overlay does the same. These pages show [back][title] only. The hamburger appears exclusively on Today's home header, on the Browse inner pages (Library, Notebook, results, vibe, wired at `StoreFront.tsx:694-701`), and in the reader.\n\n**Native behavior:** `src/screens/StatsScreen.tsx:78`, `src/screens/SettingsScreen.tsx:47`, and `src/screens/AboutScreen.tsx:36` all pass `onMenu={() => { haptics.tick(); setMenuOpen(true); }}` to InnerPageHeader, so a hamburger renders on the right of each of those headers and reopens the drawer from pages where the web never allows it.\n\n**Fix:** remove the `onMenu` prop from InnerPageHeader on Stats, Settings, and About (and clean up the now unused `setMenuOpen` imports if nothing else uses them). Keep `onMenu` on Library, Notebook, Results, Vibe, and the reader.\n\nSide effect: the drawer becomes unreachable from More pages, which also removes the currently odd drawer state where no Browse item is highlighted on those routes.\n\n### 4. Per screen transitions: instant swaps and a 200 ms fade (medium)\n\n**Web behavior** (`StoreFront.tsx:439-454`, `:139-147`, `:1356-1363`, `tailwind.config.js:44-58`, `src/App.tsx:316-353`): three distinct treatments.\n\n1. Library, Notebook, results, and vibe are a conditional render swap with NO transition animation at all; the only motion is the scroll position resetting to top.\n2. Stats, Settings, and About overlays mount with `animate-fade-in` which is `fadeIn 0.2s ease-out` (opacity 0 to 1, 200 ms). Closing them unmounts instantly with no exit animation.\n3. Entering and leaving the reader is an instant viewMode swap; the book open transition overlay visually covers the entry, and swipe down exit lands back on the storefront with zero transition.\n\n**Native behavior** (`App.tsx:72-86`): the Stack.Navigator sets only `headerShown: false`, so every screen gets the Android native-stack `default` animation (a system slide and fade of roughly 300 to 400 ms) on push AND pop. Reader alone overrides with `animation: 'fade'`, which also plays on pop, so leaving the reader fades where the web is instant.\n\n**Fix:** per screen options:\n\n- `animation: 'none'` for Library, Notebook, Results, and Vibe.\n- `animation: 'fade'` with `animationDuration: 200` for Stats, Settings, and About. Accept that native-stack applies the fade symmetrically to pop where web closes instantly, or use `'none'` plus a self fading mount inside those three screens for exact asymmetry.\n- Reader pop should be instant; `animation: 'none'` is safe because the open transition overlay covers the push.\n\nThe web fade uses `ease-out`; the native-stack fade is close enough at 200 ms. The uncommitted reader session does not touch `App.tsx`, so this change will not collide.\n\n### 5. Scroll to top when backing out to Today (low)\n\n**Web behavior** (`StoreFront.tsx:449-454`): a `useLayoutEffect` runs `window.scrollTo(0, 0)` whenever `mode` or `activeTab` changes. Entering Library, Notebook, results, or vibe opens them at the top, AND backing out of any of them lands on Today scrolled to the very top, even if the user had scrolled deep before descending.\n\n**Native behavior** (`src/components/ui.tsx:161-195`, `App.tsx:72-86`): each screen owns a fresh ScrollView, so inner pages do open at their top (entry parity holds), but popping back restores the previous screen exactly as it was left. Returning to Today keeps the old scroll offset instead of jumping to the top.\n\n**Fix:** on back navigation focus (a `useFocusEffect` or navigation `'focus'` listener that distinguishes a return visit from first mount), scroll the screen's ScrollView to `y: 0` without animation. At minimum do this on Today, which is the only screen reachable by backing out on web. The `useScrollTop` hook in `ui.tsx:193-195` already hands out the ref needed, and `PageShell` accepts a `scrollRef` prop.\n\n### 6. Today search box must be empty after returning from Results (low)\n\n**Web behavior** (`StoreFront.tsx:569-577` and `:601-605`): backing out of results calls `clearResults()`, which runs `setQuery('')` along with resetting mode, so the Today header search box is always empty (placeholder \"Search Focus Reader\", no X button) when the user lands back on home.\n\n**Native behavior** (`src/screens/TodayScreen.tsx:35` and `:55-58`): TodayScreen holds its own `query` state with `useState('')` and stays mounted beneath the Results screen; `submitSearch` navigates without clearing, so after backing out the Today pill still shows the stale query text with the clear X visible. The file has no `useFocusEffect` or blur listener.\n\n**Fix:** clear the Today search field when the user returns from Results. Either a `useFocusEffect` that resets `query`, or `setQuery('')` immediately after `navigation.navigate` in `submitSearch`.\n\nNote: the Results screen pre-filling its own box from `route.params.query` already matches web (shared query state there). Only the home box's post back state diverges.\n\n### 7. Opening a book from Stats must pop Stats first (medium)\n\n**Web behavior** (`StoreFront.tsx:1447-1461`): on the Reading Stats page, each \"Reading now\" RecentRow is given a custom onOpen: `(book, rect, idx) => { setStatsOpen(false); onOpenBookInstant(book, rect, idx); }` (line 1456). The Stats overlay is closed BEFORE the book opens, so when the user later swipes down out of the reader they land on whatever page the Stats overlay had been covering (Today home, or Library if the menu was opened from there), never back on Stats.\n\n**Native behavior** (`src/screens/StatsScreen.tsx:165`, `src/components/rows.tsx:23-46`, `src/open/OpenTransition.tsx:276-287`): StatsScreen renders `<RecentRow key={r.bookId} r={r} />` with no way to customize the open action. RecentRow's `useRowOpen` calls `open.begin(...)`, and `OpenTransition.tsx:282` does `navigationRef.navigate('Reader', ...)`, which pushes Reader on top of Stats. Stats stays in the stack, so backing out of the reader returns to the Stats page.\n\n**Fix:** when a book is opened from the Stats screen, pop Stats off the stack first. For example, give the native RecentRow an optional `onOpen` or `beforeOpen` prop that StatsScreen uses to call `navigation.goBack()` (or pop) before `open.begin`, or have OpenTransition replace rather than push when told to. Exiting the reader must land on the screen Stats was opened over.\n\nThe cover flight from the row rect already matches (native measures the cover via `measureInWindow`); only the stack landing differs. `OpenTransition.tsx` is shared with the in flight reader session's work, so keep the change minimal and coordinate around any uncommitted state you find there.\n\n### 8. Drawer must mark Today active when opened from a Vibe page (low)\n\n**Web behavior** (`StoreFront.tsx:1308`): active state is `mode !== 'results' && activeTab === t.key`. A vibe page is `mode='vibe'` with `activeTab` still `'today'` (openVibe never touches activeTab, and vibe rows exist only on the Today tab), so the drawer shows Today highlighted (cream card, coral border, 2.4 stroke icon, trailing Check). Only `mode='results'` (search or Browse) shows no active tab.\n\n**Native behavior** (`src/components/MenuDrawer.tsx:135`, snapshot at `:49-57`): `active = activeRoute === key || (key === 'Today' && activeRoute == null)`. When the current route is `'Vibe'`, no Browse item is highlighted. `'Results'` correctly shows none; Library, Notebook, and Today match.\n\n**Fix:** treat the Vibe route as Today for highlighting:\n\n```ts\nconst active = activeRoute === key || (key === 'Today' && (activeRoute == null || activeRoute === 'Vibe'));\n```\n\nAfter issue 3 is fixed, Stats, Settings, and About can no longer open the drawer, so their no active tab state stops being reachable.\n\n### 9. Drawer and header animation easing curves (low)\n\n**Web behavior** (`StoreFront.tsx:1274-1284` panel, `:1267-1272` scrim, `src/components/InnerPageHeader.tsx:36-39` collapse): the drawer panel slides with `transform 240ms cubic-bezier(.2,.8,.25,1)` (fast start, gentle settle) in both directions, including the snap back after an uncommitted swipe. The scrim fades in with `fadeIn 200ms ease-out` and fades out with `opacity 240ms ease`. The reader and inner header collapse animates grid rows plus opacity with `duration-300 ease-out`.\n\n**Native behavior** (`src/components/MenuDrawer.tsx:51-66` open/close, `:93-102` swipe end, `src/components/InnerPageHeader.tsx:29-37`): all of these use `withTiming` with no easing argument, which defaults to `Easing.inOut(Easing.quad)`. Durations already match (240 ms panel, 200 ms scrim in, 240 ms scrim out, 300 ms header collapse); the curves do not. The native drawer starts slower and lands harder than the web's decelerate curve.\n\n**Fix:** pass easing explicitly:\n\n- `Easing.bezier(0.2, 0.8, 0.25, 1)` for the drawer panel's three timing calls (open, close, and the swipe snap back and commit at `MenuDrawer.tsx:97-100`).\n- `Easing.out(Easing.quad)` for the scrim fade in and the InnerPageHeader collapse (the CSS `ease-out` equivalent).\n- The CSS `ease` equivalent, `Easing.bezier(0.25, 0.1, 0.25, 1)`, for the scrim fade out.\n\nThis bezier is the house curve (the web's `slide-in-right` keyframe uses the same one). InnerPageHeader is shared with the in flight reader chrome work but the file itself is not in that session's uncommitted set.\n\n### 10. Drawer swipe dismiss details (low)\n\n**Web behavior** (`StoreFront.tsx:374-437` and `:361-372`): pointer down on the panel is ignored entirely if it starts on `'button, input, [role=\"button\"], a, label, select, textarea'`. Tracking then claims the gesture only after dx exceeds 8 px rightward; it bails if the move is vertical dominant (`|dy| > |dx| + 4` and `|dy| > 8`) or leftward past 8 px. On release: commit close if dx exceeds 35% of panel width OR average velocity (dx divided by elapsed ms) exceeds 0.5 px per ms; commit runs `closeMenu()` which ALWAYS fires `haptics.tick()` before the 240 ms slide out. Otherwise the panel springs back to 0.\n\n**Native behavior** (`src/components/MenuDrawer.tsx:86-102`): `Gesture.Pan().activeOffsetX(12).failOffsetY([-16, 16])`. Activation at 12 px (web: 8), vertical fail at a fixed plus or minus 16 px window rather than a dominance comparison, and no exclusion for swipes starting on menu rows (gesture-handler cancels the Pressable once the pan activates, so a drag beginning on a row moves the drawer; on web it does nothing). Commit thresholds match (`translationX > 0.35 * panelW`, `velocityX > 500` px per s which is 0.5 px per ms, though instantaneous rather than average velocity), but a committed swipe close calls `runOnJS(setMenuOpen)(false)` directly with NO `haptics.tick()`. The web ticks on every close path.\n\n**Fix:** add `runOnJS(haptics.tick)()` on the swipe commit branch; lower `activeOffsetX` to 8; optionally match the vertical dominance bail and refuse pans that begin on interactive rows to mirror the web exactly.\n\nWeb quirk worth knowing: selecting a Browse or More item on web double ticks (the item handler ticks, then closeMenu ticks again about 0 ms later, effectively one buzz at 5 ms vibrations); native `go()` single ticks, which matches the intent. No change recommended there.\n\n### 11. Drawer MORE label spacing and active row shadow (low)\n\n**Web behavior** (`StoreFront.tsx:1328`, `:1315`, `:1305`): the \"More\" group label has `mt-7 mb-2`, that is 28 px above and 8 px below. The Browse tab list above it already carries `mb-7` (28 px), so 56 px separate the last tab row from the MORE label. The active Browse tab row style is `bg-cream ring-coral-accent/50 shadow-sm`, carrying a subtle drop shadow (`0 1px 2px rgba(0,0,0,0.05)`).\n\n**Native behavior** (`src/components/MenuDrawer.tsx:157`, `:190-192`, `:131-133`): the MORE label gets `marginTop: 8` and inherits groupLabel's `marginBottom: 12`, so only 36 px from the last tab row (the Browse list's `marginBottom: 28` plus 8) and 12 px to the first More row (web: 56 px and 8 px). The active tab row has surface background plus accent border but no shadow or elevation.\n\n**Fix:** MORE label: `marginTop: 28`, `marginBottom: 8`. Active tab row: add a hairline shadow matching `shadow-sm`: `shadowOpacity: 0.05`, `shadowRadius: 2`, `shadowOffset: { width: 0, height: 1 }`, `elevation: 1`.\n\nTwo adjacent cleanups while you are in the drawer:\n\n- The ScrollView content ends at `paddingBottom: 24` (matches web `pb-6`) but adds no bottom safe area inset, so on edge to edge Android the About row can sit inside the gesture navigation band. Use `Math.max(24, insets.bottom + 8)`.\n- `src/components/InnerHeader.tsx` is dead code (zero importers; only its own definition references it). Delete it so nobody reaches for the non parity header. Verify it is still unreferenced before deleting.\n\n## Acceptance checklist\n\n- [ ] 1. With the drawer open on any screen, pressing hardware back plays a haptic tick and slides the drawer closed over 240 ms; the screen beneath never changes and the app never exits.\n- [ ] 2. From Today, open a Vibe page, open the drawer, tap Library; one back press from Library lands on Today (the Vibe page is gone). Same for Notebook.\n- [ ] 3. Stats, Settings, and About headers show only the back button and title; no hamburger appears on any of the three.\n- [ ] 4. Entering or leaving Library, Notebook, Results, or Vibe swaps instantly with no slide; Stats, Settings, and About fade in over about 200 ms; leaving the reader does not play a fade.\n- [ ] 5. Scroll deep on Today, descend into an inner page, back out; Today is scrolled to the very top.\n- [ ] 6. Search something from Today, then back out of Results; the Today search box is empty with its placeholder showing and no clear X.\n- [ ] 7. Open a book from the Stats page's \"Reading now\" list, then exit the reader; you land on the screen that was beneath Stats, not on Stats.\n- [ ] 8. Open the drawer while on a Vibe page; the Today row is highlighted (cream card, coral border, bolder icon, trailing check).\n- [ ] 9. The drawer panel opens and closes with a fast start and gentle settle (bezier 0.2, 0.8, 0.25, 1); the scrim eases out on fade in; the inner header collapse uses ease out.\n- [ ] 10. A committed swipe dismiss of the drawer fires a haptic tick; the swipe claims the gesture at 8 px of rightward travel.\n- [ ] 11. In the drawer, the MORE label sits 28 px below the Browse list block with 8 px below it, the active Browse row carries a hairline shadow, and the drawer content clears the Android gesture navigation band.\n\n## Verification\n\n1. Type check: run `npx tsc --noEmit` in `C:/Users/Michael/Desktop/Focus Reader Android` and fix every error you introduced.\n2. Reason through the running behavior carefully for each checklist item: trace the BackHandler registration lifecycle against `menuOpen`, the reset stack shapes, the focus effect ordering, and the OpenTransition timing with Stats popped.\n3. Do NOT use the Expo web build to verify anything. Its dev server opens blank localhost tabs in the real browser and the web bundle breaks on zustand's `import.meta`. On device checking is done by Michael on his Android phone.\n\nWhen you finish, tell Michael exactly what to try on his phone, in plain everyday English. Cover at least: open the menu and press the phone's back button (menu should close, nothing behind it should move); go into a mood page, use the menu to jump to Library, then press back once (should land on Today); open a book from the Reading Stats page and swipe out of it (should not land back on Stats); check that Stats, Settings, and About no longer have a menu button in the corner; search for a book, go back, and check the search box is empty; and feel whether the menu now slides with a quicker start and softer landing.\n\n## Final note\n\nWhen summarizing work for Michael, use plain everyday language, no jargon, and avoid dashes in prose sentences. Use commas or periods instead.\n\n---\n\n## Outcome, recorded 2026-07-13\n\nImplemented in commit `5de8738` on `feat/native-ui-web-parity` in the native repo.\n\nFiles changed: `App.tsx`, `src/components/MenuDrawer.tsx`, `src/components/InnerPageHeader.tsx`, `src/components/InnerHeader.tsx (deleted)`, `src/components/rows.tsx`, `src/screens/StatsScreen.tsx`, `src/screens/SettingsScreen.tsx`, `src/screens/AboutScreen.tsx`, `src/screens/TodayScreen.tsx`.\n\n### Issue by issue\n\n**1. Hardware back closes the open drawer** (done)\n\nMenuDrawer registers a BackHandler while menuOpen is true; it runs the same close path as the scrim tap (haptic tick plus the 240 ms slide out) and returns true so the stack never pops and the app never exits beneath the drawer.\n\n**2. Drawer Browse choices reset the stack** (done)\n\nLibrary and Notebook now reset the stack to [Today, tab], so one back press always lands on Today and any Vibe or Results page is discarded. Today keeps its single route reset, More routes stay plain pushes.\n\n**3. Stats, Settings, About lose the hamburger** (done)\n\nRemoved onMenu from all three headers and cleaned up the now unused setMenuOpen lines (AboutScreen also dropped its whole useStore import). Library, Notebook, Results, Vibe, and the reader keep theirs.\n\n**4. Per screen transitions** (done)\n\nLibrary, Notebook, Results, Vibe, and Reader use animation none (instant swap; the book open overlay covers reader entry). Stats, Settings, About use fade with animationDuration 200. Note animationDuration may be ignored on some Android versions of native stack fade, but the system fade is already close to 200 ms, which the prompt accepted.\n\n**5. Scroll to top when backing out to Today** (done)\n\nTodayScreen adds a navigation focus listener that skips the first mount and scrolls its PageShell ScrollView to y 0 without animation on every return visit, including returns from the reader (which also matches web, where the storefront remounts fresh).\n\n**6. Today search box empty after Results** (done)\n\nsubmitSearch clears the query right after navigating to Results (the prompt's second suggested option). Results still prefills its own box from route params, matching web.\n\n**7. Opening a book from Stats pops Stats first** (done)\n\nRecentRow gained an optional beforeOpen prop that runs after the cover rect is measured but before open.begin. StatsScreen passes navigation.goBack there, so the flight starts from the real row rect, Stats leaves the stack, and exiting the reader lands on whatever was beneath Stats. Other RecentRow call sites are untouched. OpenTransition.tsx itself needed no change.\n\n**8. Drawer marks Today active on a Vibe page** (done)\n\nActive check now treats the Vibe route as Today, exactly the expression given in the prompt.\n\n**9. Drawer and header easing curves** (done)\n\nPanel open, close, swipe commit, and swipe snap back all use Easing.bezier(0.2, 0.8, 0.25, 1). Scrim fade in and the InnerPageHeader collapse use Easing.out(Easing.quad). Scrim fade out uses Easing.bezier(0.25, 0.1, 0.25, 1). Durations were already correct.\n\n**10. Drawer swipe dismiss details** (PARTIAL)\n\nCore fixes applied: haptic tick on the swipe commit branch and activeOffsetX lowered from 12 to 8. The two parts the prompt marked optional were skipped: the exact vertical dominance bail (gesture handler cannot express the relational comparison declaratively, and the existing failOffsetY window of plus or minus 16 approximates it) and refusing pans that start on menu rows (would need manual touch target inspection with real regression risk to row taps).\n\n**11. MORE label spacing, active row shadow, drawer cleanups** (done)\n\nMORE label now marginTop 28 and marginBottom 8. Active Browse row carries the hairline shadow (opacity 0.05, radius 2, offset 0 1, elevation 1). Drawer scroll content bottom padding is Math.max(24, insets.bottom + 8). Dead InnerHeader.tsx verified unreferenced and deleted.\n\n### Judgment calls made during implementation\n\n1. Issue 6: chose the setQuery('') right after navigate option rather than a focus listener, since Results swaps in with no animation so the clear is invisible, and it cannot accidentally clear while typing. 2. Issue 7: implemented beforeOpen so it runs after the cover rect is measured but before open.begin, otherwise popping Stats first would unmount the row and lose the rect the cover flight starts from. 3. Issue 4: kept animationDuration 200 on the three fade screens as the prompt specified, accepting the symmetric pop fade instead of building self fading mounts. 4. Issue 10: skipped the optional exact vertical dominance bail and the interactive row pan exclusion (see checklist note). 5. Reader animation set to none for both push and pop per the prompt; the book open overlay covers the entry visually. 6. The package 03 cover inks decision needed no action here: BookCover.tsx already has onTint = t.surface from the earlier package, and this package touches no cover ink code.\n\n### Testing performed\n\n- `npx tsc --noEmit` in the native repo: clean at commit time.\n- An independent adversarial review agent re-opened the uncommitted diff, checked every acceptance checklist item above against the native code and the cited web sources (exact constants, timings, easing curves, and copy strings), hunted for regressions (broken imports, accidental behavior changes, worklet violations), and re-ran the type check itself. Verdict: passed with no unresolved findings and zero fix rounds.\n- The commit step re-ran the type check once more before staging, and staged only the files listed above (no blanket `git add`).\n- Not yet done: the on-device checks in the Verification section above. Playback pacing and gesture feel only prove out on a real phone, so those remain for Michael on build 0.7.10 or later.\n"},{"id":"06","filename":"06-reel-engine-playback-core.md","title":"Reel engine playback correctness: match web's useRSVP state machine","content":"# Reel engine playback correctness: match web's useRSVP state machine\n\n> **Status: implemented and committed 2026-07-13.** Commit `0bfbcde` on `feat/native-ui-web-parity` in the native repo. Adversarial review passed with no unresolved findings. Deliberate divergence kept: a controls seek beats a coasting fling (the web fling swallowing the seek was judged accidental).\n\n\n## Mission\n\nFix six behavior gaps in the native reader's core playback engine (`src/reader/useReelEngine.ts` in the native repo) so it behaves exactly like the web app's `useRSVP` hook and kinetic scrubber. The headline bug: seeking during playback silently freezes word advancement while the button still shows the Pause icon. The rest: a stuck dragging flag after taps, the final word getting zero dwell time, speed changes not restarting the current word, no reduce motion support, and two small differences in how a fling gets interrupted. Every fix goes in the native repo only.\n\n## Context\n\nFocus Reader is a cozy speed reading app for public domain books. Words are shown one at a time (or in sentence, trail, paragraph, and hybrid views) at a chosen speed, and the reader can scrub through the text with a finger like an iOS date picker.\n\nTwo repos are involved:\n\n- **Web app (READ ONLY source of truth): `C:/Users/Michael/Desktop/Focus Reader`**. A React web app. It defines the correct look and behavior. You will read its files to understand what \"correct\" means. Never modify anything in this repo.\n- **Native app (ALL changes go here): `C:/Users/Michael/Desktop/Focus Reader Android`**. Expo SDK 54, React Native 0.81, reanimated 4, gesture-handler 2.28, zustand, expo-image, expo-haptics, lucide-react-native, react-navigation native-stack. This is a full React Native app. Never introduce a WebView.\n\nAll file references below are relative to their repo root. Web refs point into `C:/Users/Michael/Desktop/Focus Reader`, native refs into `C:/Users/Michael/Desktop/Focus Reader Android`.\n\nKey architecture facts you need:\n\n- Web: `src/hooks/useRSVP.ts` is the playback engine (a requestAnimationFrame loop keyed to `isPlaying` React state, with an accumulated time ref per word). `src/hooks/useKineticScrub.ts` is the pointer driven scrubber (drag, fling with exponential friction, ease onto a whole word). `src/components/Reader/RSVPDisplay.tsx` is the single word Focus reel.\n- Native: `src/reader/useReelEngine.ts` merges both jobs into one shared engine. A single `useFrameCallback` worklet runs every frame on the UI thread with a `mode` shared value: 0 idle, 1 play, 2 fling, 3 settle. `pos` is the continuous fractional reading position, `acc` is the per word accumulated time, `dragging` and `interacting` are shared flags, and React `playing` state drives the play/pause icon and chrome behavior. `src/reader/displays.tsx` renders the views (its `useReelFrame` mirrors `pos` into React state only while `interacting` is true). `src/reader/ReaderChrome.tsx` holds the controls. `src/screens/ReaderScreen.tsx` wires it all together.\n- The feel constants already match the web verbatim: FRICTION_K 0.0035, HANDOFF_V 0.004, MAX_V 0.4, SETTLE_MS 260, easeOutCubic, a 64ms frame delta cap, and clamp at bounds with velocity zeroed. Do not touch them.\n\n## Before you start\n\n**IMPORTANT: this work overlaps an active reader fix session.** Run `git status` in `C:/Users/Michael/Desktop/Focus Reader Android`. Expect branch `feat/native-ui-web-parity` with uncommitted changes in `src/reader/useReelEngine.ts`, `src/reader/ReaderChrome.tsx`, `src/reader/displays.tsx`, and `app.json` left by another session that is actively fixing the reader. Read the current state of each file before editing it, build on what is there, and do not revert changes you did not make. Do not commit, stash, or discard anything without being asked.\n\nThe line numbers below were verified against the working tree on 2026-07-13. If a line has drifted by the time you read it, trust the described behavior and re-locate the code.\n\n## Issues to fix\n\n### 1. Seek during playback freezes word advancement while the Pause icon stays up (high)\n\n**What web does.** `useRSVP.seek(index)` (web `src/hooks/useRSVP.ts:177-182`) only clamps the index, sets `currentIndex` and `indexRef`, and resets `accumulatedTimeRef` to 0. It never touches `isPlaying`. The rAF loop is keyed to `isPlaying`, so while playing, pressing prev or next sentence (`skipToSentence` at lines 184 to 205 routes through `seek`) or tapping a word in Paragraph view (`onWordClick={rsvp.seek}`, web `src/components/Reader/ReaderView.tsx:119`) jumps position and playback continues seamlessly at the new spot, with the new word getting its full delay. The Controls get `onSkipSentence={rsvp.skipToSentence}` and `onSeek={rsvp.seek}` at ReaderView.tsx:179-182.\n\n**What native does.** `useReelEngine.seek()` (native `src/reader/useReelEngine.ts:338-343`) sets `mode.value = 0` (idle) but does NOT call `setPlaying(false)`. If mode was 1 (playing), the frame loop's play branch stops running: words freeze, but the `playing` React state stays true, so the Controls button still shows the Pause icon, `useImmersive` keeps treating the reader as playing (chrome re-hides after the peek), and the user must tap the play button twice to recover (the first tap only clears the stale state). `skipSentence()` (lines 345 to 356) routes through `seek()`, and the chrome wires the prev and next sentence buttons straight to it (native `src/reader/ReaderChrome.tsx:103-112`). Word taps also hit `seek` directly: paragraph words call `onSeek(tok.id)` (native `src/reader/displays.tsx:543`) and the sentence strip passes `onWordPress={engine.seek}` (native `src/screens/ReaderScreen.tsx:286`).\n\nReachability today: the bug reproduces mainly in Paragraph mode (prev and next sentence buttons, word taps, horizontal swipe skip) because its surface gesture has no scrub pan, so nothing pauses first. In Focus, Hybrid, Trail, and Sentence the bug is currently masked, not absent: the whole stage scrub pan's `onBegin` pauses cleanly at touch down before any tap or swipe resolves (that over eager pause is a separate delta, `focusreel-tap-zone-pauses-everywhere`, owned by another session). Fixing that tap zone immediately exposes this freeze in Focus. Fix this engine bug regardless of where it currently reproduces; the tap zone parity fix depends on `seek()` keeping playback alive through a swipe skip.\n\n**The fix.** `seek()` must preserve playback: if `mode.value` was 1, keep it 1 (set `pos.value` to the clamped target and reset `acc.value = 0`) instead of dropping to idle. If mode was 2 or 3 (fling or settle), keep the current behavior of dropping to 0 for now (see issue 6 for the open question there). Only explicit pause, `togglePlay`, and the AppState listener should ever flip `playing`. After the fix, sentence skips and word taps during playback must continue reading from the new index exactly like web. Note the Controls progress bar drag already pauses explicitly before seeking (its own pan `onBegin` calls `onPause`), matching web, so this fix does not change that path.\n\n### 2. Stuck `dragging` flag after a tap or failed pan keeps the reel on its heavyweight interacting path (medium)\n\n**What web does.** During playback and at rest the web reel shows ONLY the centred word: whenever the user is not scrubbing, an effect syncs `frac` to `currentIndex` with speed 0 (web `src/components/Reader/RSVPDisplay.tsx:61-66`), so `motion = min(1, speed / 0.02) = 0` (line 86, NEIGHBOR_FULL_SPEED is 0.02) and every neighbour renders at `opacity = distanceFade * motion = 0` (lines 136 to 146). Neighbours are visible only while the finger is actually moving the reel.\n\n**What native does.** `pan.onBegin` (native `src/reader/useReelEngine.ts:264-271`, fires at touch down, before activation) sets `dragging.value = true`. Only `pan.onEnd` (lines 278 to 293) resets it, and `onEnd` never fires when the pan is cancelled or fails (a tap wins the Race, or a horizontal move trips `failOffsetX([-24, 24])`, line 297). There is no `onFinalize`. After any tap to peek or swipe, `dragging` stays true, so the frame loop (lines 196 to 202) pins `interacting` true forever and `useReelFrame` (native `src/reader/displays.tsx:117-135`) stays active.\n\nWhat actually goes wrong: (1) the reel mounts and lays out the whole nine row neighbour window (displays.tsx lines 176 to 183) and fires a redundant `runOnJS` setState on every word during playback, hot path churn that breaches the documented invariant \"render just the centred word at rest and during playback\". Note the neighbours are usually invisible during this churn: reanimated mappers run via queueMicrotask in the same UI frame as the `pos` write, before the next frame recomputes `speed`, so each per word `setReel` push captures speed 0 and neighbours render at opacity 0. (2) A tap that interrupts a fling leaves the LAST nonzero pushed speed in React state, so frozen half faded neighbours stay visible at rest until the next scrub or word advance. The web exhibits the same frozen neighbour wart after a tap that interrupts a fling, so that sub case is parity, not a delta. (3) The stuck `interacting` flag leaks into SentenceDisplay's playback pinning, making the strip follow the UI thread `pos` instead of the committed index, the per word lurch the engine's own comment warns against (another session owns that symptom, same root cause).\n\n**The fix.** Add `pan.onFinalize(() => { 'worklet'; dragging.value = false; })` to the scrub gesture. `onFinalize` fires for completed, cancelled, AND failed gestures, so a tap or failed pan can no longer leave `dragging` and `interacting` stuck. After the fix, playback after a tap must go back to mounting only the centred row with no per word `setReel` pushes.\n\nOne warning: the web has its own tap quirk in the same area. `useKineticScrub.ts:188-197`, the tap path in `onUp`, returns without firing `onSettle`, so RSVPDisplay's `scrubbing` ref also sticks true after a tap on the reel band. Do NOT replicate that web freeze. The parity target here is the intended invariant that both codebases document, not the web's accidental behavior.\n\n### 3. Final readable word gets zero dwell time, and play refuses to start at the readable end (low)\n\n**What web does.** The tick (web `src/hooks/useRSVP.ts:113-125`) only ends playback inside the `accumulatedTime >= wordDelay` branch: the token AT `effectiveEnd` (the readable end word) is displayed for its full delay (base times multiplier, for example 3x for a closing period, DELAY_SENTENCE_END = 3.0 at web `src/utils/textProcessing.ts:39`), and only then do `setIsPlaying(false)` and `onComplete` fire. `play()` (lines 152 to 156) is guarded by `currentIndex < tokens.length - 1` (the raw last token, not `effectiveEnd`), so with the index scrubbed to or past the readable end but before the raw end, pressing play starts, shows that word for one delay, then auto pauses.\n\n**What native does.** The play branch checks `if (i >= endSV.value)` at the top of the frame (native `src/reader/useReelEngine.ts:204-210`), so the moment `pos` reaches `effectiveEnd` it flips to paused with zero dwell on the final word (its 3x sentence end pause is never served). The user sees the book ending one word delay early, the chrome pops back in while the last word barely flashed. And `togglePlay` (lines 306 to 319) refuses to start unless `cur < effectiveEnd`, so play does nothing at or past the readable end instead of web's one dwell then complete.\n\n**The fix.** Serve the final word's full delay before stopping: in the play branch, accumulate `acc` for the word at `effectiveEnd` too, and end playback (mode 0 plus `setPlayingJS(false, i)`) only when its delay elapses, instead of advancing. In other words, move the end check inside the `acc.value >= wordDelay` branch: if `i < endSV.value` advance to `i + 1`, otherwise stop. Also align the start guard in `togglePlay` to the web's: block only at `tokens.length - 1` (the engine's `max`), not at `effectiveEnd`, so play at or past the readable end dwells once then completes.\n\n### 4. Changing WPM during playback does not restart the current word's dwell (low)\n\n**What web does.** `wpm` is a dependency of the tick callback (web `src/hooks/useRSVP.ts:94-132`); a WPM change creates a new tick, and the start and stop effect (lines 135 to 150, deps `[isPlaying, tick, tokens.length]`) re-runs: cancelAnimationFrame, `lastTimeRef = 0`, `accumulatedTimeRef = 0`, new rAF. Net effect: the word on screen gets a fresh, full delay at the new rate. Tapping plus or minus repeatedly during playback visibly holds the current word until you stop adjusting.\n\n**What native does.** A WPM change only writes `baseDelay.value` (native `src/reader/useReelEngine.ts:115`, the effect `useEffect(() => { baseDelay.value = wpmToDelay(wpm); }, [wpm, baseDelay])`); `acc.value` keeps its accumulated time, so the current word's remaining dwell is the new delay minus `acc` and words keep flowing while the user taps plus or minus.\n\n**The fix.** One line in that existing effect: when `wpm` changes while `mode.value === 1`, also reset `acc.value = 0`, so the current word restarts its dwell at the new rate exactly like web. Only observable while playing and adjusting speed.\n\n### 5. The OS reduce motion setting is ignored (low)\n\n**What web does.** `prefersReducedMotion()` (web `src/hooks/useKineticScrub.ts:41-43`) checks `matchMedia('(prefers-reduced-motion: reduce)')`. On release (line 207): `if (Math.abs(v) < HANDOFF_V || prefersReducedMotion()) startSettle()`, and `startSettle` itself finalizes instantly with no 260ms ease when reduced motion is on (line 116). So the reel snaps to the nearest whole word with no coast and no animation.\n\n**What native does.** Nothing. The fling (mode 2, exponential friction, native `src/reader/useReelEngine.ts:221-234`) and the 260ms easeOutCubic settle (mode 3, lines 235 to 244) always run regardless of the OS \"Remove animations\" accessibility setting. The pan's `onEnd` (lines 278 to 293) always routes into mode 2 or 3.\n\n**The fix.** Read the platform setting (reanimated's `useReducedMotion()` hook, or `AccessibilityInfo.isReduceMotionEnabled`), mirror it into a shared value so worklets can read it, and when enabled: on pan release skip mode 2 and mode 3 entirely and finalize instantly (`pos.value = ` the clamped `Math.round(pos.value)`, `mode.value = 0`). Guard the mode 3 branch the same way for safety so any settle in flight also finalizes instantly. Android maps the web's prefers-reduced-motion media query to its Remove animations setting via that API. This applies to every consumer of the shared engine (the trail and sentence scrubs too) but the change lives entirely in this engine.\n\n### 6. Interrupting a fling: re-grip position and controls seek semantics differ (low)\n\nThree sub behaviors when the reel is coasting (mode 2):\n\n(a) **Catching the reel.** Web: touching the reel cancels the rAF and seeds the new drag from `getIndex()`, the committed integer (web `src/hooks/useKineticScrub.ts:139-166`, the seed is at line 155; `RSVPDisplay.tsx` passes `getIndex: () => currentIndex`), so the reel visibly snaps up to half a row the moment you catch it (the snap lands on the first move event). Native: `pan.onBegin` sets `dragBase.value = pos.value`, the exact fractional position (native `src/reader/useReelEngine.ts:264-271`), so catching is seamless with no snap. For exact parity, seed the drag from the committed integer: `dragBase.value = Math.round(pos.value)` (clamped). At rest and during playback `pos` is already an integer, so this only changes the catch during a fling or settle.\n\n(b) **Controls seek during a coast.** Web: `rsvp.seek` from the controls (progress slider, skip buttons) during a coast does NOT stop the coast. The inertia loop keeps emitting `onCommit(round(frac))` every frame (web `src/hooks/useKineticScrub.ts:214-234`, commit at line 79) and overrides the seek until the fling settles; `scrub.stop()` is only invoked when playback starts (web `src/components/Reader/RSVPDisplay.tsx:83`, `stop` at `useKineticScrub.ts:102-108`). Native: `engine.seek()` sets mode 0, killing any in flight fling; the seek wins immediately. The web behavior reads like an accident (a fling silently swallowing an explicit seek), so do NOT blindly replicate it. Keep native's seek wins behavior, and flag the question to Michael in your final summary: does he want exact web parity here (the fling overrides a controls seek until it settles), or should the native behavior be treated as correct and the web fixed to match later?\n\n(c) **Play during a fling.** Web stops the fling and finalizes onto the nearest word instantly. Native `togglePlay` (native `src/reader/useReelEngine.ts:306-319`) zeroes `vel` and enters play mode. These already match; just confirm your other edits keep it true.\n\nAll the feel constants involved (FRICTION_K 0.0035, HANDOFF_V 0.004, MAX_V 0.4, SETTLE_MS 260, easeOutCubic, the 64ms frame delta cap, clamp at bounds with velocity zeroed) already match verbatim; the only code change for this issue is the one line in (a).\n\n## Acceptance checklist\n\n- [ ] 1. While playing in Paragraph mode, tapping prev or next sentence or tapping a word jumps to the new spot and the words keep flowing; the Pause icon stays correct and one tap on the button pauses. The same holds in Focus once the tap zone fix from the other session lands.\n- [ ] 2. After tapping the Focus reel to peek the chrome, resumed playback renders only the centred word (no neighbour rows mounted, no per word `setReel` state pushes), because `pan.onFinalize` clears `dragging`.\n- [ ] 3. The last readable word of a book stays on screen for its full delay (3x base for a closing period) before playback flips to paused, and pressing play while sitting at or past the readable end shows that word for one delay then completes instead of doing nothing.\n- [ ] 4. Tapping plus or minus on the WPM pill during playback restarts the current word's dwell each tap, so holding the buttons visibly holds the current word, like web.\n- [ ] 5. With Android's Remove animations accessibility setting on, releasing a scrub snaps the reel instantly to the nearest word with no coast and no 260ms ease, in Focus, Sentence, and Trail views.\n- [ ] 6. Catching the reel during a fling re-grips at the committed whole word (a visible snap of up to half a row on the first move), matching web; a controls seek during a fling still wins on native, and the summary asks Michael which behavior he wants long term.\n\n## Verification\n\n- Type check the native repo: run `npx tsc --noEmit` in `C:/Users/Michael/Desktop/Focus Reader Android`. It must pass.\n- Reason through the running behavior carefully, especially the frame worklet's mode transitions: idle to play, play to idle at the end, drag to fling to settle, and every interruption path (tap during fling, seek during play, WPM change during play, app going to background). Confirm no path can leave `playing` true with `mode` at 0, and no path can leave `dragging` or `interacting` stuck true.\n- Do NOT use the Expo web build to verify anything. Its dev server opens blank localhost tabs in Michael's real browser and the web bundle breaks on zustand's import.meta. It proves nothing about the app.\n- On device checking is done by Michael on his Android phone. End your summary by telling him exactly what to try, in plain everyday English, for example: \"Open a book in Paragraph view, hit play, then tap the next sentence arrow. Reading should keep going from the new sentence instead of freezing. Tap the middle of the screen while a word reel is spinning, then hit play again and watch that the reel shows just one word while it reads. Let a book run to the very last word and check the last word lingers a beat before the controls come back. While it reads, tap the speed plus button a few times fast and notice the current word holds still until you stop tapping. Then turn on Remove animations in Android's accessibility settings and check that flicking the reel lands instantly with no glide.\"\n\n## Final note\n\nWhen summarizing your work for Michael, use plain everyday language, no jargon, and avoid dashes in prose. Also put the issue 6(b) question to him plainly: on the web, dragging the progress bar while the reel is still gliding gets ignored until the glide ends, which looks like a bug; the phone app lets the drag win right away. Ask which one he wants everywhere.\n\n---\n\n## Outcome, recorded 2026-07-13\n\nImplemented in commit `0bfbcde` on `feat/native-ui-web-parity` in the native repo.\n\nFiles changed: `src/reader/useReelEngine.ts`.\n\n### Issue by issue\n\n**1. Seek during playback keeps words flowing (Pause icon stays correct)** (done)\n\nseek() now leaves mode 1 alone when playing (only resets acc and moves pos, like web useRSVP.seek); it still drops fling/settle (mode 2/3) to i
